  {id:"r6-mng-q34",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第34問",title:"第34問　PR(パブリック・リレーションズ)",body:"PR(パブリック・リレーションズ)に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"PRの定義には、広報誌、ロビー活動、サンプル配布、プレスキット、セミナー、OOHが含まれる。"},{key:"イ",label:"ダイレクト・レスポンスとは、マスメディアを用いて特定のターゲットを対象としたメッセージを送り、直接反応を得るプロモーションであり、特定顧客との関係を構築するためのツールとして用いられてきた。"},{key:"ウ",label:"プロモーションの具体的な手法については、伝統的な分類では、広告、販売促進、ダイレクト・レスポンスおよびパブリシティをプロモーション・ミックスとしてきた。"},{key:"エ",label:"ペイド・パブリシティは、企業が取材費や記事制作経費などを負担することによってメディアに記事やニュースを掲載してもらう方法であり、実質的には広告と捉えることができる。"}],correct:"エ",explanation:"【論点・背景】PR・パブリシティ関連の用語整理問題。パブリシティとは、企業がニュース素材をメディアに提供し、メディア側の判断で報道してもらう活動(原則無償・掲載の統制不可・第三者発信ゆえ信頼性が高い)。これに対しペイド・パブリシティは、企業が費用を負担して記事体で掲載してもらうもので、対価性がある以上、実質的には広告(記事体広告・タイアップ記事)であり、広告である旨の表示がなければステルスマーケティングの問題も生じる。\n\n【正答の理由】エ：ペイド・パブリシティの定義(企業の費用負担による記事・ニュースの掲載)と、その性格づけ(実質的には広告)の両方が正しい。\n\n【誤答の検討】\n・ア：広報誌・ロビー活動・プレスキット・セミナーはPRの手段だが、『サンプル配布』は販売促進(セールス・プロモーション)、『OOH(屋外・交通広告)』は広告媒体であり、PRの定義に含めるのは誤り。\n・イ：ダイレクト・レスポンス(ダイレクト・マーケティング)の本質は、マスメディアによる一方向の発信ではなく、ダイレクトメール・電話・Eメール・Webなど標的に直接届く媒体で個別の反応を獲得すること。『マスメディアを用いて』という規定が不適切。\n・ウ：伝統的なプロモーション・ミックスの4要素は『広告・販売促進・人的販売・パブリシティ(PR)』。『ダイレクト・レスポンス』は伝統的4分類には含まれず、人的販売が抜けている点で誤り。\n\n【まとめ】正解はエ。『パブリシティ＝無償・統制不可・高信頼／ペイド・パブリシティ＝有償＝実質広告』の対比と、プロモーション・ミックスの伝統的4要素(広告・販促・人的販売・パブリシティ)を正確に覚えることが鍵。"},
  {id:"r6-mng-q35",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第35問",title:"第35問　人的販売",body:"BtoCマーケティングにおける人的販売に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"経営トップの意向や判断が強く影響するBtoBマーケティングでは、顧客企業との接点を担う営業人材の選好や判断が購買意思決定に反映されにくく、BtoCマーケティングに比べて、営業人材が担う役割は極めて小さい。"},{key:"イ",label:"消費者自身では購買意思決定が困難な製品・サービスや、購買に際して高い知覚リスクを感じるような製品・サービスの場合に適したプロモーション手段である。"},{key:"ウ",label:"全体的なプロモーション効果を高めるためには、購買プロセスの前半に購買者の選好、納得感、行動に強く影響を与える人的販売が実施され、購買プロセスの後半にリマインドのための広告や販売促進が実施される。"},{key:"エ",label:"対応可能な消費者の数が限られる一方、相手の状況や反応を把握しながら柔軟な対応ができるため、高い認知率を獲得するためには、極めてコスト効率が高いプロモーション手段である。"},{key:"オ",label:"ダイレクト・マーケティングは、消費者へのダイレクトな非人的チャネルを利用して、仲介業者を介さずに顧客に到達し、財やサービスを提供する活動であるため、これに人的販売は含まれない。"}],correct:"イ",explanation:"【論点・背景】人的販売(パーソナル・セリング)の特性：双方向で相手の反応に応じた柔軟な対応ができ、説得力が高い反面、1人の販売員が対応できる顧客数は限られ、接触当たりコストは最も高い。したがって『広い認知の獲得は広告、購買プロセスの後半(検討・決定段階)の説得・クロージングは人的販売』という役割分担が定石。\n\n【正答の理由】イ：保険・住宅・金融商品など、消費者自身では判断が難しい複雑な製品や、知覚リスク(失敗の不安)が高い製品では、対話を通じて疑問や不安を解消できる人的販売が適している。人的販売の適用領域の説明として正しい。\n\n【誤答の検討】\n・ア：BtoBこそ営業人材が顧客との関係構築・提案・交渉の中心を担い、その役割はBtoC以上に大きい。『極めて小さい』は逆。\n・ウ：定石は逆で、購買プロセスの前半(認知・関心)に広告・パブリシティ、後半(検討・購買)に人的販売・販売促進が効果的。前半に人的販売・後半に広告という配置は効率・効果の両面で不適切。\n・エ：前半(対応人数が限られ柔軟対応できる)は正しいが、接触当たりコストが高いため『高い認知率の獲得』には最もコスト効率が悪い手段。認知獲得のコスト効率が高いのはマス広告。\n・オ：ダイレクト・マーケティングには通信販売やEコマースのような非人的チャネルだけでなく、訪問販売・電話による販売など人的要素を含む形態もある。『人的販売は含まれない』と断定するのは誤り。\n\n【まとめ】正解はイ。人的販売は『高コスト・少人数・高説得力』ゆえに、『複雑・高関与・高知覚リスクの製品』『購買プロセスの後半』で使う、という適材適所の原則で全肢を判定できる。"},
  {id:"r6-mng-q36",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第36問",title:"第36問　先発優位と後発優位",body:"以下のa〜fは、新製品に関する先発優位または後発優位についての記述である。このうち、先発に比べて後発の方がよりメリットが大きいとされる記述の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　経験効果が大きい。\nb　製品の規格をコントロールしやすい。\nc　金銭的コストや心理的コストなどの切り替えコストの発生を利用できる。\nd　需要の不確実性を見極められる。\ne　消費者の心の中に参入障壁を形成できる。\nf　PLCにおいて主流となる顧客ニーズに対応しやすい。",options:[{key:"ア",label:"aとc"},{key:"イ",label:"bとe"},{key:"ウ",label:"cとf"},{key:"エ",label:"dとe"},{key:"オ",label:"dとf"}],correct:"オ",explanation:"【論点・背景】先発優位(ファーストムーバー・アドバンテージ)の源泉は、(1)経験効果の先行蓄積によるコスト優位、(2)デファクト・スタンダード(規格)の主導、(3)顧客の切り替えコストによる囲い込み、(4)カテゴリーの代名詞となる知名度＝消費者の心の中の参入障壁、(5)希少資源(立地・チャネル)の先取りなど。一方、後発優位の源泉は、(1)市場の需要が顕在化してから参入できるため需要の不確実性を見極められる、(2)先発者の試行錯誤・教育投資にただ乗りできる(フリーライド)、(3)市場が成長期に入り主流となった顧客ニーズに合わせて製品を投入できる、(4)技術の不確実性の低下、など。\n\n【各記述の判定】\n・a(経験効果)：先に累積生産量を積み上げられる先発のメリット。\n・b(規格のコントロール)：デファクト・スタンダード形成は先発のメリット。\n・c(切り替えコストの利用)：顧客を先に囲い込んだ先発のメリット。\n・d(需要の不確実性の見極め)：市場の立ち上がりを見てから参入できる後発のメリット。\n・e(消費者の心の中の参入障壁)：第一想起・カテゴリー代名詞化は先発のメリット。\n・f(PLCの主流ニーズへの対応)：導入期の限られたニーズではなく、成長期に主流化したニーズに最適化した製品を出せるのは後発のメリット。\nよって後発優位はdとf＝オ。\n\n【まとめ】正解はオ。『先発＝経験効果・規格・切替コスト・心理的障壁・資源先取り』『後発＝不確実性の見極め・フリーライド・主流ニーズ対応』という対照表で機械的に仕分ける。"},
  {id:"r6-mng-q37",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第37問",title:"第37問　価格設定",body:"価格設定に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"価格バンドリングでは、バンドリングされる2つの商品間におけるカニバリゼーションを避けるため、商品間の品質や価格などの差を十分に大きくしておく必要がある。"},{key:"イ",label:"キャプティブ・プライシングは、例えばプリンターとインクカートリッジのような組み合わせにおいて、プリンターの価格を安くして購入を促し、インクカートリッジで利益を確保していこうとする価格戦略である。"},{key:"ウ",label:"ダイナミック・プライシングは、宿泊や航空のサービスなどの需給に大きな変化が生じやすいカテゴリーでは適応されるが、自動販売機や小売店頭で販売されるような需給の変化が小さいカテゴリーでは適応されない。"},{key:"エ",label:"フリーミアムは、スマートフォンなどの高価格商品においては当該ブランドを選択する吸引力になりうるが、ファストフードのコーヒーなどの低価格商品においては当該店舗に来店する吸引力になりにくい。"}],correct:"イ",explanation:"【論点・背景】価格戦略の用語問題。\n\n【正答の理由】イ：キャプティブ・プライシング(虜価格)は、本体(プリンター・ゲーム機・カミソリ本体)を安価にして顧客を取り込み、継続的に必要となる消耗品・付属品(インク・ソフト・替刃)で利益を回収する価格戦略。プリンターとインクの例も含めて定義どおりで正しい。\n\n【誤答の検討】\n・ア：価格バンドリングは複数の商品をセットにして単品合計より割安に販売する手法で、補完的な商品同士の組み合わせで顧客の支払意思額を取り込むことが狙い。『カニバリゼーション回避のために品質・価格差を大きくする』という説明は、バンドリングではなく製品ライン内の価格設定(プライス・ライニング等)の論点であり不適切。\n・ウ：ダイナミック・プライシングは需給変動の大きいホテル・航空で発達したが、近年はAIや電子棚札の活用により小売店頭、自動販売機、スポーツ・エンタメのチケットなどにも適用が広がっている。『適応されない』という断定が誤り。\n・エ：フリーミアム(基本無料＋上位有料)はデジタルサービスで典型的だが、無料・低価格のフックで集客する論理は低価格商品にも働く(無料クーポンのコーヒーが来店誘引になる例など)。『低価格商品では吸引力になりにくい』という限定が不適切。\n\n【キーワードの意味】キャプティブ＝captive(虜)。本体で顧客をロックインし消耗品で回収するため、ジレット・モデル(替刃モデル)とも呼ばれる。フリーミアム＝free＋premium。\n\n【まとめ】正解はイ。価格戦略は『本体安・消耗品高＝キャプティブ』『セット割安＝バンドリング』『需給で変動＝ダイナミック』『基本無料＝フリーミアム』と1行定義を即答できるようにし、断定・限定表現(〜されない、〜になりにくい)の誤りを見抜く。"},
  {id:"r6-mng-q38-1",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第38問",title:"第38問 設問1　消費者を取り巻く社会文化的要因",body:"消費者市場の分析は、企業が適正な製品を、適正なタイミングや方法で、適正なターゲット顧客に販売するために不可欠である。企業は、消費者を取り巻く社会文化的要因や個人的要因を分析することによって、各消費者に適したマーケティングの実現を目指している。\nこのうち、消費者を取り巻く社会文化的要因に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"グローバル市場参入における標準化と適応化の決定においては、日本製という原産国イメージを利用する場合には、標準化のマーケティングが実施され、原産国イメージを利用しない場合には、現地の消費者に及ぼす社会制度や文化などの分析に基づく適応化のマーケティングが実施される。"},{key:"イ",label:"社会階層は、人種や宗教などが多様な国や地域のセグメンテーションでは有効な変数であるが、日本においてはセグメンテーションの変数として有効ではない。"},{key:"ウ",label:"準拠集団の影響をイノベーションの普及理論に当てはめてみると、オピニオンリーダーは早期少数採用者として新製品の普及に影響を与え、インフルエンサーは後期多数採用者として当該製品の普及に大きな影響を与える。"},{key:"エ",label:"消費に関する他者の影響を説明する理論には、他者の消費行動が欲求を増大させるスノッブ効果、他者の消費行動が欲求を低下させるバンドワゴン効果、値段が高いことが欲求を増大させるヴェブレン効果などがある。"},{key:"オ",label:"デモグラフィック変数には、性別、年齢、年収、社会的地位、ライフステージが含まれ、サイコグラフィック変数には、趣味、価値観、関与、ライフスタイルが含まれる。"}],correct:"オ",explanation:"【論点・背景】消費者行動に影響する社会文化的要因(文化・社会階層・準拠集団・家族など)と、セグメンテーション変数の分類に関する問題。セグメンテーション変数は、ジオグラフィック(地理的)、デモグラフィック(人口統計的：性別・年齢・所得・職業・家族構成・ライフステージ等)、サイコグラフィック(心理的：価値観・ライフスタイル・関与・趣味等)、行動変数(使用頻度・ロイヤルティ等)に大別される。\n\n【正答の理由】オ：性別・年齢・年収・社会的地位・ライフステージはデモグラフィック(社会経済的属性を含む)変数、趣味・価値観・関与・ライフスタイルはサイコグラフィック変数、という分類はマーケティングの標準的な整理と一致しており正しい。\n\n【誤答の検討】\n・ア：原産国イメージの利用＝標準化、不利用＝適応化、という機械的対応は成り立たない。標準化/適応化の決定は製品特性・市場の同質性・規模の経済など多面的な要因によるもので、原産国イメージの利用とは独立の判断。\n・イ：日本でも所得・職業・学歴等に基づく社会階層的な区分は消費パターンと関連し、セグメンテーション変数として有効になりうる。『日本では有効でない』と断定するのは誤り。\n・ウ：普及理論(ロジャーズ)でオピニオンリーダーが対応するのは初期採用者(アーリーアダプター)。またインフルエンサーを『後期多数採用者』とするのも誤りで、インフルエンサーはむしろ普及の早い段階で影響を与える存在。\n・エ：スノッブ効果は『他者が消費しているほど欲求が低下する(人と同じは嫌)』、バンドワゴン効果は『他者が消費しているほど欲求が増大する(流行に乗る)』であり、両者の定義が入れ替わっている。ヴェブレン効果(顕示的消費)の説明のみ正しい。\n\n【まとめ】正解はオ。『デモ＝外形的・統計的属性／サイコ＝心理・価値観』の線引きと、『スノッブ(逆張り)・バンドワゴン(同調)・ヴェブレン(見せびらかし)』の3効果の定義は、入れ替えひっかけの定番として確実に区別する。"},
  {id:"r6-mng-q38-2",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第38問",title:"第38問 設問2　消費者の個人的要因(購買行動)",body:"消費者市場の分析は、企業が適正な製品を、適正なタイミングや方法で、適正なターゲット顧客に販売するために不可欠である。企業は、消費者を取り巻く社会文化的要因や個人的要因を分析することによって、各消費者に適したマーケティングの実現を目指している。\nこのうち、消費者の個人的要因(知覚・関与・記憶・感情など)に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"過去の経験や知識、自己との関連性などに基づき膨大な商業的情報に対して選択的に注意を向けるという知覚機能は、無意識に働きかける情報に対しては働かない。そのため、サブリミナル広告は製品のブランド化に大きな影響を与える。"},{key:"イ",label:"消費者の関与水準とブランド間の知覚差異によって購買行動を分類したアサエルによると、バラエティ・シーキングが最も起こりやすいのは、関与が低く、ブランド間の知覚差異が大きい場合である。"},{key:"ウ",label:"消費者の購買意思決定に影響を与える記憶では、一時的に情報を保持する手続き的記憶と、情報の保持期間が長く、一生にわたり潜在的に保持されるエピソード記憶や意味記憶の役割が明らかにされている。"},{key:"エ",label:"製品が魅力的に見えたりそうでなかったりすることに、天気や店舗の雰囲気といった、製品とは無関連な原因から生じている感情が影響を及ぼすことがある。同化効果と呼ばれるこのような現象は、感情が生じている原因を消費者が正しく認識している場合には見られない。"}],correct:"イ",explanation:"【論点・背景】消費者の個人的要因(知覚・関与・記憶・感情)に関する理論問題。中心はアサエルの購買行動類型：関与水準(高/低)×ブランド間知覚差異(大/小)の2×2で、(1)高関与×差異大＝複雑な購買行動(情報処理型)、(2)高関与×差異小＝不協和低減型、(3)低関与×差異大＝バラエティ・シーキング(多様性追求)、(4)低関与×差異小＝習慣的購買、に分類する。\n\n【正答の理由】イ：バラエティ・シーキングは、こだわり(関与)は低いがブランドの違いは知覚できる場合に、飽きや目新しさを求めてブランドを次々に切り替える行動。『低関与×知覚差異大』という位置づけはアサエルの分類どおりで正しい(スナック菓子や飲料が典型例)。\n\n【誤答の検討】\n・ア：知覚の選択性は意識的な情報にのみ働くわけではないが、より重要な誤りは結論部分で、サブリミナル(閾下)刺激が購買やブランド化に大きな影響を与えるという主張には頑健な実証的裏付けがなく、『大きな影響を与える』は誤り。\n・ウ：『一時的に情報を保持する』のは短期記憶(作動記憶)。手続き的記憶は自転車の乗り方のような技能に関する長期記憶の一種であり、短期記憶と取り違えている。エピソード記憶・意味記憶が長期記憶である点だけが正しい。\n・エ：天気や店舗の雰囲気など製品と無関連な感情が製品評価に影響する現象は『感情の誤帰属』(気分を製品の魅力と取り違える)として知られ、『同化効果』という名称は不適切。なお『原因を正しく認識していると効果が消える』という後段は誤帰属の特徴として正しいだけに、名称のすり替えに気づけるかが問われる。\n\n【まとめ】正解はイ。アサエルの2×2(複雑・不協和低減・バラエティ・習慣)は頻出の暗記事項。記憶の分類(短期/長期、手続き的・エピソード・意味)と感情の誤帰属も、用語のすり替えひっかけの定番として整理しておく。"},
  {id:"r6-mng-q39",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第39問",title:"第39問　マーケティング・リサーチ",body:"マーケティング・リサーチに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"サーベイ法では、間隔尺度、序数尺度、比例尺度、名義尺度によってデータが収集される。このうち、調査対象者の選択した回答番号が数字としての意味を持たず、回答番号の違いが単に対象者の質的な違いを分類するだけの意味を持つ尺度は間隔尺度である。"},{key:"イ",label:"自社ビールの売上が落ちてきている原因の1つとして「テイストが軽すぎる」という仮説が立てられた場合、自社ビールのテイストに関する消費者データを収集して分析し、仮説を明らかにしようとする調査をインサイト・リサーチと呼ぶ。"},{key:"ウ",label:"消費者の発言データは、コーディングにより頻度を算出したり、コード間の結びつきを図示したりするなどして解釈が行われる。データの解釈では、分析者の主観を排除し、客観的に結果を示すことが重視される。"},{key:"エ",label:"データ収集において、リサーチ対象となる母集団の全てを対象に調査を実施する全数調査に対し、母集団の一部を標本として抽出して調査を実施する悉皆調査では、母集団の属性を反映した標本を抽出することが重視される。"},{key:"オ",label:"マーケティング・リサーチで収集および利用されるデータの中で、自社の売上や顧客情報といったすでに社内に蓄積された内部データは一次データに該当し、他の組織が収集した外部データは二次データに該当する。"}],correct:"ウ",explanation:"【論点・背景】マーケティング・リサーチの基礎用語(測定尺度・調査タイプ・定性データ分析・全数/標本調査・一次/二次データ)の横断問題。\n\n【正答の理由】ウ：インタビューなどで得た消費者の発言(定性)データは、コーディング(発言内容にコードを付与して分類)によって頻度を集計したり、コード間の関係を図示したりして解釈される。その際、分析者の恣意的な解釈に流れないよう、手続きを明確にして主観を排除し、客観的に結果を示すことが重視される。定性データ分析の標準的な説明として正しい。\n\n【誤答の検討】\n・ア：回答番号が数字としての意味を持たず質的分類のみを表すのは『名義尺度』(性別・職業など)。間隔尺度は目盛りの間隔が等しい尺度(温度など)であり、取り違え。4尺度は『名義(分類)→序数(順位)→間隔(差が意味を持つ)→比例(ゼロと比が意味を持つ)』の階層で覚える。\n・イ：立てた仮説をデータで検証する調査は『検証的(仮説検証型)調査』。インサイト・リサーチは、消費者自身も自覚していない深層の本音(インサイト)を探索的に発見しようとする調査であり、仮説検証とは方向が逆。\n・エ：母集団の一部を抽出して調べるのは『標本調査』。悉皆(しっかい)調査は全数調査の別名であり、用語が逆になっている。\n・オ：一次データ／二次データの区別は『当該調査目的のために新たに収集したか否か』で決まる。社内に既に蓄積された売上・顧客データは(社内のものであっても)内部二次データであり、『内部＝一次』とするのは誤り。\n\n【まとめ】正解はウ。『名義・序数・間隔・比例の4尺度』『探索的(インサイト)vs検証的』『全数(悉皆)vs標本』『一次(新規収集)vs二次(既存)』という4組の対概念を正確に区別できれば全肢を判定できる。"},
  {id:"r6-mng-q40",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第40問",title:"第40問　ジョハリの窓とリサーチ手法",body:"下図は、「自分でわかっている」自己と「他人がわかっている」自己の一致・不一致を、窓のように見える4つの枠に分類したジョハリの窓と呼ばれる概念図である。企業が消費者の自己に関するデータを収集する場合、どのリサーチ手法が、どの窓の自己データ収集において有効かを記した記述として、最も適切なものを下記の解答群から選べ。",figure:"MgtR6Q40",options:[{key:"ア",label:"インタビュー調査は、どの窓の自己データの収集についても有効ではない。"},{key:"イ",label:"行動観察調査は、「開放の窓」についてのデータを得るために有効ではない。"},{key:"ウ",label:"行動観察調査は、「盲点の窓」についてのデータを得るために有効である。"},{key:"エ",label:"定量的なアンケート調査は、「開放の窓」と「盲点の窓」についてのデータを得るために有効である。"},{key:"オ",label:"定量的なアンケート調査は、「未知の窓」についてのデータを得るために有効である。"}],correct:"ウ",explanation:"【論点・背景】ジョハリの窓は自己を4象限に分類する：開放の窓(自分も他人もわかっている)、盲点の窓(自分はわからないが他人はわかっている)、隠された窓(自分はわかっているが他人はわからない)、未知の窓(自分も他人もわからない)。リサーチ手法との対応は、『本人の自覚に依存する手法(アンケート・インタビュー)は本人がわかっている窓(開放・隠された)に有効』『本人の自覚に依存しない手法(行動観察)は本人がわからない窓(盲点)に有効』という原理で整理できる。\n\n【正答の理由】ウ：行動観察調査は、消費者本人が自覚していない無意識の行動・癖・使い方を第三者の観察によって捉える手法であり、『自分はわからないが他人(観察者)にはわかる』盲点の窓のデータ収集にまさに有効。正しい。\n\n【誤答の検討】\n・ア：インタビュー調査は、本人が自覚している事柄、特に普段は表に出さない本音(隠された窓)や開放の窓のデータ収集に有効。『どの窓にも有効でない』は誤り。\n・イ：行動観察は、本人も自覚し他人にも見えている行動(開放の窓)も当然観察できるため、『開放の窓に有効ではない』は誤り。\n・エ：アンケート調査は本人の自己申告に依存するため、本人が自覚していない『盲点の窓』のデータは原理的に得られない。開放の窓に有効という前半は正しいが、盲点を含めた点で誤り。\n・オ：未知の窓は本人も他人もわかっていない領域であり、本人の回答に頼るアンケートでは捉えられない(深層的な投影法や長期のエスノグラフィなどでようやく接近できる領域)。\n\n【まとめ】正解はウ。『回答ベースの手法→本人がわかっている窓(開放・隠された)』『観察ベースの手法→本人がわからない窓(盲点)』『未知の窓→通常の調査では困難』という対応原理を覚えれば、初見でも論理的に解ける。"},

const QUESTIONS_LAW = [
  {id:"r7-law-q1",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第1問",title:"第1問　株主総会",body:"株主総会に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"株主総会の決議について特別の利害関係を有する株主は、その決議において、いかなる場合も議決権を行使することができない。"},{key:"イ",label:"株主は、保有する議決権について、常に統一して行使しなければならない。"},{key:"ウ",label:"非公開会社であり取締役会設置会社でない会社では、株主総会は会社の本店の所在地において開催しなければならない。"},{key:"エ",label:"非公開会社であり取締役会設置会社でない会社では、書面・電磁的方法による議決権行使を定めたときを除き、1週間より短い期間を株主総会の招集通知の発送期限とすることができる。"}],correct:"エ",explanation:"【立法趣旨・背景】株主総会は株主が会社の基本的意思決定に参加する最高機関。会社法は機関設計を会社の規模・公開性に応じて柔軟にし、特に取締役会を置かない非公開・小規模会社では手続を簡素化している。\n\n【正答の根拠】取締役会を設置しない非公開会社では、招集通知は原則『総会日の1週間前まで』だが、書面・電磁的方法による議決権行使を定める場合を除き、定款でこれより短い期間に短縮できる(会社法299条1項)。小規模・閉鎖的会社の機動性を確保する趣旨。\n\n【誤答の検討とキーワードの意味】\n・『特別利害関係株主はいかなる場合も議決権を行使できない』とする記述は誤り。株主総会では特別利害関係株主も議決権を行使でき、著しく不当な決議がなされた場合に決議取消事由となるにとどまる(取締役会の特別利害関係取締役が議決に加われないのとは扱いが異なる)。『特別利害関係』というキーワードで取締役会と株主総会の扱いの違いを混同させるひっかけ。\n・『議決権は常に統一行使しなければならない』は誤り。株主は議決権の不統一行使ができる(会社法313条)。これは信託の受託者など他人のために株式を持つ者に配慮した規定。\n・『株主総会は本店所在地で開催しなければならない』は誤り。旧商法には開催地制限があったが、現行会社法に開催地の法的制限はない。"},
  {id:"r7-law-q2",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第2問",title:"第2問　取締役会",body:"取締役会に関する記述として、最も適切なものはどれか。なお、特別取締役の定めはないものとする。",options:[{key:"ア",label:"代表取締役および業務執行取締役は3カ月に1回以上、職務執行の状況を取締役会に報告しなければならないが、定款の定めがあれば取締役全員への書面通知によりその報告を省略できる。"},{key:"イ",label:"取締役会の決議の定足数は、当該決議について特別の利害関係があり議決に加わることができない取締役の人数を除いて計算することができる。"},{key:"ウ",label:"取締役会を招集する者は取締役会の日の1週間前までに通知を発しなければならず、この通知期間は定款の定めによっても短縮できない。"},{key:"エ",label:"取締役が現実に開催される予定の取締役会に出席できない場合、事前に他の取締役に委任状を発行することにより当該取締役会で議決権を行使できる。"}],correct:"イ",explanation:"【立法趣旨・背景】取締役会は業務執行の意思決定と取締役の相互監督を担う合議体。会議体としての適正な意思決定を確保するため、株主総会とは異なる厳格な手続(現実の出席・議論)が求められる。\n\n【正答の根拠】取締役会の決議の定足数は、特別利害関係を有し議決に加われない取締役を除いて計算できる(会社法369条2項)。利害関係者を意思決定から排除し決議の公正を担保する趣旨。\n\n【誤答の検討とキーワードの意味】\n・『代表取締役等の職務執行状況の報告(3カ月に1回以上)は定款で書面通知により省略できる』は誤り。この報告は取締役会の監督機能の中核であり省略できない(会社法363条2項。報告事項の省略を認める372条の適用除外)。\n・『招集通知期間(原則1週間前)は定款でも短縮できない』は誤り。定款でこれを下回る期間に短縮できる(会社法368条1項)。\n・『委任状により他の取締役に議決権を代理行使させられる』は誤り。取締役は会議体で自ら議論・議決すべきで、議決権の代理行使はできない(株主総会では代理行使が可能なのと対照的)。『委任状』というキーワードで株主総会と取締役会の違いを問うひっかけ。"},
  {id:"r7-law-q3",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第3問",title:"第3問　監査役",body:"監査役に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"監査役の任期は、定款の定めによって選任後2年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとすることができる。"},{key:"イ",label:"監査役は、取締役会の同意があれば、子会社の取締役を兼ねることができる。"},{key:"ウ",label:"監査役を解任する旨の株主総会の決議は、定款の定めがない場合は議決権の過半数を有する株主が出席し、出席株主の議決権の過半数をもって行う。"},{key:"エ",label:"監査役を辞任した者は、取締役会の同意がなくても、辞任後最初に招集される株主総会に出席して辞任した旨およびその理由を述べることができる。"}],correct:"エ",explanation:"【立法趣旨・背景】監査役は取締役の職務執行を監査し会社の健全性を担保する機関。独立性を確保するため、任期の長さや兼任禁止、解任の厳格化など、取締役より手厚い身分保障が図られている。\n\n【正答の根拠】辞任した監査役は、辞任後最初に招集される株主総会に出席して辞任した旨およびその理由を述べることができる(会社法345条が監査役に準用)。不当な圧力による辞任を株主に知らせ、監査役の独立性を守る趣旨。\n\n【誤答の検討とキーワードの意味】\n・『定款で任期を選任後2年以内に短縮できる』は誤り。監査役の任期は原則『選任後4年以内に終了する事業年度のうち最終のものに関する定時総会終結時まで』で、独立性確保のため定款でも短縮できない(会社法336条)。取締役の任期(原則2年・短縮可)との違いがポイント。\n・『取締役会の同意があれば子会社の取締役を兼ねられる』は誤り。監査役は会社・子会社の取締役等を兼ねられない(兼任禁止、会社法335条2項)。自己監査を防ぐ趣旨で、同意では覆らない。\n・『監査役の解任は普通決議』は誤り。監査役の解任は株主総会の特別決議による(会社法343条4項・309条2項)。これも監査役の身分保障の一環。"},
  {id:"r7-law-q4",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第4問",title:"第4問　譲渡制限株式",body:"譲渡制限株式に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"発行する全部の株式の内容として譲渡制限の定めを設ける定款変更を行う場合には、総株主の同意を得なければならない。"},{key:"イ",label:"株主が譲渡承認の請求をした場合、会社が請求の日から2週間(または定款で定めたより短い期間)内に決定内容を通知しなかったときは、別段の合意がない限り承認したものとみなされる。"},{key:"ウ",label:"相続により譲渡制限株式を取得した株式取得者であっても、会社による取得の承認を受けなければ株主名簿の名義書換の請求をすることができない。"},{key:"エ",label:"取締役会設置会社の場合には、定款の定めにより、譲渡承認の決定を株主総会の決議によるものとすることはできない。"}],correct:"イ",explanation:"【立法趣旨・背景】譲渡制限株式は、会社にとって好ましくない者が株主になるのを防ぐための制度で、同族・閉鎖的会社の人的信頼関係を保護する。一方で株主の投下資本回収の途を不当に塞がない配慮も必要となる。\n\n【正答の根拠】株主から譲渡承認請求があった場合、会社が請求日から2週間(定款でより短い期間も可)以内に承認するか否かを通知しないときは、承認したものとみなされる(会社法145条1号)。会社の不作為で株主が塩漬けにされるのを防ぐ趣旨。\n\n【誤答の検討とキーワードの意味】\n・『全株式に譲渡制限を設ける定款変更には総株主の同意が必要』は誤り。これは特殊決議(議決権を行使できる株主の半数以上かつ議決権の3分の2以上、会社法309条3項)で足り、総株主の同意までは不要。\n・『相続(一般承継)で取得した者も承認を受けなければ名義書換できない』は誤り。相続・合併等の一般承継は『譲渡』に当たらず、承認なしに権利を取得し名義書換を請求できる。『譲渡』と『一般承継』の区別がキーワード。\n・『取締役会設置会社では承認機関を株主総会にできない』は誤り。定款で承認機関を別の機関(株主総会等)に定めることができる(会社法139条1項ただし書)。"},
  {id:"r7-law-q5",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第5問",title:"第5問　合同会社",body:"合同会社に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"法人が業務執行社員である場合に、別の法人を職務執行者として選任することができる。"},{key:"イ",label:"労務や信用を出資の目的とすることができる。"},{key:"ウ",label:"新たな社員が加入する場合、定款の変更が必要である。"},{key:"エ",label:"業務執行社員は、無限責任を負う。"}],correct:"ウ",explanation:"【立法趣旨・背景】合同会社(LLC)は2006年会社法で導入された持分会社の一類型。出資者全員が間接有限責任を負いつつ、内部関係は組合的に定款自治で柔軟に設計できる『有限責任＋人的会社』のハイブリッド。スタートアップやジョイントベンチャーに使われる。\n\n【正答の根拠】合同会社で新たに社員を加入させるには、定款の絶対的記載事項である社員に関する事項の変更＝定款変更が必要(会社法604条)。社員の個性が重視される持分会社の性質を反映する。\n\n【誤答の検討とキーワードの意味】\n・『法人が業務執行社員のとき、別の法人を職務執行者に選任できる』は誤り。法人が業務執行社員である場合、職務を行う自然人(職務執行者)を選任しなければならない(会社法598条)。実際に職務を行う生身の人間を特定させる趣旨。\n・『労務や信用を出資の目的にできる』は誤り。合同会社の社員は間接有限責任のため、出資は金銭等の財産に限られ、労務出資・信用出資はできない(合名・合資会社の無限責任社員とは異なる)。『労務・信用出資』は無限責任社員に許される点との対比がキーワード。\n・『業務執行社員は無限責任を負う』は誤り。合同会社の社員は全員が間接有限責任社員(株式会社の株主に近い)。"},
  {id:"r7-law-q6-1",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第6問",title:"第6問 設問1　会社分割と事業譲渡(契約移転・債権者保護)",body:"X社のA事業部門をY社に譲渡する方法として、Y社本体での事業譲受けか、会社分割による新会社設立後にその株式をY社が譲り受けるかを検討している。会話の空欄A(契約関係の移転の効力の違い)とB(債権者保護手続の違い)に入る記述の組み合わせとして、最も適切なものはどれか。",options:[{key:"ア",label:"A：会社分割は包括承継により原則として権利義務の包括的移転の効果が生じるが、事業譲渡ではその効果は生じず、個々の財産の移転手続や対抗要件具備が個別に必要で、契約の相手方の同意を得る必要がある。　B：会社分割では債権者保護手続が必要だが、事業譲渡では債権者保護手続は不要。ただし個別に債権者の同意を得る必要がある。"},{key:"イ",label:"A：会社分割は包括承継により包括的移転の効果が生じるが、事業譲渡では生じず個別の同意が必要。　B：会社分割の場合も事業譲渡の場合も、債権者保護手続が必要となる。"},{key:"ウ",label:"A：会社分割も事業譲渡も包括承継により包括的移転の効果が生じるので、個別に契約の相手方の同意を得る必要はない。　B：会社分割も事業譲渡も債権者保護手続が必要となる。"},{key:"エ",label:"A：会社分割も事業譲渡も包括承継により包括的移転の効果が生じるので個別同意は不要。　B：会社分割も事業譲渡も債権者保護手続は必要ない。"}],correct:"ア",explanation:"【立法趣旨・背景】事業を移転する手法には、組織法上の行為である『会社分割』と、取引法上の個別契約である『事業譲渡』がある。両者は権利義務の移転の仕方と債権者保護の手続が大きく異なり、M&A実務での使い分けの基本論点。\n\n【正答の根拠(A・B)】\nA(移転の効力):会社分割は組織再編行為で、分割計画・契約で定めた権利義務が包括的に承継される(包括承継)。契約上の地位も個別の相手方同意なく移転しうる。これに対し事業譲渡は個々の財産・契約を個別に移転する特定承継で、債権譲渡の対抗要件具備や契約上の地位移転に相手方の同意が必要。\nB(債権者保護):会社分割では会社法上の債権者異議手続(債権者保護手続)が法定されている。事業譲渡には会社法上の債権者保護手続の規定がなく、債務の移転は個別の債権者の同意(免責的債務引受等)によることになる。\n\n【誤答の検討】A・Bのいずれかで両手法の差を取り違える選択肢は誤り。特に『事業譲渡でも会社法上の債権者保護手続が必要』とする点や『会社分割でも個別同意が必要』とする点は、包括承継/特定承継の本質的な違いに反する。会社分割は手続が重い代わりに包括移転でき、事業譲渡は手続が軽い代わりに個別の同意・対抗要件が要る、という構造を押さえる。"},
  {id:"r7-law-q6-2",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第6問",title:"第6問 設問2　反対株主の株式買取請求権",body:"会話の空欄C(会社分割と事業譲渡での反対株主の株式買取請求権の違い、簡易手続は利用できない前提)に入る記述として、最も適切なものはどれか。",options:[{key:"ア",label:"会社分割では反対株主の株式買取請求権が認められているが、事業譲渡では認められていない。"},{key:"イ",label:"会社分割では反対株主の株式買取請求権が認められていないが、事業譲渡では認められている。"},{key:"ウ",label:"会社分割でも事業譲渡でも、反対株主の株式買取請求権が認められている。"},{key:"エ",label:"会社分割でも事業譲渡でも、反対株主の株式買取請求権は認められていない。"}],correct:"ウ",explanation:"【立法趣旨・背景】組織再編や重要な事業譲渡は、反対する株主にとって不本意な会社の基礎的変更となる。そこで会社法は、一定の場合に反対株主へ『公正な価格』での株式買取請求権を与え、多数決で進む再編から少数株主の経済的利益を救済する。\n\n【正答の根拠】簡易手続が使えない規模の場合、会社分割(吸収分割・新設分割)でも、事業の重要な一部の譲渡等(事業譲渡)でも、株主総会の特別決議を要し、反対株主には株式買取請求権が認められる(会社法785条・797条・469条等)。いずれの手法でも少数株主保護が及ぶ。\n\n【誤答の検討とキーワードの意味】『会社分割のみ認められる』『事業譲渡のみ認められる』『どちらも認められない』とする選択肢は誤り。買取請求権の有無は手法の種類ではなく『株主総会の特別決議を要する重大な行為か』で決まり、両手法とも(簡易手続によらない限り)これに当たる。なお『簡易手続』とは、譲渡資産や対価が一定割合以下で株主総会決議を省略できる制度で、これに当たる場合は買取請求権が生じないため、設問が『簡易手続は使えない前提』とする点が効いている。"},
  {id:"r7-law-q7",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第7問",title:"第7問　下請代金支払遅延等防止法",body:"下請法に関する会話の空欄A(当月納入分を翌月納入分として扱い支払までに60日超が経過した場合)とB(値上げを拒否し理由を書面等で説明せず取引価格を据え置いた場合)に入る記述の組み合わせとして、最も適切なものを下記の解答群から選べ。",options:[{key:"ア",label:"A：60日以内に支払わないことを両者間で合意しているので下請法上の問題にはならない。　B：価格転嫁しない理由を書面等で回答せず取引価格を据え置くことは、買いたたきに該当し下請法上の問題になる可能性がある。"},{key:"イ",label:"A：60日以内に支払わないことを両者間で合意しているので下請法上の問題にはならない。　B：御社も合意したのであれば下請法上の問題にはならない。"},{key:"ウ",label:"A：60日以内に支払わないことを両者間で合意している場合であっても、下請法上の問題になる。　B：価格転嫁しない理由を書面等で回答せず取引価格を据え置くことは、買いたたきに該当し下請法上の問題になる可能性がある。"},{key:"エ",label:"A：60日以内に支払わないことを両者間で合意している場合であっても、下請法上の問題になる。　B：御社も合意したのであれば下請法上の問題にはならない。"}],correct:"ウ",explanation:"【立法趣旨・背景】下請代金支払遅延等防止法(下請法)は、親事業者の優越的地位の濫用から立場の弱い下請事業者を守る法律(独占禁止法の特別法)。当事者の『合意』があっても規制を免れない強行法規である点が特徴。近年は価格転嫁・賃上げの観点から運用が強化されている。\n\n【正答の根拠(A・B)】\nA:下請代金の支払期日は物品等の受領日から起算して60日以内に定めなければならず(下請法2条の2)、当事者が合意していても60日を超える支払は違反(支払遅延)。『合意があるから問題ない』は通用しない。\nB:コスト上昇分の価格転嫁について協議を求められたのに、理由を書面等で説明せず一方的に従来価格に据え置く行為は『買いたたき』に該当しうる。下請が渋々受け入れていても問題となる。\n\n【誤答の検討とキーワードの意味】A・Bのいずれかで『合意/受入れがあれば問題ない』とする選択肢は誤り。下請法が強行法規であり当事者の合意で逸脱できないこと、『買いたたき』が形式的合意の有無でなく実質的な押し付けで判断されることが核心。下請代金の減額・受領拒否・返品等とともに、近年は『買いたたき(価格据置き)』が重点的に取り締まられている。"},
  {id:"r7-law-q8",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第8問",title:"第8問　仲裁条項(国際契約)",body:"準拠法を日本法、紛争解決を日本商事仲裁協会の商事仲裁規則に従い東京での仲裁(仲裁人3名、各当事者1名選任+両者が第三仲裁人を選定、手続言語は英語、仲裁判断は終局的かつ拘束力あり)とする契約条項に関する記述として、最も適切なものを下記の解答群から選べ。",options:[{key:"ア",label:"仲裁手続は、中立的な第三者である3名の仲裁人が当事者の話し合いを仲介して紛争解決を目指す手続であり、解決に関する合意が成立しない場合には不成立となる。"},{key:"イ",label:"仲裁判断は当事者を法的に拘束するが、判断内容に不服がある場合には原則として裁判所に不服の申立てをすることができる。"},{key:"ウ",label:"仲裁手続は、日本商事仲裁協会の商事仲裁規則に従って、3名の仲裁人によって、英語で行われる。"},{key:"エ",label:"仲裁手続は日本の東京で行われるため、国際商業会議所の商事仲裁規則に従い、契約条項の定めにかかわらず日本語で行われ、準拠法は日本法となる。"}],correct:"ウ",explanation:"【立法趣旨・背景】仲裁は、当事者の合意に基づき、裁判所ではなく仲裁人の判断(仲裁判断)で紛争を終局的に解決する制度(仲裁法)。国際取引で多用されるのは、ニューヨーク条約により仲裁判断の国際的執行が容易で、手続言語・準拠法・仲裁地を当事者が柔軟に設計できるため。\n\n【正答の根拠】設問の条項どおり、日本商事仲裁協会(JCAA)の商事仲裁規則に従い、3名の仲裁人により、手続言語を英語として仲裁が行われる。当事者の合意(仲裁条項)が手続の基本ルールとなる。\n\n【誤答の検討とキーワードの意味】\n・『仲裁は当事者の話し合いを仲介し、合意不成立なら不成立になる』は誤り。それは『調停(mediation)』の説明。仲裁は仲裁人が判断を下して終局的に解決する点で調停と異なる。『仲裁』と『調停』の区別がキーワード。\n・『仲裁判断に不服があれば裁判所に不服申立てできる』は誤り。仲裁判断は終局的・拘束力を持ち、内容の当否を上訴のように争うことは原則できない(取消事由は手続的瑕疵等に限定)。\n・『東京で行うから国際商業会議所(ICC)規則・日本語による』は誤り。規則も言語も当事者の条項(JCAA・英語)が優先し、仲裁地が東京であることは規則・言語を左右しない。"},
  {id:"r7-law-q9",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第9問",title:"第9問　職務発明(特許法35条)",body:"特許法第35条に規定する職務発明に関する記述として、最も適切なものはどれか。なお「使用者等」は使用者・法人・国・地方公共団体、「従業者等」は従業者・法人の役員・国家公務員・地方公務員をいう。",options:[{key:"ア",label:"従業者等がした発明については、その発明が職務発明である場合を除き、あらかじめ使用者等に特許を受ける権利を取得させることを定めた契約・勤務規則その他の定めの条項は無効である。"},{key:"イ",label:"使用者等は従業者等が職務発明について特許を受けたときその特許権について通常実施権を有するが、この通常実施権は発生後にその特許権を取得した者に対しては効力を有しない。"},{key:"ウ",label:"使用者等は従業者等が職務発明について特許を受けたときその特許権について通常実施権を有するが、この通常実施権は登録しなければ効力を生じない。"},{key:"エ",label:"職務発明は従業者等の現在の職務に属する発明を指すので、同一企業内であっても従業者等の過去の職務に属する発明が職務発明と認められる場合はない。"}],correct:"ア",explanation:"【立法趣旨・背景】職務発明制度(特許法35条)は、従業者の発明意欲と、研究開発に投資する使用者の利益のバランスを図る制度。発明は本来発明者(従業者)に帰属するのが原則だが、使用者にも一定の利用権を認める。\n\n【正答の根拠】職務発明以外の発明(自由発明等)について、あらかじめ使用者に特許を受ける権利等を取得させる契約・勤務規則の条項は無効(特許法35条2項)。職務と無関係な発明まで使用者が事前に吸い上げるのを防ぎ、従業者を保護する趣旨。\n\n【誤答の検討とキーワードの意味】\n・『法定通常実施権は後に特許権を取得した第三者には及ばない』は誤り。職務発明について使用者が持つ通常実施権は法定のもので、登録なくして第三者にも対抗できる。\n・『法定通常実施権は登録しなければ効力を生じない』は誤り。職務発明の使用者の通常実施権は登録不要で当然に発生する(特許法35条1項)。一般の通常実施権(契約による)とは異なる『法定』である点がキーワード。\n・『職務発明は現在の職務に属する発明に限られ、過去の職務は含まれない』は誤り。職務発明には『現在又は過去の職務』に属する発明が含まれる。"},
  {id:"r7-law-q10",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第10問",title:"第10問　補償金請求権(特許法65条1項)",body:"特許法第65条第1項に規定する補償金請求権に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"出願公開後に特許出願が放棄された場合でも、補償金請求権は消滅しない。"},{key:"イ",label:"特許出願人は出願公開後に発明の内容を記載した書面を提示して警告をしなければ、出願公開後・設定登録前に業として発明を実施した者に対し補償金請求権を一切行使できない。"},{key:"ウ",label:"補償金請求権は、特許権の設定の登録があった後でなければ行使することができない。"},{key:"エ",label:"補償金請求権を行使した場合は、特許権は行使できない。"}],correct:"ウ",explanation:"【立法趣旨・背景】特許出願は出願公開により内容が公知となるが、設定登録までは特許権が発生しない。この空白期間に第三者が模倣しても権利行使できないと出願人が害されるため、補償金請求権(特許法65条)が手当てされている。\n\n【正答の根拠】補償金請求権は、特許権の設定登録があった後でなければ行使できない(特許法65条2項)。登録によって権利が確定するまで行使を待たせる趣旨。\n\n【誤答の検討とキーワードの意味】\n・『出願公開後に出願が放棄されても補償金請求権は消滅しない』は誤り。出願の放棄・取下げ・却下、拒絶査定の確定、無効審決の確定等の場合、補償金請求権は初めから生じなかったものとみなされる。\n・『警告をしなければ一切行使できない』は誤り。原則は書面警告が必要だが、相手方が出願公開された発明であると知って(悪意で)実施していた場合は警告なしでも行使できる。『警告』と『悪意』がキーワード。\n・『補償金請求権を行使すると特許権は行使できない』は誤り。補償金請求権(公開〜登録前の実施に対するもの)と、登録後の特許権の行使は別個に成立する。"},
  {id:"r7-law-q11",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第11問",title:"第11問　不正競争防止法",body:"不正競争防止法に関する記述として、最も適切なものはどれか。なお「特定商品等表示」とは人の業務に係る氏名・商号・商標・標章その他の商品・役務を表示するものをいう。",options:[{key:"ア",label:"営業秘密を保有する事業者からその営業秘密を示された場合に、不正の利益を得る目的でその営業秘密を使用する行為は不正競争に該当する旨が規定されている。"},{key:"イ",label:"他人の著名な商品等表示と同一・類似のものを使用する行為が「著名表示冒用行為」と認定されるには、他人の商品・営業と混同を生じさせることが要件となる。"},{key:"ウ",label:"第2条第1項第1号の「商品等表示」に含まれる商標法上の「商標」には、役務商標は含まれない。"},{key:"エ",label:"不正の利益を得る目的で他人の特定商品等表示と同一・類似のドメイン名を使用する権利を取得する行為は、当該表示が周知である場合に限り不正競争を構成する旨が規定されている。"}],correct:"ア",explanation:"【立法趣旨・背景】不正競争防止法は、事業者間の公正な競争秩序を維持するため、営業秘密の侵害・周知/著名表示の冒用・形態模倣・ドメイン名の不正取得など類型を限定して規制する。商標法等の登録制度を補完し、登録がなくても保護を及ぼす点に特徴がある。\n\n【正答の根拠】正当に示された営業秘密を、不正の利益を得る目的または保有者に損害を加える目的で使用・開示する行為は不正競争に該当する(不正競争防止法2条1項7号)。従業員や取引先による秘密の流用を捕捉する規定。\n\n【誤答の検討とキーワードの意味】\n・『著名表示冒用行為の認定には混同のおそれが要件』は誤り。著名表示冒用(2条1項2号)は混同を要件とせず、著名表示へのフリーライド・希釈化を防ぐ。混同のおそれを要件とするのは『周知表示混同惹起行為』(1号)であり、両者の区別がキーワード。\n・『商品等表示の商標には役務商標(サービスマーク)は含まれない』は誤り。役務商標も含まれる。\n・『ドメイン名の不正取得は周知の場合に限り不正競争となる』は誤り。ドメイン名の不正取得・使用(2条1項19号)は周知・著名であることを要件としない。"},
  {id:"r7-law-q12",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第12問",title:"第12問　立体商標と出願変更",body:"ワインの容器形状の立体商標について、会話の空欄A(登録が認められうる要件)とB(立体商標の商標登録出願を意匠登録出願に変更できるか)に入る記述の組み合わせとして、最も適切なものを下記の解答群から選べ。",options:[{key:"ア",label:"A：使用された結果、需要者が何人かの業務に係る商品であることを認識できるもの。　B：いいえ。立体商標の商標登録出願を意匠登録出願に変更することはできません。"},{key:"イ",label:"A：使用された結果、需要者が何人かの業務に係る商品であることを認識できるもの。　B：はい。所定期間内であれば、立体商標の商標登録出願を意匠登録出願に変更することができます。"},{key:"ウ",label:"A：容器の形状が視覚を通じて美感を起こさせるもの。　B：いいえ。立体商標の商標登録出願を意匠登録出願に変更することはできません。"},{key:"エ",label:"A：容器の形状が視覚を通じて美感を起こさせるもの。　B：はい。所定期間内であれば、立体商標の商標登録出願を意匠登録出願に変更することができます。"}],correct:"ア",explanation:"【立法趣旨・背景】商標は商品・役務の出所を識別する標識。商品や容器の形状そのものは本来誰もが使えるべきで識別力を欠くのが原則だが、使用を通じて特定の出所を示すに至れば例外的に商標登録を認める(使用による識別力の獲得)。意匠法(物品の美的外観の保護)とは保護目的が異なる。\n\n【正答の根拠(A・B)】\nA:容器形状の立体商標は原則識別力を欠くが、使用の結果、需要者が何人かの業務に係る商品であると認識できるに至った場合は登録されうる(商標法3条2項)。\nB:商標登録出願を意匠登録出願へ出願変更することはできない(制度・保護対象が異なるため)。\n\n【誤答の検討とキーワードの意味】\n・Aを『容器の形状が視覚を通じて美感を起こさせるもの』とする選択肢は誤り。『美感を起こさせる』は意匠の登録要件(意匠法2条・3条)であって商標の登録要件ではない。商標(出所識別)と意匠(美的外観)の保護目的の違いがキーワード。\n・Bを『所定期間内なら意匠登録出願に変更できる』とする選択肢は誤り。出願変更は同一法域内の出願種類間(例:特許↔実用新案)で認められるもので、商標→意匠の変更は認められない。"},
  {id:"r7-law-q13",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第13問",title:"第13問　パリ条約",body:"パリ条約に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"意匠の保護は、当該意匠の実施をしないことにより失われる旨が、パリ条約に規定されている。"},{key:"イ",label:"実用新案登録出願に基づいて優先権を主張して意匠登録出願をすることは、パリ条約では認められていない。"},{key:"ウ",label:"特許には、輸入特許、改良特許、追加特許など同盟国の法令によって認められる各種の特許が含まれる旨が、パリ条約に規定されている。"},{key:"エ",label:"パリ条約は、工業所有権の保護の対象として商号を挙げていない。"}],correct:"ウ",explanation:"【立法趣旨・背景】パリ条約は工業所有権(特許・実用新案・意匠・商標・商号等)の国際的保護の基本条約。内国民待遇・優先権・各国特許独立の原則などを定め、各国制度の調和を図る。\n\n【正答の根拠】パリ条約には、同盟国の法令により認められる輸入特許・改良特許・追加特許などの各種特許が『特許』に含まれる旨の規定がある(パリ条約4条の2等)。各国の多様な特許制度を包摂する趣旨。\n\n【誤答の検討とキーワードの意味】\n・『意匠は不実施により保護を失う旨が規定されている』は誤り。パリ条約5条Bは、意匠はいかなる場合も不実施を理由として効力を失わない旨を定めており、記述は逆。\n・『実用新案を基礎とする優先権主張で意匠登録出願をすることは認められていない』は誤り。パリ条約上、先の出願と後の出願の種類が異なる場合でも一定範囲で優先権が認められる。\n・『パリ条約は商号を保護対象として挙げていない』は誤り。パリ条約1条2項は工業所有権の保護対象として商号を明示している。"},
  {id:"r7-law-q14",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第14問",title:"第14問　美術の著作物の利用(著作権法46条)",body:"著作権法第46条に関する会話の空欄A(原作品が恒常的に設置される場所)とB(同条4号の「専ら美術の著作物の複製物の○○を目的として複製し、またはその複製物を○○する場合」)に入る語句の組み合わせとして、最も適切なものを下記の解答群から選べ。",options:[{key:"ア",label:"A：屋外の場所　B：展示"},{key:"イ",label:"A：屋外の場所　B：販売"},{key:"ウ",label:"A：公共の施設内　B：展示"},{key:"エ",label:"A：公共の施設内　B：販売"}],correct:"イ",explanation:"【立法趣旨・背景】著作権法は著作者の権利を保護する一方、文化的所産の公正な利用とのバランスを図るため、権利制限規定(自由に利用できる例外)を設ける。屋外に恒常設置された美術・建築の著作物は公衆の目に触れる公共性があり、一定の利用が認められる(46条)。\n\n【正答の根拠(A・B)】\nA:著作権法46条は、美術の著作物の原作品が街路・公園など『一般公衆の見やすい屋外の場所』に恒常的に設置されている場合等の利用を認める(A＝屋外の場所)。\nB:ただし46条4号は『専ら美術の著作物の複製物の販売を目的として複製し、又はその複製物を販売する場合』を例外(自由利用できない場合)とする(B＝販売)。彫刻のミニチュアを土産物として売る行為等を排除し、著作者の経済的利益を守る趣旨。\n\n【誤答の検討】Aを『公共の施設内』とする選択肢は、条文が『屋外の場所』を要件とする点で誤り(屋内展示物は対象外)。Bを『展示』とする選択肢は誤りで、自由利用が及ばないのは複製物の『販売』を目的とする場合。『屋外・恒常設置』と『販売目的の除外』の二点を押さえる。"},
  {id:"r7-law-q15",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第15問",title:"第15問　著作権の譲渡と著作者人格権",body:"イラストの著作権譲渡に関する会話の空欄A(「対価の完済により著作権はX社に移転する」と定めれば著作権はすべて移転するか)とB(著作者人格権は移転できるか)に入る記述の組み合わせとして、最も適切なものを下記の解答群から選べ。なお著作権法27条(翻案権等)・28条(二次的著作物の利用に関する原著作者の権利)が問題となる。",options:[{key:"ア",label:"A：いいえ。著作権法27条・28条の権利は譲渡の目的として特掲しないと、譲渡した者に留保したものと推定されます。　B：いいえ。著作者人格権は著作者の一身に専属し、譲渡することができません。"},{key:"イ",label:"A：いいえ。27条・28条の権利は特掲しないと譲渡した者に留保したものと推定されます。　B：はい。著作者人格権を移転することはできます。"},{key:"ウ",label:"A：はい。著作権はすべて対価を支払った者に自動的に移転します。　B：いいえ。著作者人格権は一身専属で譲渡できません。"},{key:"エ",label:"A：はい。著作権はすべて対価を支払った者に自動的に移転します。　B：はい。著作者人格権を移転することはできます。"}],correct:"ア",explanation:"【立法趣旨・背景】著作権(財産権)は譲渡できるが、著作者人格権(公表権・氏名表示権・同一性保持権)は著作者の人格的利益を守るもので譲渡できない。また権利譲渡契約では、特に強力な翻案権等が当然には移転しないよう、著作者保護の推定規定が置かれている。\n\n【正答の根拠(A・B)】\nA:著作権を譲渡する契約で、27条(翻案権・二次的著作物の創作権)・28条(二次的著作物の利用に関する原著作者の権利)を譲渡の目的として特掲しない場合、これらの権利は譲渡した者(著作者)に留保されたものと推定される(著作権法61条2項)。安易な全部譲渡から著作者を守る趣旨。\nB:著作者人格権は著作者の一身に専属し、譲渡することができない(著作権法59条)。\n\n【誤答の検討とキーワードの意味】Aを『対価を払えば著作権はすべて自動的に移転する』とする選択肢は、27条・28条の特掲がなければ留保と推定される点に反し誤り。Bを『著作者人格権も移転できる』とする選択肢は、人格権の一身専属性(59条)に反し誤り。財産権としての著作権(譲渡可・ただし27/28条は特掲要)と、人格権(譲渡不可)の区別がキーワード。"},
  {id:"r7-law-q16",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第16問",title:"第16問　不使用取消審判(商標法50条)",body:"既に登録されている同一文字商標に対し、不使用取消審判の利用を検討する会話の空欄A(継続して何年以上の不使用が要件か)とB(誰が請求できるか)に入る数値・記述の組み合わせとして、最も適切なものを下記の解答群から選べ。",options:[{key:"ア",label:"A：2　B：誰でも請求することができます"},{key:"イ",label:"A：2　B：利害関係人のみが請求することができます"},{key:"ウ",label:"A：3　B：誰でも請求することができます"},{key:"エ",label:"A：3　B：利害関係人のみが請求することができます"}],correct:"ウ",explanation:"【立法趣旨・背景】商標は使用してこそ出所表示機能を果たす。使われていない登録商標(死蔵商標)が他者の商標選択を妨げるのを防ぐため、不使用取消審判(商標法50条)が用意されている。商標法の『使用主義』的な調整弁。\n\n【正答の根拠(A・B)】\nA:継続して3年以上、日本国内で商標権者・専用使用権者・通常使用権者のいずれもが指定商品・役務について登録商標を使用していない場合に請求できる(商標法50条1項)(A＝3年)。\nB:不使用取消審判は『何人も』請求でき、利害関係は不要(B＝誰でも請求できる)。死蔵商標の整理という公益的性格から請求人適格を広く認める。\n\n【誤答の検討とキーワードの意味】Aを『2年』とする選択肢は誤り(正しくは3年)。Bを『利害関係人のみ』とする選択肢は誤り。無効審判の一部などでは利害関係が要求される場面もあるが、不使用取消審判は何人も請求できる点が特徴で、ここが混同を誘うポイント。"},
  {id:"r7-law-q17",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第17問",title:"第17問　共有(各3分の1で甲土地を共有)",body:"A・B・Cが各3分の1の割合で甲土地を共有している場合に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"A・B・Cが共同して甲土地を第三者に賃貸した場合、その賃貸借契約の解除は、A・B・Cが全員で行う必要がある。"},{key:"イ",label:"Aが甲土地の自己の持分をB・C以外の第三者に譲渡するためには、B・Cの同意を得る必要がある。"},{key:"ウ",label:"Aが甲土地の自己の持分を放棄した場合、その持分は国庫に帰属する。"},{key:"エ",label:"Aは、甲土地を不法に占有している第三者に対し、単独で甲土地全部の明渡しを請求することができる。"}],correct:"エ",explanation:"【立法趣旨・背景】共有は複数人が一つの物を持分で所有する状態。民法は、共有物の利用・変更・処分について、行為の重大性に応じて『保存行為(単独)』『管理行為(持分価格の過半数)』『変更・処分行為(全員の同意)』と段階的に意思決定要件を定める。\n\n【正答の根拠】各共有者は保存行為として、単独で第三者(不法占有者)に対し共有物全部の明渡しを請求できる(民法252条5項等)。共有物の現状維持は各人の利益になるため単独でできる。\n\n【誤答の検討とキーワードの意味】\n・『賃貸借契約の解除は共有者全員でしなければならない』は誤り。賃貸借の解除は管理行為で、持分価格の過半数で決する(民法252条1項)。『管理行為』のキーワード。\n・『自己の持分を第三者に譲渡するには他の共有者の同意が必要』は誤り。各共有者は自己の持分を単独で自由に処分できる(持分の処分は自由)。\n・『持分を放棄するとその持分は国庫に帰属する』は誤り。共有持分の放棄・共有者の相続人不存在の場合、その持分は他の共有者に帰属する(民法255条)。相続人不存在の単独所有財産が国庫に帰属する場合との違いがキーワード。"},
  {id:"r7-law-q18",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第18問",title:"第18問　保証",body:"保証に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"3,000万円の主たる債務について3人の連帯保証人がいる場合、各連帯保証人はそれぞれ1,000万円の限度で連帯保証債務を負う。"},{key:"イ",label:"事業のために負担した貸金債務を主たる債務とする保証契約は、主たる債務者の配偶者であって事業に現に従事していない者が保証人になろうとする場合、保証意思が公正証書で表示されていなくても効力を生じる。"},{key:"ウ",label:"主たる債務者が破産し免責許可決定が確定した場合、保証人はその責任を免れる。"},{key:"エ",label:"主たる債務について違約金の定めがない場合であっても、債権者と保証人の間で保証債務についてのみ違約金の定めをすることができる。"}],correct:"エ",explanation:"【立法趣旨・背景】保証は債権担保の一手段で、保証人保護(特に個人の安易な保証による生活破綻の防止)が近年の民法改正の重要テーマ。事業性融資の保証には公正証書による保証意思確認が導入された。\n\n【正答の根拠】保証人は、保証債務についてのみ違約金や損害賠償の額を約定することができる(民法447条2項)。主たる債務と別に保証債務の履行確保を図ることを認める規定。\n\n【誤答の検討とキーワードの意味】\n・『連帯保証人が3人いれば各自1,000万円(3,000万円÷3)の限度』は誤り。連帯保証人には『分別の利益』がなく、各自が全額(3,000万円)について保証債務を負う。通常の共同保証人にある分別の利益が連帯保証では否定される点がキーワード。\n・『事業性貸金債務の保証は、現に事業に従事していない配偶者なら公正証書がなくても有効』は誤り。事業性貸金債務の保証は原則として保証意思宣明公正証書が必要で、適用除外となる『共同事業者・現に事業に従事している配偶者』に当たらない者は公正証書が必要(民法465条の6・465条の9)。\n・『主たる債務者が破産免責を受ければ保証人も責任を免れる』は誤り。主債務者の免責後も保証人の責任は残る(保証の存在意義そのもの)。"},
  {id:"r7-law-q19",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第19問",title:"第19問　消費貸借",body:"民法が定める消費貸借に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"書面でする消費貸借の貸主は、借主に目的物を交付するまで、契約を解除することができる。"},{key:"イ",label:"書面でする消費貸借は、借主が目的物を受け取る前に借主が破産手続開始の決定を受けた場合にはその効力を失うが、貸主が破産手続開始の決定を受けた場合には効力を失わない。"},{key:"ウ",label:"当事者が返還の時期を定めた場合、借主はその時期まで返還をすることができない。"},{key:"エ",label:"利息付きの金銭消費貸借の貸主は、特約のない限り、借主が元本を受け取った日を含めた利息を請求することができる。"}],correct:"エ",explanation:"【立法趣旨・背景】消費貸借(金銭等を借りて同種同量を返す契約)は、2017年改正で従来の要物契約(物の交付で成立)に加え、書面でする諾成的消費貸借(合意のみで成立)が明文化された。借主保護の規定も整理された。\n\n【正答の根拠】利息付きの金銭消費貸借では、貸主は借主が元本を受け取った日以後の利息を請求できる(民法589条2項)。元本を現実に利用できる日から利息が発生するという考え方。\n\n【誤答の検討とキーワードの意味】\n・『書面でする消費貸借の貸主は目的物交付まで契約を解除できる』は誤り。書面でする諾成的消費貸借では、目的物受領前に解除できるのは『借主』(民法587条の2第2項)。貸主側の自由な解除権は規定されていない。\n・『貸主が破産手続開始決定を受けても効力を失わない』は誤り。諾成的消費貸借は、当事者の一方が目的物受領前に破産手続開始決定を受けたときは効力を失う(民法587条の2第3項)。借主・貸主いずれの破産でも同様。\n・『返還時期を定めたら借主はその時期まで返還できない』は誤り。借主は期限の利益を放棄していつでも返還できる(民法591条2項)。"},
  {id:"r7-law-q20",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第20問",title:"第20問　請負",body:"民法が定める請負に関する記述として、最も適切なものはどれか。なお特約はないものとする。",options:[{key:"ア",label:"請負人が仕事を完成しない間は、注文者はいつでも損害を賠償して契約を解除することができる。"},{key:"イ",label:"請負人が契約不適合の目的物を引き渡した場合、注文者が引渡しから1年以内にその旨を通知しないときは、注文者はその不適合を理由として損害賠償の請求をすることができない。"},{key:"ウ",label:"注文者が破産手続開始の決定を受けた場合、請負人は仕事の完成後であっても契約を解除することができる。"},{key:"エ",label:"物の引渡しを要する請負契約において、仕事の完成と報酬の支払は同時履行の関係に立つ。"}],correct:"ア",explanation:"【立法趣旨・背景】請負は『仕事の完成』を目的とする契約(民法632条)。完成という結果に対して報酬を支払う点で、労務提供自体を目的とする委任・雇用と区別される。2017年改正で契約不適合責任が整理された。\n\n【正答の根拠】請負人が仕事を完成しない間は、注文者はいつでも損害を賠償して契約を解除できる(民法641条)。注文者にとって不要になった仕事を続けさせる意味がないため、注文者の任意解除権を認める。\n\n【誤答の検討とキーワードの意味】\n・『契約不適合は引渡しから1年以内に通知しないと請求できない』は誤り。通知期間は『不適合を知った時から1年以内』(民法637条)。起算点が『引渡し時』ではなく『知った時』である点がキーワード。\n・『注文者が破産すると、仕事完成後でも請負人は解除できる』は誤り。注文者の破産による解除は仕事完成『前』に限られる(民法642条)。\n・『仕事の完成と報酬支払が同時履行』は誤り。同時履行となるのは『目的物の引渡し』と『報酬の支払』で、仕事の完成は報酬支払に先立つ(完成が先履行)。"},
  {id:"r7-law-q21",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第21問",title:"第21問　遺言",body:"遺言に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"遺言者は、いつでも、遺言の方式に従って、その遺言の全部または一部を撤回することができる。"},{key:"イ",label:"遺言は、18歳に達しなければできない。"},{key:"ウ",label:"公正証書によって遺言をする場合、公証人が遺言者の口述を筆記することを要するが、証人の立会いは要しない。"},{key:"エ",label:"秘密証書によって遺言をするには、遺言者が、その全文、日付および氏名を自書した上で押印をしなければならない。"}],correct:"ア",explanation:"【立法趣旨・背景】遺言は遺言者の最終意思を尊重する制度で、要式行為(法定の方式によらないと無効)とされる。これは偽造・変造を防ぎ意思の真正を担保するため。方式の種類(自筆証書・公正証書・秘密証書)ごとに要件が異なる。\n\n【正答の根拠】遺言者はいつでも、遺言の方式に従ってその全部または一部を撤回できる(民法1022条)。最終意思の尊重から、撤回の自由が広く認められる。\n\n【誤答の検討とキーワードの意味】\n・『遺言は18歳に達しなければできない』は誤り。遺言能力は満15歳から認められる(民法961条)。成年(18歳)や婚姻適齢とは別の基準。\n・『公正証書遺言に証人の立会いは不要』は誤り。公正証書遺言には証人2人以上の立会いが必要(民法969条)。公証人が関与しても証人は要る。\n・『秘密証書遺言は全文・日付・氏名の自書と押印が必要』は誤り。全文・日付・氏名の自書を要するのは『自筆証書遺言』(民法968条)。秘密証書遺言は本文をワープロ等で作成してもよく、署名・押印・封印等が要件(民法970条)。方式ごとの要件の違いがキーワード。"},
  {id:"r7-law-q22",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第22問",title:"第22問　遺留分",body:"遺留分に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"遺留分侵害額請求権は、裁判外で行使することも可能である。"},{key:"イ",label:"遺留分侵害額請求権は、相続開始の時から1年以内に行使しなければ、時効によって消滅する。"},{key:"ウ",label:"相続の開始後における遺留分の放棄は、家庭裁判所の許可を受けたときに限り、その効力を生ずる。"},{key:"エ",label:"被相続人の兄弟姉妹は、被相続人の相続について遺留分を有する。"}],correct:"ア",explanation:"【立法趣旨・背景】遺留分は、一定の相続人(配偶者・子・直系尊属)に保障される最低限の取り分。被相続人の財産処分の自由と、遺族の生活保障・相続期待の保護とを調整する制度。2018年改正で、従来の物権的な減殺請求から金銭債権としての『遺留分侵害額請求』に改められた。\n\n【正答の根拠】遺留分侵害額請求権は意思表示により行使でき、裁判外(内容証明郵便等)でも行使できる。必ずしも訴訟による必要はない。\n\n【誤答の検討とキーワードの意味】\n・『相続開始から1年以内に行使しないと時効消滅する』は誤り。消滅時効は『相続の開始及び遺留分を侵害する贈与・遺贈を知った時から1年』(かつ相続開始から10年の除斥期間)(民法1048条)。起算点が『知った時』である点がキーワード。\n・『相続開始後の遺留分放棄は家庭裁判所の許可が必要』は誤り。家裁の許可が要るのは『相続開始前』の遺留分放棄(民法1049条)。相続開始後は許可なく放棄できる。生前の放棄を許可制にするのは、被相続人や他の相続人による不当な放棄強要を防ぐ趣旨。\n・『兄弟姉妹も遺留分を有する』は誤り。兄弟姉妹に遺留分はない(民法1042条)。"},
  {id:"r7-law-q23",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第23問",title:"第23問　製造物責任法",body:"製造物責任法に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"安全性に関わらない品質上の不具合は、製造物責任法に基づく損害賠償責任の根拠となる「欠陥」に当たらない。"},{key:"イ",label:"製造物責任法には、PL保険への加入を義務付ける規定がある。"},{key:"ウ",label:"製造物責任法には、製造物の部品の保存期間に関する規定がある。"},{key:"エ",label:"製造物責任法に基づく損害賠償請求権は、製造業者が製造物を引き渡した時から5年を経過したときは、時効によって消滅する。"}],correct:"ア",explanation:"【立法趣旨・背景】製造物責任法(PL法)は、製造物の欠陥により生命・身体・財産に損害が生じた場合、被害者が製造業者の『過失』を立証せずとも『欠陥』の立証で損害賠償を請求できるとする無過失責任の特別法。被害者の立証負担を軽減し救済を図る。\n\n【正答の根拠】PL法の『欠陥』は、製造物が通常有すべき安全性を欠いていることをいう。したがって安全性に関わらない単なる品質上の不具合(性能不足等)は、PL法上の『欠陥』には当たらない。PL法が保護するのは安全性であって品質一般ではない。\n\n【誤答の検討とキーワードの意味】\n・『PL保険への加入を義務付ける規定がある』は誤り。PL法に保険加入義務の規定はない。\n・『部品の保存期間に関する規定がある』は誤り。そのような規定はない。\n・『引渡しから5年で時効消滅する』は誤り。期間制限は『損害及び賠償義務者を知った時から3年(人の生命・身体の侵害は5年)』、かつ『引渡しの時から10年』(製造物責任法5条)。『3年/5年/10年』の数値がキーワードで、5年は人身損害の主観的起算の期間。"},
  {id:"r7-law-q24",exam:"中小企業診断士",year:"R7",subject:"経営法務",examLabel:"R7 経営法務",parent:"第24問",title:"第24問　裁判所の紛争解決手続",body:"裁判所の紛争解決手続に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"少額訴訟で請求できる金銭の上限額は、140万円である。"},{key:"イ",label:"通常訴訟において、裁判所は、口頭弁論の終結後も、和解の勧告をすることができる。"},{key:"ウ",label:"民事訴訟法上、特許権侵害訴訟の第一審については、東京地方裁判所のみが専属管轄を有すると規定されている。"},{key:"エ",label:"民事調停は、公開の法廷で実施される。"}],correct:"イ",explanation:"【立法趣旨・背景】民事紛争の解決手段には、通常訴訟のほか、少額・簡易な事件に対応する少額訴訟、当事者の合意による解決を図る民事調停、仲裁などがあり、事件の性質に応じて使い分けられる。手続コストと解決の質のバランスを図る制度設計。\n\n【正答の根拠】通常訴訟では、裁判所は訴訟がいかなる程度にあるかを問わず和解を試みることができ、口頭弁論終結後でも和解を勧告できる(民事訴訟法89条)。判決によらない柔軟な解決を促す趣旨。\n\n【誤答の検討とキーワードの意味】\n・『少額訴訟で請求できる金額の上限は140万円』は誤り。少額訴訟の上限は60万円(民事訴訟法368条)。140万円は簡易裁判所の事物管轄の上限であり、これと混同させるひっかけ。\n・『特許権侵害訴訟の第一審は東京地裁のみの専属管轄』は誤り。特許権等の侵害訴訟の第一審は東京地裁または大阪地裁が専属管轄を持つ(民事訴訟法6条)。専門的事件を二庁に集中させる趣旨。\n・『民事調停は公開の法廷で行われる』は誤り。調停は非公開(調停室)で行われる。当事者が率直に話し合い譲り合うため非公開とする。訴訟(公開原則)との違いがキーワード。"},
];

const QUESTIONS_SYS = [
  {id:"r7-sys-q1",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第1問",title:"第1問　USB",body:"USBに関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　USBは、上位規格のポートに下位規格のケーブルを介して下位規格の周辺機器を接続する場合、通信速度は最も上位の規格に依存する。\nb　USBは、電源を入れたまま周辺機器が接続できるホットプラグ対応のシリアルインタフェースである。\nc　USB Type-Cのコネクタは、USB Type-Cのポートに上下どちらの向きでも差し込むことができる。\nd　すべてのUSB Type-CのポートはUSB Power Delivery規格に対応しているので、ケーブルを介して外部ディスプレイに映像を出力できる。",options:[{key:"ア",label:"a：正　b：正　c：誤　d：正"},{key:"イ",label:"a：正　b：誤　c：正　d：誤"},{key:"ウ",label:"a：誤　b：正　c：正　d：誤"},{key:"エ",label:"a：誤　b：正　c：誤　d：正"},{key:"オ",label:"a：誤　b：誤　c：正　d：正"}],correct:"ウ",explanation:"a 誤:通信速度は接続経路上で最も低い(下位の)規格に律速される。最上位規格には依存しない。\nb 正:USBはホットプラグ対応のシリアルインタフェース。\nc 正:USB Type-Cは上下対称(リバーシブル)で、どちらの向きでも挿せる。\nd 誤:すべてのType-CポートがUSB PDや映像出力(Alternate Mode)に対応するわけではない。\n→ a誤 b正 c正 d誤 = ウ。"},
  {id:"r7-sys-q2",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第2問",title:"第2問　仮想化技術",body:"仮想化技術に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"コンテナは、物理マシン上に直接、仮想化ソフトウェアを動作させ、その上で1つ以上のゲストOSを稼働させる技術である。"},{key:"イ",label:"コンテナは、ホストOS上に仮想化ソフトウェアを動作させ、その上で1つ以上のゲストOSを稼働させる技術である。"},{key:"ウ",label:"ハイパーバイザは、アプリケーションやライブラリなどをパッケージ化し、ホストOSのカーネルを直接利用することで、ゲストOSなしでアプリケーションを稼働させる技術である。"},{key:"エ",label:"ハイパーバイザは、単一の物理マシン上に1つ以上の仮想マシンを稼働させる技術である。"},],correct:"エ",explanation:"エ 正:ハイパーバイザは物理マシン上に1つ以上の仮想マシン(VM)を稼働させる技術。\nア 誤:物理マシン上に直接動作しゲストOSを稼働させるのはハイパーバイザ(型1)の説明。\nイ 誤:ホストOS上で動作しゲストOSを稼働させるのはホスト型ハイパーバイザの説明。\nウ 誤:パッケージ化しホストOSのカーネルを共有しゲストOSなしで動かすのはコンテナの説明。\nアイウはコンテナとハイパーバイザの説明が入れ替わっている。"},
  {id:"r7-sys-q3",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第3問",title:"第3問　RFID",body:"RFIDに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"RFタグのメモリの型には、リードオンリー型、ライトワンス・リードメニー型、リード・ライト型がある。"},{key:"イ",label:"カメラによる画像処理を利用して、複数のRFタグのデータを一括して読み取ることができる。"},{key:"ウ",label:"赤外線を利用して、複数のRFタグのデータを一括して読み取ることができる。"},{key:"エ",label:"パッシブタグは、内蔵電源を用いて無線信号を発信できる。"},],correct:"ア",explanation:"ア 正:RFタグのメモリには読み取り専用(リードオンリー)、一度だけ書込可能(ライトワンス・リードメニー)、読み書き可能(リード・ライト)の型がある。\nイ 誤:RFIDは電波(無線)で読み取る。カメラ画像処理はバーコード/画像認識の方式。\nウ 誤:RFIDは電波を用いる。赤外線ではない。\nエ 誤:パッシブタグは内蔵電源を持たず、リーダの電波から電力を得て応答する。内蔵電源を持つのはアクティブタグ。"},
  {id:"r7-sys-q4",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第4問",title:"第4問　クライアント・サーバ間のデータ交換",body:"Webアプリケーションにおけるクライアントとサーバ間のデータ交換に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　RESTは、HTTPメソッドを用いることなく、Webアプリケーションを通じてサーバOSが提供する各機能を利用する仕組みである。\nb　Web APIは、HTMLとCSSを使用して、クライアント上で動的なWebページ表示を可能にする仕組みである。\nc　JSONは、Webアプリケーションのデータ交換に使用されているデータ形式の1つである。\nd　HTTPは、クライアントとサーバがHTML文書などをやり取りするために用いられるプロトコルである。",options:[{key:"ア",label:"a：正　b：正　c：誤　d：正"},{key:"イ",label:"a：正　b：誤　c：正　d：正"},{key:"ウ",label:"a：正　b：誤　c：誤　d：誤"},{key:"エ",label:"a：誤　b：正　c：正　d：誤"},{key:"オ",label:"a：誤　b：誤　c：正　d：正"}],correct:"オ",explanation:"a 誤:RESTはHTTPメソッド(GET/POST/PUT/DELETE等)を用いてリソースを操作する設計様式。「HTTPメソッドを用いることなく」が誤り。\nb 誤:Web APIはアプリ間で機能・データをやり取りする仕組み。HTML/CSSで動的表示する仕組みではない。\nc 正:JSONはデータ交換に広く使われるデータ形式。\nd 正:HTTPはクライアント・サーバ間でHTML等をやり取りするプロトコル。\n→ a誤 b誤 c正 d正 = オ。"},
  {id:"r7-sys-q5",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第5問",title:"第5問　通信プロトコル",body:"通信プロトコルに関する記述とその用語の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　信頼性よりも速度を重視し、確認や再送制御を行わず、リアルタイム性が求められる場面で用いられるプロトコル。\nb　ネットワークに接続する機器にIPアドレスなど通信に必要な設定情報を自動的に割り当てるプロトコル。\nc　正しい宛先にデータパケットを届けるための経路選択およびアドレス指定を行うプロトコル。",options:[{key:"ア",label:"a：TCP　b：SNMP　c：ARP"},{key:"イ",label:"a：TCP　b：SNMP　c：IP"},{key:"ウ",label:"a：UDP　b：DHCP　c：ARP"},{key:"エ",label:"a：UDP　b：DHCP　c：IP"},{key:"オ",label:"a：UDP　b：SNMP　c：ARP"}],correct:"エ",explanation:"a:確認・再送をせず高速・リアルタイム性を重視するのはUDP(TCPは信頼性重視で再送あり)。\nb:IPアドレス等の設定情報を自動割当するのはDHCP(SNMPはネットワーク機器の監視・管理)。\nc:経路選択(ルーティング)とアドレス指定を担うのはIP(ARPはIPアドレスからMACアドレスを解決する)。\n→ a:UDP b:DHCP c:IP = エ。"},
  {id:"r7-sys-q6",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第6問",title:"第6問　ブロックチェーン",body:"ブロックチェーン技術に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　コンソーシアム型では、誰もがブロックチェーン上のデータを読むことも書き込むこともできる。\nb　パブリック型では、データを書き込むためにコンセンサスアルゴリズムによる正当性の承認が必要になる。\nc　プライベート型では、データを書き込むためにネットワーク参加者全員による承認が必ず必要になる。\nd　NFTは、契約条件に基づきブロックチェーン上で自動的に取引を処理・実行・記録するコンピュータプログラムである。",options:[{key:"ア",label:"a：正　b：正　c：正　d：誤"},{key:"イ",label:"a：正　b：誤　c：誤　d：正"},{key:"ウ",label:"a：誤　b：正　c：誤　d：誤"},{key:"エ",label:"a：誤　b：誤　c：正　d：正"},{key:"オ",label:"a：誤　b：誤　c：正　d：誤"}],correct:"ウ",explanation:"a 誤:コンソーシアム型は複数の特定組織が参加・管理する許可型で、誰もが読み書きできるわけではない(それはパブリック型寄り)。\nb 正:パブリック型は不特定多数が参加し、コンセンサスアルゴリズム(PoW/PoS等)で正当性を承認して書き込む。\nc 誤:プライベート型は単一組織の管理で、参加者「全員」の承認が必須とは限らない。\nd 誤:契約条件に基づき自動実行するプログラムはスマートコントラクト。NFTは代替不可能なトークン。\n→ a誤 b正 c誤 d誤 = ウ。"},
  {id:"r7-sys-q7",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第7問",title:"第7問　ソフトウェアのテスト",body:"テストに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"アルファテストでは、システム開発の最終段階で、開発中のソフトウェアを利用者に提供し、実際に使用してもらってシステム要件を満たしているかを検証する。"},{key:"イ",label:"回帰テストでは、大量アクセスなどの負荷をかけて応答時間や資源利用状況などを測定し、高負荷状況での振る舞いを検証する。"},{key:"ウ",label:"境界値分析とは、データを有効値と無効値のグループに分け、おのおののグループから代表値を1つずつ選んでテストする技法である。"},{key:"エ",label:"ドライバとは、上位から下位へ順に結合してテストする際、呼び出し先の下位モジュールが未完成の場合にその代わりとなるテスト用ダミーモジュールのことである。"},{key:"オ",label:"ホワイトボックステストでは、モジュール内の分岐や繰り返しなど、内部ロジックの正しさを検証する。"}],correct:"オ",explanation:"オ 正:ホワイトボックステストは内部構造(分岐・繰り返し等の論理)に着目して検証する。\nア 誤:利用者に提供し実使用で検証するのはベータテスト/受入テスト寄り。アルファテストは開発側環境で行う。\nイ 誤:負荷をかけて応答時間等を測るのは負荷テスト/性能テスト。回帰テストは変更による既存機能への影響(デグレード)確認。\nウ 誤:有効値・無効値の代表値を選ぶのは同値分割。境界値分析は境界付近の値を選ぶ技法。\nエ 誤:下位モジュールの代わりはスタブ。ドライバは上位モジュールの代わり(下位を呼び出す側)。"},
  {id:"r7-sys-q8",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第8問",title:"第8問　IoT",body:"IoTに関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　エッジコンピューティングは、IoT機器やその近くに配置したコンピュータでデータを処理する技術である。\nb　IoT機器に使用されるすべてのワンボードマイコンには、OSとしてLinuxが組み込まれている。\nc　IoT機器の構成要素の1つであるサーミスタは、方位センサーである。\nd　LPWA(Low Power Wide Area)は、広範囲をカバーし低消費電力で運用できる通信技術である。",options:[{key:"ア",label:"a：正　b：正　c：誤　d：正"},{key:"イ",label:"a：正　b：誤　c：正　d：誤"},{key:"ウ",label:"a：正　b：誤　c：誤　d：正"},{key:"エ",label:"a：誤　b：正　c：誤　d：誤"},{key:"オ",label:"a：誤　b：誤　c：正　d：正"}],correct:"ウ",explanation:"a 正:エッジコンピューティングは端末側・近傍でデータ処理を行う。\nb 誤:すべてのワンボードマイコンにLinuxが組み込まれているわけではない(OSを持たないマイコンもある)。\nc 誤:サーミスタは温度センサー。方位センサーではない。\nd 正:LPWAは広域・低消費電力の通信技術。\n→ a正 b誤 c誤 d正 = ウ。"},
  {id:"r7-sys-q9",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第9問",title:"第9問　システムの稼働率(直列・並列)",body:"稼働率が同じ装置Xを3台組み合わせたシステムa〜cの全体稼働率を高い順に並べたものとして、最も適切なものを下記の解答群から選べ。装置Xの稼働率は0より大きく1未満。\n\na　X—X—X（3台すべて直列）\nb　（X∥X）—X（2台並列の後に1台直列）\nc　（X—X）∥X（2台直列の塊と1台を並列）",options:[{key:"ア",label:"a、b、c"},{key:"イ",label:"b、a、c"},{key:"ウ",label:"b、c、a"},{key:"エ",label:"c、a、b"},{key:"オ",label:"c、b、a"}],correct:"オ",explanation:"装置Xの稼働率をp(0<p<1)とする。\na(3直列) = p³\nb(並列2→直列1) = (1-(1-p)²)・p = (2p-p²)・p = 2p²-p³\nc(直列2と1の並列) = 1-(1-p²)(1-p) = p+p²-p³\n差を比較すると、c-b = (p+p²-p³)-(2p²-p³) = p-p² = p(1-p) > 0 より c>b。\nb-a = (2p²-p³)-p³ ... 正確には b-a=(2p²-p³)-p³=2p²-2p³=2p²(1-p)>0 より b>a。\nよって c>b>a。高い順は c、b、a = オ。"},
  {id:"r7-sys-q10",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第10問",title:"第10問　信頼性設計",body:"情報システムの信頼性設計に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"フェイルオーバとは、故障時に一部の機能を低下させても限定的ながら重要な機能だけでも稼働し続けるように設計することである。"},{key:"イ",label:"フォールトアボイダンスとは、部品一つ一つの信頼性を高めることで、故障や障害が発生しないように設計することである。"},{key:"ウ",label:"フォールトトレランスとは、人為的な操作ミスがあっても危険が生じず、システムに異常が起こらないように設計することである。"},{key:"エ",label:"フォールトマスキングとは、故障や障害が発生したときにシステムの被害を最小限にとどめるように設計することである。"},{key:"オ",label:"フォールバックとは、故障や障害が発生したときに待機系システムが処理を継続するように設計することである。"}],correct:"イ",explanation:"イ 正:フォールトアボイダンスは部品の信頼性を高め故障そのものの発生を避ける考え方。\nア 誤:故障時に重要機能だけ縮退させて稼働継続するのはフォールバック(縮退運転)。フェイルオーバは待機系への切替。\nウ 誤:操作ミスがあっても危険が生じないようにするのはフールプルーフ。\nエ 誤:故障の影響を冗長構成等で隠蔽し正常動作を維持するのがフォールトマスキング。被害を最小に抑える設計はフェイルセーフ寄り。\nオ 誤:待機系が処理を継続するのはフェイルオーバ。"},
  {id:"r7-sys-q11",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第11問",title:"第11問　正規化",body:"開講講座一覧の表(主キーは「開講コード」。各講師は開講コードの異なる同一名の講座を担当することがある。属性:開講コード/講座コード/講座名/講師コード/講師)に関する正規化の観点からの記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　第1正規形である。\nb　第2正規形である。\nc　第3正規形である。",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：正　c：誤"},{key:"ウ",label:"a：正　b：誤　c：正"},{key:"エ",label:"a：正　b：誤　c：誤"},{key:"オ",label:"a：誤　b：誤　c：誤"}],correct:"イ",explanation:"a 正:繰り返し項目がなく各セルが単一値なので第1正規形を満たす。\nb 正:主キーが単一属性(開講コード)なので、部分関数従属は生じえず第2正規形を満たす。\nc 誤:講師コード→講師(氏名)という、主キー以外の属性間の関数従属(推移的関数従属)が存在するため第3正規形ではない。\n→ a正 b正 c誤 = イ。"},
  {id:"r7-sys-q12",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第12問",title:"第12問　SQL(外部結合とGROUP BY)",body:"「登録ユーザ」表と「商品登録管理」表から、商品登録をしていない顧客も含めて登録ユーザごとの商品登録状況(購入商品登録状況)を得るSQL文の空欄①(結合方法)と②(GROUP BY句)に入る語句の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\nSELECT 登録ユーザ.顧客ID, 登録ユーザ.アカウント名, 商品登録管理.商品コード, COUNT(商品登録管理.商品コード) AS 登録台数\nFROM 登録ユーザ ① 商品登録管理 ON 登録ユーザ.顧客ID = 商品登録管理.顧客ID\nGROUP BY ②\nORDER BY 登録ユーザ.顧客ID ASC, 登録台数 DESC;",acceptAll:true,options:[{key:"ア",label:"①：INNER JOIN　②：登録ユーザ.顧客ID, 商品登録管理.商品コード"},{key:"イ",label:"①：INNER JOIN　②：登録ユーザ.顧客ID, 登録台数"},{key:"ウ",label:"①：RIGHT OUTER JOIN　②：登録ユーザ.顧客ID"},{key:"エ",label:"①：LEFT OUTER JOIN　②：登録ユーザ.顧客ID, 商品登録管理.商品コード"},{key:"オ",label:"①：LEFT OUTER JOIN　②：登録ユーザ.顧客ID, 登録台数"}],correct:"エ",explanation:"本問は公式に正解が「－」(全員正解扱い・不採点)とされた問題です。\n考え方としては、商品登録をしていない顧客(結果表で登録台数0)も残すため、左表(登録ユーザ)を基準に結合する LEFT OUTER JOIN が必要で、集計のGROUP BYは出力する非集計列「登録ユーザ.顧客ID, 商品登録管理.商品コード」を指定するのが筋に近い(=選択肢エの方向性)。ただし結果表の整合(アカウント名の扱い等)に解釈の余地があり、本問は不採点とされました。"},
  {id:"r7-sys-q13",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第13問",title:"第13問　システム開発手法",body:"システム開発手法に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　デイリースクラムでは、スプリントの成果をステークホルダーに提示しフィードバックを得る。\nb　ローコード開発では、システムの全体像をモデル化し、優先度を付けた機能単位で計画・設計・構築を反復的に行う。\nc　DevOpsでは、開発と運用のフェーズを明確に分離して、システムの導入や更新を柔軟かつ迅速に行う。\nd　XPにおけるペアプログラミングでは、2人のプログラマがペアとなり、相談やレビューを行いながら協力してプログラムを開発する。",options:[{key:"ア",label:"a：正　b：正　c：誤　d：誤"},{key:"イ",label:"a：正　b：誤　c：正　d：正"},{key:"ウ",label:"a：誤　b：正　c：誤　d：正"},{key:"エ",label:"a：誤　b：誤　c：正　d：誤"},{key:"オ",label:"a：誤　b：誤　c：誤　d：正"}],correct:"オ",explanation:"a 誤:成果をステークホルダーに提示しフィードバックを得るのはスプリントレビュー。デイリースクラムはチームの日次短時間ミーティング。\nb 誤:全体像をモデル化し優先度付き機能単位で反復するのは反復型開発の説明。ローコード開発はコーディングを最小化する開発手法。\nc 誤:DevOpsは開発(Dev)と運用(Ops)を分離せず連携・統合して迅速化する。「明確に分離」が誤り。\nd 正:XPのペアプログラミングの説明として正しい。\n→ a誤 b誤 c誤 d正 = オ。"},
  {id:"r7-sys-q14",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第14問",title:"第14問　エコーチェンバー",body:"SNSなどで見られるエコーチェンバーと呼ばれる現象に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"AI技術で本物そっくりの偽の映像や音声を作成することで、人々が虚偽の情報を真実と信じ込むリスクが高まることが懸念されている。"},{key:"イ",label:"Webサイト間で個人の閲覧履歴が共有・追跡される仕組みにより、意図しない形で広告や情報が提示されることが懸念されている。"},{key:"ウ",label:"オンライン活動への監視が広がる中で、個人の行動や発言が常に記録されることで、プライバシーの侵害や自由な発言の抑制が懸念されている。"},{key:"エ",label:"特定の意見や価値観を持つ集団内でのみ情報が共有されることで、異なる視点が排除され、偏った情報が強化されることが懸念されている。"},{key:"オ",label:"人の認知の隙を突き、熟考を妨げることで、不利な条件を見落とさせるリスクが懸念されている。"}],correct:"エ",explanation:"エ 正:エコーチェンバーは、同質の意見を持つ集団内で同じ情報が反響(増幅)し、異なる視点が排除されて偏りが強化される現象。\nア 誤:偽の映像・音声の作成はディープフェイクの説明。\nイ 誤:閲覧履歴の共有・追跡はサードパーティ・クッキー/トラッキングの説明。\nウ 誤:監視による萎縮はサーベイランス/監視社会の懸念。\nオ 誤:認知の隙を突いて誘導するのはダークパターンの説明。"},
  {id:"r7-sys-q15",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第15問",title:"第15問　システム監査基準",body:"経済産業省「システム監査基準」(2023年改訂)の「システム監査の意義と目的」について、空欄A〜Cに入る語句の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\nシステム監査とは、専門性と【A】を備えた監査人が、一定の基準に基づいてITシステムの利活用に係る検証・評価を行い、ガバナンス、マネジメント、【B】の適切性等に対する保証を与える、又は改善のための助言を行う監査である。また、その目的は、ITシステムに係る【C】に適切に対応しているかどうかを検証・評価し…",options:[{key:"ア",label:"A：客観性　B：コントロール　C：セキュリティ"},{key:"イ",label:"A：客観性　B：コントロール　C：リスク"},{key:"ウ",label:"A：客観性　B：コンプライアンス　C：セキュリティ"},{key:"エ",label:"A：倫理観　B：コントロール　C：セキュリティ"},{key:"オ",label:"A：倫理観　B：コンプライアンス　C：リスク"}],correct:"イ",explanation:"システム監査基準(2023)では、監査人は専門性と「客観性」を備え、ITシステムの利活用に係るガバナンス・マネジメント・「コントロール」の適切性等に保証・助言を行うとされる。また目的はITシステムに係る「リスク」に適切に対応しているかを検証・評価することにある。\nしたがって A=客観性、B=コントロール、C=リスク = イ。"},
  {id:"r7-sys-q16",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第16問",title:"第16問　データウェアハウス",body:"データウェアハウスに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"ETLとは、さまざまなデータソースからデータを抽出し、扱いやすいフォーマットに変換して、データウェアハウスに統合して格納する処理のことである。"},{key:"イ",label:"OLTPは、データウェアハウスに蓄積されたデータをスライシング、ドリルダウンなどの操作により多次元分析するために用いられる分析ツールである。"},{key:"ウ",label:"データウェアハウスは、データを主題ごとに分解・整理するオブジェクト指向という特性を持つデータベースである。"},{key:"エ",label:"データスワンプとは、データウェアハウスから必要なデータを抽出し、利用しやすい形式で格納したデータベースのことである。"},{key:"オ",label:"データマートとは、構造化データやIoT・SNSなどからの非構造化データをそのままの形式で格納するデータベースのことである。"}],correct:"ア",explanation:"ア 正:ETLはExtract(抽出)・Transform(変換)・Load(格納)の処理。\nイ 誤:多次元分析(スライシング・ドリルダウン等)を行うのはOLAP。OLTPはオンライン・トランザクション処理。\nウ 誤:データウェアハウスはサブジェクト指向(主題指向)・統合・時系列・不揮発という特性を持つ。オブジェクト指向ではない。\nエ 誤:必要なデータを抽出し利用しやすく格納するのはデータマート。データスワンプは管理されず劣化したデータレイク。\nオ 誤:非構造化データをそのまま格納するのはデータレイク。データマートではない。"},
  {id:"r7-sys-q17",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第17問",title:"第17問　情報システムの概念・技術",body:"情報システムの概念やそれに使われる技術に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"ARとは、現実世界をコンピュータが創り出した仮想空間に完全に置き換え、あたかも現実であるかのように疑似体験できる技術のことである。"},{key:"イ",label:"CTIとは、クラウドコンピューティングを利用した財務会計専用システムのことである。"},{key:"ウ",label:"RPAとは、自律走行ロボットを使った工場・倉庫用の自動搬送システムのことである。"},{key:"エ",label:"SEOとは、顧客データを一元管理することで顧客に合った商品やサービスを提案するOne to Oneマーケティングシステムのことである。"},{key:"オ",label:"SFAとは、営業支援システムのことであり、営業担当者の行動管理や商談の進捗状況管理などの機能を有する。"}],correct:"オ",explanation:"オ 正:SFA(Sales Force Automation)は営業支援システムで、行動管理・商談進捗管理等の機能を持つ。\nア 誤:現実を仮想空間に完全に置き換えるのはVR。ARは現実に情報を重畳する拡張現実。\nイ 誤:CTIはコンピュータと電話を統合する技術(コールセンター等)。財務会計専用システムではない。\nウ 誤:RPAはソフトウェアによる定型業務の自動化。自律走行ロボットの搬送システムではない。\nエ 誤:SEOは検索エンジン最適化。顧客データ一元管理・One to Oneマーケはレコメンド/CRMの説明。"},
  {id:"r7-sys-q18",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第18問",title:"第18問　WBS",body:"WBS(Work Breakdown Structure)に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　WBS辞書とは、プロジェクト全体の範囲、成果物、前提条件や制約条件などを記述した文書のことである。\nb　ワークパッケージとは、WBSの最下位レベルの作業群のことで、進捗状況などをコントロールする際の最小単位である。\nc　100％ルールとは、上位の作業を過不足なく下位の複数の作業に展開するルールのことである。\nd　イテレーションとは、早期に完了すべき作業は詳細に、将来の作業は概略にとどめ時期がきたら詳細化を繰り返す反復計画技法のことである。",options:[{key:"ア",label:"a：正　b：正　c：正　d：誤"},{key:"イ",label:"a：正　b：正　c：誤　d：正"},{key:"ウ",label:"a：正　b：誤　c：誤　d：誤"},{key:"エ",label:"a：誤　b：正　c：正　d：誤"},{key:"オ",label:"a：誤　b：誤　c：正　d：正"}],correct:"エ",explanation:"a 誤:WBS辞書は各WBS要素(ワークパッケージ等)の詳細(作業内容・成果物・担当・見積り等)を記述した文書。プロジェクト全体の範囲・前提・制約を記すのはプロジェクトスコープ記述書等。\nb 正:ワークパッケージはWBSの最下位の作業単位で、管理・コントロールの最小単位。\nc 正:100％ルールはスコープを過不足なく下位に分解する原則。\nd 誤:早期は詳細・将来は概略にとどめ順次詳細化するのはローリングウェーブ計画法。イテレーションは反復(の各回)を指す語。\n→ a誤 b正 c正 d誤 = エ。"},
  {id:"r7-sys-q19",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第19問",title:"第19問　ランサムウェア",body:"ランサムウェアに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"EDR(Endpoint Detection and Response)は、マルウェア感染防止や外部からの攻撃通信ブロックなど、攻撃による侵入の事前防止を担う。"},{key:"イ",label:"EPP(Endpoint Protection Platform)は、侵入してしまったランサムウェアを検知し、不審な挙動があれば担当者に通知するなど侵入後の事後対処を担う。"},{key:"ウ",label:"早期復旧できるように、バックアップデータを保存した機器は常にネットワークに接続しておく。"},{key:"エ",label:"ランサムウェアに感染した場合は、速やかに感染した端末の電源を切り、システム担当者やセキュリティベンダに報告する。"},{key:"オ",label:"ランサムウェアの主要な侵入経路は、VPN機器、リモートデスクトップ、不審メールやその添付ファイルである。"}],correct:"オ",explanation:"オ 正:近年のランサムウェアの主な侵入経路はVPN機器・リモートデスクトップ(RDP)・不審メールおよび添付ファイル。\nア 誤:侵入の事前防止(感染防止・通信ブロック)を担うのはEPP。EDRは侵入後の検知・対応。\nイ 誤:侵入後の検知・通知・対応を担うのはEDR。EPPは事前防止。アとイで説明が入れ替わっている。\nウ 誤:バックアップ機器を常時ネットワーク接続するとバックアップごと暗号化される恐れがあり、オフライン保管が望ましい。\nエ 誤:電源を切ると揮発性の証拠が失われ調査に支障が出るため、安易に電源を切らずネットワークから隔離して報告するのが原則。"},
  {id:"r7-sys-q20",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第20問",title:"第20問　AIシステムへの攻撃",body:"AIシステムへの攻撃に関する文章の空欄A〜Cに入る用語の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\n【A】は、学習済みモデルへの入力データに、攻撃者の意図した結果を引き起こすよう計算されたノイズや微小な変化を含める攻撃である。【B】は、学習済みモデルへの入力データと出力データを分析することで当初の学習データを推測する攻撃である。生成AIに対しては、特殊な指示を与えて意図しない挙動を引き起こす【C】という攻撃がある。",options:[{key:"ア",label:"A：敵対的サンプル攻撃　B：ブルートフォース攻撃　C：プロンプト・インジェクション"},{key:"イ",label:"A：敵対的サンプル攻撃　B：モデル反転攻撃　C：クロスサイト・スクリプティング"},{key:"ウ",label:"A：敵対的サンプル攻撃　B：モデル反転攻撃　C：プロンプト・インジェクション"},{key:"エ",label:"A：中間者攻撃　B：ブルートフォース攻撃　C：クロスサイト・スクリプティング"},{key:"オ",label:"A：中間者攻撃　B：モデル反転攻撃　C：プロンプト・インジェクション"}],correct:"ウ",explanation:"A:入力に微小な摂動(ノイズ)を加えて誤推論を誘発するのは敵対的サンプル攻撃(Adversarial Examples)。\nB:入力と出力から学習データを推測・復元するのはモデル反転攻撃(Model Inversion)。\nC:生成AIに特殊な指示を与えて意図しない挙動を引き起こすのはプロンプト・インジェクション。\nしたがって A=敵対的サンプル攻撃、B=モデル反転攻撃、C=プロンプト・インジェクション = ウ。"},
  {id:"r7-sys-q21",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第21問",title:"第21問　デジタルガバナンス・コード3.0",body:"経済産業省「デジタルガバナンス・コード3.0」(2024年9月)が示すDX経営の5つの柱の空欄A〜Cに入る語句の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\n1.経営ビジョン・ビジネスモデルの策定 / 2.DX戦略の策定 / 3.【A】(3-1.組織づくり、3-2.【B】、3-3.ITシステム・サイバーセキュリティ) / 4.成果指標の設定・DX戦略の見直し / 5.【C】",options:[{key:"ア",label:"A：DX戦略の推進　B：デジタル技術活用環境の整備　C：経営者の情報発信"},{key:"イ",label:"A：DX戦略の推進　B：デジタル技術活用環境の整備　C：ステークホルダーとの対話"},{key:"ウ",label:"A：DX戦略の推進　B：デジタル人材の育成・確保　C：ステークホルダーとの対話"},{key:"エ",label:"A：企業文化に関する方策　B：DX戦略の推進　C：経営者の情報発信"},{key:"オ",label:"A：企業文化に関する方策　B：デジタル人材の育成・確保　C：経営者の情報発信"}],correct:"ウ",explanation:"デジタルガバナンス・コード3.0の5本柱では、3が「DX戦略の推進」で、その下に組織づくり・デジタル人材の育成/確保・ITシステム/サイバーセキュリティが置かれ、5は「ステークホルダーとの対話」とされる。\nしたがって A=DX戦略の推進、B=デジタル人材の育成・確保、C=ステークホルダーとの対話 = ウ。"},
  {id:"r7-sys-q22",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第22問",title:"第22問　製造分野DX度チェック(進展レベル3)",body:"IPA「中小規模製造業者の製造分野におけるDX推進のためのガイド」の『製造分野DX度チェック』において、9つのチェック項目のいずれかについて進展レベル3(変化に対応できる仕組みが構築できている)を表現している記述として、最も適切なものを下記の解答群から選べ。",options:[{key:"ア",label:"企業間でシステム・設備のデジタルデータのやり取りが可能な状態となっており、データを活用している。"},{key:"イ",label:"競争領域・協調領域の定義・特定ができ、さらに競争領域においてビジョン実現に向けた戦略が立てられている。"},{key:"ウ",label:"製造分野の業務プロセスの見直し・改善は実施しているが、部門や個人に閉じた範囲で個別に対応している。"},{key:"エ",label:"プライバシー、データセキュリティ等に関しての課題は明確になっている。"},{key:"オ",label:"変革に向け必要となるスキル、人的リソース、資金は明確になっている。"}],correct:"ア",explanation:"進展レベルは0(未着手)・1(課題が明確)・2(取り組みを実行)・3(変化に対応できる仕組みが構築)。\nア 正:企業間でデジタルデータ連携ができ活用している状態は、仕組みが構築されたレベル3に相当(データ連携の項目)。\nイ 誤:戦略が立てられている段階(レベル2相当)。\nウ 誤:部門・個人に閉じた個別対応はレベル2以下。\nエ 誤:課題が明確になっている=レベル1。\nオ 誤:必要資源が明確=レベル1。"},
  {id:"r7-sys-q23",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第23問",title:"第23問　EVM(完成時総コスト予測EAC)",body:"完成時総予算(BAC)1,080万円・期間半年の4プロジェクトA〜Dについて、期間が半分経過した時点の出来高計画値(PV)・コスト実績値(AC)・出来高実績値(EV)が表に与えられている。このままのコスト効率で進むとき、完了時の総コスト予測(EAC)を小さい順に並べたものとして最も適切なものはどれか。",options:[{key:"ア",label:"A、B、C、D"},{key:"イ",label:"A、B、D、C"},{key:"ウ",label:"B、A、C、D"},{key:"エ",label:"B、C、A、D"},{key:"オ",label:"B、C、D、A"}],correct:"オ",explanation:"コスト効率指数 CPI = EV / AC。このままのコスト効率で進むときの完了時総コスト予測は EAC = BAC / CPI = BAC × (AC / EV)。\nBACは4件とも1,080万円で共通なので、比 AC/EV が小さい(=CPI=EV/ACが大きい=コスト効率が良い)プロジェクトほどEACは小さくなる。\n本問の表の数値ではコスト効率の良い順が B>C>D>A となり、EACの小さい順は B、C、D、A となる(公式正答=オ)。\nポイントはEV/AC(CPI)の大小でEACの順位が決まること。EVとACを取り違えると順序が逆転するため注意。"},
  {id:"r7-sys-q24",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第24問",title:"第24問　稼働率(サービスレベル目標)",body:"ITサービスのサービスレベル目標として、計画停止は毎月第1・第3土曜日の22時〜翌8時(10時間×2回/月)、計画停止以外のサービス停止は年間142時間以内とする。計画停止時間は合意済みサービス時間に含まれない。1年=8,760時間とするとき、目標達成のための最低稼働率(小数点第2位を四捨五入)はどれか。",options:[{key:"ア",label:"94.5％"},{key:"イ",label:"95.6％"},{key:"ウ",label:"97.3％"},{key:"エ",label:"98.3％"},{key:"オ",label:"99.8％"}],correct:"エ",explanation:"計画停止=10時間×2回×12カ月=240時間。これは合意済みサービス時間に含まれないので除外する。\n合意済みサービス時間=8,760-240=8,520時間。\n計画停止以外の停止が年間142時間以内のとき、稼働時間=8,520-142=8,378時間。\n稼働率=8,378/8,520≒0.98334…→98.3％ = エ。"},
  {id:"r7-sys-q25",exam:"中小企業診断士",year:"R7",subject:"経営情報システム",examLabel:"R7 経営情報システム",parent:"第25問",title:"第25問　回帰タスクの評価指標",body:"機械学習における回帰タスクに関する記述の空欄①〜④に入る語句の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\n回帰タスクは【①】学習に分類される。評価指標には、誤差の二乗の平均である【②】や、その平方根である【③】、誤差の絶対値の平均である【④】などがある。",options:[{key:"ア",label:"①：教師あり　②：MAE　③：RMSE　④：MSE"},{key:"イ",label:"①：教師あり　②：MSE　③：RMSE　④：MAE"},{key:"ウ",label:"①：教師なし　②：MAPE　③：WAPE　④：MSE"},{key:"エ",label:"①：教師なし　②：MSE　③：MAPE　④：MAE"},{key:"オ",label:"①：教師なし　②：MSE　③：RMSE　④：MAE"}],correct:"イ",explanation:"①回帰タスクは正解値(目的変数)を用いるので教師あり学習。\n②誤差の二乗の平均はMSE(平均二乗誤差)。\n③その平方根はRMSE(二乗平均平方根誤差)。\n④誤差の絶対値の平均はMAE(平均絶対誤差)。\nしたがって ①教師あり ②MSE ③RMSE ④MAE = イ。"},
];

const QUESTIONS_POL = [
  {id:"r7-pol-q1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第1問",title:"第1問　中小企業の従業者総数・付加価値額",body:"「令和3年経済センサス－活動調査」に基づき、従業者総数(民営・非一次産業・2021年)と付加価値額(民営・非一次産業・2020年)を企業規模別に見た場合、中小企業に関する記述として最も適切なものはどれか。",options:[{key:"ア",label:"従業者総数は約2,300万人で全体の約50％、付加価値額は約80兆円で全体の約46％。"},{key:"イ",label:"従業者総数は約2,300万人で全体の約70％、付加価値額は約140兆円で全体の約46％。"},{key:"ウ",label:"従業者総数は約3,300万人で全体の約50％、付加価値額は約140兆円で全体の約46％。"},{key:"エ",label:"従業者総数は約3,300万人で全体の約70％、付加価値額は約80兆円で全体の約56％。"},{key:"オ",label:"従業者総数は約3,300万人で全体の約70％、付加価値額は約140兆円で全体の約56％。"}],correct:"オ",explanation:"【論点・背景】中小企業が日本経済に占める存在感を、量(従業者数)と質(付加価値額)の両面から問う頻出論点。規模区分は中小企業基本法に準ずる(製造業その他＝資本金3億円以下または従業員300人以下、卸売業＝1億円/100人、小売業＝5,000万円/50人、サービス業＝5,000万円/100人)。\n\n【キーワードの意味】付加価値額＝企業が新たに生み出した価値で、ここでは会社・個人事業者の純付加価値額の合計。従業者総数は会社・個人事業者の従業者の合計。\n\n【正答の数値】中小企業の従業者総数は約3,300万人で全体の約70％、付加価値額は約140兆円で全体の約56％。\n\n【誤答の検討】最重要ポイントは『従業者シェア(約70％)＞付加価値シェア(約56％)』という関係。これは中小企業の労働生産性(付加価値÷従業者)が大企業より低いことの裏返しで、後続の生産性格差の問題にもつながる。従業者を『約2,300万人・約50％』とする選択肢は実際より過小で誤り。付加価値を『約80兆円・約46％』とする選択肢も過小で誤り。『約3,300万人・約70％・約140兆円・約56％』の組だけがすべて整合する。"},
  {id:"r7-pol-q2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第2問",title:"第2問　付加価値額に占める中小企業割合が最も高い産業",body:"「令和3年経済センサス－活動調査」に基づき、卸売業・建設業・小売業・情報通信業・製造業について、各産業の付加価値額(民営・非一次産業・2020年)に占める中小企業の割合を見た場合、最も高いものはどれか。",options:[{key:"ア",label:"卸売業"},{key:"イ",label:"建設業"},{key:"ウ",label:"小売業"},{key:"エ",label:"情報通信業"},{key:"オ",label:"製造業"}],correct:"イ",explanation:"【論点・背景】産業によって中小企業の付加価値シェアは大きく異なる。これは産業ごとの『最小効率規模』や装置産業性の違いを反映する。労働集約的で小規模事業者が多い産業ほど中小企業のシェアが高くなる。\n\n【正答】付加価値額に占める中小企業の割合が最も高いのは建設業。建設業は地域密着の中小・零細事業者が極めて多く、元請—下請の重層構造の中で中小企業が付加価値の大半を担う。\n\n【誤答の検討】『製造業』は大企業の大規模工場が付加価値の多くを生み、中小シェアは相対的に低い。『情報通信業』は大手通信・IT企業への集中度が高く、中小シェアは最も低い部類。『卸売業』『小売業』も大手商社・チェーンの存在で建設業ほどは高くない。産業特性(資本集約度・企業規模分布)から中小シェアの高低を推論できるかが問われている。"},
  {id:"r7-pol-q3",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第3問",title:"第3問　企業規模別企業数の増減(1999→2021)",body:"1999年と2021年の企業規模別企業数(民営・非一次産業)を比較すると、【A】の方が【B】よりも高い割合で【C】している。空欄の組み合わせとして最も適切なものを選べ。なお小規模企業と中規模企業で比較する。",options:[{key:"ア",label:"A：小規模企業　B：中規模企業　C：減少"},{key:"イ",label:"A：小規模企業　B：中規模企業　C：増加"},{key:"ウ",label:"A：中規模企業　B：小規模企業　C：減少"},{key:"エ",label:"A：中規模企業　B：小規模企業　C：増加"}],correct:"ア",explanation:"【論点・背景】長期(1999→2021年)の企業数の構造変化を問う。日本では開業率が低く廃業率を下回る状態が続き、企業数は趨勢的に減少してきた。とりわけ小規模企業の減少が著しい。\n\n【キーワードの意味】企業数＝会社数＋個人事業者数。小規模企業(製造業等は従業員20人以下、商業・サービス業は5人以下)と、中規模企業(中小企業のうち小規模企業以外)で比較する。\n\n【正答】小規模企業の方が中規模企業より高い割合で減少している(A＝小規模企業、B＝中規模企業、C＝減少)。\n\n【誤答の検討】『増加』とする選択肢は、この間の企業数全体の減少基調に反するため誤り。減少の主因は個人事業者を中心とする小規模企業であり、後継者不足・経営者高齢化・需要構造変化の影響を最も強く受ける層であることが背景。中規模企業の方が高い割合で減ったとする選択肢も実態と逆で誤り。"},
  {id:"r7-pol-q4-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第4問",title:"第4問 設問1　売上高経常利益率・自己資本比率",body:"「令和5年中小企業実態基本調査」に基づき、中小企業(法人)の全業種平均で、売上高経常利益率は6％を【A】、自己資本比率は25％を【B】。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：上回る　B：上回る"},{key:"イ",label:"A：上回る　B：下回る"},{key:"ウ",label:"A：下回る　B：上回る"},{key:"エ",label:"A：下回る　B：下回る"}],correct:"ウ",explanation:"【論点・背景】中小企業(法人)の収益性(売上高経常利益率)と安全性(自己資本比率)の全業種平均の水準感を問う。「令和5年中小企業実態基本調査(令和4年度決算実績)」が出典。\n\n【キーワードの意味】売上高経常利益率＝経常利益÷売上高で、本業＋財務活動を含む通常の収益力を示す。自己資本比率＝自己資本÷総資本で、返済不要の資本の厚み＝財務の安全性を示す。\n\n【正答】全業種平均の売上高経常利益率は概ね4〜5％程度で6％は下回る。自己資本比率は概ね40％前後で25％は上回る(A＝下回る、B＝上回る)。\n\n【誤答の検討】売上高経常利益率が『6％を上回る』とする選択肢は、中小企業の薄い利益率の実態に反し誤り。自己資本比率が『25％を下回る』とする選択肢も誤りで、近年は内部留保の蓄積で自己資本比率はむしろ改善傾向にある。『収益性は低め・安全性は意外と高め』という中小企業財務の特徴を押さえる。"},
  {id:"r7-pol-q4-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第4問",title:"第4問 設問2　業種別の比較",body:"小売業・宿泊業飲食サービス業・製造業を比較した場合の記述として、最も適切なものはどれか。",options:[{key:"ア",label:"小売業では、売上高経常利益率・自己資本比率とも製造業を下回っている。"},{key:"イ",label:"小売業では、売上高経常利益率は宿泊業・飲食サービス業を上回り、自己資本比率は宿泊業・飲食サービス業を下回っている。"},{key:"ウ",label:"宿泊業・飲食サービス業では、売上高経常利益率は製造業を下回り、自己資本比率は製造業を上回っている。"},{key:"エ",label:"製造業では、売上高経常利益率は小売業を上回り、自己資本比率は小売業を下回っている。"},{key:"オ",label:"製造業では、売上高経常利益率は宿泊業・飲食サービス業を下回り、自己資本比率は宿泊業・飲食サービス業を上回っている。"}],correct:"ア",explanation:"【論点・背景】業種別に収益性・安全性を比較させる問題。装置産業性・在庫負担・参入障壁の違いが業種ごとの財務指標に表れる。\n\n【正答】小売業は売上高経常利益率・自己資本比率とも製造業を下回る。製造業は相対的に利益率が高く、設備投資の積み上げに対応した自己資本も厚い。\n\n【誤答の検討】『製造業の利益率が小売業を下回る』『製造業の自己資本比率が小売業より低い』といった大小関係を逆にした選択肢は実態と反するため誤り。宿泊業・飲食サービス業は労働集約的で利益率・自己資本比率とも低めという特徴があり、これらの大小関係を取り違えた選択肢も誤り。各業種の事業特性(設備の重さ・回転率・利益率)から財務指標の高低を結びつけられるかが問われる。"},
  {id:"r7-pol-q5",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第5問",title:"第5問　外国人労働者数の推移(在留資格別)",body:"厚生労働省「『外国人雇用状況』の届出状況まとめ」に基づく外国人労働者数の推移(在留資格別)のグラフで、2017年の約23.8万人から2023年の約59.6万人へと大きく増加している図中のa(専門的・技術的分野は技術・人文知識・国際業務や経営・管理を含み、2019年以降は特定技能も含む)に該当する在留資格として、最も適切なものを選べ。",options:[{key:"ア",label:"技能実習"},{key:"イ",label:"資格外活動"},{key:"ウ",label:"専門的・技術的分野の在留資格"},{key:"エ",label:"身分に基づく在留資格"}],correct:"ウ",explanation:"【論点・背景】深刻な人手不足を背景に外国人労働者が増加している。在留資格別の構成と推移(厚生労働省「外国人雇用状況の届出状況まとめ」、中小企業白書2024)を問う。\n\n【キーワードの意味】『専門的・技術的分野の在留資格』は技術・人文知識・国際業務や経営・管理などを含み、2019年以降は新設の『特定技能』も含む。『身分に基づく在留資格』は永住者・日本人の配偶者等・定住者など。『技能実習』は技能移転を目的とする制度。『資格外活動』は留学生のアルバイト等。\n\n【正答】図のaは2017年約23.8万人→2023年約59.6万人と最も急増しており、2019年創設の特定技能を取り込んだ『専門的・技術的分野の在留資格』。\n\n【誤答の検討】『身分に基づく在留資格』は最大規模(約61.6万人)だが伸びは緩やかでaの急増カーブと一致しない。『技能実習』(約41.3万人)『資格外活動』(約35.3万人)はいずれも別の帯で規模・伸びが異なる。急増の要因が特定技能の追加にある点を結びつけられるかが鍵。"},
  {id:"r7-pol-q6",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第6問",title:"第6問　大企業と小規模事業者の労働生産性の差",body:"「令和3年経済センサス－活動調査」に基づき、大企業と小規模事業者の労働生産性(純付加価値額／従業者数、中央値)の差を小売業・宿泊業飲食サービス業・製造業で見た場合の記述として、最も適切なものはどれか。",options:[{key:"ア",label:"差は小売業が最も大きく、宿泊業・飲食サービス業が最も小さい。"},{key:"イ",label:"差は小売業が最も大きく、製造業が最も小さい。"},{key:"ウ",label:"差は宿泊業・飲食サービス業が最も大きく、小売業が最も小さい。"},{key:"エ",label:"差は製造業が最も大きく、小売業が最も小さい。"},{key:"オ",label:"差は製造業が最も大きく、宿泊業・飲食サービス業が最も小さい。"}],correct:"オ",explanation:"【論点・背景】大企業と小規模事業者の労働生産性の格差を業種別に問う。Q1で見た『従業者シェア＞付加価値シェア』の根本要因が、この生産性格差にある。\n\n【キーワードの意味】労働生産性＝純付加価値額÷従業者数。ここでは企業ベース・中央値で比較。中央値を使うのは、一部の極端値に引きずられない代表的水準を見るため。\n\n【正答】格差は製造業が最も大きく、宿泊業・飲食サービス業が最も小さい。製造業は大企業が大規模設備で高い付加価値を生むため大企業と小規模の差が開く。宿泊・飲食は労働集約的で大企業でも一人当たり付加価値が大きく伸びにくく、規模間格差が小さい。\n\n【誤答の検討】『小売業が最大』『製造業が最小』など大小関係を入れ替えた選択肢は、装置産業性(設備による生産性押上げ効果)の大小という背景と矛盾するため誤り。"},
  {id:"r7-pol-q7",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第7問",title:"第7問　企業規模別の設備投資額(2012→2021)",body:"「平成24年・令和3年経済センサス－活動調査」に基づき、2012年度と2021年度の企業規模別設備投資額(非一次産業)を比較した場合の記述として、最も適切なものはどれか。",options:[{key:"ア",label:"大企業、中小企業とも増加している。"},{key:"イ",label:"大企業は増加し、中小企業は減少している。"},{key:"ウ",label:"大企業は増加し、中小企業はほぼ横ばいである。"},{key:"エ",label:"大企業はほぼ横ばい、中小企業は減少している。"},{key:"オ",label:"大企業はほぼ横ばい、中小企業は増加している。"}],correct:"ア",explanation:"【論点・背景】設備投資の動向(2012年度→2021年度)を規模別に問う。設備投資は生産性向上・省力化の源泉で、人手不足下で重要性が増している。\n\n【キーワードの意味】ここでの設備投資額＝有形固定資産(土地を除く)＋無形固定資産(ソフトウェアのみ)の取得額の合計。\n\n【正答】大企業・中小企業とも増加している。この期間は景気回復、設備の更新需要、人手不足対応の省力化・デジタル投資などにより、規模を問わず投資が拡大した。\n\n【誤答の検討】『中小企業は減少』『横ばい』とする選択肢は、近年の中小企業の投資意欲の回復(補助金支援も追い風)に反し誤り。『大企業は横ばい』とする選択肢も、設備更新・脱炭素・DX投資の拡大基調に反する。両者とも増加という方向感を押さえる。"},
  {id:"r7-pol-q8",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第8問",title:"第8問　労働分配率の推移(企業規模別)",body:"財務省「法人企業統計調査年報」に基づき、1990年度から2022年度の労働分配率の推移を企業規模別(大企業=資本金10億円以上、中小企業=資本金1億円未満、金融保険業除く)に見た場合の記述として、最も適切なものはどれか。",options:[{key:"ア",label:"中小企業の労働分配率は、大企業の労働分配率を一貫して上回っている。"},{key:"イ",label:"中小企業の労働分配率は、大企業の労働分配率を一貫して下回っている。"},{key:"ウ",label:"中小企業は大企業を2008年度まで上回り、2009年度以降は下回っている。"},{key:"エ",label:"中小企業は大企業を2008年度まで下回り、2009年度以降は上回っている。"}],correct:"ア",explanation:"【論点・背景】労働分配率の長期推移(1990→2022年度)を規模別に問う。労働分配率は『生み出した付加価値のうちどれだけを人件費に回したか』を示し、企業の収益構造と分配の問題に直結する。\n\n【キーワードの意味】労働分配率＝人件費÷付加価値。資本装備が薄く労働集約的な企業ほど高くなりやすい。大企業＝資本金10億円以上、中小企業＝資本金1億円未満(金融・保険業を除く)で区分。\n\n【正答】中小企業の労働分配率は大企業を一貫して上回っている。中小企業は付加価値に占める人件費の比重が高く、利益として残る部分が薄いため。\n\n【誤答の検討】『一貫して下回る』『途中で逆転する』とする選択肢は誤り。中小企業の方が労働分配率が高いという関係は構造的で、特定年度で逆転する性質のものではない。これはQ4で見た中小企業の薄い利益率とも整合する。"},
  {id:"r7-pol-q9",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第9問",title:"第9問　人手不足対応の取組(従業員100〜299人)",body:"厚生労働省「令和5年労働経済動向調査」に基づき、従業員100〜299人の企業で人手不足対応の取組(採用・正社員登用／省力化投資・外注・下請化／福利厚生・再雇用・定年延長)を見た場合、取組割合が最も高い【A】と最も低い【B】の組み合わせとして最も適切なものを選べ。",options:[{key:"ア",label:"A：採用・正社員登用　B：福利厚生、再雇用、定年延長"},{key:"イ",label:"A：採用・正社員登用　B：省力化投資、外注、下請化"},{key:"ウ",label:"A：省力化投資、外注、下請化　B：採用・正社員登用"},{key:"エ",label:"A：省力化投資、外注、下請化　B：福利厚生、再雇用、定年延長"},{key:"オ",label:"A：福利厚生、再雇用、定年延長　B：省力化投資、外注、下請化"}],correct:"ア",explanation:"【論点・背景】人手不足への対応として企業が何に取り組んでいるかを規模別に問う(厚生労働省「労働経済動向調査」)。\n\n【正答】従業員100〜299人の企業では『採用・正社員登用』の取組割合が最も高く、『福利厚生、再雇用、定年延長』が最も低い(A＝採用・正社員登用、B＝福利厚生等)。まず人材を直接確保する採用が中心となり、処遇・定年延長等は相対的に後回しになりやすい。\n\n【誤答の検討】最も高い取組を『省力化投資、外注、下請化』や『福利厚生等』とする選択肢は誤り。省力化投資は重要性を増しているが、調査時点では採用が依然最多。最も低い取組を『省力化投資』とする選択肢も誤りで、最下位は処遇・定年延長系。人手不足対応の優先順位(まず採用→省力化→処遇改善)という実務感覚と結びつける。"},
  {id:"r7-pol-q10",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第10問",title:"第10問　中規模企業の借入金依存度・総資産(2006→2022)",body:"財務省「法人企業統計調査年報」に基づき、中規模企業(金融保険業除く・資本金1,000万円以上1億円未満)の借入金依存度と1社当たり総資産について、2006年度と2022年度を比較した場合の記述として最も適切なものはどれか。",options:[{key:"ア",label:"借入金依存度は上昇、1社当たり総資産は減少している。"},{key:"イ",label:"借入金依存度は上昇、1社当たり総資産は増加している。"},{key:"ウ",label:"借入金依存度は低下、1社当たり総資産は減少している。"},{key:"エ",label:"借入金依存度は低下、1社当たり総資産は増加している。"}],correct:"エ",explanation:"【論点・背景】中規模企業の財務構造の長期変化(2006→2022年度)を問う。\n\n【キーワードの意味】借入金依存度＝(金融機関借入金＋その他借入金＋社債)÷(負債及び純資産合計)で、外部負債への依存度＝財務リスクを示す。中規模企業＝資本金1,000万円以上1億円未満(金融・保険業を除く)。\n\n【正答】借入金依存度は低下し、1社当たり総資産は増加している。内部留保の蓄積により自己資本が厚くなって借入依存が下がる一方、事業規模拡大で総資産は膨らんだ。\n\n【誤答の検討】借入金依存度が『上昇』とする選択肢は、近年の中小企業の財務体質改善(自己資本比率の上昇＝Q4と整合)に反し誤り。1社当たり総資産が『減少』とする選択肢も、規模拡大・資産蓄積の流れに反する。『負債依存は下がり、規模は大きくなった』という方向を押さえる。"},
  {id:"r7-pol-q11",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第11問",title:"第11問　ローカルベンチマーク",body:"ローカルベンチマークに関する記述の正誤の組み合わせとして、最も適切なものを選べ。\n\na　財務分析における「6つの指標」には「売上高人件費比率」「総資本回転率」が含まれる。\nb　非財務情報の「業務フロー」では、自社業務の流れを把握し、各業務の工夫や差別化ポイントを理解することが重要である。\nc　非財務情報の「4つの視点」には「経営者への着目」「内部管理体制への着目」が含まれる。",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：誤　c：正"},{key:"ウ",label:"a：誤　b：正　c：正"},{key:"エ",label:"a：誤　b：正　c：誤"},{key:"オ",label:"a：誤　b：誤　c：誤"}],correct:"ウ",explanation:"【論点・背景】ローカルベンチマーク(ロカベン)は経済産業省が提供する『企業の健康診断』ツール。財務・非財務の両面から経営状態を把握し、金融機関等との対話(知的資産経営)の入口とすることを狙う。\n\n【正答の構成】aは誤り、bは正しい、cは正しい。\n\n【各記述とキーワードの意味】\n・財務分析の『6つの指標』とは、(1)売上高増加率、(2)営業利益率、(3)労働生産性、(4)EBITDA有利子負債倍率、(5)営業運転資本回転期間、(6)自己資本比率の6つ。『売上高人件費比率』『総資本回転率』は含まれない(aが誤りの理由)。これらを混同させるのが典型的なひっかけ。\n・非財務情報の『業務フロー』では、自社業務の流れを把握し各工程の工夫・差別化ポイントを理解することが重視される(bは正しい)。\n・非財務情報の『4つの視点』とは、経営者への着目、関係者(事業を取り巻く環境・関係者)への着目、事業への着目、内部管理体制への着目の4つで、『経営者』『内部管理体制』を含む(cは正しい)。"},
  {id:"r7-pol-q12",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第12問",title:"第12問　売上高に対する研究開発費割合(1991→2021)",body:"経済産業省「企業活動基本調査」に基づき、1991年度から2021年度の売上高に対する研究開発費の割合(非一次産業)の推移を企業規模別に見た場合の記述として、最も適切なものはどれか。",options:[{key:"ア",label:"大企業、中小企業とも減少基調で推移している。"},{key:"イ",label:"大企業、中小企業ともほぼ横ばいで推移している。"},{key:"ウ",label:"大企業は増加基調、中小企業は減少基調で推移している。"},{key:"エ",label:"大企業は増加基調、中小企業はほぼ横ばいで推移している。"},{key:"オ",label:"大企業はほぼ横ばい、中小企業は減少基調で推移している。"}],correct:"エ",explanation:"【論点・背景】研究開発投資の対売上高比率の長期推移(1991→2021年度)を規模別に問う(経済産業省「企業活動基本調査」)。研究開発はイノベーションと生産性の源泉で、規模間格差が拡大している。\n\n【正答】大企業は増加基調、中小企業はほぼ横ばいで推移している。大企業は競争力維持のため研究開発を継続的に拡大する一方、中小企業は資金・人材の制約から対売上高比率を大きく高めにくい。\n\n【誤答の検討】『大企業・中小企業とも減少/横ばい』とする選択肢は、大企業の研究開発拡大基調に反し誤り。『中小企業が減少基調』とする選択肢も、横ばいという実態より強い下降を主張しており誤り。研究開発の規模間格差が開いている点を押さえる。"},
  {id:"r7-pol-q13",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第13問",title:"第13問　損益分岐点比率の推移",body:"財務省「法人企業統計調査年報」に基づく1990〜2022年度の損益分岐点比率の推移について、大企業の損益分岐点比率は【A】傾向、大企業と小規模企業の差は【B】傾向、中規模企業と小規模企業を比べると一貫して小規模企業の方が【C】。空欄の組み合わせとして最も適切なものを選べ。",options:[{key:"ア",label:"A：上昇　B：拡大　C：高い"},{key:"イ",label:"A：上昇　B：縮小　C：低い"},{key:"ウ",label:"A：低下　B：拡大　C：高い"},{key:"エ",label:"A：低下　B：縮小　C：低い"},{key:"オ",label:"A：横ばい　B：拡大　C：高い"}],correct:"ウ",explanation:"【論点・背景】損益分岐点比率の長期推移(1990→2022年度)を規模別に問う。\n\n【キーワードの意味】損益分岐点比率＝損益分岐点売上高÷実際の売上高。100％に近いほど赤字転落の危険が高く収益構造が脆弱、低いほど余裕がある。大企業＝資本金10億円以上、中規模＝1,000万円以上1億円未満、小規模＝1,000万円未満。\n\n【正答】大企業の損益分岐点比率は低下傾向(A＝低下)。大企業と小規模企業の差は拡大傾向(B＝拡大)。一貫して小規模企業の方が高い(C＝高い)。\n\n【誤答の検討】大企業が『上昇/横ばい』とする選択肢は、大企業の収益力改善傾向に反し誤り。差が『縮小』とする選択肢も、規模間の収益力格差拡大という流れと逆で誤り。小規模企業の方が『低い』とする選択肢は、Q4・Q8で見た中小・小規模の収益構造の脆弱さと矛盾し誤り。"},
  {id:"r7-pol-q14",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第14問",title:"第14問　倒産件数の推移(2009〜2023)",body:"東京商工リサーチ「全国企業倒産状況」に基づき、2009〜2023年の倒産件数の推移を見た場合、2009〜2021年は【A】傾向、2022年以降は【B】傾向。空欄の組み合わせとして最も適切なものを選べ(負債1千万円以上が集計対象)。",options:[{key:"ア",label:"A：減少　B：増加"},{key:"イ",label:"A：減少　B：横ばい"},{key:"ウ",label:"A：増加　B：減少"},{key:"エ",label:"A：横ばい　B：減少"},{key:"オ",label:"A：横ばい　B：増加"}],correct:"ア",explanation:"【論点・背景】企業倒産件数の推移(2009→2023年)を問う(東京商工リサーチ「全国企業倒産状況」、負債1千万円以上が対象)。\n\n【キーワードの意味】倒産＝企業が債務の支払不能に陥る、または経済活動の継続が困難になること。私的整理(取引停止処分・内整理)も含む。\n\n【正答】2009〜2021年は減少傾向、2022年以降は増加傾向(A＝減少、B＝増加)。減少局面は中小企業金融円滑化法やコロナ禍の各種支援(実質無利子無担保のゼロゼロ融資等)が倒産を強力に抑制した時期。2022年以降は物価高・コスト上昇、支援策の終了、ゼロゼロ融資の返済本格化などを背景に倒産が増加に転じた。\n\n【誤答の検討】2009〜2021年を『増加/横ばい』とする選択肢は、支援策による倒産抑制という実態に反し誤り。2022年以降を『減少/横ばい』とする選択肢も、コスト高・返済本格化による増加局面に反し誤り。政策(支援)と倒産件数の連動を押さえる。"},
  {id:"r7-pol-q15",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第15問",title:"第15問　年代別雇用者・女性従業者の割合",body:"総務省「就業構造基本調査」(2022年)に基づく従業者規模別の記述の正誤の組み合わせとして、最も適切なものを選べ。\n\na　従業者4人以下の60歳代以上の雇用者数割合は、20〜299人の事業者の割合を下回っている。\nb　従業者4人以下の正規の女性従業者数割合は、20〜299人の事業者の割合を上回っている。\nc　従業者4人以下の非正規の女性従業者数割合は、20〜299人の事業者の割合を下回っている。",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：正　c：誤"},{key:"ウ",label:"a：正　b：誤　c：正"},{key:"エ",label:"a：誤　b：正　c：誤"},{key:"オ",label:"a：誤　b：誤　c：正"}],correct:"エ",explanation:"【論点・背景】中小企業が高齢者・女性の雇用の受け皿となっている実態を、従業者規模別に問う(総務省「就業構造基本調査」2022年)。\n\n【正答の構成】aは誤り、bは正しい、cは誤り。\n\n【各記述の検討】\n・a:小規模(4人以下)の事業者ほど高齢者(60歳代以上)の雇用割合は高い傾向にあり、20〜299人規模を『下回っている』とするのは逆で誤り。地域の小規模事業者が高齢者雇用の受け皿となっている実態を踏まえる。\n・b:小規模事業者では正規の女性従業者割合が相対的に高く、20〜299人規模を上回るとする記述は妥当(正)。\n・c:非正規の女性従業者割合は規模により傾向が一様でなく、『4人以下が20〜299人を下回る』と断定するのは誤り。\n\n【キーワードの意味】女性従業者数の割合＝(女性従業者数)÷(男性＋女性従業者数)を、正規(正社員等)・非正規(パート・派遣・契約・嘱託等)別に算出したもの。"},
  {id:"r7-pol-q16-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第16問",title:"第16問 設問1　休廃業・解散企業(規模・赤字黒字)",body:"帝国データバンク「企業概要ファイル」に基づき、2023年の休廃業・解散企業数を企業規模別に見ると【A】が大半を占める。また2016〜2023年の休廃業・解散企業の赤字・黒字割合を見ると、中規模企業はいずれの年も過半数が【B】であった。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：小規模事業者　B：赤字"},{key:"イ",label:"A：小規模事業者　B：黒字"},{key:"ウ",label:"A：大企業　B：赤字"},{key:"エ",label:"A：中規模企業　B：赤字"},{key:"オ",label:"A：中規模企業　B：黒字"}],correct:"イ",explanation:"【論点・背景】休廃業・解散の動向を問う(帝国データバンク)。倒産(法的整理)とは別に、特段の手続をとらず事業を停止する『休廃業・解散』が経営者高齢化を背景に増えている。\n\n【キーワードの意味】休廃業・解散＝倒産(法的整理)を除き、特段の手続なく事業活動が停止した状態の確認(休廃業)、または商業登記等での解散(みなし解散を除く)を確認した企業の総称。\n\n【正答】休廃業・解散企業数は小規模事業者が大半を占める(A＝小規模事業者)。中規模企業はいずれの年も過半数が黒字であった(B＝黒字)。\n\n【誤答の検討】A を『大企業』『中規模企業』とする選択肢は、企業数全体に占める小規模事業者の多さに反し誤り。Bを『赤字』とする選択肢が特に重要な誤り——休廃業・解散は経営難だけでなく、黒字のまま後継者不在で『あきらめ廃業』するケースが多い。これがB＝黒字となる理由で、事業承継支援の必要性を示す論点につながる。"},
  {id:"r7-pol-q16-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第16問",title:"第16問 設問2　休廃業・解散企業の経営者平均年齢",body:"2016〜2023年の休廃業・解散企業の経営者平均年齢の推移を企業規模別に見ると、中規模企業では経営者平均年齢が【C】し、小規模事業者では【D】している。小規模事業者の経営者平均年齢は中規模企業よりも【E】水準で推移している。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"C：上昇　D：上昇　E：高い"},{key:"イ",label:"C：上昇　D：上昇　E：低い"},{key:"ウ",label:"C：上昇　D：低下　E：高い"},{key:"エ",label:"C：低下　D：上昇　E：高い"},{key:"オ",label:"C：低下　D：低下　E：低い"}],correct:"ア",explanation:"【論点・背景】休廃業・解散企業の経営者年齢の推移を規模別に問う。経営者の高齢化と後継者不在が休廃業の主因であることを裏づける。\n\n【正答】中規模企業・小規模事業者とも経営者平均年齢は上昇している(C＝上昇、D＝上昇)。また小規模事業者の経営者平均年齢は中規模企業よりも高い水準で推移している(E＝高い)。小規模ほど後継者確保が難しく、高齢の経営者がそのまま廃業に至りやすい。\n\n【誤答の検討】C・Dを『低下』とする選択肢は、経営者の高齢化という一貫した潮流に反し誤り。Eを『低い』とする選択肢も、規模が小さいほど承継が進まず経営者が高齢化しやすいという実態に反し誤り。Q16設問1の『黒字廃業』とあわせ、事業承継税制・後継者支援策の背景として理解する。"},
  {id:"r7-pol-q17",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第17問",title:"第17問　製造業の有形・無形固定資産投資",body:"「ものづくり白書2024年版」(法人企業統計調査ベース)に基づき、2015〜2023年の製造業の設備投資額を見ると、無形固定資産への投資額は有形固定資産への投資額を【A】いる。また2023年の2015年比の増加率を見ると、無形固定資産への投資額の増加率は有形固定資産への投資額の増加率を【B】いる。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：上回って　B：上回って"},{key:"イ",label:"A：上回って　B：下回って"},{key:"ウ",label:"A：下回って　B：上回って"},{key:"エ",label:"A：下回って　B：下回って"}],correct:"ウ",explanation:"【論点・背景】製造業の設備投資を有形固定資産と無形固定資産に分けて問う(ものづくり白書2024、法人企業統計ベース、2015→2023年)。生産性向上には機械等の有形投資に加え、ソフトウェア・研究開発等の無形投資が重要性を増している。\n\n【キーワードの意味】有形固定資産＝機械・建物等の物的資産。無形固定資産＝ソフトウェア等の形のない資産。\n\n【正答】投資額の絶対水準では依然として有形固定資産が大きく、無形固定資産への投資額は有形を下回っている(A＝下回って)。一方、2015年比の増加率では無形固定資産投資の伸びが有形を上回っている(B＝上回って)。\n\n【誤答の検討】絶対額で無形が有形を『上回る』とする選択肢は、製造業がなお設備(有形)中心である実態に反し誤り。増加率で無形が有形を『下回る』とする選択肢も、無形投資の急成長という近年の傾向に反し誤り。『水準は有形が大きいが、伸びは無形が速い』という二段構えを区別する。"},
  {id:"r7-pol-q18",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第18問",title:"第18問　開業費用の推移(2013→2023)",body:"日本政策金融公庫総合研究所「2023年度新規開業実態調査」に基づき、開業費用の平均値・中央値を2013年度と2023年度で比較すると、開業費用の平均値は【A】し、中央値は【B】している。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：上昇　B：上昇"},{key:"イ",label:"A：上昇　B：低下"},{key:"ウ",label:"A：低下　B：上昇"},{key:"エ",label:"A：低下　B：低下"}],correct:"エ",explanation:"【論点・背景】開業費用の動向(2013→2023年度)を問う(日本政策金融公庫「新規開業実態調査」)。開業の量と質を高めることは新陳代謝・生産性向上の鍵。\n\n【キーワードの意味】平均値は外れ値(大型開業)に引っ張られやすく、中央値は典型的な開業者の実感に近い。\n\n【正答】開業費用は平均値・中央値とも低下している(A＝低下、B＝低下)。インターネット活用やスモールスタート(小資本での起業)の広がり、フランチャイズや無店舗開業の増加などにより、開業に必要な初期費用は縮小傾向。\n\n【誤答の検討】平均値・中央値を『上昇』とする選択肢は、近年の小規模・低資本開業の潮流に反し誤り。開業のハードルが下がっていることが、創業支援策の追い風になっている点を押さえる。"},
  {id:"r7-pol-q19",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第19問",title:"第19問　製造業の賃金・男女間賃金格差",body:"厚生労働省「賃金構造基本統計調査」に基づき、2005〜2023年について製造業の一般労働者の賃金を全産業と比較すると、製造業の賃金は全産業を一貫して【A】いる。また、男性を100とした女性の賃金指数で見ると、製造業の男女間賃金格差は全産業と比較して一貫して【B】。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：上回って　B：大きい"},{key:"イ",label:"A：上回って　B：小さい"},{key:"ウ",label:"A：下回って　B：大きい"},{key:"エ",label:"A：下回って　B：小さい"}],correct:"ウ",explanation:"【論点・背景】製造業の賃金と男女間賃金格差を全産業と比較する(賃金構造基本統計調査、2005→2023年)。\n\n【キーワードの意味】一般労働者の所定内給与額(残業代等を除く決まって支給する給与)で比較。男女間賃金格差は『男性の賃金を100とした女性の賃金指数』で見る(指数が低いほど格差が大きい)。\n\n【正答】製造業の賃金は全産業を一貫して下回っている(A＝下回って)。全産業には金融・情報通信・電気ガス等の高賃金業種が含まれるため、製造業はその平均を下回る。また製造業の男女間賃金格差は全産業と比べて一貫して大きい(B＝大きい)。製造業は男性比率が高く、女性が相対的に高賃金の職務に就きにくい構造が背景。\n\n【誤答の検討】製造業賃金が全産業を『上回る』とする選択肢は誤り。男女格差が全産業より『小さい』とする選択肢も、製造業の男性中心の構造に反し誤り。"},
  {id:"r7-pol-q20-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第20問",title:"第20問 設問1　新規開業・スタートアップ支援資金(年齢要件)",body:"日本政策金融公庫(国民生活事業)の新規開業・スタートアップ支援資金で、特別利率が適用される「若年者または高齢者」の年齢要件の定めとして、最も適切なものはどれか。",options:[{key:"ア",label:"若年者は30歳未満、高齢者は55歳以上。"},{key:"イ",label:"若年者は30歳未満、高齢者は65歳以上。"},{key:"ウ",label:"若年者は35歳未満、高齢者は55歳以上。"},{key:"エ",label:"若年者は35歳未満、高齢者は60歳以上。"},{key:"オ",label:"若年者は35歳未満、高齢者は65歳以上。"}],correct:"ウ",explanation:"【制度の趣旨・背景】日本政策金融公庫(国民生活事業)の新規開業・スタートアップ支援資金は、創業を促進するため貸付利率等に特例を設ける政策金融。とりわけ女性・若年者・高齢者は資金調達やキャリア上の制約を抱えやすいため、運転資金・設備資金に特別利率を適用し後押しする。\n\n【正答】特別利率の対象となる年齢要件は、若年者は35歳未満、高齢者は55歳以上。\n\n【誤答の検討】若年者を『30歳未満』とする選択肢、高齢者を『60歳以上』『65歳以上』とする選択肢は誤り。一般に高齢者雇用・支援の基準は60歳・65歳が多用されるため、本制度の『55歳以上』と混同させるひっかけになっている。創業支援では幅広い年齢層の起業を促す趣旨から、高齢者の基準が55歳とやや低めに設定されている点に注意。"},
  {id:"r7-pol-q20-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第20問",title:"第20問 設問2　貸付期間(運転資金・設備資金)",body:"新規開業・スタートアップ支援資金の貸付期間(いずれも据置期間5年以内)について、空欄AとBに入る組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：運転資金10年以内　B：設備資金15年以内"},{key:"イ",label:"A：運転資金10年以内　B：設備資金20年以内"},{key:"ウ",label:"A：運転資金20年以内　B：設備資金20年以内"},{key:"エ",label:"A：運転資金20年以内　B：設備資金25年以内"}],correct:"イ",explanation:"【制度の趣旨・背景】設備資金は投資回収に長期を要するため運転資金より長い償還期間が認められるのが政策金融の通例。\n\n【正答】貸付期間は、運転資金10年以内、設備資金20年以内(いずれも据置期間5年以内)。なお廃業歴等の一定要件に該当する場合、運転資金は15年以内となる特例もある。\n\n【誤答の検討】運転資金を『20年以内』とする選択肢は、設備資金より長く設定する点で不自然かつ誤り。設備資金を『15年以内』『25年以内』とする選択肢も誤り。『運転資金より設備資金の方が長い』という政策金融の一般原則(投資回収期間の長短に対応)から、運転10年・設備20年の組合せを導ける。"},
  {id:"r7-pol-q21-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第21問",title:"第21問 設問1　中小企業基本法(小規模企業への施策方針)",body:"中小企業基本法の小規模企業に関する施策方針について、【A】の確保が特に困難であることが多い小規模企業者の事情を踏まえ、小規模企業の【B】に努める、とする空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：経営資源　B：経営の発達及び改善"},{key:"イ",label:"A：経営資源　B：生産性の向上"},{key:"ウ",label:"A：労働力　B：経営の発達及び改善"},{key:"エ",label:"A：労働力　B：生産性の向上"}],correct:"ア",explanation:"【制度の趣旨・背景】中小企業基本法は中小企業政策の基本理念を定める法律。1999年の抜本改正で『多様で活力ある中小企業の成長発展』を理念に掲げ、さらに2013年改正で小規模企業への配慮を強化した(小規模企業基本法の制定もこの流れ)。小規模企業は経営資源(ヒト・モノ・カネ・情報)の確保が特に困難なため、特別の配慮を行うとされる。\n\n【正答】経営資源の確保が特に困難であることが多い小規模企業者の事情を踏まえ、小規模企業の経営の発達及び改善に努める(A＝経営資源、B＝経営の発達及び改善)。\n\n【誤答の検討】Aを『労働力』に限定する選択肢は、確保が困難なのは労働力だけでなく経営資源全般であるため狭すぎて誤り。Bを『生産性の向上』とする選択肢は、生産性向上は施策の手段・目標の一つではあるが、ここで法が掲げる文言は『経営の発達及び改善』であり、条文の趣旨(小規模企業の事業活動全体の底上げ)に照らして誤り。"},
  {id:"r7-pol-q21-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第21問",title:"第21問 設問2　中小企業の範囲(小売業)",body:"中小企業基本法における、小売業を主たる事業とする中小企業の範囲(資本金の額または出資の総額が【C】の会社、常時使用する従業員の数が【D】の会社・個人)について、空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"C：5,000万円以下　D：50人以下"},{key:"イ",label:"C：5,000万円以下　D：100人以下"},{key:"ウ",label:"C：1億円以下　D：50人以下"},{key:"エ",label:"C：1億円以下　D：100人以下"}],correct:"ア",explanation:"【制度の趣旨・背景】中小企業基本法の中小企業の範囲は、業種ごとに資本金基準『または』従業員基準のいずれかを満たせば該当する(両方を満たす必要はない)。業種で基準が異なるのは、必要資本や雇用規模の業種特性を反映するため。\n\n【正答】小売業の中小企業は『資本金5,000万円以下、または従業員50人以下』(C＝5,000万円以下、D＝50人以下)。\n\n【誤答の検討】資本金を『1億円以下』とする選択肢は卸売業の基準との混同で誤り。従業員を『100人以下』とする選択肢も卸売業・サービス業の基準との混同で誤り。整理すると——製造業その他＝3億円/300人、卸売業＝1億円/100人、サービス業＝5,000万円/100人、小売業＝5,000万円/50人。小売業は最も小さい基準(5,000万円・50人)である点を押さえる。"},
  {id:"r7-pol-q21-3",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第21問",title:"第21問 設問3　中小企業基本法(労働に関する施策)",body:"中小企業基本法の労働に関する施策で、国は中小企業における労働関係の【E】及び従業員の【F】の向上を図るため必要な施策を講ずる、とする空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"E：健全な発展　F：生活"},{key:"イ",label:"E：健全な発展　F：福祉"},{key:"ウ",label:"E：適正化　F：生活"},{key:"エ",label:"E：適正化　F：福祉"}],correct:"エ",explanation:"【制度の趣旨・背景】中小企業基本法は労働に関する施策として、中小企業で働く人の労働環境の整備と人材確保の両面を国の責務として定める。中小企業の人手不足・処遇格差への対応という政策思想を反映する。\n\n【正答】国は中小企業における労働関係の適正化及び従業員の福祉の向上を図るため必要な施策を講ずるとともに、必要な労働力確保のため職業能力開発・職業紹介事業の充実等を講ずる(E＝適正化、F＝福祉)。\n\n【誤答の検討】Eを『健全な発展』とする選択肢は、労働『関係』に対して用いる法文言としては『適正化』が正しく誤り。Fを『生活』とする選択肢も、条文は従業員の『福祉』の向上としており誤り。条文の語(労働関係の適正化／従業員の福祉)を正確に押さえることが求められる。"},
