  {id:"r7-pol-q9",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第9問",title:"第9問　人手不足対応の取組(従業員100〜299人)",body:"厚生労働省「令和5年労働経済動向調査」に基づき、従業員100〜299人の企業で人手不足対応の取組(採用・正社員登用／省力化投資・外注・下請化／福利厚生・再雇用・定年延長)を見た場合、取組割合が最も高い【A】と最も低い【B】の組み合わせとして最も適切なものを選べ。",options:[{key:"ア",label:"A：採用・正社員登用　B：福利厚生、再雇用、定年延長"},{key:"イ",label:"A：採用・正社員登用　B：省力化投資、外注、下請化"},{key:"ウ",label:"A：省力化投資、外注、下請化　B：採用・正社員登用"},{key:"エ",label:"A：省力化投資、外注、下請化　B：福利厚生、再雇用、定年延長"},{key:"オ",label:"A：福利厚生、再雇用、定年延長　B：省力化投資、外注、下請化"}],correct:"ア",explanation:"【論点・背景】人手不足への対応として企業が何に取り組んでいるかを規模別に問う(厚生労働省「労働経済動向調査」)。\n\n【正答】従業員100〜299人の企業では『採用・正社員登用』の取組割合が最も高く、『福利厚生、再雇用、定年延長』が最も低い(A＝採用・正社員登用、B＝福利厚生等)。まず人材を直接確保する採用が中心となり、処遇・定年延長等は相対的に後回しになりやすい。\n\n【誤答の検討】最も高い取組を『省力化投資、外注、下請化』や『福利厚生等』とする選択肢は誤り。省力化投資は重要性を増しているが、調査時点では採用が依然最多。最も低い取組を『省力化投資』とする選択肢も誤りで、最下位は処遇・定年延長系。人手不足対応の優先順位(まず採用→省力化→処遇改善)という実務感覚と結びつける。"},
  {id:"r7-pol-q10",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第10問",title:"第10問　中規模企業の借入金依存度・総資産(2006→2022)",body:"財務省「法人企業統計調査年報」に基づき、中規模企業(金融保険業除く・資本金1,000万円以上1億円未満)の借入金依存度と1社当たり総資産について、2006年度と2022年度を比較した場合の記述として最も適切なものはどれか。",options:[{key:"ア",label:"借入金依存度は上昇、1社当たり総資産は減少している。"},{key:"イ",label:"借入金依存度は上昇、1社当たり総資産は増加している。"},{key:"ウ",label:"借入金依存度は低下、1社当たり総資産は減少している。"},{key:"エ",label:"借入金依存度は低下、1社当たり総資産は増加している。"}],correct:"エ",explanation:"【論点・背景】中規模企業の財務構造の長期変化(2006→2022年度)を問う。\n\n【キーワードの意味】借入金依存度＝(金融機関借入金＋その他借入金＋社債)÷(負債及び純資産合計)で、外部負債への依存度＝財務リスクを示す。中規模企業＝資本金1,000万円以上1億円未満(金融・保険業を除く)。\n\n【正答】借入金依存度は低下し、1社当たり総資産は増加している。内部留保の蓄積により自己資本が厚くなって借入依存が下がる一方、事業規模拡大で総資産は膨らんだ。\n\n【誤答の検討】借入金依存度が『上昇』とする選択肢は、近年の中小企業の財務体質改善(自己資本比率の上昇＝Q4と整合)に反し誤り。1社当たり総資産が『減少』とする選択肢も、規模拡大・資産蓄積の流れに反する。『負債依存は下がり、規模は大きくなった』という方向を押さえる。"},
  {id:"r7-pol-q11",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第11問",title:"第11問　ローカルベンチマーク",body:"ローカルベンチマークに関する記述の正誤の組み合わせとして、最も適切なものを選べ。\n\na　財務分析における「6つの指標」には「売上高人件費比率」「総資本回転率」が含まれる。\nb　非財務情報の「業務フロー」では、自社業務の流れを把握し、各業務の工夫や差別化ポイントを理解することが重要である。\nc　非財務情報の「4つの視点」には「経営者への着目」「内部管理体制への着目」が含まれる。",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：誤　c：正"},{key:"ウ",label:"a：誤　b：正　c：正"},{key:"エ",label:"a：誤　b：正　c：誤"},{key:"オ",label:"a：誤　b：誤　c：誤"}],correct:"ウ",explanation:"【論点・背景】ローカルベンチマーク(ロカベン)は経済産業省が提供する『企業の健康診断』ツール。財務・非財務の両面から経営状態を把握し、金融機関等との対話(知的資産経営)の入口とすることを狙う。\n\n【正答の構成】aは誤り、bは正しい、cは正しい。\n\n【各記述とキーワードの意味】\n・財務分析の『6つの指標』とは、(1)売上高増加率、(2)営業利益率、(3)労働生産性、(4)EBITDA有利子負債倍率、(5)営業運転資本回転期間、(6)自己資本比率の6つ。『売上高人件費比率』『総資本回転率』は含まれない(aが誤りの理由)。これらを混同させるのが典型的なひっかけ。\n・非財務情報の『業務フロー』では、自社業務の流れを把握し各工程の工夫・差別化ポイントを理解することが重視される(bは正しい)。\n・非財務情報の『4つの視点』とは、経営者への着目、関係者(事業を取り巻く環境・関係者)への着目、事業への着目、内部管理体制への着目の4つで、『経営者』『内部管理体制』を含む(cは正しい)。"},
  {id:"r7-pol-q12",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第12問",title:"第12問　売上高に対する研究開発費割合(1991→2021)",body:"経済産業省「企業活動基本調査」に基づき、1991年度から2021年度の売上高に対する研究開発費の割合(非一次産業)の推移を企業規模別に見た場合の記述として、最も適切なものはどれか。",options:[{key:"ア",label:"大企業、中小企業とも減少基調で推移している。"},{key:"イ",label:"大企業、中小企業ともほぼ横ばいで推移している。"},{key:"ウ",label:"大企業は増加基調、中小企業は減少基調で推移している。"},{key:"エ",label:"大企業は増加基調、中小企業はほぼ横ばいで推移している。"},{key:"オ",label:"大企業はほぼ横ばい、中小企業は減少基調で推移している。"}],correct:"エ",explanation:"【論点・背景】研究開発投資の対売上高比率の長期推移(1991→2021年度)を規模別に問う(経済産業省「企業活動基本調査」)。研究開発はイノベーションと生産性の源泉で、規模間格差が拡大している。\n\n【正答】大企業は増加基調、中小企業はほぼ横ばいで推移している。大企業は競争力維持のため研究開発を継続的に拡大する一方、中小企業は資金・人材の制約から対売上高比率を大きく高めにくい。\n\n【誤答の検討】『大企業・中小企業とも減少/横ばい』とする選択肢は、大企業の研究開発拡大基調に反し誤り。『中小企業が減少基調』とする選択肢も、横ばいという実態より強い下降を主張しており誤り。研究開発の規模間格差が開いている点を押さえる。"},
  {id:"r7-pol-q13",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第13問",title:"第13問　損益分岐点比率の推移",body:"財務省「法人企業統計調査年報」に基づく1990〜2022年度の損益分岐点比率の推移について、大企業の損益分岐点比率は【A】傾向、大企業と小規模企業の差は【B】傾向、中規模企業と小規模企業を比べると一貫して小規模企業の方が【C】。空欄の組み合わせとして最も適切なものを選べ。",options:[{key:"ア",label:"A：上昇　B：拡大　C：高い"},{key:"イ",label:"A：上昇　B：縮小　C：低い"},{key:"ウ",label:"A：低下　B：拡大　C：高い"},{key:"エ",label:"A：低下　B：縮小　C：低い"},{key:"オ",label:"A：横ばい　B：拡大　C：高い"}],correct:"ウ",explanation:"【論点・背景】損益分岐点比率の長期推移(1990→2022年度)を規模別に問う。\n\n【キーワードの意味】損益分岐点比率＝損益分岐点売上高÷実際の売上高。100％に近いほど赤字転落の危険が高く収益構造が脆弱、低いほど余裕がある。大企業＝資本金10億円以上、中規模＝1,000万円以上1億円未満、小規模＝1,000万円未満。\n\n【正答】大企業の損益分岐点比率は低下傾向(A＝低下)。大企業と小規模企業の差は拡大傾向(B＝拡大)。一貫して小規模企業の方が高い(C＝高い)。\n\n【誤答の検討】大企業が『上昇/横ばい』とする選択肢は、大企業の収益力改善傾向に反し誤り。差が『縮小』とする選択肢も、規模間の収益力格差拡大という流れと逆で誤り。小規模企業の方が『低い』とする選択肢は、Q4・Q8で見た中小・小規模の収益構造の脆弱さと矛盾し誤り。"},
  {id:"r7-pol-q14",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第14問",title:"第14問　倒産件数の推移(2009〜2023)",body:"東京商工リサーチ「全国企業倒産状況」に基づき、2009〜2023年の倒産件数の推移を見た場合、2009〜2021年は【A】傾向、2022年以降は【B】傾向。空欄の組み合わせとして最も適切なものを選べ(負債1千万円以上が集計対象)。",options:[{key:"ア",label:"A：減少　B：増加"},{key:"イ",label:"A：減少　B：横ばい"},{key:"ウ",label:"A：増加　B：減少"},{key:"エ",label:"A：横ばい　B：減少"},{key:"オ",label:"A：横ばい　B：増加"}],correct:"ア",explanation:"【論点・背景】企業倒産件数の推移(2009→2023年)を問う(東京商工リサーチ「全国企業倒産状況」、負債1千万円以上が対象)。\n\n【キーワードの意味】倒産＝企業が債務の支払不能に陥る、または経済活動の継続が困難になること。私的整理(取引停止処分・内整理)も含む。\n\n【正答】2009〜2021年は減少傾向、2022年以降は増加傾向(A＝減少、B＝増加)。減少局面は中小企業金融円滑化法やコロナ禍の各種支援(実質無利子無担保のゼロゼロ融資等)が倒産を強力に抑制した時期。2022年以降は物価高・コスト上昇、支援策の終了、ゼロゼロ融資の返済本格化などを背景に倒産が増加に転じた。\n\n【誤答の検討】2009〜2021年を『増加/横ばい』とする選択肢は、支援策による倒産抑制という実態に反し誤り。2022年以降を『減少/横ばい』とする選択肢も、コスト高・返済本格化による増加局面に反し誤り。政策(支援)と倒産件数の連動を押さえる。"},
  {id:"r7-pol-q15",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第15問",title:"第15問　年代別雇用者・女性従業者の割合",body:"総務省「就業構造基本調査」(2022年)に基づく従業者規模別の記述の正誤の組み合わせとして、最も適切なものを選べ。\n\na　従業者4人以下の60歳代以上の雇用者数割合は、20〜299人の事業者の割合を下回っている。\nb　従業者4人以下の正規の女性従業者数割合は、20〜299人の事業者の割合を上回っている。\nc　従業者4人以下の非正規の女性従業者数割合は、20〜299人の事業者の割合を下回っている。",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：正　c：誤"},{key:"ウ",label:"a：正　b：誤　c：正"},{key:"エ",label:"a：誤　b：正　c：誤"},{key:"オ",label:"a：誤　b：誤　c：正"}],correct:"エ",explanation:"【論点・背景】中小企業が高齢者・女性の雇用の受け皿となっている実態を、従業者規模別に問う(総務省「就業構造基本調査」2022年)。\n\n【正答の構成】aは誤り、bは正しい、cは誤り。\n\n【各記述の検討】\n・a:小規模(4人以下)の事業者ほど高齢者(60歳代以上)の雇用割合は高い傾向にあり、20〜299人規模を『下回っている』とするのは逆で誤り。地域の小規模事業者が高齢者雇用の受け皿となっている実態を踏まえる。\n・b:小規模事業者では正規の女性従業者割合が相対的に高く、20〜299人規模を上回るとする記述は妥当(正)。\n・c:非正規の女性従業者割合は規模により傾向が一様でなく、『4人以下が20〜299人を下回る』と断定するのは誤り。\n\n【キーワードの意味】女性従業者数の割合＝(女性従業者数)÷(男性＋女性従業者数)を、正規(正社員等)・非正規(パート・派遣・契約・嘱託等)別に算出したもの。"},
  {id:"r7-pol-q16-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第16問",title:"第16問 設問1　休廃業・解散企業(規模・赤字黒字)",body:"帝国データバンク「企業概要ファイル」に基づき、2023年の休廃業・解散企業数を企業規模別に見ると【A】が大半を占める。また2016〜2023年の休廃業・解散企業の赤字・黒字割合を見ると、中規模企業はいずれの年も過半数が【B】であった。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：小規模事業者　B：赤字"},{key:"イ",label:"A：小規模事業者　B：黒字"},{key:"ウ",label:"A：大企業　B：赤字"},{key:"エ",label:"A：中規模企業　B：赤字"},{key:"オ",label:"A：中規模企業　B：黒字"}],correct:"イ",explanation:"【論点・背景】休廃業・解散の動向を問う(帝国データバンク)。倒産(法的整理)とは別に、特段の手続をとらず事業を停止する『休廃業・解散』が経営者高齢化を背景に増えている。\n\n【キーワードの意味】休廃業・解散＝倒産(法的整理)を除き、特段の手続なく事業活動が停止した状態の確認(休廃業)、または商業登記等での解散(みなし解散を除く)を確認した企業の総称。\n\n【正答】休廃業・解散企業数は小規模事業者が大半を占める(A＝小規模事業者)。中規模企業はいずれの年も過半数が黒字であった(B＝黒字)。\n\n【誤答の検討】A を『大企業』『中規模企業』とする選択肢は、企業数全体に占める小規模事業者の多さに反し誤り。Bを『赤字』とする選択肢が特に重要な誤り——休廃業・解散は経営難だけでなく、黒字のまま後継者不在で『あきらめ廃業』するケースが多い。これがB＝黒字となる理由で、事業承継支援の必要性を示す論点につながる。"},
  {id:"r7-pol-q16-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第16問",title:"第16問 設問2　休廃業・解散企業の経営者平均年齢",body:"2016〜2023年の休廃業・解散企業の経営者平均年齢の推移を企業規模別に見ると、中規模企業では経営者平均年齢が【C】し、小規模事業者では【D】している。小規模事業者の経営者平均年齢は中規模企業よりも【E】水準で推移している。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"C：上昇　D：上昇　E：高い"},{key:"イ",label:"C：上昇　D：上昇　E：低い"},{key:"ウ",label:"C：上昇　D：低下　E：高い"},{key:"エ",label:"C：低下　D：上昇　E：高い"},{key:"オ",label:"C：低下　D：低下　E：低い"}],correct:"ア",explanation:"【論点・背景】休廃業・解散企業の経営者年齢の推移を規模別に問う。経営者の高齢化と後継者不在が休廃業の主因であることを裏づける。\n\n【正答】中規模企業・小規模事業者とも経営者平均年齢は上昇している(C＝上昇、D＝上昇)。また小規模事業者の経営者平均年齢は中規模企業よりも高い水準で推移している(E＝高い)。小規模ほど後継者確保が難しく、高齢の経営者がそのまま廃業に至りやすい。\n\n【誤答の検討】C・Dを『低下』とする選択肢は、経営者の高齢化という一貫した潮流に反し誤り。Eを『低い』とする選択肢も、規模が小さいほど承継が進まず経営者が高齢化しやすいという実態に反し誤り。Q16設問1の『黒字廃業』とあわせ、事業承継税制・後継者支援策の背景として理解する。"},
  {id:"r7-pol-q17",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第17問",title:"第17問　製造業の有形・無形固定資産投資",body:"「ものづくり白書2024年版」(法人企業統計調査ベース)に基づき、2015〜2023年の製造業の設備投資額を見ると、無形固定資産への投資額は有形固定資産への投資額を【A】いる。また2023年の2015年比の増加率を見ると、無形固定資産への投資額の増加率は有形固定資産への投資額の増加率を【B】いる。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：上回って　B：上回って"},{key:"イ",label:"A：上回って　B：下回って"},{key:"ウ",label:"A：下回って　B：上回って"},{key:"エ",label:"A：下回って　B：下回って"}],correct:"ウ",explanation:"【論点・背景】製造業の設備投資を有形固定資産と無形固定資産に分けて問う(ものづくり白書2024、法人企業統計ベース、2015→2023年)。生産性向上には機械等の有形投資に加え、ソフトウェア・研究開発等の無形投資が重要性を増している。\n\n【キーワードの意味】有形固定資産＝機械・建物等の物的資産。無形固定資産＝ソフトウェア等の形のない資産。\n\n【正答】投資額の絶対水準では依然として有形固定資産が大きく、無形固定資産への投資額は有形を下回っている(A＝下回って)。一方、2015年比の増加率では無形固定資産投資の伸びが有形を上回っている(B＝上回って)。\n\n【誤答の検討】絶対額で無形が有形を『上回る』とする選択肢は、製造業がなお設備(有形)中心である実態に反し誤り。増加率で無形が有形を『下回る』とする選択肢も、無形投資の急成長という近年の傾向に反し誤り。『水準は有形が大きいが、伸びは無形が速い』という二段構えを区別する。"},
  {id:"r7-pol-q18",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第18問",title:"第18問　開業費用の推移(2013→2023)",body:"日本政策金融公庫総合研究所「2023年度新規開業実態調査」に基づき、開業費用の平均値・中央値を2013年度と2023年度で比較すると、開業費用の平均値は【A】し、中央値は【B】している。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：上昇　B：上昇"},{key:"イ",label:"A：上昇　B：低下"},{key:"ウ",label:"A：低下　B：上昇"},{key:"エ",label:"A：低下　B：低下"}],correct:"エ",explanation:"【論点・背景】開業費用の動向(2013→2023年度)を問う(日本政策金融公庫「新規開業実態調査」)。開業の量と質を高めることは新陳代謝・生産性向上の鍵。\n\n【キーワードの意味】平均値は外れ値(大型開業)に引っ張られやすく、中央値は典型的な開業者の実感に近い。\n\n【正答】開業費用は平均値・中央値とも低下している(A＝低下、B＝低下)。インターネット活用やスモールスタート(小資本での起業)の広がり、フランチャイズや無店舗開業の増加などにより、開業に必要な初期費用は縮小傾向。\n\n【誤答の検討】平均値・中央値を『上昇』とする選択肢は、近年の小規模・低資本開業の潮流に反し誤り。開業のハードルが下がっていることが、創業支援策の追い風になっている点を押さえる。"},
  {id:"r7-pol-q19",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第19問",title:"第19問　製造業の賃金・男女間賃金格差",body:"厚生労働省「賃金構造基本統計調査」に基づき、2005〜2023年について製造業の一般労働者の賃金を全産業と比較すると、製造業の賃金は全産業を一貫して【A】いる。また、男性を100とした女性の賃金指数で見ると、製造業の男女間賃金格差は全産業と比較して一貫して【B】。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：上回って　B：大きい"},{key:"イ",label:"A：上回って　B：小さい"},{key:"ウ",label:"A：下回って　B：大きい"},{key:"エ",label:"A：下回って　B：小さい"}],correct:"ウ",explanation:"【論点・背景】製造業の賃金と男女間賃金格差を全産業と比較する(賃金構造基本統計調査、2005→2023年)。\n\n【キーワードの意味】一般労働者の所定内給与額(残業代等を除く決まって支給する給与)で比較。男女間賃金格差は『男性の賃金を100とした女性の賃金指数』で見る(指数が低いほど格差が大きい)。\n\n【正答】製造業の賃金は全産業を一貫して下回っている(A＝下回って)。全産業には金融・情報通信・電気ガス等の高賃金業種が含まれるため、製造業はその平均を下回る。また製造業の男女間賃金格差は全産業と比べて一貫して大きい(B＝大きい)。製造業は男性比率が高く、女性が相対的に高賃金の職務に就きにくい構造が背景。\n\n【誤答の検討】製造業賃金が全産業を『上回る』とする選択肢は誤り。男女格差が全産業より『小さい』とする選択肢も、製造業の男性中心の構造に反し誤り。"},
  {id:"r7-pol-q20-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第20問",title:"第20問 設問1　新規開業・スタートアップ支援資金(年齢要件)",body:"日本政策金融公庫(国民生活事業)の新規開業・スタートアップ支援資金で、特別利率が適用される「若年者または高齢者」の年齢要件の定めとして、最も適切なものはどれか。",options:[{key:"ア",label:"若年者は30歳未満、高齢者は55歳以上。"},{key:"イ",label:"若年者は30歳未満、高齢者は65歳以上。"},{key:"ウ",label:"若年者は35歳未満、高齢者は55歳以上。"},{key:"エ",label:"若年者は35歳未満、高齢者は60歳以上。"},{key:"オ",label:"若年者は35歳未満、高齢者は65歳以上。"}],correct:"ウ",explanation:"【制度の趣旨・背景】日本政策金融公庫(国民生活事業)の新規開業・スタートアップ支援資金は、創業を促進するため貸付利率等に特例を設ける政策金融。とりわけ女性・若年者・高齢者は資金調達やキャリア上の制約を抱えやすいため、運転資金・設備資金に特別利率を適用し後押しする。\n\n【正答】特別利率の対象となる年齢要件は、若年者は35歳未満、高齢者は55歳以上。\n\n【誤答の検討】若年者を『30歳未満』とする選択肢、高齢者を『60歳以上』『65歳以上』とする選択肢は誤り。一般に高齢者雇用・支援の基準は60歳・65歳が多用されるため、本制度の『55歳以上』と混同させるひっかけになっている。創業支援では幅広い年齢層の起業を促す趣旨から、高齢者の基準が55歳とやや低めに設定されている点に注意。"},
  {id:"r7-pol-q20-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第20問",title:"第20問 設問2　貸付期間(運転資金・設備資金)",body:"新規開業・スタートアップ支援資金の貸付期間(いずれも据置期間5年以内)について、空欄AとBに入る組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：運転資金10年以内　B：設備資金15年以内"},{key:"イ",label:"A：運転資金10年以内　B：設備資金20年以内"},{key:"ウ",label:"A：運転資金20年以内　B：設備資金20年以内"},{key:"エ",label:"A：運転資金20年以内　B：設備資金25年以内"}],correct:"イ",explanation:"【制度の趣旨・背景】設備資金は投資回収に長期を要するため運転資金より長い償還期間が認められるのが政策金融の通例。\n\n【正答】貸付期間は、運転資金10年以内、設備資金20年以内(いずれも据置期間5年以内)。なお廃業歴等の一定要件に該当する場合、運転資金は15年以内となる特例もある。\n\n【誤答の検討】運転資金を『20年以内』とする選択肢は、設備資金より長く設定する点で不自然かつ誤り。設備資金を『15年以内』『25年以内』とする選択肢も誤り。『運転資金より設備資金の方が長い』という政策金融の一般原則(投資回収期間の長短に対応)から、運転10年・設備20年の組合せを導ける。"},
  {id:"r7-pol-q21-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第21問",title:"第21問 設問1　中小企業基本法(小規模企業への施策方針)",body:"中小企業基本法の小規模企業に関する施策方針について、【A】の確保が特に困難であることが多い小規模企業者の事情を踏まえ、小規模企業の【B】に努める、とする空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：経営資源　B：経営の発達及び改善"},{key:"イ",label:"A：経営資源　B：生産性の向上"},{key:"ウ",label:"A：労働力　B：経営の発達及び改善"},{key:"エ",label:"A：労働力　B：生産性の向上"}],correct:"ア",explanation:"【制度の趣旨・背景】中小企業基本法は中小企業政策の基本理念を定める法律。1999年の抜本改正で『多様で活力ある中小企業の成長発展』を理念に掲げ、さらに2013年改正で小規模企業への配慮を強化した(小規模企業基本法の制定もこの流れ)。小規模企業は経営資源(ヒト・モノ・カネ・情報)の確保が特に困難なため、特別の配慮を行うとされる。\n\n【正答】経営資源の確保が特に困難であることが多い小規模企業者の事情を踏まえ、小規模企業の経営の発達及び改善に努める(A＝経営資源、B＝経営の発達及び改善)。\n\n【誤答の検討】Aを『労働力』に限定する選択肢は、確保が困難なのは労働力だけでなく経営資源全般であるため狭すぎて誤り。Bを『生産性の向上』とする選択肢は、生産性向上は施策の手段・目標の一つではあるが、ここで法が掲げる文言は『経営の発達及び改善』であり、条文の趣旨(小規模企業の事業活動全体の底上げ)に照らして誤り。"},
  {id:"r7-pol-q21-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第21問",title:"第21問 設問2　中小企業の範囲(小売業)",body:"中小企業基本法における、小売業を主たる事業とする中小企業の範囲(資本金の額または出資の総額が【C】の会社、常時使用する従業員の数が【D】の会社・個人)について、空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"C：5,000万円以下　D：50人以下"},{key:"イ",label:"C：5,000万円以下　D：100人以下"},{key:"ウ",label:"C：1億円以下　D：50人以下"},{key:"エ",label:"C：1億円以下　D：100人以下"}],correct:"ア",explanation:"【制度の趣旨・背景】中小企業基本法の中小企業の範囲は、業種ごとに資本金基準『または』従業員基準のいずれかを満たせば該当する(両方を満たす必要はない)。業種で基準が異なるのは、必要資本や雇用規模の業種特性を反映するため。\n\n【正答】小売業の中小企業は『資本金5,000万円以下、または従業員50人以下』(C＝5,000万円以下、D＝50人以下)。\n\n【誤答の検討】資本金を『1億円以下』とする選択肢は卸売業の基準との混同で誤り。従業員を『100人以下』とする選択肢も卸売業・サービス業の基準との混同で誤り。整理すると——製造業その他＝3億円/300人、卸売業＝1億円/100人、サービス業＝5,000万円/100人、小売業＝5,000万円/50人。小売業は最も小さい基準(5,000万円・50人)である点を押さえる。"},
  {id:"r7-pol-q21-3",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第21問",title:"第21問 設問3　中小企業基本法(労働に関する施策)",body:"中小企業基本法の労働に関する施策で、国は中小企業における労働関係の【E】及び従業員の【F】の向上を図るため必要な施策を講ずる、とする空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"E：健全な発展　F：生活"},{key:"イ",label:"E：健全な発展　F：福祉"},{key:"ウ",label:"E：適正化　F：生活"},{key:"エ",label:"E：適正化　F：福祉"}],correct:"エ",explanation:"【制度の趣旨・背景】中小企業基本法は労働に関する施策として、中小企業で働く人の労働環境の整備と人材確保の両面を国の責務として定める。中小企業の人手不足・処遇格差への対応という政策思想を反映する。\n\n【正答】国は中小企業における労働関係の適正化及び従業員の福祉の向上を図るため必要な施策を講ずるとともに、必要な労働力確保のため職業能力開発・職業紹介事業の充実等を講ずる(E＝適正化、F＝福祉)。\n\n【誤答の検討】Eを『健全な発展』とする選択肢は、労働『関係』に対して用いる法文言としては『適正化』が正しく誤り。Fを『生活』とする選択肢も、条文は従業員の『福祉』の向上としており誤り。条文の語(労働関係の適正化／従業員の福祉)を正確に押さえることが求められる。"},
  {id:"r7-pol-q22-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第22問",title:"第22問 設問1　ものづくり補助金(要件A・B)",body:"ものづくり・商業・サービス生産性向上促進補助金の要件のうち、第1の要件は【A】の年平均成長率が【B】向上することである。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：売上高　B：1.5％以上"},{key:"イ",label:"A：売上高　B：3.0％以上"},{key:"ウ",label:"A：付加価値額　B：1.5％以上"},{key:"エ",label:"A：付加価値額　B：3.0％以上"}],correct:"エ",explanation:"【制度の趣旨・背景】ものづくり・商業・サービス生産性向上促進補助金(通称ものづくり補助金)は、中小企業・小規模事業者等が生産性向上につながる革新的な製品・サービス開発や生産プロセス改善のための設備投資等を行う際に支援する制度。日本の中小企業政策は近年、単なる延命・救済から『稼ぐ力＝付加価値の向上』へと軸足を移しており、その思想を反映して、補助の成果指標は売上規模ではなく付加価値額に置かれている。第1要件は『付加価値額の年平均成長率3.0％以上』。\n\n【なぜ付加価値額か(キーワードの意味)】付加価値額とは、企業が新たに生み出した価値であり、中小企業庁の定義では『営業利益＋人件費＋減価償却費』で算出する。売上高は原材料費など外部からの仕入を含むため『規模』は測れても『自社が生み出した価値』は測れない。賃上げ原資や労働生産性(付加価値÷従業員数)の向上を促すという政策目的からは、付加価値額を指標とするのが整合的である。\n\n【誤答の検討とキーワードの本来の意味】\n・売上高(誤):上記のとおり規模指標であり、仕入の増減でも変動するため生産性向上の成果指標としては不適切。\n・年平均成長率1.5％(誤):この1.5％は別制度である『中小企業向け賃上げ促進税制』で税額控除の入口となる『雇用者給与等支給額の前年度比1.5％以上増加』に登場する数値であり、ものづくり補助金の付加価値額要件(3.0％)とは別物。数値を取り違えさせる典型的なひっかけ。\n\n【類似制度との対比】事業再構築補助金やものづくり補助金など近年の主要な投資系補助金は、いずれも『付加価値額の年平均成長率』を成果要件に据える点で共通する。一方、賃上げ促進税制は『給与支給総額(雇用者給与等支給額)の増加率』を基準とし、対象指標が異なる。『付加価値額の成長率(補助金)』と『給与の増加率(税制)』を切り分けて覚えるとよい。"},
  {id:"r7-pol-q22-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第22問",title:"第22問 設問2　ものづくり補助金(要件C・D)",body:"ものづくり補助金の要件のうち、1人当たり給与支給総額の年平均成長率が最低賃金の直近5年の年平均成長率以上、または給与支給総額の年平均成長率が【C】向上すること、事業所内最低賃金が事業実施都道府県の最低賃金【D】の水準であること。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"C：1.0％以上　D：プラス20円以上"},{key:"イ",label:"C：1.0％以上　D：プラス30円以上"},{key:"ウ",label:"C：2.0％以上　D：プラス20円以上"},{key:"エ",label:"C：2.0％以上　D：プラス30円以上"}],correct:"エ",explanation:"【制度の趣旨・背景】ものづくり補助金は、生産性向上の成果を『企業が生み出す付加価値(設問1)』と『それを働き手へ還元する賃上げ(本設問)』の両面で求める。これは近年の『成長と分配の好循環』という政策思想を反映したもので、補助金で設備投資して生産性を上げたら、その果実を賃金として従業員に分配することを促す設計になっている。賃上げを補助要件に組み込むことで、政府の賃上げ促進策(最低賃金の引上げ・賃上げ促進税制等)と方向性を揃えている。\n\n【正しい要件】\n(1)1人当たり給与支給総額の年平均成長率が、事業実施都道府県における最低賃金の直近5年間の年平均成長率以上であること。または給与支給総額の年平均成長率が2.0％以上向上すること。\n(2)事業所内最低賃金が、事業実施都道府県における地域別最低賃金＋30円以上の水準であること。\n\n【誤答の検討とキーワードの本来の意味】\n・給与支給総額の年平均成長率1.0％(誤):ものづくり補助金の給与要件は2.0％以上であり、1.0％ではない。\n・地域別最低賃金プラス20円以上(誤):事業所内最低賃金の要件は『地域別最低賃金＋30円以上』。+20円は誤り。\n・『事業所内最低賃金』とは、その事業所で雇用する労働者に支払う賃金のうち最も低い時間額のこと。地域別最低賃金(最低賃金法に基づき都道府県ごとに毎年改定される、その地域で支払うべき賃金の下限)を下回らないのは当然として、補助金ではそれを一定額(＋30円)上回る水準を補助期間中維持することを求める。\n\n【関連・運用上の注意】最低賃金は最低賃金法に基づき毎年引き上げられており、補助金側もそれに連動して賃金の底上げを促す。これらの賃上げ要件(給与支給総額・事業所内最低賃金)を補助事業期間中に満たせなかった場合、原則として補助金の返還を求められることがあり、成果へのコミットメントが担保されている。"},
  {id:"r7-pol-q23-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第23問",title:"第23問 設問1　経営セーフティ共済(共済金借入額)",body:"経営セーフティ共済(中小企業倒産防止共済制度)で、取引先が倒産して売掛金等の回収が困難となった場合に借入れできる共済金の額に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"回収困難額と、積み立てた掛金総額の10倍のいずれか少ない額を借入れできる。ただし借入限度額は8,000万円。"},{key:"イ",label:"回収困難額と、掛金総額の10倍のいずれか少ない額を借入れできる。ただし借入限度額は1億2,000万円。"},{key:"ウ",label:"回収困難額を借入れできる。ただし借入限度額は6,000万円。"},{key:"エ",label:"回収困難額を借入れできる。ただし借入限度額は8,000万円。"},{key:"オ",label:"回収困難額を借入れできる。ただし借入限度額は1億2,000万円。"}],correct:"ア",explanation:"【制度の趣旨・背景】経営セーフティ共済(中小企業倒産防止共済制度)は、取引先の倒産による連鎖倒産・経営難を防ぐためのセーフティネット。掛金は法人なら損金、個人なら必要経費に算入でき、節税メリットを伴いつつ不測の事態に備える設計。\n\n【正答】共済金の借入額は『回収困難となった売掛金債権等の額』と『掛金総額の10倍』のいずれか少ない額。借入限度額は8,000万円。\n\n【誤答の検討】借入限度額を『6,000万円』『1億2,000万円』とする選択肢は誤り(正しくは8,000万円)。また『回収困難額をそのまま借入れできる』とのみ述べ『掛金総額の10倍』という上限に触れない選択肢も不正確で誤り。掛金を積み立てた範囲(10倍)でしか借りられないため、平時からの計画的な積立が重要になるという制度趣旨を押さえる。"},
  {id:"r7-pol-q23-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第23問",title:"第23問 設問2　経営セーフティ共済(借入条件)",body:"経営セーフティ共済の共済金の借入条件について、共済金の借入れには【B】であり、無利子だが【C】こととなっている。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"B：担保は不要だが経営者個人の連帯保証が必要　C：借入れた共済金の10分の1に相当する額が掛金総額から控除"},{key:"イ",label:"B：担保は不要だが経営者個人の連帯保証が必要　C：借入れの翌月から掛金が一定額増額"},{key:"ウ",label:"B：担保や保証人は不要　C：借入れた共済金の10分の1に相当する額が掛金総額から控除"},{key:"エ",label:"B：担保や保証人は不要　C：借入れの翌月から掛金が一定額増額"}],correct:"ウ",explanation:"【制度の趣旨・背景】中小企業が緊急時に迅速に資金を確保できるよう、共済金の借入れは手続を簡素化し担保・保証人を不要としている。一方で無利子だが、借入れには実質的なコストが伴う設計になっている。\n\n【正答】共済金の借入れは担保や保証人が不要(B)。無利子だが、借入れを受けると借入額の10分の1に相当する額が掛金総額から控除される(C)。\n\n【誤答の検討】『経営者個人の連帯保証が必要』とする選択肢は、担保・保証人不要という制度の趣旨に反し誤り。Cを『借入れの翌月から掛金が一定額増額される』とする選択肢も誤りで、正しくは『掛金総額からの控除』。つまり無利子の代わりに積み立てた掛金が目減りする形で実質的なコストを負担する仕組みである点を理解する。"},
  {id:"r7-pol-q24-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第24問",title:"第24問 設問1　中小企業向け賃上げ促進税制(対象)",body:"中小企業向け賃上げ促進税制の対象となるものの正誤の組み合わせとして、最も適切なものを選べ。\n\na　衣料品卸売業者(従業員数55人、資本金2億円の株式会社)\nb　和菓子製造小売業者(従業員数9人、個人事業、確定申告は青色申告)",options:[{key:"ア",label:"a：正　b：正"},{key:"イ",label:"a：正　b：誤"},{key:"ウ",label:"a：誤　b：正"},{key:"エ",label:"a：誤　b：誤"}],correct:"ウ",explanation:"【制度の趣旨・背景】中小企業向け賃上げ促進税制は、中小企業者等・個人事業主の賃上げを後押しするため、給与増加額に応じて法人税額(個人は所得税額)を控除する制度。『成長と分配の好循環』を税制面から支える。\n\n【正答の構成】aは誤り、bは正しい。\n\n【各記述とキーワードの意味】\n・a:衣料品卸売業者(従業員55人、資本金2億円の株式会社)——本税制の『中小企業者等』は原則として資本金1億円以下の法人等。資本金2億円は1億円超で中小企業者等に該当せず対象外(aが誤りの理由)。卸売業は中小企業基本法上は資本金1億円以下『または』従業員100人以下で中小企業に当たるが、この税制の判定は『資本金1億円以下』が基準であり、基本法の定義との違いがひっかけになっている。\n・b:和菓子製造小売業者(従業員9人、個人事業、青色申告)——青色申告の個人事業主は対象となる(bが正しい理由)。\n\n【類似制度との対比】『中小企業者等(税制上＝資本金1億円以下等)』と『中小企業基本法上の中小企業(業種別の資本金/従業員基準)』は定義が異なる。同じ『中小企業』でも、どの制度の定義かで該当・非該当が変わる点が最重要。"},
  {id:"r7-pol-q24-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第24問",title:"第24問 設問2　賃上げ促進税制(控除対象・控除率)",body:"中小企業向け賃上げ促進税制は【A】から税額を控除する制度で、雇用者給与等支給額を2.5％以上増加させた場合の控除率は控除対象雇用者給与等支給増加額の【B】である。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：事業税額　B：20％"},{key:"イ",label:"A：事業税額　B：30％"},{key:"ウ",label:"A：法人税額または所得税額　B：20％"},{key:"エ",label:"A：法人税額または所得税額　B：30％"}],correct:"エ",explanation:"【制度の趣旨・背景】賃上げ促進税制は、賃上げの度合いに応じて税額控除率を高め、教育訓練費の増加や子育て支援・女性活躍にも上乗せを設けることで、賃上げと人的投資を同時に促す。\n\n【正答】控除は法人税額(個人は所得税額)から行い、雇用者給与等支給額を2.5％以上増加させた場合の控除率は控除対象雇用者給与等支給増加額の30％(A＝法人税額または所得税額、B＝30％)。なお1.5％以上増加で15％、教育訓練費増加要件で＋10％、子育て・女性活躍支援要件で＋5％の上乗せがある。\n\n【誤答の検討】控除対象を『事業税額』とする選択肢は誤り(控除は法人税・所得税から)。Bを『20％』とする選択肢も誤りで、2.5％以上増加時は30％。賃上げ幅(1.5％→15％、2.5％→30％)と控除率の対応を正確に覚える。"},
  {id:"r7-pol-q25-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第25問",title:"第25問 設問1　中小企業成長加速化補助金(対象)",body:"中小企業成長加速化補助金は、賃上げ・輸出・地域経済への波及効果が大きい【A】を超える中小企業を目指す事業者の大胆な投資を支援する制度である。空欄Aに入る語句として最も適切なものはどれか。",options:[{key:"ア",label:"売上高50億円"},{key:"イ",label:"売上高100億円"},{key:"ウ",label:"営業利益5億円"},{key:"エ",label:"営業利益10億円"}],correct:"イ",explanation:"【制度の趣旨・背景】中小企業成長加速化補助金は、賃上げ・輸出による外需獲得・域内仕入による地域経済への波及効果が大きい、成長志向の中小企業の大胆な投資を支援する制度。単なる小規模支援ではなく『規模拡大による生産性向上』を後押しする近年の政策思想を体現する。\n\n【正答】売上高100億円を超える中小企業を目指す事業者が対象(A＝売上高100億円)。\n\n【誤答の検討】『売上高50億円』とする選択肢は基準額が異なり誤り。『営業利益5億円/10億円』とする選択肢は、本補助金が利益額ではなく売上高100億円という規模目標を掲げている点に反し誤り。『100億宣言』など売上高100億円を一つの成長の到達点とする近年の政策の流れと結びつける。"},
  {id:"r7-pol-q25-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第25問",title:"第25問 設問2　成長加速化補助金(補助上限・補助率)",body:"中小企業成長加速化補助金の補助上限額は【B】、補助率は【C】と定められている。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"B：2億円　C：2分の1"},{key:"イ",label:"B：2億円　C：3分の2"},{key:"ウ",label:"B：5億円　C：2分の1"},{key:"エ",label:"B：5億円　C：3分の2"}],correct:"ウ",explanation:"【制度の趣旨・背景】大胆な投資を促すため、成長加速化補助金は補助上限額・補助率とも手厚く設定されている。\n\n【正答】補助上限額は5億円、補助率は2分の1(B＝5億円、C＝2分の1)。\n\n【誤答の検討】補助上限を『2億円』とする選択肢は、大規模投資を支援するという制度趣旨に照らして過小で誤り。補助率を『3分の2』とする選択肢も誤りで、本補助金は2分の1。補助率2分の1は『投資の半分は自己負担し、本気の投資にコミットさせる』という設計思想を反映している。"},
  {id:"r7-pol-q26-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第26問",title:"第26問 設問1　信用保証制度(一般保証の限度額)",body:"信用保証制度の一般保証の限度額について、普通保証が【A】、【B】が8,000万円以内となっている。空欄の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"A：1億円以内　B：無担保保証"},{key:"イ",label:"A：1億円以内　B：無担保無保証人保証"},{key:"ウ",label:"A：2億円以内　B：無担保保証"},{key:"エ",label:"A：2億円以内　B：無担保無保証人保証"}],correct:"ウ",explanation:"【制度の趣旨・背景】信用保証制度は、信用力・担保力に乏しい中小企業が金融機関から融資を受けやすくするため、信用保証協会が債務を保証する仕組み。中小企業金融の根幹を支える。\n\n【正答】一般保証の限度額は、普通保証が2億円以内、無担保保証が8,000万円以内(A＝2億円以内、B＝無担保保証)。両者あわせて2億8,000万円が上限。\n\n【誤答の検討】普通保証を『1億円以内』とする選択肢は限度額が異なり誤り。Bを『無担保無保証人保証』とする選択肢も用語の取り違えで誤り。『普通保証(担保あり想定)＝2億円』『無担保保証＝8,000万円』という二本立てを区別する。なお経営者保証を不要とする流れ(経営者保証ガイドライン等)は別の論点で、ここでの『無担保保証』とは混同しない。"},
  {id:"r7-pol-q26-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第26問",title:"第26問 設問2　セーフティネット保証",body:"セーフティネット保証制度の利用に必要な認定機関【C】と、その保証限度額【D】の組み合わせとして最も適切なものはどれか。",options:[{key:"ア",label:"C：市町村長または特別区長　D：一般保証の枠内で、保証料は減免"},{key:"イ",label:"C：市町村長または特別区長　D：一般保証枠とは別枠"},{key:"ウ",label:"C：都道府県知事　D：一般保証の枠内で、保証料は減免"},{key:"エ",label:"C：都道府県知事　D：一般保証枠とは別枠"}],correct:"イ",explanation:"【制度の趣旨・背景】セーフティネット保証は、取引先倒産や自然災害など経済環境の急変で経営が悪化した中小企業を救済するための別枠保証。平時の一般保証とは別枠で確保することで、危機時に資金繰りを下支えする。\n\n【正答】利用には事業所所在地の市町村長または特別区長の認定が必要で、保証限度額は一般保証枠とは別枠(C＝市町村長または特別区長、D＝一般保証枠とは別枠)。\n\n【誤答の検討】認定機関を『都道府県知事』とする選択肢は誤り(認定は市区町村長)。Dを『一般保証の枠内で保証料を減免』とする選択肢も誤りで、ポイントは『別枠』であること——別枠だからこそ既存借入があっても危機時に追加で保証を受けられる。危機対応のための上乗せ枠という性格を押さえる。"},
  {id:"r7-pol-q27",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第27問",title:"第27問　交際費等の損金算入の特例",body:"交際費等の損金不算入の特例について、【A】は800万円までの交際費等の【B】の損金算入、または接待飲食費の50％の損金算入の選択適用が認められている。空欄の組み合わせとして最も適切なものを選べ。",options:[{key:"ア",label:"A：資本金または出資金の額が1億円以下の法人　B：50％"},{key:"イ",label:"A：資本金または出資金の額が1億円以下の法人　B：全額"},{key:"ウ",label:"A：中小企業基本法に定める中小企業に該当する法人　B：50％"},{key:"エ",label:"A：中小企業基本法に定める中小企業に該当する法人　B：全額"}],correct:"イ",explanation:"【制度の趣旨・背景】交際費等は原則として損金不算入(課税所得から差し引けない)とされる。これは交際費の濫用的支出を抑制する趣旨。ただし中小法人には経営上の必要性に配慮した特例が設けられている。\n\n【キーワードの意味】交際費等＝得意先・仕入先など事業関係者への接待・贈答等のための支出。\n\n【正答】資本金または出資金の額が1億円以下の法人(税法上の中小法人)は、年800万円までの交際費等の全額を損金算入できる(または接待飲食費の50％損金算入との選択適用)(A＝資本金1億円以下の法人、B＝全額)。ただし大法人の100％子会社等は対象外。\n\n【誤答の検討】Bを『50％』とする選択肢は、800万円までの定額控除は『全額』であり誤り(50％は接待飲食費基準の方の率)。Aを『中小企業基本法に定める中小企業』とする選択肢は、税法上の中小法人(資本金1億円以下)と基本法上の中小企業(業種別基準)を混同させるひっかけで誤り。Q24と同様、『どの法律の定義か』で判定が変わる点が問われる。"},
  {id:"r7-pol-q28",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第28問",title:"第28問　地域経済牽引事業(根拠法)",body:"都道府県による地域経済牽引事業計画の承認を受けた事業者が、地域の特性を生かして高い付加価値を創出し地域に経済的効果を及ぼす地域経済牽引事業を行う際、各種優遇措置・課税の特例・金融支援・規制の特例等を受けることができる根拠となる法律として、最も適切なものを選べ。",options:[{key:"ア",label:"多極分散型国土形成促進法"},{key:"イ",label:"地域再生法"},{key:"ウ",label:"地域未来投資促進法"},{key:"エ",label:"中小企業等経営強化法"}],correct:"ウ",explanation:"【制度の趣旨・背景】地域経済牽引事業計画は、地域の特性(自然・観光・ものづくり等)を生かして高い付加価値を創出し、地域の事業者へ相当の経済的波及効果を及ぼす事業を、都道府県が承認して支援する仕組み。地域全体の稼ぐ力を高める政策思想に基づく。\n\n【正答】根拠法は地域未来投資促進法。承認を受けた事業者は、予算事業の加点・優遇、課税の特例、金融支援、規制の特例措置等を受けられる。\n\n【誤答の検討(類似法令の整理)】\n・地域再生法:地域再生計画に基づく支援で、地方創生の総合的な枠組み。地域経済牽引事業の直接の根拠ではない。\n・中小企業等経営強化法:経営力向上計画・先端設備等導入計画等の根拠法で、個社の経営強化が中心。地域全体への波及を狙う本制度とは目的が異なる。\n・多極分散型国土形成促進法:国土の均衡ある発展を図る古い法律で、本制度とは無関係。\n似た名称・目的の地域系・中小企業系の法律が並ぶため、『地域の牽引事業＝地域未来投資促進法』と直結させて覚える。"},
  {id:"r7-pol-q29-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第29問",title:"第29問 設問1　経営革新計画(該当する事業内容)",body:"経営革新計画の「新たな事業活動(該当する事業内容)」に関する記述の正誤の組み合わせとして、最も適切なものを選べ。\n\na　商品の新たな販売方式の導入は対象となる。\nb　自社にとって新しいものであれば、他社で採用されているものも対象となる。",options:[{key:"ア",label:"a：正　b：正"},{key:"イ",label:"a：正　b：誤"},{key:"ウ",label:"a：誤　b：正"},{key:"エ",label:"a：誤　b：誤"}],correct:"ア",explanation:"【制度の趣旨・背景】経営革新計画は、中小企業が『新たな事業活動』により経営の相当程度の向上を図る計画を都道府県知事等が承認し、政策金融・信用保証の特例等で支援する制度(中小企業等経営強化法に基づく)。新規性のハードルは『自社にとっての新しさ』に置かれている点が特徴。\n\n【正答の構成】aは正しい、bは正しい。\n\n【各記述の検討】\n・a:『新たな事業活動』には、(1)新商品の開発・生産、(2)新役務の開発・提供、(3)商品の新たな生産・販売方式の導入、(4)役務の新たな提供方式の導入等が含まれる。商品の新たな販売方式の導入も対象となる(aが正しい)。\n・b:新規性の判断は『当該中小企業者にとって』新しいかどうかが基準であり、他社で既に採用されている技術・方式でも、自社にとって新しければ対象となる(bが正しい)。これは大企業並みの全国初の新規性を求めず、中小企業の現実的な革新を後押しする趣旨。"},
  {id:"r7-pol-q29-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第29問",title:"第29問 設問2　経営革新計画(経営目標の指標)",body:"経営革新計画では、3〜5年の事業期間において【　】または従業員1人当たりの【　】が年率3.0％以上伸び、かつ給与支給総額が年率1.5％以上伸びる計画であることが求められる。空欄に入る指標として最も適切なものはどれか。",options:[{key:"ア",label:"売上高"},{key:"イ",label:"営業利益"},{key:"ウ",label:"設備投資額"},{key:"エ",label:"付加価値額"}],correct:"エ",explanation:"【制度の趣旨・背景】経営革新計画では、経営の向上を客観的に測る指標として『付加価値額』と『給与支給総額』を用いる。単なる売上拡大ではなく、生み出した価値と従業員への分配の両方を高めることを求める。\n\n【正答】3〜5年の事業期間において、付加価値額または従業員1人当たりの付加価値額が年率3.0％以上伸び、かつ給与支給総額が年率1.5％以上伸びる計画であることが必要(空欄＝付加価値額)。\n\n【誤答の検討】『売上高』とする選択肢は、規模(売上)ではなく生み出した価値(付加価値)を重視する制度趣旨に反し誤り。『営業利益』『設備投資額』とする選択肢も、経営革新計画の目標指標は付加価値額であり誤り。なお付加価値額＝営業利益＋人件費＋減価償却費。ものづくり補助金(Q22)も付加価値額の年率3.0％を要件としており、近年の支援策が共通して付加価値を成果指標に据えている点を押さえる。"},
  {id:"r7-pol-q30-1",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第30問",title:"第30問 設問1　事業承継税制(猶予される税)",body:"事業承継税制では、円滑化法に基づく認定の下で、会社や個人事業者の後継者が取得した一定の資産について、【　】の納税が猶予される。空欄に入る語句として最も適切なものはどれか。",options:[{key:"ア",label:"固定資産税"},{key:"イ",label:"固定資産税・登録免許税"},{key:"ウ",label:"贈与税・相続税"},{key:"エ",label:"贈与税・相続税・固定資産税"},{key:"オ",label:"贈与税・相続税・登録免許税"}],correct:"ウ",explanation:"【制度の趣旨・背景】事業承継税制は、後継者不足による廃業・事業の散逸を防ぐため、『中小企業における経営の承継の円滑化に関する法律(円滑化法)』の認定を前提に、承継した資産に係る税の納税を猶予・免除する制度。経営者の世代交代を税制面から後押しする。\n\n【正答】会社の株式や個人事業者の事業用資産を後継者が取得した際の贈与税・相続税の納税が猶予される(空欄＝贈与税・相続税)。活用には特例承継計画または個人事業承継計画の提出が必要。\n\n【誤答の検討】『固定資産税』『登録免許税』を含める選択肢は誤り。事業承継税制が猶予するのは、承継時に多額となり承継の障害になりやすい贈与税・相続税であり、保有期間中に毎年課される固定資産税や登記時の登録免許税は対象ではない。『承継のタイミングで重くのしかかる税(贈与税・相続税)を猶予する』という制度の狙いから判断できる。"},
  {id:"r7-pol-q30-2",exam:"中小企業診断士",year:"R7",subject:"中小企業経営・政策",examLabel:"R7 中小企業経営・政策",parent:"第30問",title:"第30問 設問2　法人版事業承継税制の特例措置",body:"法人版事業承継税制の特例措置(平成30年度税制改正で創設、10年間)に関する記述の正誤の組み合わせとして、最も適切なものを選べ。\n\na　納税猶予の対象となる非上場株式などの株式数の上限が撤廃され、全株式が対象となった。\nb　後継者1人への承継のみが対象であったものが、最大3人への承継に緩和された。",options:[{key:"ア",label:"a：正　b：正"},{key:"イ",label:"a：正　b：誤"},{key:"ウ",label:"a：誤　b：正"},{key:"エ",label:"a：誤　b：誤"}],correct:"ア",explanation:"【制度の趣旨・背景】法人版事業承継税制は平成30年度改正で抜本拡充され、従来の一般措置に加えて10年間限定の特例措置が創設された。利用には特例承継計画の提出が必要で、より使いやすい要件に緩和された。\n\n【正答の構成】aは正しい、bは正しい。\n\n【各記述の検討】\n・a:一般措置では納税猶予の対象が発行済株式総数の3分の2までだったが、特例措置では株式数の上限が撤廃され全株式が対象となった(aが正しい)。\n・b:一般措置では後継者1人への承継のみが対象だったが、特例措置では代表権を持つ最大3人の後継者への承継が対象に緩和された(bが正しい)。\n\n【補足】特例措置はさらに、雇用確保要件(承継後5年平均で雇用8割維持)の実質緩和、納税猶予割合の引上げ(贈与・相続とも対象株式に係る税の100％猶予)など、一般措置より大幅に使いやすい。ただし期間限定(特例承継計画の提出と期限内の承継)である点に注意。"},

const QUESTIONS_FIN = [
  {id:"r7-fin-q1",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第1問",title:"第1問　貸倒引当金繰入(販売費及び一般管理費)",body:"以下の資料に基づき、貸倒引当金に関する当期の決算整理で計上される貸倒引当金繰入のうち、損益計算書における販売費及び一般管理費に含まれる金額として、最も適切なものを下記の解答群から選べ。\n\n【資料】\n・決算整理前残高試算表の借方には、売掛金が10,000,000円、営業活動から生じた未収入金が4,000,000円、短期貸付金が5,000,000円計上されている。これらはいずれも当期に生じたもので、期首にあった売掛金等は全額回収済み。\n・決算整理前残高試算表の貸方には、貸倒引当金が50,000円計上されている。これはすべて前期末に売掛金について設定された貸倒引当金の残額。\n・売掛金の期末残高に対しては2%、未収入金と短期貸付金の期末残高に対しては20%の貸倒れを見積もる。\n・差額補充法を採用。",options:[{key:"ア",label:"200,000円"},{key:"イ",label:"950,000円"},{key:"ウ",label:"1,000,000円"},{key:"エ",label:"1,150,000円"}],correct:"イ",explanation:"販売費及び一般管理費に含まれるのは「営業活動から生じた債権」の貸倒見積額。\n・売掛金:10,000,000×2%=200,000円。期首引当金50,000円(売掛金分)を差し引き、繰入は200,000-50,000=150,000円(販管費)。\n・営業未収入金:4,000,000×20%=800,000円(販管費、期首引当金なし)。\n・販管費合計:150,000+800,000=950,000円。\n短期貸付金分(5,000,000×20%=1,000,000円)は営業外費用となり販管費に含まれない。"},
  {id:"r7-fin-q2",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第2問",title:"第2問　会社法における計算書類および会計帳簿",body:"会社法における計算書類および会計帳簿に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"会計帳簿は、書面をもって作成しなければならない。"},{key:"イ",label:"株式会社が作成しなければならない計算書類とは、貸借対照表、損益計算書および包括利益計算書である。"},{key:"ウ",label:"株式会社は、会計帳簿の閉鎖の時から3年間、その会計帳簿を保存しなければならない。"},{key:"エ",label:"取締役会設置会社においては、定時株主総会の招集の通知に際して、取締役会で承認を受けた計算書類を株主に提供しなければならない。"}],correct:"エ",explanation:"ア 誤:会計帳簿は電磁的記録による作成も認められる。\nイ 誤:会社法上の計算書類は「貸借対照表・損益計算書・株主資本等変動計算書・個別注記表」。包括利益計算書は連結財務諸表の範疇で会社法計算書類ではない。\nウ 誤:会計帳簿の保存期間は10年間(会社法432条2項)。\nエ 正:取締役会設置会社では計算書類等を株主に提供する義務がある(会社法437条)。"},
  {id:"r7-fin-q3",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第3問",title:"第3問　法人税の所得金額と消費税の納付税額",body:"以下の資料に基づき、法人税が課される所得金額と消費税および地方消費税の納付税額として、最も適切なものを下記の解答群から選べ。なお、税抜経理方式を採用、期首在庫・中間納付税額はゼロ、消費税の課税事業者だが簡易課税は選択していない。\n\n【資料】\n・1個1,100円(消費税100円含む)の商品を1,000個仕入れ、現金で支払った。\n・仕入れた商品のうち800個を期中に1個1,650円(消費税150円含む)で販売、現金で受け取った。\n・期末在庫は200個。",options:[{key:"ア",label:"消費税の納付税額は20,000円である。"},{key:"イ",label:"消費税の納付税額は40,000円である。"},{key:"ウ",label:"所得金額は200,000円である。"},{key:"エ",label:"所得金額は440,000円である。"}],correct:"ア",explanation:"【消費税(税抜経理)】\n受取消費税 = 800×150 = 120,000円\n支払消費税 = 1,000×100 = 100,000円\n納付税額 = 120,000-100,000 = 20,000円(納付税額20,000円が正しい)。\n\n【所得金額(税抜)】\n売上(税抜) = 800×1,500 = 1,200,000円\n売上原価(税抜・販売分のみ) = 800×1,000 = 800,000円\n所得金額 = 1,200,000-800,000 = 400,000円(200,000円・440,000円という記述は誤り)。"},
  {id:"r7-fin-q4",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第4問",title:"第4問　中小企業の会計に関する指針(棚卸資産)",body:"「中小企業の会計に関する指針」における棚卸資産に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"借り入れた資金で商品を購入した場合、借入日から商品購入日までの利息をその商品の取得原価に算入することができる。"},{key:"イ",label:"棚卸資産に係る簿価切下額のうち、臨時の事象に起因し、かつ、多額であるものは、損益計算書上、特別損失として表示する。"},{key:"ウ",label:"棚卸資産の評価基準としては、個別法、後入先出法、総平均法、移動平均法などが挙げられる。"},{key:"エ",label:"棚卸資産は原則として期末における時価をもって、貸借対照評価額とすることが求められている。"}],correct:"イ",explanation:"ア 誤:借入金利息は原則として取得原価に算入しない(期間費用)。\nイ 正:臨時かつ多額の簿価切下額は特別損失として表示する。\nウ 誤:後入先出法は会計基準で廃止されており評価基準として認められていない。先入先出法・個別法・総平均法・移動平均法・売価還元法などが用いられる。\nエ 誤:棚卸資産は原則として取得原価をもって貸借対照表価額とし、収益性の低下が認められる場合に正味売却価額まで切り下げる。"},
  {id:"r7-fin-q5",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第5問",title:"第5問　固定資産",body:"固定資産に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"資産計上したソフトウェアは、減損処理の対象とはならない。"},{key:"イ",label:"ソフトウェアは、CD-ROMで購入する場合であっても、無形固定資産に属する。"},{key:"ウ",label:"無形固定資産の償却方法は一律に定率法であるが、有形固定資産の減価償却方法には、定額法なども認められている。"},{key:"エ",label:"有形固定資産・無形固定資産ともに、貸借対照表において、取得原価から減価償却累計額を控除する形式で表示することができる。"}],correct:"イ",explanation:"ア 誤:資産計上したソフトウェアも減損会計の対象。\nイ 正:CD-ROM等の媒体で購入してもソフトウェアそのものは無形固定資産。\nウ 誤:無形固定資産の償却は原則として定額法(残存価額ゼロ)。\nエ 誤:有形固定資産は取得原価-減価償却累計額の間接控除形式が一般的だが、無形固定資産は減価償却累計額を直接控除した残額で表示するのが原則。"},
  {id:"r7-fin-q6",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第6問",title:"第6問　繰延資産",body:"繰延資産に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"会社設立時にかかった株式発行費用と新株発行時にかかった株式発行費用を繰延資産とする場合には、株式交付費に含める。"},{key:"イ",label:"会社の設立のためにかかった費用や開業準備にかかった費用は、繰延資産に属する創立費として資産計上することができる。"},{key:"ウ",label:"研究開発費は発生時に費用化することが求められているため、開発費は繰延資産とすることができない。"},{key:"エ",label:"支出の効果が期待されなくなった繰延資産は、未償却残高を一時に償却する。"}],correct:"エ",explanation:"ア 誤:会社設立時の株式発行費は「創立費」、設立後の新株発行費用が「株式交付費」。\nイ 誤:設立費用は創立費だが、開業準備費用は別項目「開業費」として繰延資産計上。\nウ 誤:研究開発費は発生時費用化が必要だが、それとは別に「開発費」(新技術・新経営組織の採用、資源の開発、市場の開拓等)は繰延資産として計上可能。\nエ 正:効果が期待されなくなった繰延資産は未償却残高を一時に償却する。"},
  {id:"r7-fin-q7",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第7問",title:"第7問　投資有価証券売却益(移動平均法)",body:"以下の投資有価証券に関する資料に基づき、当期の投資有価証券売却益として、最も適切なものを下記の解答群から選べ。\n\n【資料】\n・A社株式を長期保有目的で保有(1,000株)。\n・当期に800株を1株700円で売却。\n・購入履歴:\n  ├ 7期前 300株を1株500円で購入\n  ├ 5期前 500株を1株660円で購入\n  └ 3期前 200株を1株650円で購入\n・前期までに減損なし。\n・前期末株価620円。\n・移動平均法を採用。",options:[{key:"ア",label:"64,000円"},{key:"イ",label:"72,000円"},{key:"ウ",label:"80,000円"},{key:"エ",label:"90,000円"}],correct:"イ",explanation:"移動平均法で順次平均単価を更新する。\n300株、150,000円、平均500円\n→ 300+500=800株、150,000+330,000=480,000円、平均600円\n→ 800+200=1,000株、480,000+130,000=610,000円、平均610円\n\n売却800株の売却原価 = 800×610 = 488,000円\n売却収入 = 800×700 = 560,000円\n売却益 = 560,000-488,000 = 72,000円。"},
  {id:"r7-fin-q8",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第8問",title:"第8問　営業損益計算の区分",body:"損益計算書項目のうち、営業損益計算の区分に含まれるものとして、最も適切なものはどれか。",options:[{key:"ア",label:"国庫補助金受贈益"},{key:"イ",label:"支払利息"},{key:"ウ",label:"のれん償却"},{key:"エ",label:"有価証券利息"}],correct:"ウ",explanation:"ア 誤:国庫補助金受贈益は特別利益。\nイ 誤:支払利息は営業外費用。\nウ 正:のれん償却は販売費及び一般管理費(営業損益計算の区分)に表示する。\nエ 誤:有価証券利息は営業外収益。"},
  {id:"r7-fin-q9",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第9問",title:"第9問　税効果会計",body:"税効果会計に関する記述として、最も適切なものはどれか。法人税等の実効税率を30%として計算。繰延税金資産の回収可能性は考慮しない。",options:[{key:"ア",label:"期首に備品を購入し、減価償却方法を定額法とすると、取得原価10,000千円、残存価額1,000千円、会計上の耐用年数が5年、税務上の耐用年数が4年の場合、1年目の終わりには135千円の繰延税金負債が計上される。"},{key:"イ",label:"期首に備品を購入し、減価償却方法を定額法とすると、取得原価10,000千円、残存価額1,000千円、会計上の耐用年数が5年、税務上の耐用年数が6年の場合、1年目の終わりには90千円の繰延税金負債が計上される。"},{key:"ウ",label:"前期に計上した賞与引当金3,000千円が全額損金不算入となり、繰延税金資産が900千円計上されていたとする。当期末に賞与引当金3,300千円を設定し、同額が損金不算入になった場合、繰延税金資産は90千円だけ増加することになる。"},{key:"エ",label:"当期に積立金方式による圧縮記帳を行ったことにより将来減算一時差異が10,000千円生じた場合、当期末には3,000千円の繰延税金資産が計上される。"}],correct:"ウ",explanation:"ア 誤:税務上の耐用年数の方が短いケースでは、会計上の耐用年数で償却すれば税務上もその金額しか損金算入されず、一時差異は発生しない(損金経理が前提)。\nイ 誤:会計上1,800、税務上1,500で会計の方が大きく、超過300は損金不算入→将来減算一時差異→繰延税金「資産」90千円(負債ではない)。\nウ 正:当期末の繰延税金資産=3,300×30%=990千円。前期末900千円から90千円増加。\nエ 誤:積立金方式の圧縮記帳は将来「加算」一時差異→繰延税金「負債」3,000千円が計上される。"},
  {id:"r7-fin-q10",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第10問",title:"第10問　連結財務諸表",body:"連結財務諸表に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"親会社の当期純利益が1,000百万円、子会社の当期純利益が500百万円。親会社が子会社の普通株式の70%を保有しているので、当期の連結損益計算書の当期純利益は1,350百万円である。"},{key:"イ",label:"親会社は子会社に対して売掛金を500百万円保有、子会社が親会社に対して売掛金を100百万円保有。他社に対する売掛金がないので、連結貸借対照表における売掛金は両者を相殺して400百万円である。"},{key:"ウ",label:"当期(4月1日〜3月31日)の10月1日に他社を買収し、10月1日時点で生じたのれんが200百万円。のれんを10年で償却する場合、当期の連結損益計算書におけるのれん償却は20百万円である。"},{key:"エ",label:"当期(4月1日〜3月31日)の12月1日に普通株式の70%を取得して他社を買収し、12月1日時点の非支配株主持分が500百万円。買収後の子会社の当期純利益が100百万円なので、当期末の連結貸借対照表における非支配株主持分は530百万円になる。"}],correct:"エ",explanation:"ア 誤:連結の「当期純利益」は親+子を単純合算した1,500百万円。1,350は「親会社株主に帰属する当期純利益」。\nイ 誤:親子間の債権債務は全額相殺消去。連結売掛金=500+100全額相殺で連結上はゼロ(対外売掛金がないため)。\nウ 誤:のれん償却=200÷10=20/年。10/1取得なので当期は6か月分=20×6/12=10百万円。\nエ 正:期末の非支配株主持分=取得時500+(子会社利益100×30%)=500+30=530百万円。"},
  {id:"r7-fin-q11",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第11問",title:"第11問　材料の原価差異(先入先出法)",body:"以下の材料に関する資料に基づき、当月の原価差異として、最も適切なものを下記の解答群から選べ。\n\n【資料】\n・予定消費価格は@1,100円、実際消費額の計算は先入先出法。\n・前月繰越高:200,000千円(200千個、@1,000円)\n・当月購入高:960,000千円(800千個、@1,200円)\n・当月消費数量:850千個(直接材料800千個、間接材料50千個)\n・棚卸減耗なし。",options:[{key:"ア",label:"15,000千円"},{key:"イ",label:"45,000千円"},{key:"ウ",label:"55,000千円"},{key:"エ",label:"60,000千円"}],correct:"イ",explanation:"予定消費額 = 850千個 × @1,100 = 935,000千円\n\n実際消費額(先入先出法):\n・前月繰越200千個 × @1,000 = 200,000千円\n・当月購入から650千個 × @1,200 = 780,000千円\n・合計 = 980,000千円\n\n原価差異 = 予定 - 実際 = 935,000 - 980,000 = -45,000千円(不利差異)\n金額の絶対値で45,000千円。"},
  {id:"r7-fin-q12",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第12問",title:"第12問　平均法による完成品原価",body:"以下の資料に基づき、平均法による完成品原価として、最も適切なものを下記の解答群から選べ。\n\n【生産データ】\n・月初仕掛品 50個(40%)\n・当月投入 150個\n・正常仕損 10個 (工程終点で発生)\n・月末仕掛品 30個(40%)\n・完成品 160個\n\n【原価データ】\n・月初仕掛品: 直接材料費98,000円 / 加工費52,000円\n・当月投入: 直接材料費302,000円 / 加工費403,000円\n\n材料は工程始点投入。正常仕損の処理は度外視法、負担関係は進捗度による。",options:[{key:"ア",label:"720,000円"},{key:"イ",label:"726,750円"},{key:"ウ",label:"757,894円"},{key:"エ",label:"765,000円"}],correct:"エ",explanation:"正常仕損は終点発生(進捗度100%)、月末仕掛品の進捗度40%より進んでいるので完成品のみが負担。\n\n【直接材料費(始点投入)】\n材料費合計 = 98,000+302,000 = 400,000円\n単価 = 400,000÷200個 = 2,000円(完成品160+仕損10+月末30=200個で按分)\n完成品=160×2,000+仕損10×2,000=320,000+20,000=340,000円\n月末=30×2,000=60,000円\n\n【加工費】\n加工費合計 = 52,000+403,000 = 455,000円\n換算量:完成品160 + 仕損10(終点100%) + 月末12(30×40%) = 182\n単価 = 455,000÷182 = 2,500円\n完成品=160×2,500+仕損10×2,500=400,000+25,000=425,000円\n\n完成品原価合計 = 340,000+425,000 = 765,000円。"},
  {id:"r7-fin-q13",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第13問",title:"第13問　営業レバレッジ",body:"営業レバレッジ(オペレーティング・レバレッジ)に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"営業レバレッジが低い企業は、営業レバレッジが高い企業に比べて、売上高が減少しても利益が減少しにくい状態であるといえる。"},{key:"イ",label:"営業レバレッジの状況は、営業利益と当期純利益から把握できる。"},{key:"ウ",label:"営業レバレッジは、一般的に、製造業の企業よりも小売業の企業の方が高くなる傾向にある。"},{key:"エ",label:"営業レバレッジは、固定費を削減して変動費を増やすことによって高めることができる。"}],correct:"ア",explanation:"営業レバレッジ = 限界利益÷営業利益。固定費比率が高いほど大きくなる。\nア 正:営業レバレッジが低い=固定費比率が低い=売上変動による利益変動が小さい。\nイ 誤:営業レバレッジは限界利益と営業利益の関係で把握(当期純利益ではなく)。\nウ 誤:設備投資が大きい製造業の方が固定費比率が高く、営業レバレッジは高い傾向。\nエ 誤:固定費を増やし変動費を減らすほど営業レバレッジは高くなる(逆の関係)。"},
  {id:"r7-fin-q14",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第14問",title:"第14問　リース料の最低額",body:"Xリース社は第14期首に500万円の機械を購入し、同日得意先に5年間リースを行う予定。耐用年数5年、残存価額ゼロ、定額法。第14期から毎期均一のリース料を毎期末に受け取る契約。要求収益率4%。毎期のリース料の最低額として、最も適切なものを下記の解答群から選べ。\n\n年金現価係数(5年):2%=4.71、3%=4.57、4%=4.45、5%=4.32",options:[{key:"ア",label:"106万円"},{key:"イ",label:"109万円"},{key:"ウ",label:"113万円"},{key:"エ",label:"116万円"}],correct:"ウ",explanation:"毎期のリース料をRとすると、要求収益率4%でR×4.45 ≥ 500万円。\nR ≥ 500÷4.45 ≒ 112.36万円。\n選択肢の中で112.36万円以上の最低額は113万円。\n検算:113×4.45 = 502.85万円 ≥ 500万円(OK)、112×4.45 = 498.4万円 < 500万円(NG)。"},
  {id:"r7-fin-q15",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第15問",title:"第15問　資本コストのリスクプレミアム",body:"資本コストのリスクプレミアムに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"不確実な投資プロジェクトの評価に確実性等価法を適用する場合、キャッシュフローの不確実性を、割引率として用いる資本コストのリスクプレミアムで調整する。"},{key:"イ",label:"負債が増大するにつれて、債務不履行リスクが大きくなる場合、負債の資本コストのリスクプレミアムには、債務不履行リスクが反映される。"},{key:"ウ",label:"負債による資金調達を行っている企業の株主資本コストは、リスクフリー・レートと財務リスクプレミアムで構成されている。"},{key:"エ",label:"ポートフォリオ理論によれば、株主資本コストのリスクプレミアムには、市場リスクが反映されていない。"}],correct:"イ",explanation:"ア 誤:確実性等価法は分子(キャッシュフロー)を確実性等価額に調整し、分母はリスクフリーレートで割り引く方法。割引率のリスクプレミアムで調整するのはリスク調整割引率法。\nイ 正:負債コストには債務不履行リスク(信用リスクプレミアム)が反映される。\nウ 誤:株主資本コスト=リスクフリーレート+ビジネスリスクプレミアム+財務リスクプレミアム。\nエ 誤:CAPMによれば株主資本コストのリスクプレミアムは市場リスク(システマティックリスク=β)を反映する。"},
  {id:"r7-fin-q16",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第16問",title:"第16問　加重平均資本コスト(WACC)",body:"以下のデータに基づき、毎期一定額の配当を行っている当社の加重平均資本コストを計算したとき、最も適切なものを下記の解答群から選べ。株主資本コストは配当割引モデルによって求める。\n\n・負債(時価)5,000万円、株主資本(時価)5,000万円\n・発行済株式数100万株、毎期1株当たり配当金5円\n・税引前負債コスト4%、実効税率30%",options:[{key:"ア",label:"5.6%"},{key:"イ",label:"6.4%"},{key:"ウ",label:"6.5%"},{key:"エ",label:"7%"}],correct:"イ",explanation:"1株当たり時価 = 5,000万円÷100万株 = 50円。\n配当割引モデル(定額配当):株主資本コスト = D/P = 5÷50 = 10%。\n税引後負債コスト = 4%×(1-0.30) = 2.8%。\nWACC = (5,000/10,000)×10% + (5,000/10,000)×2.8% = 5%+1.4% = 6.4%。"},
  {id:"r7-fin-q17",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第17問",title:"第17問　正味現在価値(NPV)",body:"Y社の投資案。初期投資2,200万円(第1期首)、第1期末CF=1,100万円、第2期末CF=2,200万円。経済命数2年、資本コスト6%、税金なし。NPVとして最も適切なものを選べ。\n\n複利現価係数(6%):1年=0.94、2年=0.88",options:[{key:"ア",label:"737万円"},{key:"イ",label:"770万円"},{key:"ウ",label:"825万円"},{key:"エ",label:"902万円"}],correct:"イ",explanation:"NPV = -2,200 + 1,100×0.94 + 2,200×0.88\n   = -2,200 + 1,034 + 1,936\n   = 770万円。"},
  {id:"r7-fin-q18",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第18問",title:"第18問　新規投資案のNPV",body:"Z社の新製品投資案。初期投資150,000千円。耐用年数5年、残存価額=取得原価の10%、定額法。耐用年数終了時に残存価額で売却。販売価格40千円、年4,000個、5年間販売。変動費15千円/個、業務費用40,000千円/年。実効税率30%、資本コスト5%。\n\n資本コスト5%の現価係数(5年):複利現価0.78、年金現価4.32",options:[{key:"ア",label:"-38,508千円"},{key:"イ",label:"21,108千円"},{key:"ウ",label:"66,432千円"},{key:"エ",label:"78,132千円"}],correct:"エ",explanation:"減価償却費 = (150,000-15,000)÷5 = 27,000千円/年\n年間収益 = 4,000×40 = 160,000千円\n年間変動費 = 4,000×15 = 60,000千円\n税前利益 = 160,000-60,000-40,000-27,000 = 33,000千円\n税後利益 = 33,000×0.7 = 23,100千円\n年間営業CF = 23,100+27,000 = 50,100千円\n5年目末:残存価額15,000千円で売却(帳簿価額と一致→売却損益ゼロ)、税後CF=15,000千円\n\nNPV = -150,000 + 50,100×4.32 + 15,000×0.78\n    = -150,000 + 216,432 + 11,700\n    = 78,132千円。"},
  {id:"r7-fin-q19",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第19問",title:"第19問　投資評価基準",body:"投資評価基準に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"会計的投資利益率法では、償却方法を考慮して、会計利益に利払前・税引前・減価償却前の利益を用いて会計的投資利益率を計算する。"},{key:"イ",label:"相互排他的な投資案の比較を行う場合、収益性指数法による結果は、正味現在価値法による結果と整合的である。"},{key:"ウ",label:"内部収益率法は、内部収益率が複数存在する場合があることを指摘されている。"},{key:"エ",label:"割引回収期間法は、各期のキャッシュフローが均一でない場合には適用できない。"}],correct:"ウ",explanation:"ア 誤:会計的投資利益率法は通常の会計利益(税引後)を用いる。EBITDAは別概念。\nイ 誤:相互排他案では投資規模の違いから収益性指数法とNPV法の結論が一致しないことがある。\nウ 正:キャッシュフローの符号が複数回反転すると内部収益率(IRR)の解が複数存在する場合がある。\nエ 誤:割引回収期間法は各期のCFが均一でなくても各期のCFを順次累計すれば適用可能。"},
  {id:"r7-fin-q20-1",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第20問",title:"第20問 設問1　投資機会集合(安全資産がない場合)",body:"下図は、ポートフォリオ理論の下での、危険資産と安全資産の投資機会集合を示している。点Cは、点Eと点Gを結ぶ直線と、点Aと点Dを結ぶ曲線の接点。\n\n安全資産が存在しない場合の記述として、最も適切なものはどれか。",figure:"FinQ20",options:[{key:"ア",label:"資金の借り入れができるならば、効率的フロンティアは点B、点Cと点Gを結ぶ線となる。"},{key:"イ",label:"投資家のリスク回避度が高いほど、最適なポートフォリオは点Eと点Gを結ぶ直線上の点E寄りに位置する。"},{key:"ウ",label:"投資家のリスク回避度にかかわらず、最適なポートフォリオは点Cになる。"},{key:"エ",label:"リスク回避的な投資家は、自身のリスク回避度に基づいて、点Bと点Dを結ぶ曲線上から最適なポートフォリオを決定する。"}],correct:"エ",explanation:"安全資産がない場合、投資家は危険資産のみで構成される効率的フロンティア(B-Dの曲線部分)から、自身のリスク回避度に応じて最適点を選ぶ。\nア 誤:安全資産なしでは点E・点Gを使う議論はできない。\nイ 誤:点Eと点Gを結ぶ直線(CML)は安全資産が存在する場合の議論。\nウ 誤:接点ポートフォリオCが全員にとって最適となるのは安全資産がある場合(分離定理)。\nエ 正:効率的フロンティア(B-D曲線)上から各自のリスク回避度に応じて選択。"},
  {id:"r7-fin-q20-2",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第20問",title:"第20問 設問2　投資機会集合(安全資産がある場合)",body:"安全資産が存在する場合の記述として、最も適切なものはどれか。",figure:"FinQ20",options:[{key:"ア",label:"安全資産による資金の貸借ができるならば、効率的フロンティアは点Eと点Gを結ぶ直線である。"},{key:"イ",label:"点Cは安全資産と複数の危険資産で作られるポートフォリオである。"},{key:"ウ",label:"点Eと点Gを結ぶ直線を証券市場線という。"},{key:"エ",label:"リスク回避的な投資家の保有するポートフォリオのリスクプレミアムは、市場ポートフォリオのそれよりも小さい。"}],correct:"ア",explanation:"ア 正:安全資産で貸借可能な場合、効率的フロンティアは点E(リスクフリー)から接点Cを通る直線(資本市場線・CML)。\nイ 誤:点Cは危険資産のみで構成される接点ポートフォリオ(=市場ポートフォリオ)。安全資産は含まない。\nウ 誤:点Eと点Gを結ぶ直線は資本市場線(CML)。証券市場線(SML)はCAPMで個別証券のβと期待収益率の関係を示す別の概念。\nエ 誤:リスク回避度に応じてリスクプレミアムは様々(より小さくも大きくもなり得る)で、一律に小さいとはいえない。"},
  {id:"r7-fin-q21",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第21問",title:"第21問　フリー・キャッシュフロー",body:"当期純利益からフリー・キャッシュフローを計算する場合の記述として、最も適切なものはどれか。税金は存在しないものとする。",options:[{key:"ア",label:"売上債権の増加額は、当期純利益に加算される。"},{key:"イ",label:"減価償却費は、当期純利益から減算される。"},{key:"ウ",label:"仕入債務の増加額は、当期純利益に加算される。"},{key:"エ",label:"設備投資額は、当期純利益に加算される。"}],correct:"ウ",explanation:"FCF = 当期純利益 + 減価償却費 - 運転資本増加 - 設備投資。\nア 誤:売上債権増加=現金未回収増→運転資本増→減算。\nイ 誤:減価償却費は非現金支出のため加算。\nウ 正:仕入債務増加=支払繰延→現金留保増→加算。\nエ 誤:設備投資はキャッシュアウトなので減算。"},
  {id:"r7-fin-q22",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第22問",title:"第22問　EBITDA倍率と株価キャッシュフロー倍率",body:"B社とC社のEBITDA、有利子負債、現金・預金、当期純利益、減価償却費はそれぞれ等しい。B社のEV/EBITDA倍率がC社のそれより高いとき、両社の株価キャッシュフロー倍率に関する記述として、最も適切なものはどれか。EBITDAおよび株価CF倍率のCFはそれぞれ利益額に減価償却費を加算して計算。",options:[{key:"ア",label:"B社の株価キャッシュフロー倍率はC社のそれと等しい。"},{key:"イ",label:"B社の株価キャッシュフロー倍率はC社のそれよりも高い。"},{key:"ウ",label:"B社の株価キャッシュフロー倍率はC社のそれよりも低い。"},{key:"エ",label:"どちらの株価キャッシュフロー倍率が高いかは判断できない。"}],correct:"イ",explanation:"EV/EBITDA倍率 = (株式時価総額+有利子負債-現金預金)÷EBITDA。\nEBITDA・有利子負債・現金預金が等しい条件下でB社の倍率が高い → B社の株式時価総額がC社より大きい。\n株価CF倍率 = 株式時価総額÷(当期純利益+減価償却費)。\n当期純利益・減価償却費が等しいので分母は両社同じ → 株式時価総額の大きいB社の方が株価CF倍率も高い。"},
  {id:"r7-fin-q23",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第23問",title:"第23問　先渡取引と先物取引",body:"先渡取引(フォワード)と先物取引(フューチャー)に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"先物取引では、最終取引日までの間に決済不能となるリスクが存在するため、証拠金が必要とされる。"},{key:"イ",label:"先物取引では、諸条件は取引当事者間で任意に決定される。"},{key:"ウ",label:"先渡取引では、取引開始日が含まれる月を限月という。"},{key:"エ",label:"先渡取引では、取引所取引なので価格以外の諸条件は決定済みである。"}],correct:"ア",explanation:"ア 正:先物取引(取引所取引)では決済不履行リスクを担保するため証拠金制度がある。\nイ 誤:先物取引は取引所が定めた標準化された条件で行われる。任意に決定されるのは先渡取引。\nウ 誤:限月は先物取引の概念で、決済期限が属する月のこと。\nエ 誤:先渡取引は相対取引で取引所取引ではない。取引所取引は先物取引。"},
  {id:"r7-fin-q24",exam:"中小企業診断士",year:"R7",subject:"財務・会計",examLabel:"R7 財務・会計",parent:"第24問",title:"第24問　スワップ",body:"スワップに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"金利スワップおよび通貨スワップでは、変動金利同士を交換する取引は行われない。"},{key:"イ",label:"通貨スワップでは、金利だけを交換する取引は行われない。"},{key:"ウ",label:"通常の金利スワップ取引では、取引開始日と取引終了日に元本が交換される。"},{key:"エ",label:"通常の通貨スワップ取引では、異なる通貨の元本および金利が交換される。"}],correct:"エ",explanation:"ア 誤:変動金利同士を交換するベーシス・スワップが存在する。\nイ 誤:金利のみ交換するクーポン・スワップ(元本交換なし通貨スワップ)も行われる。\nウ 誤:金利スワップは想定元本に基づき金利のみ交換。元本は交換しない。\nエ 正:通常の通貨スワップは異なる通貨の元本と金利の両方を交換する。"},

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* 解説を「総合解説」と「選択肢別解説(元IDに紐付け)」に分離
   対応形式: 「ア 正:…」「ア 誤:…」「ア 適切:…」「ア 不適切:…」「ア:…」「イ・ウ 誤:…」(複数キー結合) */
const OPT_LINE = /^([アイウエオカ](?:・[アイウエオカ])*)[ 　]*(?:正|誤|適切|不適切|妥当)?[ 　]*[:：](.*)$/;
function parseExplanation(expl, optionKeys){
  const keySet = new Set(optionKeys);
  const perOption = {};
  const overall = [];
  (expl||"").split("\n").forEach(line=>{
    const m = line.match(OPT_LINE);
    if(m){
      const keys = m[1].split("・").filter(k=>keySet.has(k));
      if(keys.length){ keys.forEach(k=>{ if(!perOption[k]) perOption[k]=m[2].trim(); }); return; }
    }
    overall.push(line);
  });
  return { overall: overall.join("\n").trim(), perOption, hasPer: Object.keys(perOption).length>0 };
}

/* 学習履歴を問題ごとに集計 */
function computeStats(history){
  const byQ = {};
  for(const h of history){
    const s = byQ[h.qid] || (byQ[h.qid] = {attempts:0, correct:0, wrong:0, cur:0, max:0, lastAt:0});
    s.attempts++;
    if(h.correct){ s.correct++; s.cur++; if(s.cur>s.max) s.max=s.cur; }
    else { s.wrong++; s.cur=0; }
    s.lastAt = h.t;
  }
  return byQ;
}

function Figure({fig}){ const Comp = FIGURE_MAP[fig]; return Comp ? <Comp/> : null; }

/* ---------- Tag ---------- */
function Tag({children, soft, warn}){
  const st = warn ? {background:C.warnBg, color:C.warnText, border:`1px solid ${C.warnBorder}`}
    : soft ? {background:"#f1f5f9", color:C.sub, border:`1px solid ${C.border}`}
    : {background:C.primarySoft, color:C.primaryDark, border:`1px solid #bfdbfe`};
  return <span style={{...st, padding:"3px 10px", borderRadius:"999px", fontSize:"12px", fontWeight:600}}>{children}</span>;
}

/* ---------- QuizView ---------- */
function QuizView({quiz, idx, onAnswer, onNext, onFinish}){
  const q = quiz[idx];
  const [opts, setOpts] = useState([]);       // [{origKey,label,dispKey}]
  const [selected, setSelected] = useState(null); // dispKey selected
  const [revealed, setRevealed] = useState(false);
  const [parsed, setParsed] = useState({overall:"",perOption:{},hasPer:false});
  const [dispCorrect, setDispCorrect] = useState(null);

  useEffect(()=>{
    const shuffled = shuffle(q.options).map((o,i)=>({origKey:o.key, label:o.label, dispKey:OPT_LABELS[i]}));
    setOpts(shuffled);
    const corr = shuffled.find(o=>o.origKey===q.correct);
    setDispCorrect(corr ? corr.dispKey : null);
    setParsed(parseExplanation(q.explanation, q.options.map(o=>o.key)));
    setSelected(null); setRevealed(false);
  }, [idx]);

  const selOpt = opts.find(o=>o.dispKey===selected);
  const corrOpt = opts.find(o=>o.dispKey===dispCorrect);
  const isCorrect = q.acceptAll || (selOpt && selOpt.origKey===q.correct);

  const handleReveal=()=>{
    if(selected==null || revealed) return;
    setRevealed(true);
    onAnswer(q, {
      chosenOrig: selOpt ? selOpt.origKey : null,
      correct: !!isCorrect,
      dispChosen: selected,
      dispCorrect: dispCorrect,
      chosenContent: selOpt ? selOpt.label : "",
      correctContent: corrOpt ? corrOpt.label : "",
    });
  };

  return (
    <div style={{maxWidth:"760px", margin:"0 auto", padding:"20px 16px 70px"}}>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"14px"}}>
        <div style={{fontSize:"13px", color:C.muted, fontWeight:600}}>{idx+1} / {quiz.length} 問</div>
        <button onClick={onFinish} style={{...chip(false), padding:"5px 12px", fontSize:"12px"}}>中断して結果へ</button>
      </div>
      <div style={{height:"6px", background:C.border, borderRadius:"999px", overflow:"hidden", marginBottom:"18px"}}>
        <div style={{height:"100%", width:`${(idx/quiz.length)*100}%`, background:`linear-gradient(90deg, ${C.primary}, ${C.accent})`, transition:"width .3s"}}/>
      </div>

      <div style={{background:C.card, border:`1px solid ${C.border}`, borderRadius:"16px", padding:"22px", boxShadow:sh}}>
        <div style={{display:"flex", gap:"8px", flexWrap:"wrap", marginBottom:"12px"}}>
          <Tag>{q.examLabel}</Tag><Tag soft>{q.parent}</Tag>
          {q.acceptAll && <Tag warn>不採点問題</Tag>}
        </div>
        <div style={{fontSize:"17px", fontWeight:700, color:C.text, marginBottom:"12px", lineHeight:1.5}}>{q.title}</div>
        <div style={{fontSize:"15px", color:C.sub, lineHeight:1.75, whiteSpace:"pre-wrap"}}>{q.body}</div>
        {q.figure && <Figure fig={q.figure}/>}

        <div style={{display:"flex", flexDirection:"column", gap:"10px", marginTop:"18px"}}>
          {opts.map(opt=>{
            const chosen = selected===opt.dispKey;
            const correctKey = revealed && opt.origKey===q.correct;
            let bg="#fff", bd=C.borderStrong, badge="#f1f5f9", badgeFg=C.sub;
            if(revealed){
              if(correctKey){ bg=C.goodSoft; bd=C.good; badge=C.good; badgeFg="#fff"; }
              else if(chosen){ bg=C.badSoft; bd=C.bad; badge=C.bad; badgeFg="#fff"; }
            } else if(chosen){ bg=C.primarySoft; bd=C.primary; badge=C.primary; badgeFg="#fff"; }
            return (
              <button key={opt.dispKey} onClick={()=>{ if(!revealed) setSelected(opt.dispKey); }} disabled={revealed}
                style={{textAlign:"left", display:"flex", gap:"12px", alignItems:"flex-start", padding:"13px 14px",
                  borderRadius:"12px", border:`1.5px solid ${bd}`, background:bg, cursor: revealed?"default":"pointer", transition:"all .12s"}}>
                <span style={{flexShrink:0, width:"26px", height:"26px", borderRadius:"7px", background:badge, color:badgeFg,
                  display:"flex", alignItems:"center", justifyContent:"center", fontWeight:700, fontSize:"14px"}}>{opt.dispKey}</span>
                <span style={{fontSize:"14.5px", color:C.text, lineHeight:1.6, paddingTop:"2px"}}>{opt.label}</span>
              </button>
            );
          })}
        </div>

        {!revealed ? (
          <button onClick={handleReveal} disabled={selected==null}
            style={{marginTop:"18px", width:"100%", padding:"14px", borderRadius:"12px", border:"none",
              background: selected!=null?C.primary:"#cbd5e1", color:"#fff", fontSize:"15px", fontWeight:700,
              cursor: selected!=null?"pointer":"not-allowed"}}>解答する</button>
        ) : (
          <div style={{marginTop:"18px"}}>
            <div style={{display:"flex", alignItems:"center", gap:"10px", padding:"12px 14px", borderRadius:"11px", flexWrap:"wrap",
              background: isCorrect?C.goodSoft:C.badSoft, border:`1px solid ${isCorrect?C.good:C.bad}`, marginBottom:"14px"}}>
              <span style={{fontWeight:800, fontSize:"15px", color: isCorrect?C.good:C.bad}}>{q.acceptAll?"不採点（正解扱い）":(isCorrect?"正解":"不正解")}</span>
              <span style={{fontSize:"13.5px", color:C.sub}}>正解: <b>{dispCorrect}</b>　/　あなた: <b>{selected}</b></span>
            </div>

            {parsed.overall && (
              <div style={{background:"#fafaf9", border:`1px solid ${C.border}`, borderRadius:"11px", padding:"15px", marginBottom:"12px"}}>
                <div style={{fontSize:"12.5px", fontWeight:700, color:C.accent, marginBottom:"8px", letterSpacing:".03em"}}>総合解説</div>
                <div style={{fontSize:"14px", color:C.text, lineHeight:1.8, whiteSpace:"pre-wrap"}}>{parsed.overall}</div>
              </div>
            )}

            {parsed.hasPer && (
              <div style={{background:"#fafaf9", border:`1px solid ${C.border}`, borderRadius:"11px", padding:"15px"}}>
                <div style={{fontSize:"12.5px", fontWeight:700, color:C.accent, marginBottom:"10px", letterSpacing:".03em"}}>選択肢別解説</div>
                <div style={{display:"flex", flexDirection:"column", gap:"9px"}}>
                  {opts.map(opt=>{
                    const note = parsed.perOption[opt.origKey];
                    if(!note) return null;
                    const ok = opt.origKey===q.correct;
                    return (
                      <div key={opt.dispKey} style={{display:"flex", gap:"9px", alignItems:"flex-start"}}>
                        <span style={{flexShrink:0, width:"22px", height:"22px", borderRadius:"6px", marginTop:"1px",
                          background: ok?C.goodSoft:C.badSoft, color: ok?C.good:C.bad, fontWeight:800, fontSize:"12px",
                          display:"flex", alignItems:"center", justifyContent:"center"}}>{opt.dispKey}</span>
                        <div style={{fontSize:"13.5px", color:C.text, lineHeight:1.7}}>
                          <b style={{color: ok?C.good:C.bad}}>{ok?"正":"誤"}</b>　{note}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            <button onClick={idx+1<quiz.length?onNext:onFinish}
              style={{marginTop:"16px", width:"100%", padding:"14px", borderRadius:"12px", border:"none",
                background:`linear-gradient(135deg, ${C.primary}, ${C.primaryDark})`, color:"#fff", fontSize:"15px", fontWeight:700, cursor:"pointer"}}>
              {idx+1<quiz.length ? "次の問題へ" : "結果を見る"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

  const color = pct>=80?C.good : pct>=50?C.primary : C.bad;
  return (
    <div style={{maxWidth:"760px", margin:"0 auto", padding:"24px 16px 70px"}}>
      <div style={{background:C.card, border:`1px solid ${C.border}`, borderRadius:"16px", padding:"26px", boxShadow:sh, textAlign:"center", marginBottom:"18px"}}>
        <div style={{fontSize:"13px", color:C.muted, fontWeight:600, marginBottom:"6px"}}>結果</div>
        <div style={{fontSize:"44px", fontWeight:800, color, lineHeight:1.1}}>{correct}<span style={{fontSize:"22px", color:C.muted, fontWeight:600}}> / {total}</span></div>
        <div style={{fontSize:"15px", color:C.sub, marginTop:"6px"}}>正答率 {pct}%</div>
        <div style={{display:"flex", gap:"10px", marginTop:"20px", justifyContent:"center", flexWrap:"wrap"}}>
          <button onClick={onRetry} style={{...btn(true), padding:"12px 22px"}}>もう一度</button>
          <button onClick={onHome} style={{...btn(false), padding:"12px 22px"}}>ホームへ</button>
        </div>
      </div>
      <div style={{fontSize:"13px", fontWeight:700, color:C.sub, marginBottom:"10px"}}>解答の内訳</div>
      <div style={{display:"flex", flexDirection:"column", gap:"8px"}}>
        {items.map((it,i)=>(
          <div key={i} style={{background:C.card, border:`1px solid ${C.border}`, borderRadius:"11px", padding:"12px 14px", display:"flex", alignItems:"center", gap:"12px"}}>
            <span style={{flexShrink:0, width:"24px", height:"24px", borderRadius:"7px", display:"flex", alignItems:"center", justifyContent:"center",
              background: it.correct?C.goodSoft:C.badSoft, color: it.correct?C.good:C.bad, fontWeight:800, fontSize:"14px"}}>{it.correct?"○":"×"}</span>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:"13.5px", color:C.text, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{it.title}</div>
              <div style={{fontSize:"12px", color:C.muted, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{it.examLabel}・正解: {it.dispCorrect}（{it.correctContent}）</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- HistoryView ---------- */
function HistoryView({history, onClear}){
  const stats = computeStats(history);
  const byQ = {};
  history.slice().reverse().forEach(h=>{ (byQ[h.qid]=byQ[h.qid]||[]).push(h); });
  const entries = Object.keys(stats).map(qid=>({qid, s:stats[qid], recent:(byQ[qid]||[]).slice(0,HISTORY_LIMIT)}));
  entries.sort((a,b)=>b.s.lastAt-a.s.lastAt);

  return (
    <div style={{maxWidth:"760px", margin:"0 auto", padding:"24px 16px 70px"}}>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"16px"}}>
        <div style={{fontSize:"18px", fontWeight:700, color:C.text}}>学習履歴</div>
        {entries.length>0 && <button onClick={onClear} style={{...chip(false, C.bad), color:C.bad, borderColor:"#fca5a5"}}>履歴を消去</button>}
      </div>
      {entries.length===0 ? (
        <div style={{background:C.card, border:`1px dashed ${C.borderStrong}`, borderRadius:"14px", padding:"40px 20px", textAlign:"center", color:C.muted, fontSize:"14px"}}>
          まだ学習履歴がありません。クイズを解くとここに記録されます。
        </div>
      ) : (
        <div style={{display:"flex", flexDirection:"column", gap:"10px"}}>
          {entries.map(({qid,s,recent})=>{
            const q = ALL_QUESTIONS.find(x=>x.id===qid);
            return (
              <div key={qid} style={{background:C.card, border:`1px solid ${C.border}`, borderRadius:"12px", padding:"14px 16px", boxShadow:sh}}>
                <div style={{fontSize:"14px", fontWeight:600, color:C.text, marginBottom:"3px"}}>{q?q.title:qid}</div>
                <div style={{fontSize:"12px", color:C.muted, marginBottom:"10px"}}>{q?q.examLabel:""}・最終解答 {fmtTime(s.lastAt)}</div>
                <div style={{display:"flex", flexWrap:"wrap", gap:"6px", marginBottom:"10px"}}>
                  <Stat label="解答回数" value={s.attempts}/>
                  <Stat label="正解" value={s.correct} color={C.good}/>
                  <Stat label="不正解" value={s.wrong} color={C.bad}/>
                  <Stat label="現在の連続正解" value={s.cur} color={C.primary}/>
                  <Stat label="最大連続正解" value={s.max} color={C.accent}/>
                </div>
                <div style={{display:"flex", gap:"5px", flexWrap:"wrap"}}>
                  {recent.map((r,i)=>(
                    <span key={i} style={{width:"24px", height:"24px", borderRadius:"6px", display:"flex", alignItems:"center", justifyContent:"center",
                      background: r.correct?C.goodSoft:C.badSoft, color: r.correct?C.good:C.bad, fontWeight:800, fontSize:"12px"}}>{r.correct?"○":"×"}</span>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
function Stat({label, value, color}){
  return (
    <div style={{background:"#fafaf9", border:`1px solid ${C.border}`, borderRadius:"8px", padding:"6px 10px", display:"flex", alignItems:"baseline", gap:"6px"}}>
      <span style={{fontSize:"11px", color:C.muted}}>{label}</span>
      <span style={{fontSize:"15px", fontWeight:800, color: color||C.text}}>{value}</span>
    </div>
  );
}

          {LS_OK
            ? "※ 学習履歴と設定はこのブラウザに自動保存され、アプリを閉じても保持されます(同じ端末・同じブラウザで有効)。履歴を消したい場合は「履歴」タブの全消去をご利用ください。なお、ブラウザのデータ削除やシークレットモードでは保存されないことがあります。図表は学習用に公式図を再現したものです。"
            : "※ この環境ではブラウザ保存が利用できないため、学習履歴はメモリ上にのみ保持され、ページを再読み込みするとリセットされます(ダウンロードしてブラウザやVercel等で開くと履歴は保存されます)。図表は学習用に公式図を再現したものです。"}
        </div>
      </div>
    </div>
  );
}

/* ---------- BrowseView (全問題の参照) ---------- */
function BrowseItem({q}){
  const [open, setOpen] = useState(false);
  const parsed = parseExplanation(q.explanation, q.options.map(o=>o.key));
  return (
    <div style={{background:C.card, border:`1px solid ${C.border}`, borderRadius:"12px", boxShadow:sh, overflow:"hidden"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{width:"100%", textAlign:"left", padding:"13px 15px", display:"flex", gap:"10px", alignItems:"center", cursor:"pointer", background:"transparent", border:"none"}}>
        <span style={{flexShrink:0, fontSize:"12px", fontWeight:700, color:"#fff", background:C.accent, borderRadius:"6px", padding:"2px 8px"}}>{q.parent}</span>
        <span style={{flex:1, minWidth:0, fontSize:"14px", fontWeight:600, color:C.text}}>{q.title.replace(/^第\d+問[ 　]*(設問\d+[ 　]*)?/,"")}</span>
        <span style={{flexShrink:0, fontSize:"18px", color:C.muted, transform: open?"rotate(180deg)":"none", transition:"transform .15s"}}>⌄</span>
      </button>
      {open && (
        <div style={{padding:"4px 16px 18px"}}>
          <div style={{fontSize:"14px", color:C.sub, lineHeight:1.75, whiteSpace:"pre-wrap", marginBottom:"6px"}}>{q.body}</div>
          {q.figure && <Figure fig={q.figure}/>}
          <div style={{display:"flex", flexDirection:"column", gap:"7px", margin:"12px 0"}}>
            {q.options.map(opt=>{
              const ok = !q.acceptAll && opt.key===q.correct;
              return (
                <div key={opt.key} style={{display:"flex", gap:"10px", alignItems:"flex-start", padding:"9px 11px", borderRadius:"9px",
                  border:`1.5px solid ${ok?C.good:C.border}`, background: ok?C.goodSoft:"#fff"}}>
                  <span style={{flexShrink:0, width:"23px", height:"23px", borderRadius:"6px", display:"flex", alignItems:"center", justifyContent:"center",
                    fontWeight:700, fontSize:"13px", background: ok?C.good:"#f1f5f9", color: ok?"#fff":C.sub}}>{opt.key}</span>
                  <span style={{fontSize:"13.5px", color:C.text, lineHeight:1.6, paddingTop:"1px"}}>{opt.label}</span>
                </div>
              );
            })}
          </div>
          <div style={{fontSize:"13px", fontWeight:700, color: q.acceptAll?C.warnText:C.good, marginBottom:"10px"}}>
            {q.acceptAll ? "正解: 不採点(全員正解扱い)" : `正解: ${q.correct}`}
          </div>
          {parsed.overall && (
            <div style={{background:"#fafaf9", border:`1px solid ${C.border}`, borderRadius:"10px", padding:"13px", marginBottom:"10px"}}>
              <div style={{fontSize:"12px", fontWeight:700, color:C.accent, marginBottom:"7px"}}>総合解説</div>
              <div style={{fontSize:"13.5px", color:C.text, lineHeight:1.8, whiteSpace:"pre-wrap"}}>{parsed.overall}</div>
            </div>
          )}
          {parsed.hasPer && (
            <div style={{background:"#fafaf9", border:`1px solid ${C.border}`, borderRadius:"10px", padding:"13px"}}>
              <div style={{fontSize:"12px", fontWeight:700, color:C.accent, marginBottom:"9px"}}>選択肢別解説</div>
              <div style={{display:"flex", flexDirection:"column", gap:"8px"}}>
                {q.options.map(opt=>{
                  const note = parsed.perOption[opt.key]; if(!note) return null;
                  const ok = opt.key===q.correct;
                  return (
                    <div key={opt.key} style={{display:"flex", gap:"8px", alignItems:"flex-start"}}>
                      <span style={{flexShrink:0, width:"21px", height:"21px", borderRadius:"5px", marginTop:"1px", display:"flex", alignItems:"center", justifyContent:"center",
                        fontWeight:800, fontSize:"11px", background: ok?C.goodSoft:C.badSoft, color: ok?C.good:C.bad}}>{opt.key}</span>
                      <div style={{fontSize:"13px", color:C.text, lineHeight:1.7}}><b style={{color: ok?C.good:C.bad}}>{ok?"正":"誤"}</b>　{note}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function BrowseView(){
  const [subject, setSubject] = useState(allSubjects[0]);
  const [year, setYear] = useState("all");
  const [query, setQuery] = useState("");
  const list = ALL_QUESTIONS.filter(q => q.subject===subject &&
    (year==="all" || q.year===year) &&
    (query.trim()==="" || (q.title+q.body+q.options.map(o=>o.label).join("")).includes(query.trim())));
  // 選択中の科目に存在する年度のみ表示
  const yearsForSubject = allYears.filter(y => ALL_QUESTIONS.some(q=>q.subject===subject && q.year===y));
  return (
    <div style={{maxWidth:"760px", margin:"0 auto", padding:"24px 16px 70px"}}>
      <div style={{fontSize:"18px", fontWeight:700, color:C.text, marginBottom:"4px"}}>問題一覧</div>
      <div style={{fontSize:"13px", color:C.muted, marginBottom:"16px"}}>全{ALL_QUESTIONS.length}問。科目と出題年を選び、各問をタップすると本文・選択肢・正解・解説を確認できます。</div>
      <div style={{display:"flex", flexWrap:"wrap", gap:"8px", marginBottom:"12px"}}>
        {allSubjects.map(s=>{
          const cnt = ALL_QUESTIONS.filter(q=>q.subject===s).length;
          return (<button key={s} onClick={()=>{setSubject(s); setYear("all");}} style={chip(subject===s, C.accent)}>{s}<span style={{opacity:.7, marginLeft:"6px", fontSize:"12px"}}>{cnt}</span></button>);
        })}
      </div>
      <div style={{display:"flex", flexWrap:"wrap", gap:"8px", alignItems:"center", marginBottom:"12px"}}>
        <span style={{fontSize:"12px", color:C.muted, marginRight:"2px"}}>出題年</span>
        <button onClick={()=>setYear("all")} style={chip(year==="all")}>すべて</button>
        {yearsForSubject.map(y=>{
          const cnt = ALL_QUESTIONS.filter(q=>q.subject===subject && q.year===y).length;
          return (<button key={y} onClick={()=>setYear(y)} style={chip(year===y)}>{y}<span style={{opacity:.7, marginLeft:"6px", fontSize:"12px"}}>{cnt}</span></button>);
        })}
      </div>
      <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="キーワードで絞り込み(任意)"
        style={{width:"100%", boxSizing:"border-box", padding:"10px 13px", borderRadius:"10px", border:`1px solid ${C.borderStrong}`, fontSize:"14px", marginBottom:"14px", outline:"none"}}/>
      <div style={{fontSize:"12px", color:C.muted, marginBottom:"10px"}}>{subject}{year==="all"?"":("／"+year)}：{list.length}問</div>
      <div style={{display:"flex", flexDirection:"column", gap:"9px"}}>
        {list.map(q=>(<BrowseItem key={q.id} q={q}/>))}
        {list.length===0 && <div style={{textAlign:"center", color:C.muted, fontSize:"13px", padding:"30px"}}>該当する問題がありません。</div>}
      </div>
    </div>
  );
}

/* ---------- 永続化(localStorage、使えない環境ではメモリ保持にフォールバック) ---------- */
const LS_OK = (() => {
  try { const k="__shindanshi_probe__"; window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();
function loadLS(key, fallback){
  if(!LS_OK) return fallback;
  try { const v = window.localStorage.getItem(key); return (v==null) ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function saveLS(key, val){
  if(!LS_OK) return;
  try { window.localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
function usePersistentState(key, fallback){
  const [val, setVal] = useState(() => loadLS(key, fallback));
  useEffect(() => { saveLS(key, val); }, [val]);
  return [val, setVal];
}

/* ---------- App ---------- */
function App(){
  const [view, setView] = useState("home");
  const [settings, setSettings] = usePersistentState("shindanshi:settings:v4", {
    exams: allExams.slice(), subjects: allSubjects.slice(), years: allYears.slice(),
    count: 10, excludeMastered: false, masterThreshold: 3,
  });
  const [history, setHistory] = usePersistentState("shindanshi:history:v1", []);
  const [quiz, setQuiz] = useState(null);
  const [idx, setIdx] = useState(0);
  const [sessionAnswers, setSessionAnswers] = useState([]);
  const [result, setResult] = useState(null);
  const [lastPool, setLastPool] = useState(null);

  const startQuiz=(pool)=>{
    let usable = pool;
    if(settings.excludeMastered){
      const stats = computeStats(history);
      usable = pool.filter(q => !(stats[q.id] && stats[q.id].cur >= settings.masterThreshold));
      if(usable.length===0) usable = pool;
    }
    const picked = shuffle(usable).slice(0, settings.count);
    if(picked.length===0) return;
    setQuiz(picked); setIdx(0); setSessionAnswers([]); setResult(null); setLastPool(pool);
    setView("quiz"); window.scrollTo(0,0);
  };

  const recordAnswer=(q, payload)=>{
    setHistory(h=>[...h, {qid:q.id, chosen:payload.chosenOrig, correct:payload.correct, t:Date.now()}]);
    setSessionAnswers(a=>[...a, {qid:q.id, title:q.title, examLabel:q.examLabel, correct:payload.correct,
      dispChosen:payload.dispChosen, dispCorrect:payload.dispCorrect, correctContent:payload.correctContent}]);
  };
  const nextQ=()=>{ setIdx(i=>i+1); window.scrollTo(0,0); };
  const finishQuiz=()=>{
    const items = sessionAnswers;
    const correct = items.filter(it=>it.correct).length;
    setResult({total: items.length, correct, items});
    setView("result"); window.scrollTo(0,0);
  };

  return (
    <div style={{minHeight:"100vh", background:C.bg, color:C.text}}>
      <Header view={(view==="quiz"||view==="result")?"home":view} setView={(v)=>{setView(v); window.scrollTo(0,0);}}/>
      {view==="home" && <HomeView settings={settings} setSettings={setSettings} startQuiz={startQuiz}/>}
      {view==="browse" && <BrowseView/>}
      {view==="quiz" && quiz && <QuizView quiz={quiz} idx={idx} onAnswer={recordAnswer} onNext={nextQ} onFinish={finishQuiz}/>}
      {view==="result" && result && <ResultView result={result} onHome={()=>{setView("home"); window.scrollTo(0,0);}} onRetry={()=>startQuiz(lastPool||ALL_QUESTIONS)}/>}
      {view==="history" && <HistoryView history={history} onClear={()=>setHistory([])}/>}
      {view==="settings" && <SettingsView settings={settings} setSettings={setSettings}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
