const FigureFrame = ({ children, viewBox = "0 0 420 280" }) => (
  <div style={{margin:"16px 0", display:"flex", justifyContent:"center"}}>
    <svg viewBox={viewBox}

      {children}

  </div>
);

const gridStyle = { stroke: "#e5e7eb", strokeWidth: 0.8, fill: "none" };
const lineStyle = (color) => ({ stroke: color, strokeWidth: 2, fill: "none" });

    <polyline points="60,180 105,178 150,176 195,178 240,178 285,176 330,174 375,172 410,170" {...lineStyle("#d97706")} /><text x="412" y="173" fontSize="13" fill="#d97706" fontWeight="bold">c</text>

const FigEcoQ3 = () => {
  const data=[{label:"A",color:"#1d4ed8",pct:41},{label:"B",color:"#b91c1c",pct:18},{label:"C",color:"#15803d",pct:14},{label:"卸売・小売業",color:"#a16207",pct:11},{label:"通信業",color:"#7c3aed",pct:7},{label:"その他",color:"#64748b",pct:9}];
  let acc=0; const cx=150,cy=130,r=95;
  const slices=data.map((d)=>{const start=(acc/100)*2*Math.PI;acc+=d.pct;const end=(acc/100)*2*Math.PI;const x1=cx+r*Math.sin(start),y1=cy-r*Math.cos(start);const x2=cx+r*Math.sin(end),y2=cy-r*Math.cos(end);const large=end-start>Math.PI?1:0;const path=`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;const mid=(start+end)/2;return{...d,path,lx:cx+(r*0.6)*Math.sin(mid),ly:cy-(r*0.6)*Math.cos(mid)};});
  return (<FigureFrame viewBox="0 0 440 280">
    {slices.map((s,i)=>(<g key={i}><path d={s.path} fill={s.color} stroke="white" strokeWidth="2" /><text x={s.lx} y={s.ly} fontSize="13" fill="white" fontWeight="bold" textAnchor="middle" dominantBaseline="middle">{s.label.length<=2?s.label:`${s.pct}%`}</text></g>))}
    {data.map((d,i)=>(<g key={i} transform={`translate(280, ${50+i*24})`}><rect width="14" height="14" fill={d.color} /><text x="20" y="11" fontSize="11" fill="#1f2937">{d.label}（{d.pct}%）</text></g>))}
  </FigureFrame>);
};

const cellTh = {border:"1px solid #a8a29e", padding:"6px 12px", background:"#f5f5f4"};
const cellTh2 = {border:"1px solid #a8a29e", padding:"6px 12px", background:"#fafaf9"};
const cellTd = {border:"1px solid #a8a29e", padding:"6px 12px", textAlign:"center"};
const cellTdL = {border:"1px solid #a8a29e", padding:"6px 12px", background:"#fafaf9"};

const FigEcoQ5 = () => (
  <div style={{margin:"16px 0", display:"flex", justifyContent:"center"}}>
    <table style={{borderCollapse:"collapse", fontSize:"14px"}}>

const FigEcoQ7 = () => {
  const ox=50,oy=290; const gx=(g)=>ox+g, gy=(g)=>oy-g; const c=0.5,b0=80,b1=110;
  const Y0=b0/(1-c),YL=b1/(1-c),YF=240,ASmax=240; const ad=(b)=>(x)=>c*x+b; const AD0=ad(b0);
  const E=[gx(Y0),gy(Y0)],L=[gx(YL),gy(YL)],F=[gx(YF),gy(YF)],H=[gx(YF),gy(AD0(YF))];
  const Jy=gy(YF),Ky=gy(AD0(YF)); const ASe=[gx(ASmax),gy(ASmax)];
  const AD0_a=[gx(0),gy(b0)],AD0_b=[gx(ASmax),gy(AD0(ASmax))]; const AD1_a=[gx(0),gy(b1)],AD1_b=[gx(ASmax),gy(ad(b1)(ASmax))];
  const grid={stroke:"#94a3b8",strokeDasharray:"3 3"};
  return (<FigureFrame viewBox="0 0 360 320">
    <line x1={ox} y1={oy} x2="340" y2={oy} {...axisStyle} /><line x1={ox} y1="20" x2={ox} y2={oy} {...axisStyle} />
    <text x="345" y={oy+4} fontSize="11" fill="#1f2937">Y</text><text x="22" y="18" fontSize="11" fill="#1f2937">AD,AS</text>
    <line x1={ox} y1={oy} x2={ASe[0]} y2={ASe[1]} stroke="#0f766e" strokeWidth="2" /><text x={ASe[0]+5} y={ASe[1]+4} fontSize="12" fill="#0f766e" fontWeight="bold">AS=Y</text>
    <line x1={AD0_a[0]} y1={AD0_a[1]} x2={AD0_b[0]} y2={AD0_b[1]} stroke="#1d4ed8" strokeWidth="2" /><text x={AD0_b[0]+5} y={AD0_b[1]+4} fontSize="12" fill="#1d4ed8" fontWeight="bold">AD0</text>
    <line x1={AD1_a[0]} y1={AD1_a[1]} x2={AD1_b[0]} y2={AD1_b[1]} stroke="#9333ea" strokeWidth="2" strokeDasharray="4 3" /><text x={AD1_b[0]+5} y={AD1_b[1]-2} fontSize="12" fill="#9333ea" fontWeight="bold">AD1</text>
    <line x1={E[0]} y1={E[1]} x2={E[0]} y2={oy} {...grid} /><line x1={ox} y1={E[1]} x2={E[0]} y2={E[1]} {...grid} /><circle cx={E[0]} cy={E[1]} r="3.5" fill="#1f2937" /><text x={E[0]+5} y={E[1]-4} fontSize="11" fill="#1f2937" fontWeight="bold">E</text>
    <line x1={L[0]} y1={L[1]} x2={L[0]} y2={oy} {...grid} /><line x1={ox} y1={L[1]} x2={L[0]} y2={L[1]} {...grid} /><circle cx={L[0]} cy={L[1]} r="3.5" fill="#9333ea" /><text x={L[0]-14} y={L[1]-3} fontSize="11" fill="#9333ea" fontWeight="bold">L</text>
    <line x1={F[0]} y1={F[1]} x2={F[0]} y2={oy} {...grid} /><line x1={ox} y1={F[1]} x2={F[0]} y2={F[1]} {...grid} /><line x1={ox} y1={H[1]} x2={F[0]} y2={H[1]} {...grid} />
    <circle cx={F[0]} cy={F[1]} r="3.5" fill="#0f766e" /><circle cx={H[0]} cy={H[1]} r="3.5" fill="#1d4ed8" /><text x={F[0]+5} y={F[1]+4} fontSize="11" fill="#0f766e" fontWeight="bold">F</text><text x={H[0]+5} y={H[1]+4} fontSize="11" fill="#1d4ed8" fontWeight="bold">H</text>
    <text x={E[0]-8} y={oy+16} fontSize="11" fill="#1f2937">Y0</text><text x={L[0]-8} y={oy+16} fontSize="11" fill="#1f2937">YL</text><text x={F[0]-9} y={oy+16} fontSize="11" fill="#1f2937">YF</text>
    <text x={ox-12} y={Jy+4} fontSize="11" fill="#1f2937">J</text><text x={ox-13} y={Ky+4} fontSize="11" fill="#1f2937">K</text><text x={ox-13} y={E[1]+4} fontSize="11" fill="#1f2937">E</text><text x={ox-12} y={oy+4} fontSize="11" fill="#1f2937">O</text>
  </FigureFrame>);
};

const FigEcoQ10 = () => {

const FigEcoQ14 = () => {
  const ox=50,oy=290,s=2; const gx=(g)=>ox+g*s, gy=(g)=>oy-g*s; const A=[gx(0),gy(120)],B=[gx(60),gy(0)],C=[gx(120),gy(0)]; const F=[gx(30),gy(60)],H=[gx(60),gy(60)];
  const Gx=Math.sqrt(1800); const G=[gx(Gx),gy(Gx)]; const Dpt=[gx(0),gy(2*Gx)],Ept=[gx(2*Gx),gy(0)];

    <line x1={Dpt[0]} y1={Dpt[1]} x2={Ept[0]} y2={Ept[1]} stroke="#15803d" strokeWidth="1.5" strokeDasharray="4 3" />
    <path d={toPath(ic1Pts)} fill="none" stroke="#475569" strokeWidth="1.5" /><path d={toPath(ic2Pts)} fill="none" stroke="#475569" strokeWidth="1.5" />
    <text x={A[0]-13} y={A[1]+4} fontSize="11" fill="#1d4ed8" fontWeight="bold">A</text><text x={B[0]-4} y={oy+14} fontSize="11" fill="#1d4ed8" fontWeight="bold">B</text><text x={C[0]-4} y={oy+14} fontSize="11" fill="#9333ea" fontWeight="bold">C</text>
    <text x={Dpt[0]-13} y={Dpt[1]+4} fontSize="11" fill="#15803d" fontWeight="bold">D</text><text x={Ept[0]-3} y={oy+14} fontSize="11" fill="#15803d" fontWeight="bold">E</text>

    <circle cx={H[0]} cy={H[1]} r="4" fill="#9333ea" /><text x={H[0]+6} y={H[1]-4} fontSize="12" fill="#9333ea" fontWeight="bold">H</text>
    <text x={ox-12} y={oy+4} fontSize="11" fill="#1f2937">O</text>
  </FigureFrame>);
};

const FigEcoQ15_2 = () => {
  const ox=50,oy=240,sx=2.5,sy=3; const gx=(g)=>ox+g*sx, gy=(g)=>oy-g*sy; const mc=(Q)=>5+0.5*Q; const Q1=40,Q2=90,Q3=130,P=50;

  return (<FigureFrame viewBox="0 0 420 280">

    <line x1={gx(0)} y1={gy(mc(0))} x2={gx(Q3)} y2={gy(mc(Q3))} stroke="#1d4ed8" strokeWidth="2" /><text x={gx(Q3)+5} y={gy(mc(Q3))+4} fontSize="12" fill="#1d4ed8" fontWeight="bold">MC</text>

    {lbl(20,(P+mc(20))/2,1)}{lbl(20,mc(20)/2,2)}{lbl((Q1+Q2)/2,(P+mc((Q1+Q2)/2))/2,3)}{lbl((Q1+Q2)/2,mc((Q1+Q2)/2)/2,4)}{lbl((Q2+Q3)/2,(mc((Q2+Q3)/2)+P)/2,5)}

    <text x="330" y="150" fontSize="11" fill="#b91c1c" fontWeight="bold">産出量の累積線</text>
    {/* β and α on x-axis (β < α) */}
    <line x1="150" y1="150" x2="150" y2={oy} stroke="#9ca3af" strokeDasharray="3 3" /><text x="150" y={oy+15} fontSize="11" fill="#1f2937" textAnchor="middle">β</text>
    <line x1="215" y1="118" x2="215" y2={oy} stroke="#9ca3af" strokeDasharray="3 3" /><text x="215" y={oy+15} fontSize="11" fill="#1f2937" textAnchor="middle">α</text>
    {/* A: vertical gap at α */}
    {(() => { const xa=215;
      const iy=150+(55-150)*((xa-150)/(440-150));
      const oyy=160+(85-160)*((xa-230)/(445-230));
      return (<g><line x1={xa} y1={iy} x2={xa} y2={oyy} stroke="#0f766e" strokeWidth="1.5" markerStart="url(#a18s)" markerEnd="url(#a18e)" /><text x={xa+8} y={(iy+oyy)/2+4} fontSize="12" fill="#0f766e" fontWeight="bold">A</text></g>); })()}
    {/* B: horizontal gap at a low cumulative level */}
    {(() => { const yb=205;
      const ix=ox+(150-ox)*((yb-oy)/(150-oy));
      const oxx=165+(230-165)*((yb-oy)/(160-oy));
      return (<g><line x1={ix} y1={yb} x2={oxx} y2={yb} stroke="#9333ea" strokeWidth="1.5" markerStart="url(#a18s)" markerEnd="url(#a18e)" /><text x={(ix+oxx)/2} y={yb-6} fontSize="12" fill="#9333ea" fontWeight="bold" textAnchor="middle">B</text></g>); })()}
    <defs>
      <marker id="a18e" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker>
      <marker id="a18s" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M6,0 L0,3 L6,6 Z" fill="#374151"/></marker>
    </defs>
  </FigureFrame>);
};

  {id:"r7-eco-q2",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第2問",title:"第2問　雇用形態別 雇用者数の推移",body:"下図は、近年の日本における男女別・雇用形態別の雇用者数の推移を示している。図中のa〜cに該当する項目の組み合わせとして、最も適切なものを下記の解答群から選べ。",figure:"EcoQ2",options:[{key:"ア",label:"a：男性、非正規　b：女性、正規　c：女性、非正規"},{key:"イ",label:"a：女性、正規　b：男性、非正規　c：女性、非正規"},{key:"ウ",label:"a：女性、正規　b：女性、非正規　c：男性、非正規"},{key:"エ",label:"a：女性、非正規　b：男性、非正規　c：女性、正規"},{key:"オ",label:"a：女性、非正規　b：女性、正規　c：男性、非正規"}],correct:"オ",explanation:"雇用者数は概ね「女性の非正規 > 女性の正規 > 男性の非正規」の順。女性の正規は近年増加傾向、女性の非正規はそれを上回る規模で最多。男性の非正規は横ばい。"},
  {id:"r7-eco-q3",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第3問",title:"第3問　対内直接投資残高 業種別内訳",body:"下図は、2023年末時点における日本への対内直接投資残高について、その業種別の内訳を示したものである。図中のA〜Cに該当する業種の組み合わせとして、最も適切なものを下記の解答群から選べ。",figure:"EcoQ3",options:[{key:"ア",label:"A：卸売・小売業　B：通信業　C：金融・保険業"},{key:"イ",label:"A：化学・医薬　B：輸送機械器具　C：電気機械器具"},{key:"ウ",label:"A：金融・保険業　B：化学・医薬　C：輸送機械器具"},{key:"エ",label:"A：電気機械器具　B：卸売・小売業　C：通信業"}],correct:"ウ",explanation:"日本への対内直接投資残高は金融・保険業が最大(約4割)、次いで化学・医薬、輸送機械器具と続く。製造業全体では化学・医薬が大きく、自動車関連の輸送機械もまとまった割合を占める。"},
  {id:"r7-eco-q4",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第4問",title:"第4問　国民経済計算の考え方",body:"国民経済計算の考え方に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"GDPは、フローとストックの混合概念である。"},{key:"イ",label:"GDPは、持ち家の帰属家賃を含み、住宅建築を含まない。"},{key:"ウ",label:"株式の配当や預金の利子は、GDPに含まれない。"},{key:"エ",label:"消防、警察などの行政サービスは無料なので、GDPに含まれない。"},{key:"オ",label:"輸入の減少は、GDPを増加させる。"}],correct:"オ",explanation:"GDP=C+I+G+(X-M)。輸入Mは控除項目。\nア:GDPは一定期間の付加価値合計でフローのみ。\nイ:住宅建築は固定資本形成としてGDPに含まれる。\nウ:配当・利子は要素所得分配としてGDP/GNIに反映される。\nエ:行政サービスは政府最終消費支出として原価で計上。\nオ:輸入Mの減少は控除項目の減少を意味し、GDPを押し上げる。"},
  {id:"r7-eco-q5",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第5問",title:"第5問　物価指数(ラスパイレス・パーシェ)",body:"2種類の財(X財とY財)の数値例で物価指数を計算する。これらの財の単位当たりの価格と数量は、それぞれ以下の表のとおりである。基準年の物価指数を100とした場合、比較年の物価指数として、最も適切なものを下記の解答群から選べ。",figure:"EcoQ5",options:[{key:"ア",label:"ラスパイレス指数では95、パーシェ指数では114。"},{key:"イ",label:"ラスパイレス指数では114、パーシェ指数では95。"},{key:"ウ",label:"ラスパイレス指数では114、パーシェ指数では120。"},{key:"エ",label:"ラスパイレス指数では120、パーシェ指数では95。"},{key:"オ",label:"ラスパイレス指数では120、パーシェ指数でも120。"}],correct:"オ",explanation:"ラスパイレス(基準年数量で加重) = (12×5+6×10)/(10×5+5×10) ×100 = 120/100 ×100 = 120。\nパーシェ(比較年数量で加重) = (12×5+6×9)/(10×5+5×9) ×100 = 114/95 ×100 ≒ 120。\n両方とも120。"},
  {id:"r7-eco-q6",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第6問",title:"第6問　景気循環の周期性",body:"景気循環の周期性に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　コンドラチェフ・サイクルは、約50年の周期をもつ景気循環で、大規模な技術革新などに起因して生じると考えられている。\nb　キチン・サイクルは、約20年の周期をもつ景気循環で、住宅や商工業建築の建て替えなどに起因して生じると考えられている。\nc　ジュグラー・サイクルは、約7〜10年の周期をもつ景気循環で、生産設備の更新投資などに起因して生じると考えられている。",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：正　c：誤"},{key:"ウ",label:"a：正　b：誤　c：正"},{key:"エ",label:"a：誤　b：正　c：正"},{key:"オ",label:"a：誤　b：正　c：誤"}],correct:"ウ",explanation:"a 正:コンドラチェフは約50年・技術革新が要因。\nb 誤:キチンは約40ヶ月(3〜4年)で在庫変動が要因。約20年で建築投資が要因なのはクズネッツ・サイクル。\nc 正:ジュグラーは約7〜10年・設備投資が要因。"},
  {id:"r7-eco-q7-1",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第7問",title:"第7問 設問1　45度線図の読み取り",body:"下図は45度線図である。Y0は現実のGDP、YFは完全雇用GDPであり、総供給AS=Y、総需要AD=C+I+G、消費関数 C=C0+c(Y-T) である。\n\nこの図に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　完全雇用GDP水準における総供給の大きさは、OJに等しい。\nb　現実のGDP水準における総需要の大きさは、OKである。\nc　デフレ・ギャップの大きさは、JKである。\nd　限界消費性向の大きさは、EH/FH である。",figure:"EcoQ7",options:[{key:"ア",label:"a：正　b：正　c：正　d：誤"},{key:"イ",label:"a：正　b：正　c：誤　d：正"},{key:"ウ",label:"a：正　b：誤　c：正　d：誤"},{key:"エ",label:"a：誤　b：正　c：正　d：誤"},{key:"オ",label:"a：誤　b：正　c：誤　d：正"}],correct:"ウ",explanation:"a 正:YFにおけるAS(45度線上)はOJに等しい。\nb 誤:現実のGDP=Y0における総需要はAD0上の点で、Y軸上ではOEに当たる。\nc 正:デフレ・ギャップは完全雇用水準でASとAD0との縦方向の差=JK。\nd 誤:限界消費性向はAD直線の傾き。EH/FHでは比が逆。"},
  {id:"r7-eco-q7-2",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第7問",title:"第7問 設問2　減税の効果",body:"減税によって総需要線がAD0からAD1にシフトしたとする。この減税の効果に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　減税による総需要の増加分は、KLである。\nb　減税によるGDPの増加分は、JLである。\nc　減税の租税乗数は、JL/JK である。",figure:"EcoQ7",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：正　c：誤"},{key:"ウ",label:"a：正　b：誤　c：誤"},{key:"エ",label:"a：誤　b：正　c：正"},{key:"オ",label:"a：誤　b：正　c：誤"}],correct:"オ",explanation:"a 誤:減税による総需要(AD)の増加分はAD0→AD1の縦方向シフト幅(KH=JK相当)。KLはGDP変化に伴う追加分も含む。\nb 正:GDPの増加分はY0→YL、すなわちJL。\nc 誤:租税乗数=ΔY/ΔT=-c/(1-c)。JL/JKは数値的に乗数の大きさを示すように見えるが、租税乗数の符号や定義からはずれる。"},
  {id:"r7-eco-q8",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第8問",title:"第8問　加速度原理",body:"加速度原理の考え方による投資の決定に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　生産量の増加が前期に比べて大きくなるとき、投資は増加していく。\nb　生産量の増加が前期と同じとき、投資の増加率はゼロになる。\nc　生産量の増加が前期に比べて小さくなると、投資はゼロになる。",options:[{key:"ア",label:"a：正　b：正　c：誤"},{key:"イ",label:"a：正　b：誤　c：正"},{key:"ウ",label:"a：正　b：誤　c：誤"},{key:"エ",label:"a：誤　b：正　c：誤"},{key:"オ",label:"a：誤　b：誤　c：正"}],correct:"ア",explanation:"加速度原理: I_t = v(Y_t - Y_{t-1})、すなわち投資はΔYに比例する。\na 正:ΔYが前期より大きい→Iは増加していく。\nb 正:ΔYが前期と同じ→Iは前期と同水準=増加率ゼロ。\nc 誤:ΔYが前期より小さくなっても、ΔY自体が正である限り投資は減少するが正の値で、ゼロにはならない。"},
  {id:"r7-eco-q9",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第9問",title:"第9問　フィッシャー方程式",body:"物価上昇率と利子率の関係に関する考え方にフィッシャー方程式がある。フィッシャー方程式に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　名目利子率は、実質利子率から期待物価上昇率を控除したものである。\nb　名目利子率が上昇しても、これと同じだけ物価上昇率が高くなると、実質利子率は変化しない。\nc　名目利子率が一定で将来の物価上昇が見込まれるとき、実質利子率は低下する。",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：正　c：誤"},{key:"ウ",label:"a：正　b：誤　c：正"},{key:"エ",label:"a：誤　b：正　c：正"},{key:"オ",label:"a：誤　b：正　c：誤"}],correct:"エ",explanation:"フィッシャー方程式: 名目利子率 = 実質利子率 + 期待物価上昇率。\na 誤:控除ではなく加算。\nb 正:両者が同じだけ動けば実質は不変。\nc 正:名目固定で期待インフレ上昇→実質利子率(=名目-期待インフレ)は低下。"},
  {id:"r7-eco-q10-1",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第10問",title:"第10問 設問1　IS-LM図の点の意味",body:"下図は、IS曲線とLM曲線を描いている。この図に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　点Eでは、生産物市場と貨幣市場が同時に均衡している。\nb　点Fでは、生産物市場は超過需要であるが、貨幣市場は均衡している。\nc　点Gでは、生産物市場は超過供給であり、貨幣市場は超過需要である。\nd　点Hでは、生産物市場は超過需要であり、貨幣市場は超過供給である。",figure:"EcoQ10",options:[{key:"ア",label:"a：正　b：正　c：誤　d：誤"},{key:"イ",label:"a：正　b：誤　c：正　d：誤"},{key:"ウ",label:"a：正　b：誤　c：誤　d：誤"},{key:"エ",label:"a：誤　b：正　c：誤　d：正"},{key:"オ",label:"a：誤　b：誤　c：正　d：誤"}],correct:"ウ",explanation:"IS左下=生産物超過需要、右上=超過供給。LM左上=貨幣超過需要、右下=超過供給。\na 正:E は両線交点で同時均衡。\nb 誤:F は IS の左下→生産物は超過需要、LM の左下→貨幣は超過供給。\nc 誤:G は IS 上方→超過供給、LM 上方→貨幣は超過需要。\nd 誤:H は IS の右下→生産物は超過供給、LM の右下→貨幣は超過供給。"},
  {id:"r7-eco-q10-2",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第10問",title:"第10問 設問2　IS-LM分析",body:"IS曲線とLM曲線に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　限界消費性向が大きいほどIS曲線の傾きはより緩やかになり、貨幣供給の増加によるGDPの拡大効果は大きくなる。\nb　投資の利子感応度が小さいほど、IS曲線の傾きはより急になり、貨幣供給の増加によるGDPの拡大効果は小さくなる。\nc　貨幣需要の所得感応度が大きいほど、LM曲線の傾きはより緩やかになり、政府支出の増加によるGDPの拡大効果は小さくなる。\nd　貨幣需要の利子感応度が大きいほど、LM曲線の傾きはより緩やかになり、政府支出の増加によるGDPの拡大効果は大きくなる。",options:[{key:"ア",label:"a：正　b：正　c：誤　d：正"},{key:"イ",label:"a：正　b：誤　c：正　d：誤"},{key:"ウ",label:"a：正　b：誤　c：誤　d：正"},{key:"エ",label:"a：誤　b：正　c：正　d：誤"},{key:"オ",label:"a：誤　b：正　c：誤　d：正"}],correct:"ア",explanation:"a 正:限界消費性向大→乗数大→IS は緩やか→金融政策によるGDP拡大効果は大。\nb 正:投資の利子感応度が小→IS が急→金融政策の効果は小。\nc 誤:貨幣需要の所得感応度が大→LM は急になる(緩やかではない)。\nd 正:貨幣需要の利子感応度が大→LM が緩やか→クラウディングアウト小→財政効果大。"},
  {id:"r7-eco-q11-1",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第11問",title:"第11問 設問1　経常収支の黒字拡大要因",body:"日本の経常収支の黒字を拡大させる方向に作用することが想定される要因の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　海外企業が提供するクラウドサービスに国内企業が支払う利用料の増加\nb　国内大手自動車メーカーが所有する海外子会社の利益の増大\nc　訪日外国人観光客の増加\nd　原油や天然ガスなどの資源価格の上昇",options:[{key:"ア",label:"aとb"},{key:"イ",label:"aとc"},{key:"ウ",label:"bとc"},{key:"エ",label:"bとd"},{key:"オ",label:"cとd"}],correct:"ウ",explanation:"a:サービス収支の支払増→赤字方向。\nb:海外子会社利益→第一次所得収支の黒字拡大方向。\nc:インバウンド消費はサービス輸出として旅行収支の黒字拡大方向。\nd:資源輸入額増→貿易赤字方向。\n→ b と c が黒字拡大要因。"},
  {id:"r7-eco-q11-2",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第11問",title:"第11問 設問2　為替レートと貿易収支",body:"円建ての貿易収支 NX = P・X(e) − e・P*・M(e) について(X(e)は輸出量、M(e)は輸入量、eは円建て為替レート、Pは円建て輸出財価格・一定、P*はドル建て輸入財価格・一定)、為替レートの変化が貿易収支に及ぼす影響に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　為替レートが変化しても輸出量と輸入量は変化しないとき、為替レートの円安・ドル高への変化は、貿易収支を悪化させる。\nb　輸入の価格弾力性と輸出の価格弾力性がいずれも1より大きいとき、為替レートの円安・ドル高への変化は、貿易収支を改善させる。\nc　輸入の価格弾力性と輸出の価格弾力性の合計が1に等しいとき、為替レートの円安・ドル高への変化は、貿易収支を悪化させる。",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：正　c：誤"},{key:"ウ",label:"a：正　b：誤　c：正"},{key:"エ",label:"a：誤　b：正　c：正"},{key:"オ",label:"a：誤　b：正　c：誤"}],correct:"イ",explanation:"マーシャル=ラーナー条件:輸出と輸入の価格弾力性合計が1超で円安が貿易収支を改善。\na 正:数量不変なら円安で輸入額(円建て)が増えるだけ→悪化(Jカーブの初期と同様)。\nb 正:両弾力性>1ならM-L条件成立で改善。\nc 誤:合計=1のときは改善も悪化もしない(中立)。"},
  {id:"r7-eco-q12",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第12問",title:"第12問　需要曲線・供給曲線のシフト",body:"完全競争市場における、ある上級財の需要曲線と供給曲線のシフトに関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　この財にとって代替的な財の価格が下落すると、需要曲線は右方向にシフトするが、供給曲線は変化しない。\nb　消費者の保有する資産額が増加すると、需要曲線は左方向にシフトするが、供給曲線は変化しない。\nc　この財を生産する企業に生産物1単位当たり定額の補助金が交付されると、供給曲線は左方向にシフトするが、需要曲線は変化しない。\nd　この財を生産するに際しての原材料費が増加すると、供給曲線は左方向にシフトするが、需要曲線は変化しない。",options:[{key:"ア",label:"a：正　b：正　c：誤　d：正"},{key:"イ",label:"a：正　b：誤　c：正　d：誤"},{key:"ウ",label:"a：誤　b：正　c：誤　d：正"},{key:"エ",label:"a：誤　b：誤　c：正　d：誤"},{key:"オ",label:"a：誤　b：誤　c：誤　d：正"}],correct:"オ",explanation:"a 誤:代替財価格が下がると消費者は代替財に流れて当該財の需要は左シフト。\nb 誤:上級財は資産増で需要が右シフト(所得効果プラス)。\nc 誤:単位当たり補助金は供給曲線を右(下方)にシフトさせる。\nd 正:原材料費増は供給曲線を左(上方)にシフト。"},
  {id:"r7-eco-q13",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第13問",title:"第13問　需要の価格弾力性",body:"需要の価格弾力性(絶対値)に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　需要の価格弾力性がゼロであれば、価格の上昇によっても消費者の支出総額は変化しない。\nb　需要の価格弾力性が1より大きければ、価格の下落によって消費者の支出総額は増加する。\nc　同一の財について長期間で計った需要の価格弾力性は、短期間で計った場合よりも低くなりやすい。\nd　需要曲線が横軸に水平な直線である場合、需要の価格弾力性は無限大である。",options:[{key:"ア",label:"a：正　b：正　c：正　d：誤"},{key:"イ",label:"a：正　b：誤　c：正　d：誤"},{key:"ウ",label:"a：誤　b：正　c：誤　d：正"},{key:"エ",label:"a：誤　b：誤　c：正　d：正"},{key:"オ",label:"a：誤　b：誤　c：誤　d：誤"}],correct:"ウ",explanation:"a 誤:弾力性ゼロは数量不変なので、価格上昇で支出額は増加。\nb 正:弾力性>1のとき価格下落で売上(支出)は増加。\nc 誤:長期は代替の余地が広がるため弾力性は通常大きい(短期より高い)。\nd 正:横軸に水平=価格水準で無限の量が需要され弾力性は∞。"},
  {id:"r7-eco-q14",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第14問",title:"第14問　代替効果と所得効果",body:"ある家計が所得をすべて使ってX財とY財の消費に充てる。当初、予算制約線AB の下で点 F で最適消費が達成。X財の価格が変化し、予算制約線がACにシフトしたことで、最適消費点は H に。AB と点 F で接する無差別曲線に対して、AC と同じ傾きの直線 DE が点 G で接する。\n\nこの図に関する記述の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　上級財であるX財の消費量は、代替効果で増加し、所得効果でも増加した。\nb　下級財であるX財の消費量は、代替効果で減少し、所得効果でも減少した。\nc　上級財であるY財の消費量は、代替効果で減少し、所得効果では増加した。\nd　上級財であるY財の消費量は、代替効果で増加し、所得効果でも増加した。",figure:"EcoQ14",options:[{key:"ア",label:"a と c"},{key:"イ",label:"a と d"},{key:"ウ",label:"b と c"},{key:"エ",label:"b と d"}],correct:"ア",explanation:"X財価格低下のとき、F→Gが代替効果(X増・Y減)、G→Hが所得効果(両財とも上級なら増)。\na 正:X財は代替で増加、所得でも増加(上級財)。\nc 正:Y財は代替で減少、所得効果で増加(上級財)。\nb,d は方向が逆で誤。"},
  {id:"r7-eco-q15-1",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第15問",title:"第15問 設問1　限界費用",body:"限界費用に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　限界費用が一定のとき、供給の価格弾力性はゼロになる。\nb　生産量の増加とともに平均可変費用が上昇するとき、限界費用も逓増している。\nc　平均固定費用の低下は、限界費用を低下させる。\nd　平均費用が最小のとき、限界費用も最小である。",options:[{key:"ア",label:"a：正　b：正　c：誤　d：正"},{key:"イ",label:"a：正　b：誤　c：正　d：誤"},{key:"ウ",label:"a：誤　b：正　c：正　d：誤"},{key:"エ",label:"a：誤　b：正　c：誤　d：正"},{key:"オ",label:"a：誤　b：正　c：誤　d：誤"}],correct:"オ",explanation:"a 誤:MC一定(水平)は供給曲線も水平で、弾力性は無限大。\nb 正:AVC上昇区間ではMC>AVCが成立しMCも逓増している。\nc 誤:平均固定費用は固定費÷数量で、MCには影響しない。\nd 誤:AC=MC となるのは AC が最小の点。MC は AC 最小点で増加途中(MC 自体の最小点ではない)。"},
  {id:"r7-eco-q15-2",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第15問",title:"第15問 設問2　MC曲線と価格",body:"下図は、ある財を生産する企業の限界費用曲線 MC と当該財の価格 P を表している。\n\nこの図に関する記述の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　生産量がQ2のときの総収入は、(2)と(4)を合わせたものである。\nb　生産量がQ2のときの固定費用と利潤の合計は、(1)と(3)を合わせたものである。\nc　生産量をQ2からQ1に減らすと、固定費用は(4)の分だけ減少する。\nd　生産量をQ2からQ3に増やすと、(5)の分だけ追加的な損失が発生する。",figure:"EcoQ15_2",options:[{key:"ア",label:"a と b"},{key:"イ",label:"a と c"},{key:"ウ",label:"b と c"},{key:"エ",label:"b と d"},{key:"オ",label:"c と d"}],correct:"エ",explanation:"a 誤:Q2のときの総収入=P×Q2=(1)+(2)+(3)+(4)。\nb 正:総収入-可変費用(MC下の面積)=粗利益=(1)+(3)。これは固定費+利潤に等しい。\nc 誤:固定費は数量によらず一定。減少するのは可変費用。\nd 正:Q2→Q3に増やすと、Q2以降は MC>P なので追加収入より追加費用が大きく、その差(5)が追加損失。"},
  {id:"r7-eco-q16",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第16問",title:"第16問　独占企業の利潤最大化と総収入最大化",body:"独占市場を示した下図において、需要曲線がD、MCが企業の限界費用、MRが限界収入である。この独占企業が利潤の最大化を図る場合の価格と、総収入の最大化を図る場合の価格の組み合わせとして、最も適切なものを下記の解答群から選べ。",figure:"EcoQ16",options:[{key:"ア",label:"利潤最大化：P1　総収入最大化：P2"},{key:"イ",label:"利潤最大化：P1　総収入最大化：P3"},{key:"ウ",label:"利潤最大化：P2　総収入最大化：P1"},{key:"エ",label:"利潤最大化：P2　総収入最大化：P3"},{key:"オ",label:"利潤最大化：P3　総収入最大化：P2"}],correct:"イ",explanation:"利潤最大化はMR=MC を満たす Q を求め、その Q に対応する D 上の価格を読む→P1(最高)。\n総収入最大化は MR=0 の点(需要曲線中点)→P3(中段)。\nP2 は完全競争(MC=D)の価格。\n上から P1 > P3 > P2 の順。"},
  {id:"r7-eco-q17",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第17問",title:"第17問　負の外部性",body:"工場排水のような負の外部性が伴う場合の市場均衡を考える。需要曲線D、私的限界費用曲線S0、社会的限界費用曲線S1が描かれている。市場均衡は点Hで、均衡価格P・均衡取引量Q。社会的最適点は点E。\n\nこの図に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　市場均衡の下での生産者余剰は、三角形PBHである。\nb　市場均衡の下での外部費用は、四角形EFHGである。\nc　市場均衡の下で生じる厚生上の損失は、三角形EHGである。\nd　最適点が達成された場合の社会的余剰は、三角形ACEである。",figure:"EcoQ17",options:[{key:"ア",label:"a：正　b：正　c：正　d：誤"},{key:"イ",label:"a：正　b：正　c：誤　d：誤"},{key:"ウ",label:"a：正　b：誤　c：正　d：正"},{key:"エ",label:"a：誤　b：正　c：誤　d：正"},{key:"オ",label:"a：誤　b：誤　c：正　d：誤"}],correct:"ウ",explanation:"a 正:生産者余剰は価格Pと私的MC(S0)で囲まれる△PBH。\nb 誤:外部費用はS1とS0の差(取引量Qhまで)に相当する四角形(BCGH 系)で、EFHG ではない。\nc 正:過大生産による厚生損失(死荷重)は△EHG。\nd 正:社会的最適点 E での社会的余剰=△ACE。"},
  {id:"r7-eco-q18-1",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第18問",title:"第18問 設問1　自由貿易下の状況",body:"国際市場でPfの価格が成立している国際的に規格化された財。国内需要曲線D・国内供給曲線S・閉鎖経済価格Pc。当初は自由貿易、その後関税賦課でPdに上昇。自由貿易下の状況に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　この財を生産する国内企業の供給量はQ4である。\nb　消費者余剰は、閉鎖経済の場合に比べて四角形PcPfIBだけ大きい。\nc　生産者余剰は、閉鎖経済の場合に比べて四角形PdPfFCだけ小さい。\nd　社会的余剰は、閉鎖経済の場合に比べて三角形BFIだけ大きい。",figure:"EcoQ18",options:[{key:"ア",label:"a：正　b：正　c：正　d：誤"},{key:"イ",label:"a：正　b：誤　c：誤　d：正"},{key:"ウ",label:"a：誤　b：正　c：正　d：正"},{key:"エ",label:"a：誤　b：正　c：正　d：誤"},{key:"オ",label:"a：誤　b：正　c：誤　d：正"}],correct:"オ",explanation:"a 誤:国際価格Pfにおいて国内供給はQ1(S曲線上の点)。Q4は国内需要量。\nb 正:消費者余剰の増分=台形PcPfIB。\nc 誤:生産者余剰の縮小は閉鎖経済価格 Pc から自由貿易価格 Pf への低下分なので台形 Pc Pf F B 系。PdPfFC は関税絡みで文脈不一致。\nd 正:自由貿易のメリットは△BFI。"},
  {id:"r7-eco-q18-2",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第18問",title:"第18問 設問2　関税の効果",body:"自由貿易から関税政策に移行したことの効果に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　輸入量の減少分は、線分Q1Q2と線分Q3Q4の合計である。\nb　消費者余剰は、自由貿易体制の場合に比べて四角形PdPfIEだけ小さくなる。\nc　関税による政府の収入は、四角形PdPfHEである。\nd　関税の導入に伴う厚生上の損失は、四角形CFIEである。",figure:"EcoQ18",options:[{key:"ア",label:"a：正　b：正　c：誤　d：正"},{key:"イ",label:"a：正　b：正　c：誤　d：誤"},{key:"ウ",label:"a：正　b：誤　c：正　d：誤"},{key:"エ",label:"a：誤　b：正　c：正　d：誤"},{key:"オ",label:"a：誤　b：誤　c：誤　d：正"}],correct:"イ",explanation:"a 正:輸入の減少=(国内供給増 Q1→Q2)+(国内需要減 Q3←Q4)の合計。\nb 正:消費者余剰の減少は台形 PdPfIE。\nc 誤:政府の関税収入=関税幅×輸入量=四角形(Q2-Q3 範囲、Pf-Pd 高さ)で、PdPfHE は範囲が違う。\nd 誤:厚生上の損失は△CFH と△EHI の2つの三角形(死荷重)で、四角形ではない。"},
  {id:"r7-eco-q19",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第19問",title:"第19問　基礎控除付き比例税",body:"下図は、所得税において一定の所得水準までは課税しない基礎控除の効果を考えるため、線形の課税線OABを描いている。AB部分は T = t(Y − A)(Yは所得、Tは税額、tは比例税率、Aは基礎控除額)で定義される。\n\nこの図に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　所得Y1を得る者と所得Y2を得る者では、追加的な同額の所得に対して課せられる税額が等しい。\nb　所得全体に占める税額の割合は、所得Y1を得る者の方が所得Y2を得る者よりも大きい。\nc　税率を一定にしたまま基礎控除額をY0まで引き上げることによる減税額は、所得Y2を得る者の方が所得Y1を得る者よりも大きい。",figure:"EcoQ19",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：正　c：誤"},{key:"ウ",label:"a：正　b：誤　c：誤"},{key:"エ",label:"a：誤　b：正　c：誤"},{key:"オ",label:"a：誤　b：誤　c：正"}],correct:"ウ",explanation:"a 正:限界税率は両者ともtで同じ。\nb 誤:基礎控除があるので平均税率は所得が大きいほど高い→Y2の方が大きい(累進的)。\nc 誤:基礎控除引上げによる減税額は t×(Y0-A) で両者とも同じ。"},
  {id:"r7-eco-q20",exam:"中小企業診断士",year:"R7",subject:"経済学・経済政策",examLabel:"R7 経済学",parent:"第20問",title:"第20問　ローレンツ曲線",body:"下図は、縦軸に所得累積比率、横軸に世帯累積比率をはかったときのローレンツ曲線を示している。この図に関する記述として、最も適切なものを下記の解答群から選べ。",figure:"EcoQ20",options:[{key:"ア",label:"aのローレンツ曲線は、所得が1つの世帯に集中している状態を表している。"},{key:"イ",label:"bのローレンツ曲線は、cのローレンツ曲線よりも所得がより不平等に分布している。"},{key:"ウ",label:"ローレンツ曲線がcの場合のジニ係数は、ローレンツ曲線がbの場合のジニ係数より大きい値となる。"},{key:"エ",label:"ローレンツ曲線が線分OBAで表される場合、ジニ係数はゼロである。"}],correct:"ウ",explanation:"ジニ係数は45度線とローレンツ曲線で囲まれた面積の2倍。曲線が下に膨らむほど不平等度が大きくジニ係数も大きい。\nア 誤:1世帯集中なら線分 OBA(L字)になる。a は中程度の不平等。\nイ 誤:b より c の方が下に膨らむ→c の方が不平等。\nウ 正:c が最も不平等→ジニ係数は c>b。\nエ 誤:OBA は完全不平等を意味しジニ係数=1。"},
];

const QUESTIONS_ECO_R6 = [
  {id:"r6-eco-q1",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第1問",title:"第1問　名目GDE(国内総支出)の内訳",body:"下図は、日本の2022年の名目国内総支出(559兆7,101億円)の内訳を示したものである。図中のA〜Cに該当する項目の組み合わせとして、最も適切なものを下記の解答群から選べ。(注:「その他」の中に純輸出のマイナス分がカウントされている)",figure:"EcoR6Q1",options:[{key:"ア",label:"A：政府最終消費支出　B：民間最終消費支出　C：一般政府の総固定資本形成"},{key:"イ",label:"A：政府最終消費支出　B：民間最終消費支出　C：非金融法人企業の総固定資本形成"},{key:"ウ",label:"A：民間最終消費支出　B：一般政府の総固定資本形成　C：非金融法人企業の総固定資本形成"},{key:"エ",label:"A：民間最終消費支出　B：政府最終消費支出　C：一般政府の総固定資本形成"},{key:"オ",label:"A：民間最終消費支出　B：政府最終消費支出　C：非金融法人企業の総固定資本形成"}],correct:"オ",explanation:"【論点・背景】国内総支出(GDE)は支出面から見たGDPで、『民間最終消費支出＋政府最終消費支出＋総固定資本形成＋在庫変動＋純輸出(輸出−輸入)』で構成される。各項目の規模感を覚えておくことが鍵。\n\n【図の読み方と各項目の規模】日本のGDP(約559兆円)の支出内訳は概ね、民間最終消費支出が最大で全体の約55％、政府最終消費支出が約21〜22％、総固定資本形成が約25％(うち民間企業設備＝非金融法人企業の総固定資本形成が約17％、住宅・公的固定資本形成が残り)。\n・A＝55.6％ → 最大項目なので民間最終消費支出。\n・B＝21.6％ → 政府最終消費支出。\n・C＝17.4％ → 総固定資本形成の最大部分である非金融法人企業の総固定資本形成(民間企業設備投資)。\n\n【誤答の検討とキーワードの意味】Aを『政府最終消費支出』とする選択肢は、消費の最大主体が家計(民間)である点に反し誤り。Cを『一般政府の総固定資本形成(公共投資)』とする選択肢は、公共投資は対GDP比で約5％程度にとどまり17.4％には届かないため誤り。17.4％の規模に合うのは企業の設備投資(非金融法人企業の総固定資本形成)。なお『その他5.4％』に純輸出のマイナス(貿易赤字)等が含まれる点も図の注で示されている。"},
  {id:"r6-eco-q2",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第2問",title:"第2問　1人当たり労働生産性の国際比較",body:"下図は、日本・米国・韓国・OECD平均の1人当たり労働生産性(購買力平価換算USドル表示)の推移(2010〜2021年)を示したものである。図中のa〜cに該当する国の組み合わせとして、最も適切なものを下記の解答群から選べ。",figure:"EcoR6Q2",options:[{key:"ア",label:"a：韓国　b：米国　c：日本"},{key:"イ",label:"a：日本　b：韓国　c：米国"},{key:"ウ",label:"a：日本　b：米国　c：韓国"},{key:"エ",label:"a：米国　b：韓国　c：日本"},{key:"オ",label:"a：米国　b：日本　c：韓国"}],correct:"エ",explanation:"【論点・背景】1人当たり労働生産性(就業者1人が生み出す付加価値)の国際比較。日本の生産性が主要国・OECD平均と比べて伸び悩んでいることが近年の重要論点。\n\n【図の読み方】\n・a:OECD平均(点線)を大きく上回り、最も高い水準で右肩上がりに推移して2021年に約15万ドルへ。主要国で労働生産性が最も高いのは米国であり、a＝米国。\n・bとc:いずれもOECD平均を下回る2本。これが日本と韓国。韓国は近年生産性を急速に伸ばし、2010年代後半に日本を上回った。図でも終盤にb(細い実線)がc(破線)を上回るため、b＝韓国、c＝日本。\n\n【誤答の検討】aを『日本』『韓国』とする選択肢は、最上位＝米国という事実に反し誤り。c(最終的に下位)を『韓国』とする選択肢は、韓国が日本を逆転した近年の傾向に反し誤り。日本の労働生産性がOECD平均を下回り、かつ韓国に抜かれているという『日本の生産性の伸び悩み』を図から読み取れるかが問われている。"},
  {id:"r6-eco-q3",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第3問",title:"第3問　消費者物価(コア)の国際比較",body:"下図は、日本・米国・ユーロ圏の消費者物価(食料及びエネルギーを除く総合、前年比、％)の推移を示したものである。図中のa〜cに該当する国・地域の組み合わせとして、最も適切なものを下記の解答群から選べ。",figure:"EcoR6Q3",options:[{key:"ア",label:"a：日本　b：米国　c：ユーロ圏"},{key:"イ",label:"a：米国　b：日本　c：ユーロ圏"},{key:"ウ",label:"a：米国　b：ユーロ圏　c：日本"},{key:"エ",label:"a：ユーロ圏　b：日本　c：米国"},{key:"オ",label:"a：ユーロ圏　b：米国　c：日本"}],correct:"ウ",explanation:"【論点・背景】コロナ後の世界的インフレ局面における各国・地域のコアインフレ率(変動の大きい食料・エネルギーを除いた基調的な物価)の比較。インフレの大きさと時期に地域差が出た。\n\n【図の読み方】\n・a:2022年にかけて最も早く・最も高く上昇し、ピークが6〜7％に達している。これは2021〜2022年に世界に先駆けてコアインフレが高進した米国。a＝米国。\n・b:aにやや遅れて立ち上がり、ピークがaより低い5％前後。これはエネルギー危機の影響で米国に遅れて上昇したユーロ圏。b＝ユーロ圏。\n・c:一貫して最も低く、2020〜2021年には0％近傍やマイナスで推移し、上昇も遅く小幅。長くデフレ基調だった日本。c＝日本。\n\n【誤答の検討】aを『日本』『ユーロ圏』とする選択肢は、最も早く高く上昇した＝米国という事実に反し誤り。cを『米国』『ユーロ圏』とする選択肢は、最も低位で推移したのが日本である点に反し誤り。『米国が先行・最大、ユーロ圏が追随、日本は低位・遅行』という順序を図から読み取る。"},
  {id:"r6-eco-q4",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第4問",title:"第4問　国民経済計算(GDPの考え方)",body:"国民経済計算の考え方に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"GDPは、中間生産物の生産額の合計である。"},{key:"イ",label:"GDPは、分配面から、要素所得、移転支払による所得、キャピタルゲインに区分される。"},{key:"ウ",label:"高等学校の授業料を無償化すると、無償化された授業料の分だけGDPが減少する。"},{key:"エ",label:"子どもが家庭内で家事を担ったとしても、GDPには計上されない。"}],correct:"エ",explanation:"【論点・背景】GDPは『一定期間に国内で新たに生み出された付加価値の合計』。何が計上され何が計上されないかを、付加価値・市場取引・帰属計算の観点から問う基本問題。\n\n【正答】『家庭内の家事はGDPに計上されない』が正しい。GDPは原則として市場で取引されたものを対象とし、対価を伴わない家庭内の家事・育児等の自家サービスは計上されない(これがGDPの限界としてよく指摘される論点)。\n\n【誤答の検討とキーワードの意味】\n・『GDPは中間生産物の生産額の合計』は誤り。GDPは最終生産物の付加価値の合計で、中間生産物(他の財の生産に使われる原材料等)の価額は二重計算を避けるため控除される。\n・『分配面から要素所得・移転支払による所得・キャピタルゲインに区分』は誤り。分配面のGDP(GDI)は雇用者報酬・営業余剰/混合所得・(生産輸入品に課される税−補助金)・固定資本減耗から成る。移転支払(対価を伴わない再分配)やキャピタルゲイン(資産価格変動による利得)は生産活動による付加価値ではないため含まれない。\n・『高校授業料の無償化でGDPがその分減少』は誤り。無償化は家計負担が政府負担に替わるだけで教育サービスの提供は続き、政府最終消費支出として計上されるためGDPは減少しない。"},
  {id:"r6-eco-q5",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第5問",title:"第5問　ケインズ型消費関数",body:"下図は、ケインズ型消費関数を直線ABによって描いている。この図に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　可処分所得が大きいほど限界消費性向が小さくなるので、高所得者ほど所得に占める消費額の割合が小さくなる。\nb　可処分所得が増加するとき、限界消費性向は一定であるが、平均消費性向は小さくなる。\nc　この消費関数の傾きは、1よりも大きい。",figure:"EcoR6Q5",options:[{key:"ア",label:"a：正　b：正　c：誤"},{key:"イ",label:"a：正　b：誤　c：誤"},{key:"ウ",label:"a：誤　b：正　c：正"},{key:"エ",label:"a：誤　b：正　c：誤"},{key:"オ",label:"a：誤　b：誤　c：正"}],correct:"エ",explanation:"【論点・背景】ケインズ型消費関数は C＝C0＋c・Yd(C0＝基礎消費＞0、c＝限界消費性向、0＜c＜1)という一次関数(直線)。直線ABの『切片A＝基礎消費』『傾き＝限界消費性向』という対応を押さえることが核心。\n\n【各記述の検討】\n・a(誤):直線の消費関数では傾き＝限界消費性向(MPC)は一定である。『可処分所得が大きいほど限界消費性向が小さくなる』は誤り。なお『高所得者ほど所得に占める消費額の割合(＝平均消費性向APC)が小さくなる』こと自体は正しいが、その理由はMPCの低下ではなく、APC＝C/Yd＝C0/Yd＋c が所得増で C0/Yd の項が小さくなるためである。理由づけが誤っているため記述全体として誤り。\n・b(正):限界消費性向(傾き)は一定だが、平均消費性向 APC＝C/Yd＝C0/Yd＋c は可処分所得Ydの増加とともに小さくなる(基礎消費C0の影響が薄まるため)。正しい。\n・c(誤):消費関数の傾き＝限界消費性向 c は 0＜c＜1 であり、1より小さい。『1より大きい』は誤り。\n\n【まとめ】a誤・b正・c誤。限界消費性向(一定・1未満)と平均消費性向(所得増で逓減)の区別が要点。"},
  {id:"r6-eco-q6",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第6問",title:"第6問　貨幣需要(取引・予備・投機的動機)",body:"貨幣需要に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　貨幣は流動性が高いので、利子率の上昇によって取引動機による貨幣需要は増加する。\nb　現金は物価上昇によって価値が増加するので、利子率の上昇によって資産選択の動機による貨幣需要は減少する。\nc　現金は安全性の高い金融資産であり、利子率の上昇によって資産選択の動機による貨幣需要は減少する。\nd　将来の不確実性が高いと見込まれるとき、利子率の上昇は予備的な動機による貨幣需要を増加させる。",options:[{key:"ア",label:"a：正　b：誤　c：誤　d：正"},{key:"イ",label:"a：誤　b：正　c：正　d：誤"},{key:"ウ",label:"a：誤　b：正　c：誤　d：誤"},{key:"エ",label:"a：誤　b：誤　c：正　d：誤"},{key:"オ",label:"a：誤　b：誤　c：誤　d：正"}],correct:"エ",explanation:"【論点・背景】ケインズの流動性選好説では、貨幣需要は(1)取引動機・(2)予備的動機(ともに主に所得に依存)と、(3)投機的動機＝資産選択の動機(利子率に依存)に分けられる。利子率は『貨幣を保有することの機会費用』である点が判断の軸。\n\n【各記述の検討】\n・a(誤):取引動機による貨幣需要は主に取引量(所得)に依存し、利子率の上昇で増加するとは言えない。むしろ利子率上昇は貨幣保有の機会費用を高めるため、取引上の貨幣保有はむしろ節約される方向。『利子率上昇で取引動機需要が増加』は誤り。\n・b(誤):『現金は物価上昇によって価値が増加する』が誤り。物価上昇(インフレ)では現金の実質価値はむしろ減少する。理由が誤っているため記述全体として誤り。\n・c(正):投機的動機(資産選択の動機)による貨幣需要は利子率の減少関数。利子率が上昇すると債券保有の魅力が高まり(機会費用増)、貨幣需要は減少する。正しい。\n・d(誤):予備的動機による貨幣需要は将来の不確実性や所得に依存する。利子率の上昇は貨幣保有の機会費用を高めるため予備的な貨幣需要をむしろ抑制する方向で、『利子率上昇が予備的動機需要を増加させる』とは言えず誤り。\n\n【まとめ】a誤・b誤・c正・d誤。利子率に明確に反応するのは投機的(資産選択)動機(減少関数)である点が核心。"},
  {id:"r6-eco-q7",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第7問",title:"第7問　減税の乗数効果",body:"生産物市場の均衡条件が以下のように表されるとき、減税の乗数効果を大きくするものとして、最も適切なものを下記の解答群から選べ。\n均衡条件 Y＝C＋I＋G、消費関数 C＝C0＋c(Y−T)、投資 I＝I0、政府支出 G＝G0。Yは所得、cは限界消費性向(0＜c＜1)、Tは租税。",options:[{key:"ア",label:"基礎消費の増加"},{key:"イ",label:"限界消費性向の上昇"},{key:"ウ",label:"限界貯蓄性向の上昇"},{key:"エ",label:"政府支出の増加"},{key:"オ",label:"投資支出の増加"}],correct:"イ",explanation:"【途中式・導出】均衡条件に各式を代入する。\nY＝C0＋c(Y−T)＋I0＋G0\nY−cY＝C0−cT＋I0＋G0\nY(1−c)＝C0−cT＋I0＋G0\nY＝(C0−cT＋I0＋G0)/(1−c)\n租税Tの変化に対する所得Yの変化(減税乗数)は、上式をTで偏微分して\nΔY/ΔT＝−c/(1−c)。\nしたがって減税(ΔT＜0)による所得増の大きさ(乗数効果の絶対値)は c/(1−c)。\n\n【正答】この値 c/(1−c) は限界消費性向 c の増加関数(cが大きいほど大きくなる)。よって『限界消費性向の上昇』が減税の乗数効果を大きくする。\n例:c＝0.6なら c/(1−c)＝0.6/0.4＝1.5。c＝0.8なら 0.8/0.2＝4.0と大きくなる。\n\n【誤答の検討とキーワードの意味】\n・『限界貯蓄性向の上昇』は、限界貯蓄性向 s＝1−c の上昇＝c の低下を意味し、c/(1−c)は小さくなるため誤り。\n・『基礎消費の増加』『政府支出の増加』『投資支出の増加』は、いずれも独立支出(分子)の水準を変えるだけで、乗数(1/(1−c)や c/(1−c))そのものの大きさには影響しないため、減税の『乗数効果(倍率)』を大きくするものではなく誤り。乗数の大きさを決めるのは限界消費性向 c である点が核心。"},
  {id:"r6-eco-q8",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第8問",title:"第8問　ビルトイン・スタビライザー",body:"財政の自動安定化装置(ビルトイン・スタビライザー)としての機能が比較的強いと想定される税の仕組みとして、最も適切な組み合わせを下記の解答群から選べ。\n\na　利潤に対して累進的に課せられる法人所得税\nb　全ての人に同額が課せられる定額税\nc　生活必需品に対して課せられる消費税\nd　一定額までの所得には課税を免除する個人所得税",options:[{key:"ア",label:"aとb"},{key:"イ",label:"aとc"},{key:"ウ",label:"aとd"},{key:"エ",label:"bとc"},{key:"オ",label:"bとd"}],correct:"ウ",explanation:"【論点・背景】ビルトイン・スタビライザー(財政の自動安定化装置)とは、景気変動に応じて税収や歳出が自動的に変動し、裁量的な政策発動なしに景気を安定化させる仕組み。所得や利潤に連動し、かつ累進的な税ほどこの機能が強い(好況時に税収が大きく増えて過熱を抑え、不況時に税収が減って下支えする)。\n\n【各記述の検討】\n・a(機能強い):利潤に累進的に課す法人所得税。好況で利潤が増えると税収が累進的に大きく増え、景気の過熱を自動的に抑制する。○\n・d(機能強い):一定額までの所得を非課税とする個人所得税。課税最低限の存在により実効的に累進的となり、所得の増減に応じて税収が変動する。○\n・b(機能弱い):全員に同額の定額税(人頭税)は、所得や景気に関係なく税額が一定で、景気に応じた自動変動が起きないため安定化機能を持たない。×\n・c(機能弱い):生活必需品への消費税は、必需品の需要が景気に対して安定的(非弾力的)なため税収が景気にあまり連動せず、安定化機能は弱い。×\n\n【まとめ】所得・利潤に連動し累進性を持つ a と d の組み合わせが、自動安定化機能が比較的強い。"},
  {id:"r6-eco-q9",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第9問",title:"第9問　為替レートの決定",body:"日本(円)と米国(ドル)を例に為替レートの決定を考える。為替レートの決定に関する記述として、最も適切な組み合わせを下記の解答群から選べ。\n\na　輸出の増加によって日本の経常収支の黒字が拡大すると、為替レートには円高ドル安の圧力が働く。\nb　輸出の増加によって日本の経常収支の黒字が拡大すると、為替レートには円安ドル高の圧力が働く。\nc　米国の金融資産の収益率が高くなり日米の収益率格差が拡大すると、日本の金融収支は赤字になり、為替レートには円高ドル安の圧力が働く。\nd　米国の金融資産の収益率が高くなり日米の収益率格差が拡大すると、日本の金融収支は黒字になり、為替レートには円安ドル高の圧力が働く。",options:[{key:"ア",label:"aとc"},{key:"イ",label:"aとd"},{key:"ウ",label:"bとc"},{key:"エ",label:"bとd"}],correct:"イ",explanation:"【論点・背景】為替レートは、財・サービスの取引(経常収支)と資本の移動(金融収支)の両面から、通貨の需要・供給を通じて決まる。『どちらの通貨が買われるか(需要が増えるか)』で円高・円安を判断する。\n\n【各記述の検討】\n・a(正):輸出増で経常収支の黒字が拡大すると、輸出企業が受け取ったドルを円に換える(円買い・ドル売り)動きが強まり、円の需要が増えて円高ドル安の圧力が働く。○\n・b(誤):aと逆で誤り。経常黒字の拡大は円高方向に働く。\n・d(正):米国の金融資産の収益率が日本より高くなると、より高い利回りを求めて日本から米国へ資金が流出する。日本居住者が対外金融資産を積み増すため日本の金融収支は黒字(対外純資産の増加)となり、その際に円を売ってドルを買うため円安ドル高の圧力が働く。○\n・c(誤):同じ資金流出の局面で『金融収支は赤字・円高ドル安』とするのは、金融収支の符号(対外資産の純取得増＝黒字)と為替の方向(ドル買い＝円安)をいずれも取り違えており誤り。\n\n【まとめ】経常黒字拡大→円高(a)、対外への資金流出(金融収支黒字)→円安(d)。aとdの組み合わせが正しい。金融収支は『資産の純取得−負債の純増』で、資本流出時にプラス(黒字)になる点がキーワード。"},

  {id:"r6-eco-q10",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第10問",title:"第10問　マンデル=フレミング・モデル(政府支出拡大)",body:"下図によって、完全資本移動かつ小国のマンデル=フレミング・モデルを考える。政府支出拡大の効果に関する記述として、最も適切な組み合わせを下記の解答群から選べ。\n\na　この国が為替レートを維持しようとするならば、政府支出の拡大は、為替レート維持のための自国通貨の売り介入に伴う貨幣供給の増加と相まって、自国のGDPを増加させることができる。\nb　この国が為替レートを維持しようとするならば、政府支出を拡大させても、為替レート維持のための自国通貨の買い介入に伴う貨幣供給の減少と相まって、自国のGDPを減少させてしまう。\nc　この国が為替レートの変動を市場に任せるとき、政府支出を拡大させても、その効果は資本流入の増加による自国通貨高によって完全なクラウディング・アウトが生じ、自国のGDPは増加しない。\nd　この国が為替レートの変動を市場に任せるとき、政府支出の拡大は、為替レートを減価させ、自国のGDPを増加させる。",figure:"EcoR6Q10",options:[{key:"ア",label:"aとc"},{key:"イ",label:"aとd"},{key:"ウ",label:"bとc"},{key:"エ",label:"bとd"}],correct:"ア",explanation:"【論点・背景】完全資本移動・小国のマンデル=フレミング・モデルでは、BP曲線が世界利子率の水準で水平になる。財政・金融政策の有効性が、固定相場制か変動相場制かで正反対になるのが最重要論点。\n\n【固定相場制(為替レートを維持)の場合】政府支出拡大→IS右シフト→国内利子率に上昇圧力→世界より高い利子率を求めて資本流入→自国通貨高の圧力。為替を維持するため中央銀行は自国通貨を売る(外貨買い)介入を行う→貨幣供給増加→LM右シフト→GDPはさらに増加。よって財政政策は有効。\n・aは『自国通貨の売り介入→貨幣供給増→GDP増加』で正しい。\n・bは『自国通貨の買い介入→貨幣供給減→GDP減少』としているが、財政拡大は通貨高圧力を生むため介入は『売り』であり、方向が逆で誤り。\n\n【変動相場制(為替を市場に任せる)の場合】政府支出拡大→利子率上昇→資本流入→自国通貨高→純輸出が減少→IS左シフトで元に戻る(完全なクラウディング・アウト)→GDPは増加しない。よって財政政策は無効。\n・cは『自国通貨高による完全なクラウディング・アウトでGDPは増加しない』で正しい。\n・dは『為替レートを減価(通貨安)させGDPを増加させる』としているが、財政拡大は通貨高(増価)を招くため誤り。\n\n【まとめ】固定相場ではaが正、変動相場ではcが正。よってaとc。財政政策は固定相場で有効・変動相場で無効、という結論を押さえる(金融政策はその逆)。"},
  {id:"r6-eco-q11-1",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第11問",title:"第11問 設問1　政府支出増加の長期的効果",body:"IS曲線とLM曲線が下図のように描かれ、Y0は完全雇用GDPであるとする。政府支出増加の長期的な効果に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　実質GDPを増加させる。\nb　物価を上昇させる。\nc　利子率を上昇させる。",figure:"EcoR6Q11",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：正　c：誤"},{key:"ウ",label:"a：正　b：誤　c：誤"},{key:"エ",label:"a：誤　b：正　c：正"},{key:"オ",label:"a：誤　b：正　c：誤"}],correct:"エ",explanation:"【論点・背景】長期では物価が伸縮的に調整され、実質GDPは完全雇用GDP(Y0、潜在GDP)の水準に戻る、という古典派的な長期均衡が前提。短期と長期で結論が変わる点が核心。\n\n【各記述の検討】\n・a(誤):政府支出増加は短期的には実質GDPを増やすが、長期的には物価上昇により実質マネーサプライが減少し、実質GDPは完全雇用水準Y0に戻る。よって長期的には実質GDPは増加しない。\n・b(正):総需要の増加(IS右シフト)は、長期的に物価を上昇させる。\n・c(正):政府支出増加→IS右シフト→利子率は上昇する(クラウディング・アウト)。長期均衡でも利子率は当初より高い水準となる。\n\n【まとめ】a誤・b正・c正。長期では『実質GDPはY0に戻る(不変)、物価上昇、利子率上昇』。財政拡大が実質GDPを恒久的には増やせない点を押さえる。"},
  {id:"r6-eco-q11-2",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第11問",title:"第11問 設問2　名目貨幣供給量増加の長期的効果",body:"設問1と同じ図(Y0は完全雇用GDP)のもとで、名目貨幣供給量増加の長期的な効果に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　実質GDPを増加させる。\nb　物価を上昇させる。\nc　利子率を低下させる。",figure:"EcoR6Q11",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：正　c：誤"},{key:"ウ",label:"a：正　b：誤　c：誤"},{key:"エ",label:"a：誤　b：正　c：正"},{key:"オ",label:"a：誤　b：正　c：誤"}],correct:"オ",explanation:"【論点・背景】長期における『貨幣の中立性』が核心。名目貨幣供給量の変化は、長期的には物価などの名目変数だけを比例的に変化させ、実質GDP・実質利子率などの実質変数には影響しない。\n\n【各記述の検討】\n・a(誤):名目貨幣供給増加は短期的には実質GDPを増やすが、長期的には物価上昇で実質マネーサプライが元に戻り、実質GDPは完全雇用水準Y0に戻る。よって長期的には実質GDPは増加しない(貨幣の中立性)。\n・b(正):名目貨幣供給の増加は、長期的に物価を(ほぼ比例的に)上昇させる。\n・c(誤):短期的には貨幣供給増で利子率は低下するが、長期的には物価上昇により実質マネーサプライが元の水準に戻るため、利子率も元の水準に戻る。よって長期的には利子率は低下しない。\n\n【まとめ】a誤・b正・c誤。長期では『実質GDP不変、物価上昇、利子率は元に戻る(不変)』。設問1(財政)では利子率が上昇したのに対し、設問2(金融)では利子率が元に戻る点が対照的。"},
  {id:"r6-eco-q12",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第12問",title:"第12問　自然失業率仮説",body:"自然失業率仮説に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　現実のインフレ率が期待インフレ率を上回るとき、失業率は自然失業率よりも高くなる。\nb　自然失業率仮説によると、長期的に失業率は、自発的失業を含めて、ゼロになる。\nc　長期的には、政府支出の増加はインフレを抑制し、失業率を低下させる。\nd　失業率が自然失業率に等しいとき、現実のインフレ率は期待インフレ率と等しくなる。",options:[{key:"ア",label:"a：正　b：正　c：誤　d：正"},{key:"イ",label:"a：正　b：誤　c：誤　d：正"},{key:"ウ",label:"a：誤　b：正　c：正　d：誤"},{key:"エ",label:"a：誤　b：正　c：誤　d：正"},{key:"オ",label:"a：誤　b：誤　c：誤　d：正"}],correct:"オ",explanation:"【論点・背景】自然失業率仮説(フリードマン)は、短期フィリップス曲線は右下がりだが、長期フィリップス曲線は自然失業率の水準で垂直になる、という考え方。期待インフレ率の調整が鍵。\n\n【各記述の検討】\n・a(誤):現実のインフレ率が期待インフレ率を上回る(予想外のインフレ)とき、短期フィリップス曲線上で失業率は自然失業率よりも『低く』なる。『高くなる』は逆で誤り。\n・b(誤):自然失業率は、摩擦的失業や自発的失業などを含む正の水準であり、ゼロにはならない。\n・c(誤):長期的には失業率は自然失業率に戻る(長期フィリップス曲線は垂直)ため、政府支出増加で失業率を恒久的に下げることはできず、むしろインフレを高める。『インフレを抑制し失業率を低下させる』は誤り。\n・d(正):長期均衡では失業率＝自然失業率であり、このとき現実のインフレ率＝期待インフレ率となる(人々の予想が実現する)。\n\n【まとめ】a誤・b誤・c誤・d正。長期では金融・財政政策で失業率を自然失業率より下げ続けることはできない(政策無効命題)点が核心。"},
  {id:"r6-eco-q13",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第13問",title:"第13問　需要の価格弾力性",body:"需要の価格弾力性(絶対値)に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　ある財について、価格の変化率(絶対値)がそれに伴う需要量の変化率(絶対値)に比べて大きいほど、需要の価格弾力性も大きくなる。\nb　代替品が豊富な財は、代替品に乏しい財に比べて、需要の価格弾力性は大きくなる。\nc　ある財の需要曲線が一定の価格水準において水平である場合、この財の需要の価格弾力性はゼロである。\nd　ある財の需要曲線が右下がりの直線である場合、この財の需要の価格弾力性は、価格水準にかかわらず一定である。",options:[{key:"ア",label:"a：正　b：正　c：誤　d：正"},{key:"イ",label:"a：正　b：正　c：誤　d：誤"},{key:"ウ",label:"a：正　b：誤　c：正　d：正"},{key:"エ",label:"a：誤　b：正　c：誤　d：正"},{key:"オ",label:"a：誤　b：正　c：誤　d：誤"}],correct:"オ",explanation:"【論点・背景】需要の価格弾力性＝|需要量の変化率|÷|価格の変化率|。定義と、需要曲線の形状(水平・垂直・直線)との対応を正確に押さえる問題。\n\n【各記述の検討】\n・a(誤):弾力性＝(需要量の変化率)÷(価格の変化率)。価格の変化率が需要量の変化率より『大きい』ほど分母が大きくなり、弾力性は『小さく』なる。『大きくなる』は逆で誤り。\n・b(正):代替品が豊富な財は、価格が上がると代替品に乗り換えやすく需要が大きく減るため、価格弾力性は大きい(弾力的)。正しい。\n・c(誤):需要曲線が水平な場合、わずかな価格変化で需要量が無限に変化するため、価格弾力性は『無限大』(完全弾力的)。ゼロ(完全非弾力的)になるのは需要曲線が垂直なときであり、混同させるひっかけ。\n・d(誤):右下がりの直線の需要曲線でも、弾力性は点によって異なる(上方ほど弾力的、中点で1、下方ほど非弾力的)。『価格水準にかかわらず一定』は誤り。弾力性が一定になるのは直角双曲線型(支出一定)の需要曲線の場合。\n\n【まとめ】a誤・b正・c誤・d誤。水平＝弾力性無限大、垂直＝弾力性ゼロ、直線でも点ごとに弾力性は変化、という対応がキーワード。"},
  {id:"r6-eco-q14",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第14問",title:"第14問　所得効果と所得弾力性(予算制約線)",body:"下図は、ある個人の予算制約線を描いている。当初の予算制約線はABであり、点Eで決まる数量のX財とY財を消費している。所得の増加によって予算制約線はCD(ABと平行に外側へシフト)となり、点Fで決まる数量のX財とY財を消費している。図ではEとFは同じ高さ(Y財の消費量が同じ)にあり、FはEより右(X財の消費量が多い)にある。この図に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　X財の所得効果は、負である。\nb　X財の所得弾力性は、正である。\nc　Y財の所得効果は、負である。\nd　Y財の所得弾力性は、ゼロである。",figure:"EcoR6Q14",options:[{key:"ア",label:"a：正　b：誤　c：正　d：誤"},{key:"イ",label:"a：正　b：誤　c：誤　d：正"},{key:"ウ",label:"a：誤　b：正　c：正　d：誤"},{key:"エ",label:"a：誤　b：正　c：誤　d：正"},{key:"オ",label:"a：誤　b：正　c：誤　d：誤"}],correct:"エ",explanation:"【論点・背景】所得増加(予算線の平行な外側シフト AB→CD)による消費の変化から、各財の『所得効果』と『所得弾力性』の符号を読み取る問題。\n・所得効果＝所得の変化に伴う需要の変化。所得増で需要が増える財は正常財(所得効果は正)、減る財は劣等財(負)、変わらない財は所得効果ゼロ。\n・所得弾力性＝(需要量の変化率)÷(所得の変化率)。正常財は正、劣等財は負、需要不変ならゼロ。\n\n【図の読み取り】点E→点Fで、X財の消費量は増加(Fが右)し、Y財の消費量は変わらない(EとFが同じ高さ)。\n\n【各記述の検討】\n・a(誤):X財は所得増で消費が増えている(正常財)ため、所得効果は『正』。『負』は誤り。\n・b(正):X財は所得増で消費が増えるため、所得弾力性は正。正しい。\n・c(誤):Y財は所得増で消費量が変わらないため、所得効果は『ゼロ』。『負』は誤り。\n・d(正):Y財は所得が増えても消費量が変わらないため、所得弾力性は『ゼロ』。正しい。\n\n【まとめ】a誤・b正・c誤・d正。X財＝正常財(所得効果正・弾力性正)、Y財＝需要が所得に反応しない財(所得効果ゼロ・弾力性ゼロ)。"},
  {id:"r6-eco-q15",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第15問",title:"第15問　等費用線と等産出量曲線",body:"下図は、労働と資本の価格および生産技術水準が一定で、かつ完全競争市場の下で2つの等費用線(C0・C1)と等産出量曲線(Q0・Q1)を示している。点Gは等費用線C0と等産出量曲線Q0の接点、点D・Fは等費用線C1と等産出量曲線Q0の交点(D上側・F下側)、点Eは等費用線C1と等産出量曲線Q1の接点である。この図に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　点Eは点Dと比べて、産出量は同じであるが、総要素費用はより少ない。\nb　点Gは点Dと比べて、技術的限界代替率は同じであるが、産出量はより少ない。\nc　総要素費用を一定とした場合、点Fでは、労働量を減らし資本量を増やすことで利潤を多くできる。\nd　産出量を一定とした場合、点Dでは、資本量を減らし労働量を増やすことで最適生産を達成できる。",figure:"EcoR6Q15",options:[{key:"ア",label:"a：正　b：正　c：正　d：誤"},{key:"イ",label:"a：正　b：誤　c：誤　d：正"},{key:"ウ",label:"a：誤　b：正　c：誤　d：誤"},{key:"エ",label:"a：誤　b：正　c：正　d：誤"},{key:"オ",label:"a：誤　b：誤　c：誤　d：正"}],correct:"オ",explanation:"【論点・背景】等費用線(同じ総費用で買える労働・資本の組み合わせ。傾き＝賃金率/資本価格＝要素価格比)と等産出量曲線(同じ産出量を生む組み合わせ。傾きの絶対値＝技術的限界代替率MRTS)を用いて、費用最小化(等費用線と等産出量曲線の接点)を理解する問題。点D・F・GはいずれもQ0上、EはQ1上にある。\n\n【各記述の検討】\n・a(誤):点EはQ1(産出量大)、点DはQ0(産出量小)の上にあり、産出量は同じではない。また両点とも等費用線C1上にあるため総要素費用は等しく『より少ない』も誤り。\n・b(誤):点Gと点Dはともに等産出量曲線Q0上にあるため産出量は同じであり、『産出量はより少ない』は誤り。さらにGはC0との接点でMRTS＝要素価格比だが、DはQ0上の非接点でMRTSが要素価格比と異なるため『技術的限界代替率は同じ』も成り立たない。\n・d(正):点DはQ0上でC1上にあり費用最小化点ではない。産出量をQ0に保ったまま、等産出量曲線Q0に沿って資本量を減らし労働量を増やすと、より低い等費用線C0との接点Gに到達し、費用最小化(最適生産)を達成できる。正しい。\n・c(誤):点Fも等産出量曲線Q0上の点であり、Gと同じ産出量を実現できる費用最小化点はGである。費用最小化の調整方向や最適点の取り方を踏まえると、本肢の記述は最適化の方向づけとして適切とはいえず誤りと判断される。\n\n【まとめ】a誤・b誤・d正(c誤)。費用最小化は『等費用線と等産出量曲線の接点(G・E)』で達成され、同一等産出量曲線上の非接点(D・F)からは接点へ向けて投入を調整すべき、という点が核心。なお本問は公式の正答キーが未確認のため、特にc肢の評価は要確認です。"},
  {id:"r6-eco-q16-1",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第16問",title:"第16問 設問1　生産者余剰",body:"短期の完全競争市場下で、ある財の生産に関する限界費用曲線MC、平均費用曲線AC、平均可変費用曲線AVCが下図のように描かれている。価格が与えられると企業は最適生産を実現する。P1はACの最小値、P3はAVCの最小値に対応する。価格がP0のとき(企業はMC＝P0となる生産量Q0を選び、点Cで生産)、Q0における平均費用ACは水準A(点D)、平均可変費用AVCは水準B(点E)である。価格がP0のときの生産者余剰として、最も適切なものはどれか。",figure:"EcoR6Q16",options:[{key:"ア",label:"四角形ABED"},{key:"イ",label:"四角形AOQ0D"},{key:"ウ",label:"四角形BOQ0E"},{key:"エ",label:"四角形P0ADC"},{key:"オ",label:"四角形P0BEC"}],correct:"オ",explanation:"【論点・背景】生産者余剰＝総収入−総可変費用。これは価格と限界費用曲線(供給曲線)の間の面積に等しく、固定費用の回収分(＝利潤＋固定費用)を表す。\n\n【途中の考え方】価格P0のとき企業はMC＝P0となる生産量Q0を選び、点Cで生産する。\n・総収入＝P0×Q0(縦P0×横Q0)。\n・総可変費用＝AVC(Q0)×Q0。Q0における平均可変費用は水準B(点E)なので、総可変費用＝B×Q0。\n・生産者余剰＝総収入−総可変費用＝P0×Q0−B×Q0＝(P0−B)×Q0。\nこれは縦(P0−B)・横Q0の長方形で、頂点はP0(縦軸上)・C(Q0上で高さP0)・E(Q0上で高さB)・B(縦軸上)を結ぶ四角形P0BECに一致する。\n\n【誤答の検討】\n・四角形P0ADC＝(P0−A)×Q0は『総収入−総費用＝利潤』であり、生産者余剰ではない(可変費用ではなく総費用を引いている)。\n・四角形AOQ0D＝A×Q0は総費用、四角形BOQ0E＝B×Q0は総可変費用そのもので、いずれも余剰ではない。\n・四角形ABEDは利潤と固定費用の差などに対応せず不適。\n\n【まとめ】生産者余剰＝総収入−総可変費用＝(P0−B)×Q0＝四角形P0BEC。利潤(P0−A)×Q0との違い(可変費用か総費用か)が最重要。"},
  {id:"r6-eco-q16-2",exam:"中小企業診断士",year:"R6",subject:"経済学・経済政策",examLabel:"R6 経済学・経済政策",parent:"第16問",title:"第16問 設問2　損益分岐点・操業停止点",body:"設問1と同じ図(P1はACの最小値、P3はAVCの最小値、P2はP3とP1の間の水準)について、次の記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　価格がP1のとき、企業の総収入は可変費用と固定費用の合計に等しくなる。\nb　価格がP2のとき、企業の損失は固定費用の一部のみとなる。\nc　価格がP3のとき、企業の損失は可変費用のみとなる。",figure:"EcoR6Q16",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：正　c：誤"},{key:"ウ",label:"a：正　b：誤　c：誤"},{key:"エ",label:"a：誤　b：正　c：正"},{key:"オ",label:"a：誤　b：誤　c：誤"}],correct:"イ",explanation:"【論点・背景】価格と平均費用AC・平均可変費用AVCの関係から、損益分岐点(P1＝ACの最小値)と操業停止点(P3＝AVCの最小値)を理解する問題。P1>P2>P3の順。\n\n【各記述の検討】\n・a(正):価格P1はACの最小値(損益分岐点)。このとき価格＝AC＝平均総費用なので、総収入＝価格×生産量＝総費用＝可変費用＋固定費用。利潤ゼロで、総収入は可変費用と固定費用の合計に等しい。正しい。\n・b(正):価格P2はP3(AVC最小)とP1(AC最小)の間。価格>AVCなので可変費用は全額回収でき、さらに固定費用の一部も回収できる。よって損失は固定費用の一部のみにとどまる(操業を続けた方が有利)。正しい。\n・c(誤):価格P3はAVCの最小値(操業停止点)。このとき価格＝AVCなので総収入＝可変費用となり、固定費用がそのまま損失になる。すなわち損失は『固定費用』であって『可変費用のみ』ではない。誤り。\n\n【まとめ】a正・b正・c誤。損益分岐点(P1＝AC最小、利潤ゼロ)と操業停止点(P3＝AVC最小、損失＝固定費用全額)の区別、AVC<価格<ACの領域では操業継続が有利、という点が核心。"},
];

const QUESTIONS_OPE = [
  {id:"r7-ope-q1",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第1問",title:"第1問　製品の設計や開発の合理化",body:"製品の設計や開発の合理化に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　コンカレントエンジニアリングは、開発期間の短縮を目的に、設計と生産技術や試作・評価などの業務を同時並行で進める手法である。\nb　CAEは、製品データを基に機械加工工程の自動編成や自動手順設計を行うコンピュータ支援システムの総称である。\nc　CAMは、コンピュータ内部の製品データから、その生産に必要となる工程設計の情報を生成するシステムである。\nd　デザインインは、自動車や家電など完成品メーカーの設計開発段階に部品メーカーが参画し、自社の部品が採用されるよう仕様を提案・調整する活動である。",options:[{key:"ア",label:"a：正　b：正　c：誤　d：誤"},{key:"イ",label:"a：正　b：誤　c：正　d：正"},{key:"ウ",label:"a：誤　b：正　c：正　d：誤"},{key:"エ",label:"a：誤　b：正　c：誤　d：正"},{key:"オ",label:"a：誤　b：誤　c：正　d：正"}],correct:"イ",explanation:"a 正:コンカレントエンジニアリングは並行開発で開発期間を短縮する手法。\nb 誤:CAE(Computer Aided Engineering)はFEMなどの工学解析支援。「機械加工工程の自動編成・自動手順設計」はCAPP(工程設計支援)の説明。\nc 正:CAM(Computer Aided Manufacturing)は製品データから加工情報・NCプログラム等を生成。\nd 正:デザインインは部品メーカーが設計段階から関与する活動。"},
  {id:"r7-ope-q2",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第2問",title:"第2問　価値工学(VE)",body:"価値工学(VE)に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"VEの考え方では、機能を「動詞＋名詞」で表現する。"},{key:"イ",label:"VEの対象は、原則として有形の製品に限定される。"},{key:"ウ",label:"価値は、機能を顧客満足度で除した値として定義される。"},{key:"エ",label:"ゼロルックVEは、既存製品の材質を見直すことで価値向上を図る活動である。"},{key:"オ",label:"セカンドルックVEは、商品企画段階で原価を低減させる活動である。"}],correct:"ア",explanation:"ア 正:VEでは機能を「動詞+名詞」で抽象化(例:「光を伝える」)。\nイ 誤:サービスや業務プロセスもVEの対象になる。\nウ 誤:価値=機能/コスト。\nエ 誤:ゼロルックVEは商品企画段階の活動。既存製品の材質見直しはセカンドルックVE。\nオ 誤:商品企画段階の活動はゼロルックVE。"},
  {id:"r7-ope-q3",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第3問",title:"第3問　制約理論(TOC)",body:"制約理論(TOC)の考え方に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　ボトルネック工程の処理能力を改善することで、別の工程がボトルネックになることがある。\nb　すべての工程の生産速度をボトルネック工程の生産速度に同期化させる。\nc　ボトルネック工程の下流工程の生産速度を上げることで、システム全体のスループットを向上させることができる。\nd　ボトルネック以外の工程の処理能力を上げることで、システム全体のスループットを向上させることができる。",options:[{key:"ア",label:"a：正　b：正　c：誤　d：誤"},{key:"イ",label:"a：正　b：正　c：誤　d：誤"},{key:"ウ",label:"a：正　b：誤　c：正　d：誤"},{key:"エ",label:"a：誤　b：正　c：誤　d：正"},{key:"オ",label:"a：誤　b：誤　c：正　d：正"}],correct:"イ",explanation:"a 正:ボトルネック改善後、別工程がボトルネックに変わる(集中改善のサイクル)。\nb 正:DBR(ドラム・バッファ・ロープ)の考え方。全工程をボトルネックに同期。\nc 誤:下流工程の能力を上げてもボトルネックがネックなのでスループットは増えない。\nd 誤:ボトルネック以外の能力向上は仕掛在庫を増やすだけ。"},
  {id:"r7-ope-q4",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第4問",title:"第4問　工場運営に関する用語",body:"工場運営に関する用語の説明として、最も適切なものはどれか。",options:[{key:"ア",label:"ERP(Enterprise Resource Planning)とは、製造現場の生産活動を最適化することを目的に、進捗、工程、品質、設備、保全などを管理する仕組みのことである。"},{key:"イ",label:"MES(Manufacturing Execution System)とは、企業の経営資源を統合管理する仕組みのことである。"},{key:"ウ",label:"APS(Advanced Planning and Scheduling)とは、生産計画の最適化や納期回答、設備計画の立案などを行う仕組みのことである。"},{key:"エ",label:"PLC(Programmable Logic Controller)とは、製品のライフサイクル全般を一元管理する仕組みのことである。"},{key:"オ",label:"MRP(Material Requirements Planning)とは、機械装置の制御を行う産業用コンピュータのことである。"}],correct:"ウ",explanation:"ア 誤:ERPは企業の経営資源全体の統合管理。記述はMESの説明。\nイ 誤:MESは製造実行システム(現場管理)。記述はERPの説明。\nウ 正:APSは高度な計画・スケジューリング。\nエ 誤:PLCは産業用制御コンピュータ。記述はPLM(Product Lifecycle Management)の説明。\nオ 誤:MRPは資材所要量計画。記述はPLCの説明。"},
  {id:"r7-ope-q5",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第5問",title:"第5問　QC七つ道具・新QC七つ道具",body:"QC七つ道具・新QC七つ道具に関する手法名a〜dと、その用途①〜④の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\n手法\na マトリックス図法\nb ヒストグラム\nc 連関図法\nd チェックシート\n\n用途\n① 対になる要素から多くの中から優先順位の高いものを選び出すために用いる。\n② 計量値のずれやばらつきの状態を視覚的に把握するために用いる。\n③ 多くの要因が複雑に絡み合った問題の因果関係を明らかにするために用いる。\n④ データを簡単に記録するために用いる。",options:[{key:"ア",label:"a-① b-② c-③ d-④"},{key:"イ",label:"a-① b-② c-④ d-③"},{key:"ウ",label:"a-② b-① c-③ d-④"},{key:"エ",label:"a-③ b-④ c-① d-②"},{key:"オ",label:"a-④ b-③ c-② d-①"}],correct:"ア",explanation:"マトリックス図法は2軸で要素間関係を整理して優先順位付け(①)。\nヒストグラムは度数分布で計量値のばらつき把握(②)。\n連関図法は因果関係を矢印で結んで複雑な問題を解きほぐす(③)。\nチェックシートはデータを簡単に記録する(④)。"},
  {id:"r7-ope-q6",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第6問",title:"第6問　フローショップ問題",body:"下表に示す4つのジョブa,b,c,dを2工程のフローショップで処理する。各ジョブは第1工程→第2工程の順に処理される。最大完了時間(メイクスパン)を最小化するように処理順序を決定したとき、第1工程と第2工程の合計の非稼働時間として、最も適切なものを下記の解答群から選べ。",figure:"OpeQ6",options:[{key:"ア",label:"0"},{key:"イ",label:"2"},{key:"ウ",label:"4"},{key:"エ",label:"6"},{key:"オ",label:"8"}],correct:"エ",explanation:"ジョンソンのアルゴリズムで最適順序を求める。各ジョブの最小値を見て、第1工程側なら前へ・第2工程側なら後ろへ配置。\na(3,4)→前へ、b(4,1)→後へ、c(5,7)→前へ(aの後)、d(6,2)→後へ(bの前)\n最適順序: a→c→d→b、メイクスパン=19\n第1工程合計=3+5+6+4=18、第2工程合計=4+7+2+1=14\n非稼働時間=メイクスパン×2-(18+14)=38-32=6"},
  {id:"r7-ope-q7",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第7問",title:"第7問　PERT・クリティカルパス短縮",body:"あるプロジェクトのアローダイアグラムに基づき、所要日数を当初より2日短縮したい。各作業の1日短縮あたりの追加コストは下表のとおりである。最小の追加コストで2日短縮するときの追加コストとして、最も適切なものを下記の解答群から選べ。",figure:"OpeQ7",options:[{key:"ア",label:"8万円"},{key:"イ",label:"10万円"},{key:"ウ",label:"12万円"},{key:"エ",label:"16万円"},{key:"オ",label:"20万円"}],correct:"ウ",explanation:"クリティカルパス上で最も削減コストの低い作業を1日ずつ短縮していく。短縮の結果、別のパスがクリティカルになる場合は、両方のパス上の作業を組み合わせて短縮する。本問では合計12万円が最小コストとなる。"},
  {id:"r7-ope-q8",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第8問",title:"第8問　工場の管理指標",body:"工場の管理指標とその内容の組み合わせとして、最も適切なものはどれか。",options:[{key:"ア",label:"操業度差異は、工場における無災害稼働日数を把握するための指標である。"},{key:"イ",label:"平均活性示数は、品質不良の発生頻度を評価するための指標である。"},{key:"ウ",label:"度数率は、設備の停止ロス時間を把握するための指標である。"},{key:"エ",label:"工程能力指数は、運搬作業の効率性を測定するための指標である。"},{key:"オ",label:"時間稼働率は、設備の停止ロス時間を考慮した上での稼働状況を把握するための指標である。"}],correct:"オ",explanation:"オ 正:時間稼働率=(負荷時間-停止時間)/負荷時間。停止ロスを反映した稼働指標。\nア 誤:操業度差異は会計上の差異分析の用語。\nイ 誤:平均活性示数は運搬の活性度(置き方)を示す。\nウ 誤:度数率は労働災害の発生頻度。\nエ 誤:工程能力指数(Cp/Cpk)は品質ばらつきと規格幅の関係。"},
  {id:"r7-ope-q9",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第9問",title:"第9問　生産プロセスの合理化",body:"生産プロセスの合理化に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"かんばん方式は、工程間の仕掛在庫を低減させるための仕組みである。"},{key:"イ",label:"U字ラインは、振り向き動作を増やすことを主な目的としている。"},{key:"ウ",label:"生産平準化は、段取替えの頻度を抑制することを主な目的としている。"},{key:"エ",label:"アンドンは、設備の異常発生を経営層に通報する仕組みである。"},{key:"オ",label:"シングル段取りは、工程内の総工数を抑制するための活動である。"}],correct:"ア",explanation:"ア 正:かんばんは後工程引取りで仕掛在庫を抑制する仕組み。\nイ 誤:U字ラインは多工程持ちで生産性を上げるためで、振り向き動作の増加が目的ではない。\nウ 誤:平準化は需要変動への対応・小ロット化が目的。段取替えはむしろ増える方向。\nエ 誤:アンドンは現場で異常を可視化する仕組み(経営層への通報ではない)。\nオ 誤:シングル段取り(SMED)は段取り時間を9分以下にする活動で、総工数の抑制ではない。"},
  {id:"r7-ope-q10",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第10問",title:"第10問　生産システムの原則",body:"生産システムの設計や改善で用いられる原則に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"3Sは、Standardization、Synchronization、Specializationの頭文字を取ったものである。"},{key:"イ",label:"ECRSの原則は、Eliminate、Combine、Reschedule、Simplifyの頭文字を取ったものである。"},{key:"ウ",label:"DMAICは、Define、Measure、Analyze、Implement、Controlの頭文字を取ったものである。"},{key:"エ",label:"動作経済の原則は、身体の使用、作業場所、設備・工具の3つの分野に大別される。"},{key:"オ",label:"トヨタ生産方式における7つのムダには、設備停止のムダが含まれる。"}],correct:"エ",explanation:"エ 正:動作経済の原則は「身体の使用」「作業場所」「設備・工具」の3分野に大別される。\nア 誤:3Sは Standardization/Simplification/Specialization(または整理・整頓・清掃)。\nイ 誤:ECRSのRはRearrange(交換・組替)。\nウ 誤:DMAICのIはImprove。\nオ 誤:7つのムダは「作りすぎ・手待ち・運搬・加工・在庫・動作・不良」。設備停止は含まれない。"},
  {id:"r7-ope-q11",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第11問",title:"第11問　TPM",body:"TPM(全員参加の生産保全)に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"TBM(Time Based Maintenance)は、設備の故障発生後にその都度修理を行う事後保全のことである。"},{key:"イ",label:"自主保全活動の最初の3つのステップは、初期清掃、発生源・困難箇所対策、自主点検である。"},{key:"ウ",label:"集中保全は、各製造現場の運転担当者が自工程の設備保全を行う方式である。"},{key:"エ",label:"保全予防は、設備の計画段階や設計段階において、保全しやすい設備とすることでトラブルを未然に防ぐ活動である。"},{key:"オ",label:"MTBF(平均故障間隔)を短くし、MTTR(平均修復時間)を長くすることが、保全活動の目標である。"}],correct:"エ",explanation:"エ 正:保全予防(MP)は設計段階で故障を防止する活動。\nア 誤:TBMは時間基準保全(予防保全の一種)。事後保全はBMやCM。\nイ 誤:自主保全7ステップの最初の3つは「初期清掃」「発生源・困難箇所対策」「清掃・給油基準作成」。\nウ 誤:集中保全は専門の保全部門が一括で行う方式。記述は部門保全の説明。\nオ 誤:MTBFは長く、MTTRは短くするのが目標(逆)。"},
  {id:"r7-ope-q12-1",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第12問",title:"第12問 設問1　保管棚の決定(開始時刻の早い順)",body:"フリーロケーション管理が行われている倉庫で、保管時間が表1のとおり予定されている5商品(商品1：8:00〜11:00、商品2：9:00〜12:00、商品3：9:00〜10:00、商品4：10:30〜12:30、商品5：11:30〜13:00)の保管棚を決定する。条件：入出庫は同一の入出庫口を利用、保管棚は4カ所で入出庫口からの距離は棚1=1・棚2=2・棚3=3・棚4=4(表2)、1つの棚に同時に2つ以上は保管できない、指定ルールに従ったうえで入出庫口にできるだけ近い利用可能な棚を利用する。\n保管棚を決定するルールを「保管開始時刻の早い商品から順に保管棚を決定する」にしたとき、商品の総移動距離(5商品を入出庫するための総移動距離)と利用する保管棚の数の組み合わせとして、最も適切なものを下記の解答群から選べ。",figure:"OpeQ12",options:[{key:"ア",label:"商品の総移動距離：20　利用する保管棚の数：3"},{key:"イ",label:"商品の総移動距離：20　利用する保管棚の数：4"},{key:"ウ",label:"商品の総移動距離：26　利用する保管棚の数：3"},{key:"エ",label:"商品の総移動距離：26　利用する保管棚の数：4"},{key:"オ",label:"商品の総移動距離：28　利用する保管棚の数：4"}],correct:"ア",explanation:"保管開始時刻の早い順(商品1→2→3→4→5)に、入出庫口に近い空き棚へ割り当てる。\n・商品1(8:00-11:00)→棚1\n・商品2(9:00-12:00)→棚1は商品1と重複→棚2\n・商品3(9:00-10:00)→棚1・棚2とも重複→棚3\n・商品4(10:30-12:30)→棚1は商品1(〜11:00)と重複、棚2は商品2と重複、棚3は商品3が10:00出庫済みで空き→棚3\n・商品5(11:30-13:00)→棚1は商品1が11:00に出庫済みで空き→棚1\nよって利用する棚は棚1・棚2・棚3の3つ。\n総移動距離は各商品で「入出庫口→棚→入出庫口」の往復＝棚の距離×2。Σ(棚距離)＝1+2+3+3+1＝10、×2＝20。\nしたがって 総移動距離20・棚数3。"},
  {id:"r7-ope-q12-2",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第12問",title:"第12問 設問2　ルール変更(保管時間の短い順)",body:"設問1と同じ条件・保管スケジュールのもとで、保管棚を決定するルールを、設問1の「保管開始時刻の早い商品から順」から「保管時間の短い商品から順に保管棚を決定する」に変更したとき、商品の総移動距離と利用する保管棚の数の変化の組み合わせとして、最も適切なものを下記の解答群から選べ。",figure:"OpeQ12",options:[{key:"ア",label:"商品の総移動距離：減る　利用する棚の数：減る"},{key:"イ",label:"商品の総移動距離：減る　利用する棚の数：変化なし"},{key:"ウ",label:"商品の総移動距離：変化なし　利用する棚の数：減る"},{key:"エ",label:"商品の総移動距離：増える　利用する棚の数：変化なし"},{key:"オ",label:"商品の総移動距離：増える　利用する棚の数：増える"}],correct:"オ",explanation:"保管時間：商品3=1時間、商品5=1.5時間、商品4=2時間、商品1=3時間、商品2=3時間。短い順(商品3→5→4→1→2)に入出庫口に近い空き棚へ割り当てる。\n・商品3(9:00-10:00)→棚1\n・商品5(11:30-13:00)→棚1は商品3が10:00出庫済みで空き→棚1\n・商品4(10:30-12:30)→棚1は商品5(11:30〜)と重複→棚2\n・商品1(8:00-11:00)→棚1は商品3と重複、棚2は商品4(10:30〜)と重複→棚3\n・商品2(9:00-12:00)→棚1は商品3・商品5と重複、棚2は商品4と重複、棚3は商品1と重複→棚4\nよって利用する棚は棚1〜棚4の4つ(設問1の3つから増加)。\n総移動距離はΣ(棚距離)×2＝(1+1+2+3+4)×2＝11×2＝22。設問1の20より大きい＝増える。\nしたがって 総移動距離は増える・棚数も増える。"},
  {id:"r7-ope-q13",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第13問",title:"第13問　金属加工技術",body:"金属加工技術に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"アーク溶接は、強力なレーザー光を金属に照射して接合する加工法である。"},{key:"イ",label:"ダイカストは、金属塊にハンマーで強い衝撃を加えて変形させる加工法である。"},{key:"ウ",label:"深絞り加工は、金属板をパンチでダイの中に押し込み、容器状の製品を成形する加工法である。"},{key:"エ",label:"フライス加工は、回転する加工物に対してバイトと呼ばれる切削工具を用いて切削する加工法である。"},{key:"オ",label:"へら絞り加工は、金属板をパンチとダイで挟んで成形する加工法である。"}],correct:"ウ",explanation:"ウ 正:深絞りはパンチとダイで金属板を容器状に成形する塑性加工。\nア 誤:アーク溶接はアーク放電で接合(レーザー溶接ではない)。\nイ 誤:ダイカストは溶融金属を金型に圧入する鋳造法。ハンマー打撃は鍛造。\nエ 誤:旋盤加工の説明。フライスは多刃の回転工具で被切削物を切削。\nオ 誤:へら絞りは回転する金属板にへら(押し金)を押し当てて成形する。"},
  {id:"r7-ope-q14",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第14問",title:"第14問　ライン生産方式とセル生産方式",body:"ライン生産方式から1人完結型のセル生産方式へ移行する際の効果や留意点に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"1人完結型のセル生産方式は、未経験の作業者でも短時間で習熟できるという利点がある。"},{key:"イ",label:"セル数の決定にあたっては、1人当たりのサイクルタイムを基に必要なセル数を計算する。"},{key:"ウ",label:"1人完結型のセル生産方式は、多品種大量生産に最も適している。"},{key:"エ",label:"ラインバランス効率(ラインバランスロス)は、1人完結型のセル生産方式における重要な評価指標である。"},{key:"オ",label:"1人完結型のセル生産方式は、工程数が多いほど効果的に運用できる。"}],correct:"イ",explanation:"イ 正:必要セル数は需要量と1人当たりのサイクルタイムから決定。\nア 誤:1人完結型は多能工が前提で、習熟に時間がかかる。\nウ 誤:多品種少量生産に向く。\nエ 誤:ラインバランス効率はライン生産の指標。1人完結ではバランスロスが発生しない。\nオ 誤:工程数が多すぎると1人で完結できなくなる。"},
  {id:"r7-ope-q15",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第15問",title:"第15問　フロムツウチャートとΣDI",body:"下図のレイアウトとフロムツウチャートに基づき、現状とレイアウト改善案に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　現状のΣDI値(距離と運搬回数の積の総合計)は284である。\nb　逆行運搬回数の合計は54である。\nc　旋盤とフライス盤の位置を入れ替えることでΣDI値は12減少する。",figure:"OpeQ15",options:[{key:"ア",label:"a：正　b：正　c：正"},{key:"イ",label:"a：正　b：誤　c：正"},{key:"ウ",label:"a：正　b：誤　c：誤"},{key:"エ",label:"a：誤　b：正　c：誤"},{key:"オ",label:"a：誤　b：誤　c：正"}],correct:"イ",explanation:"ΣDI=各運搬の(運搬回数×距離)の総和を計算する。本問の運搬回数と距離(隣接間=1)から算出するとa(現状ΣDI=284)とc(旋盤・フライス盤入替で12減少)が成立する。\nbは逆行運搬の回数集計の判定で、54に一致しない。"},
  {id:"r7-ope-q16",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第16問",title:"第16問　デカップリング・ポイント(DP)",body:"デカップリング・ポイント(DP)に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　受注組立生産(BTO)においては、DPは完成品在庫レベルに設定される。\nb　DPは、見込生産部分と受注対応生産部分の境界となる位置である。\nc　製品ライフサイクルが短い場合は、DPをより顧客に近い下流のポイントに設定すべきである。\nd　DPは、「カスタマイズに要する時間が顧客の許容する納期より短くなる位置」に設定すべきである。",figure:"OpeQ16",options:[{key:"ア",label:"a：正　b：正　c：誤　d：正"},{key:"イ",label:"a：正　b：誤　c：正　d：誤"},{key:"ウ",label:"a：誤　b：正　c：正　d：誤"},{key:"エ",label:"a：誤　b：正　c：誤　d：正"},{key:"オ",label:"a：誤　b：誤　c：正　d：正"}],correct:"エ",explanation:"a 誤:BTOではDPは部品在庫レベル(完成品ではない)。\nb 正:DPは見込・受注の境界。\nc 誤:ライフサイクル短い→陳腐化リスク大→在庫を持ちたくない→DPを上流(部品レベル)に置く。\nd 正:DPはリードタイムと顧客許容納期のバランスで決まる。"},
  {id:"r7-ope-q17",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第17問",title:"第17問　カーボンフットプリント(CFP)",body:"カーボンフットプリント(CFP)に関する記述として、最も不適切なものはどれか。",options:[{key:"ア",label:"CFPは、対象製品のライフサイクル全体を通じて排出される二酸化炭素のみを対象として算定される。"},{key:"イ",label:"CFPは、原材料調達から廃棄・リサイクルまでの製品ライフサイクル全体の温室効果ガス排出量を算定する。"},{key:"ウ",label:"CFPは、温室効果ガスをCO2換算した数値で表示される。"},{key:"エ",label:"CFPの算定にはISO 14067などの国際規格が用いられる。"},{key:"オ",label:"CFPの「見える化」により、消費者の環境配慮行動を促す効果が期待される。"}],correct:"ア",explanation:"ア 不適切:CFPはCO2のみではなく、メタンや一酸化二窒素なども含む温室効果ガス全般を対象とする(CO2換算)。\nイ〜オはCFPの正しい説明。"},
  {id:"r7-ope-q18",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第18問",title:"第18問　流動数分析",body:"下図は、ある工程における投入累積数量と産出累積数量の推移を示した流動数曲線である。記述a〜dのうち適切なものの組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　時点αにおける投入累積線と産出累積線の縦方向間隔Aは、時点αにおける仕掛品量を示す。\nb　時点α・βにおける2つの線の横方向間隔Bは、投入から産出までに要する期間を示す。\nc　投入のペースが時点αで急に低下するとAは増加する。\nd　投入から産出までに要する期間が短くなるとAも短くなる。",figure:"OpeQ18",options:[{key:"ア",label:"aとb"},{key:"イ",label:"aとc"},{key:"ウ",label:"aとbとd"},{key:"エ",label:"bとc"},{key:"オ",label:"cとd"}],correct:"ウ",explanation:"a 正:縦方向間隔=その時点での仕掛品量。\nb 正:横方向間隔=投入から産出までの所要期間。\nc 誤:投入ペースが低下するとAは縮小傾向(投入が遅れて仕掛品が減る)。\nd 正:期間Bが短くなれば、同等のペースなら仕掛量Aも小さくなる。"},
  {id:"r7-ope-q19",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第19問",title:"第19問　自工程保証",body:"「自工程保証」とは、不適合品を後工程に流出させないだけでなく、自工程内での不適合品の発生そのものを抑制する仕組みづくりを指す。次のa〜dの取り組みのうち、不適合品の発生そのものを抑制する仕組みに該当するものの組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　寸法を全数測定し、規格外を検知したらラインを停止する。\nb　部品装着前に正しい組立プログラムが選択されていることをスキャンで確認しないと、装着工程が始まらないようにする。\nc　工具が垂直方向にしか動かないようガイドを設置する。\nd　外観検査において色むらのある製品をラインから外す。",options:[{key:"ア",label:"aとb"},{key:"イ",label:"aとc"},{key:"ウ",label:"aとd"},{key:"エ",label:"bとc"},{key:"オ",label:"bとd"}],correct:"エ",explanation:"発生抑制(源流対策)= ポカヨケ的に「そもそも間違いが起こらない仕組み」を作るもの。\nb 正:プログラム取り違え自体を防ぐ→発生抑制。\nc 正:工具の動きを物理的に拘束し誤動作を防ぐ→発生抑制。\na,d 誤:発生後に検出して止める「流出抑制」(検査による)。"},
  {id:"r7-ope-q20",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第20問",title:"第20問　限界利益と最低受注単価",body:"ある製品について、1個当たりの直接材料費が200円、1個当たりの変動費(直接材料費を除く)が100円、固定費が月額10万円である。この製品の追加受注を検討するとき、損失が出ないようにするために必要な、1個当たりの最低受注単価として、最も適切なものを下記の解答群から選べ。",options:[{key:"ア",label:"100円"},{key:"イ",label:"300円"},{key:"ウ",label:"400円"},{key:"エ",label:"500円"},{key:"オ",label:"1,000円"}],correct:"イ",explanation:"追加受注では固定費は既に発生しているので変動費のみ回収できれば限界利益が確保できる。\n変動費合計=200+100=300円。\n受注単価が300円以上なら限界利益が0以上となり、損失を増やさない。"},
  {id:"r7-ope-q21",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第21問",title:"第21問　タクトタイム",body:"ある製品の月産計画は2,000個、月間稼働日数は20日、1日の正味稼働時間は7時間である。この条件下のタクトタイムが含まれる範囲として、最も適切なものを下記の解答群から選べ。",options:[{key:"ア",label:"100秒以上、200秒未満"},{key:"イ",label:"200秒以上、250秒未満"},{key:"ウ",label:"250秒以上、300秒未満"},{key:"エ",label:"300秒以上、400秒未満"},{key:"オ",label:"400秒以上"}],correct:"ウ",explanation:"1日生産量=2,000/20=100個。\n1日稼働時間=7×3600=25,200秒。\nタクトタイム=25,200/100=252秒。\n→ 250秒以上、300秒未満。"},
  {id:"r7-ope-q22",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第22問",title:"第22問　ショッピングセンター(SC)",body:"日本のショッピングセンター(SC)に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"SCは核店舗の数によって分類されることはない。"},{key:"イ",label:"SCにおけるテナント数は、サービス系業種が物販系業種を上回っている。"},{key:"ウ",label:"総SC数は、近年(2019年以降)では減少傾向にある。"},{key:"エ",label:"店舗面積3,000m²未満の小規模SCの数が、全SCの過半を占めている。"},{key:"オ",label:"近年、新規開業SC数は増加傾向にある。"}],correct:"ウ",explanation:"ウ 正:SC白書によると総SC数は2019年以降毎年減少傾向。\nア 誤:核店舗の数(0核・1核・複数核)で分類される。\nイ 誤:物販系テナントが最大シェア。\nエ 誤:中規模(5,000〜10,000m²等)が中心。\nオ 誤:新規開業数は減少傾向。"},
  {id:"r7-ope-q23",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第23問",title:"第23問　EC市場",body:"経済産業省「電子商取引に関する市場調査」に基づく、日本のBtoC-EC市場と越境EC市場に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"BtoC-EC市場の規模は、サービス系分野が物販系分野を上回っている。"},{key:"イ",label:"サービス系分野の中では、デジタル系コンテンツ(電子書籍、有料音楽配信等)が最大の市場規模を有している。"},{key:"ウ",label:"中国の消費者による日本からの越境EC購入額は、米国の消費者による日本からの越境EC購入額を上回っている。"},{key:"エ",label:"物販系分野のBtoC-EC市場規模は、近年減少傾向にある。"},{key:"オ",label:"物販系分野におけるEC化率は、近年30%を超えている。"}],correct:"ウ",explanation:"ウ 正:中国の対日越境EC購入額は米国を大きく上回る規模。\nア 誤:物販系が最大。\nイ 誤:サービス系では旅行サービスが最大。\nエ 誤:物販系は前年比増加。\nオ 誤:物販系のEC化率は約9〜10%程度。"},
  {id:"r7-ope-q24",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第24問",title:"第24問　ライリーモデル",body:"ライリー(Reilly)の小売引力法則に基づき、2つの都市A・Bの吸引力比率と都市規模(人口)から商圏の境界を推定する。都市Aの人口=3万人、都市Bの人口=8万人、AB間の距離=30kmとする。両都市から吸引される住人の境界(分岐点)はAから何kmのところに位置するか。最も適切なものを下記の解答群から選べ。",options:[{key:"ア",label:"Aから6kmの地点"},{key:"イ",label:"Aから10kmの地点"},{key:"ウ",label:"Aから15kmの地点"},{key:"エ",label:"Aから18kmの地点"},{key:"オ",label:"Aから20kmの地点"}],correct:"イ",explanation:"コンバースの分岐点公式 DA = D/(1+√(PB/PA)) を使う。\nDA=30/(1+√(8/3))≒30/(1+1.633)≒11.4km。\n選択肢中最も近いのはAから10kmの地点(イ)。"},
  {id:"r7-ope-q25",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第25問",title:"第25問　大規模小売店舗立地法",body:"大規模小売店舗立地法において、設置者が配慮すべき事項として法律上規定されている事項の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　駐車需要の充足\nb　開店日及び営業時間の届出\nc　騒音の発生\nd　建物の用途地域",options:[{key:"ア",label:"aとc"},{key:"イ",label:"aとd"},{key:"ウ",label:"bとc"},{key:"エ",label:"bとd"},{key:"オ",label:"cとd"}],correct:"ア",explanation:"大店立地法では「周辺生活環境の保持」の観点から、駐車需要の充足、騒音、廃棄物などへの配慮事項が規定されている。\nb:営業時間は届出事項だが「配慮事項」ではない。\nd:用途地域は都市計画法等で規定。"},
  {id:"r7-ope-q26",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第26問",title:"第26問　景観法・景観地区",body:"景観法や景観地区に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　景観地区を都市計画に定める場合、建築物の形態意匠の制限は必須事項である。\nb　景観地区を都市計画に定める場合、建築物の敷地面積の最低限度を定めることは必須事項である。\nc　景観地区を都市計画に定める場合、壁面の位置の制限を定めることは必須事項である。",options:[{key:"ア",label:"a：正　b：正　c：誤"},{key:"イ",label:"a：正　b：誤　c：誤"},{key:"ウ",label:"a：誤　b：正　c：正"},{key:"エ",label:"a：誤　b：正　c：誤"},{key:"オ",label:"a：誤　b：誤　c：正"}],correct:"イ",explanation:"景観地区における必須事項は「建築物の形態意匠の制限」のみ(a:正)。\n敷地面積最低限度や壁面位置の制限は「定めることができる」選択事項であり、必須ではない(b,c:誤)。"},
  {id:"r7-ope-q27",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第27問",title:"第27問　色彩に関する基礎知識",body:"色彩に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"色彩を持つ色を「多彩色」と呼び、白・黒・グレーなどを「無彩色」と呼ぶ。"},{key:"イ",label:"「進出色」とは、対象物が後方にあるかのように見える色のことである。"},{key:"ウ",label:"無彩色は色相と彩度のみを持ち、明度は持たない。"},{key:"エ",label:"明度の高い色は、対象物を膨張して見せる効果(膨張色)がある。"},{key:"オ",label:"色のコントラストを強めると、文字や図形の可読性が低下する。"}],correct:"エ",explanation:"エ 正:明度の高い色は膨張色(対象を大きく見せる)。\nア 誤:有彩色と無彩色。\nイ 誤:後方に見える色は後退色。進出色は手前に見える色。\nウ 誤:無彩色は明度のみを持ち、色相・彩度は持たない。\nオ 誤:コントラストを強めると可読性は向上する。"},
  {id:"r7-ope-q28-1",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第28問",title:"第28問 設問1　損益分岐点売上高",body:"下表は、A店のある月の損益計算書である。来月、人件費を10%増額して、その他の条件は変えないと仮定する。来月の損益分岐点売上高として、最も適切なものを下記の解答群から選べ。",figure:"OpeQ28",options:[{key:"ア",label:"172万円"},{key:"イ",label:"180万円"},{key:"ウ",label:"188万円"},{key:"エ",label:"196万円"},{key:"オ",label:"200万円"}],correct:"ウ",explanation:"売上高200万円、売上原価(変動費)150万円→変動費率0.75、限界利益率0.25。\n人件費10%増:20×1.1=22万円。\n固定費合計=22+25=47万円。\n損益分岐点売上高=固定費/限界利益率=47/0.25=188万円。"},
  {id:"r7-ope-q28-2",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第28問",title:"第28問 設問2　人時生産性",body:"A店において人時生産性(売上高/総労働時間)の向上に明らかに寄与する取り組みの組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　従業員教育を強化し、作業の標準化により同じ売上を短時間で達成する。\nb　自動レジを導入し、レジ業務の所要時間を短縮する。\nc　売上を変えずに、取扱SKU数を1.5倍に増やす。\nd　従業員数を増やし、1人あたりの労働時間は同じとする。",options:[{key:"ア",label:"aとb"},{key:"イ",label:"aとc"},{key:"ウ",label:"bとc"},{key:"エ",label:"bとd"},{key:"オ",label:"cとd"}],correct:"ア",explanation:"人時生産性=売上高÷総労働時間。\na 正:同じ売上を短時間で→分母縮小→生産性向上。\nb 正:作業時間短縮→分母縮小→生産性向上。\nc 誤:売上一定でSKU増→管理工数増の可能性、生産性は向上しない(むしろ低下)。\nd 誤:人数増・1人時間同じなら総労働時間増。売上が変わらなければ生産性低下。"},
  {id:"r7-ope-q29",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第29問",title:"第29問　売場づくり",body:"小売店の売場づくりに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"レジ前の什器(レジ前ゴンドラ等)には、高単価な専門品を陳列するのが効果的である。"},{key:"イ",label:"ワンウェイコントロール型の動線は、顧客の動線を最短化することを目的としている。"},{key:"ウ",label:"通路幅を狭くすると、ゴールデンゾーン全体に商品を見てもらえる効果が高まる。"},{key:"エ",label:"「定番」「テーマ」「特売」などの売場の役割を明確化することは、売場の生産性向上に寄与する。"},{key:"オ",label:"パワーカテゴリ(集客力の高いカテゴリ)は、店内の1か所に集中して陳列するのが原則である。"}],correct:"エ",explanation:"エ 正:売場の役割明確化は生産性向上に寄与。\nア 誤:レジ前は低単価の衝動買い商品が原則。\nイ 誤:ワンウェイコントロールは店内回遊距離を最大化することが目的。\nウ 誤:通路幅を狭くすると顧客の停滞を招き商品閲覧効果は低下。\nオ 誤:パワーカテゴリは店内に分散配置して回遊性を高める。"},
  {id:"r7-ope-q30",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第30問",title:"第30問　VMDのネガティブスペース",body:"VMD(ビジュアルマーチャンダイジング)における「ネガティブスペース」に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"商品陳列に充てられない無駄な空間で、店舗オペレーション上削減が望まれる空間のこと。"},{key:"イ",label:"商品の周囲に意図的に確保された余白で、商品の視覚的な引き立てや高級感の演出に寄与する空間のこと。"},{key:"ウ",label:"顧客が滞留しやすい、商品周辺の通路空間のこと。"},{key:"エ",label:"売場の中で、廃棄予定商品や返品商品を一時的に保管するための空間のこと。"},{key:"オ",label:"顧客に死角になる商品周辺の空間のこと。"}],correct:"イ",explanation:"ネガティブスペース(余白)は商品周囲に意図的に確保される空間で、商品の価値を視覚的に引き立てる効果がある(高級ブランド店舗などで多用される)。"},
  {id:"r7-ope-q31",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第31問",title:"第31問　通信販売における表示",body:"通信販売(オンラインショップ等)における表示に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　代金の支払時期は、特定商取引法上の表示事項には含まれない。\nb　返品に関する事項を表示しなければ、無条件に返品を受け付ける義務が生じる。\nc　送料の負担者(消費者・販売者のいずれか)は、特定商取引法上の表示事項として規定されている。",options:[{key:"ア",label:"a：正　b：正　c：誤"},{key:"イ",label:"a：正　b：誤　c：正"},{key:"ウ",label:"a：誤　b：正　c：正"},{key:"エ",label:"a：誤　b：正　c：誤"},{key:"オ",label:"a：誤　b：誤　c：正"}],correct:"オ",explanation:"a 誤:支払時期は表示事項に含まれる。\nb 誤:返品特約を表示しなくても、契約成立後8日間以内なら法定の返品権はあるが「無条件返品義務」とは異なる。\nc 正:送料負担は表示事項として規定されている。"},
  {id:"r7-ope-q32",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第32問",title:"第32問　在庫管理",body:"在庫管理に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"需要予測の精度が低くなるほど、安全在庫を減らすために、安全係数を低くすべきである。"},{key:"イ",label:"ダブルビン方式では、在庫を3つの容器に分けて管理する。"},{key:"ウ",label:"調達期間が長くなるほど、調達期間中に充足すべき需要量も増加する傾向がある。"},{key:"エ",label:"定期発注方式では、発注間隔が長いほど発注量は少なくなる傾向がある。"},{key:"オ",label:"定量発注方式では、発注間隔が一定となるが、発注量は需要に応じて変動する。"}],correct:"ウ",explanation:"ウ 正:調達期間が長いほど、その期間に発生する需要量も増える。\nア 誤:精度低下→安全係数を高くして安全在庫を増やすべき。\nイ 誤:ダブルビンは2つの容器に分けて管理。\nエ 誤:発注間隔が長いほど次回までの需要が大きく、発注量は多くなる。\nオ 誤:定量発注は発注量が一定で、発注間隔が変動する。"},
  {id:"r7-ope-q33",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第33問",title:"第33問　需要予測 (※不採点問題)",body:"※本問題は出題に瑕疵があったため、すべての受験者の解答が正解として扱われる不採点措置となった問題です。\n\n需要予測に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"移動平均法を用いた需要予測値に、最近の需要実績をより大きく反映させたい場合、算術平均する過去の実績値の期間をより長くすればよい。"},{key:"イ",label:"月次の時系列データの変動要素の1つである季節変動は、3ヶ月を1つの期として、各期の増加または減少の方向を持続する変動のことである。"},{key:"ウ",label:"指数平滑法を用いた需要予測値は、当期の実績値と前期の予測値の差分に平滑化係数を乗算した値を、前期の予測値に加算した値である。"},{key:"エ",label:"重回帰分析を用いて予測値を求める場合、各説明変数の間に強い相関関係が認められるほど、回帰係数をより適切に推定することができる。"},{key:"オ",label:"予測値と実績値の差を予測誤差とした場合、予測精度は、当該値の符号が正であれば高く、負であれば低いと評価することができる。"}],correct:"ウ",acceptAll:true,explanation:"本問は公式に「すべての受験者の解答を正解として扱う」不採点措置となりました。\n\n参考:各選択肢の通常の判断としては、\nア:期間を長くすると古い実績の影響が増し、最近の実績の重みが下がるので誤り。\nイ:循環変動の説明と季節変動が混同されている。\nウ:指数平滑法の式 F_{t+1}=F_t+α(A_t-F_t) と一致する記述。\nエ:多重共線性の問題が生じ、回帰係数の推定は不安定になる(誤)。\nオ:符号で精度を判断するのは不適切(誤差の絶対値や RMSE などで評価)。\n選択肢ウが標準的には適切と読めるが、設問の趣旨に瑕疵があったため不採点となりました。"},
  {id:"r7-ope-q34",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第34問",title:"第34問　貨物輸送",body:"貨物輸送に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"RORO船とトラクター・トレーラを組み合わせると、ドライバーが乗船しない無人航送が可能となる。"},{key:"イ",label:"特別積合せ運送は、複数の荷主の貨物を仕分けや積合せをせずに混載して運ぶ方式である。"},{key:"ウ",label:"モーダルシフトはトラック輸送が中心となるため、コンテナリゼーションの普及を阻害する。"},{key:"エ",label:"標準貨物自動車運送約款によると、待機時間料は運賃に含まれており別途請求はできない。"},{key:"オ",label:"営業用トラックの輸送費は、自家用トラックの輸送費よりも高くなる傾向がある。"}],correct:"ア",explanation:"ア 正:RORO船は車両単位で乗下船する貨物船。トレーラ部分のみを乗船させればドライバーは同乗せず、無人航送が可能。\nイ 誤:特別積合せ運送は複数荷主の貨物を仕分け・積合せする(=混載便)。\nウ 誤:モーダルシフトはトラックから鉄道・船舶への転換でコンテナ化を促進。\nエ 誤:標準約款では待機時間料は別途請求可能(2017年改正以降)。\nオ 誤:営業用は規模の経済により自家用より割安なのが一般的。"},
  {id:"r7-ope-q35",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第35問",title:"第35問　ユニットロード",body:"ユニットロードシステムに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"DFL(Design for Logistics)とは、製品の梱包形態を物流の効率性ではなく顧客満足度を最優先に設計することを意味する。"},{key:"イ",label:"PI(Physical Internet)とは、輸送機関ごとに独自の規格を採用することで効率化を図る考え方である。"},{key:"ウ",label:"複合一貫輸送とは、1つの輸送機関で複数の物流ルートを使い分ける輸送形態である。"},{key:"エ",label:"ユニットロードシステムは、貨物を一定の標準化された単位にまとめて取り扱うことで荷役効率を高める。"},{key:"オ",label:"ユニットロードシステムは、荷役効率の向上に資するが、輸送効率や保管効率の向上には寄与しない。"}],correct:"エ",explanation:"エ 正:ユニットロードシステムの定義そのもの。\nア 誤:DFLは物流効率を考慮した製品設計。\nイ 誤:PIは規格の統一・共有を進める考え方。\nウ 誤:複合一貫輸送は複数の輸送機関を組み合わせる輸送。\nオ 誤:ユニットロード化は輸送・保管効率にも寄与する。"},
  {id:"r7-ope-q36",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第36問",title:"第36問　帰り荷の確保(実車率・積載率)",body:"荷主であるA社とB社は、X県とY県の間でトラックによる輸送をそれぞれ行っており、このたび協力して帰り荷の確保という取組を行った。取組前を基準とした取組後の変化に関する記述として、最も適切なものを下記の解答群から選べ。次の条件のみを踏まえて解答すること。\n\n【取組前】A社・B社のトラックが1台ずつ運行。A社：倉庫Ax→倉庫Ayへ実車走行後、Ay→Axへ空車走行。B社：倉庫By→倉庫Bxへ実車走行後、Bx→Byへ空車走行。\n【取組後】1台で、①Ax→Ay(A社・実車)→②Ay→By(空車)→③By→Bx(B社・実車)→④Bx→Ax(空車)と連続運行(帰り荷の確保)。\n【条件】最大積載量は取組前後の全輸送で同じ。輸送貨物量はAx→AyとBy→Bxで同じ。実車率＝走行距離に占める実車走行距離の割合、積載率＝最大積載量に占める実積載量の割合。取組後の空車距離(②Ay-By間＋④Ax-Bx間)は、取組前の空車距離(Ax-Ay間＋Bx-By間)の合計より短い。",figure:"OpeQ36",options:[{key:"ア",label:"トラックの実車率と積載率はともに変わらなかった。"},{key:"イ",label:"トラックの実車率と積載率はともに上昇した。"},{key:"ウ",label:"トラックの実車率と積載率はともに低下した。"},{key:"エ",label:"トラックの実車率は変わらなかったが、積載率は上昇した。"},{key:"オ",label:"トラックの実車率は上昇したが、積載率は変わらなかった。"}],correct:"オ",explanation:"実車距離：取組前(Ax→Ay＋By→Bx)と取組後(①Ax→Ay＋③By→Bx)は同じ。\n空車距離：条件より、取組後(②Ay-By＋④Ax-Bx)は取組前(Ax-Ay＋Bx-By)より短い。\nよって総走行距離(＝実車距離＋空車距離)は減少。実車率(＝実車距離／総走行距離)は、分子が同じで分母が小さくなるため上昇する。\n積載率：各実車区間で最大積載量まで積む点(輸送貨物量・最大積載量とも同じ)は変わらないため、積載率は変わらない。\nしたがって「実車率は上昇したが、積載率は変わらなかった」＝オが正しい。\nア 誤:実車率が上昇するため。\nイ 誤:積載率は変わらないため。\nウ 誤:実車率は上昇するため。\nエ 誤:実車率は上昇し、積載率は変わらないため(逆の記述)。"},
  {id:"r7-ope-q37",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第37問",title:"第37問　物流センター",body:"物流センターに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"ASN(事前出荷情報)は、入荷側が出荷予定情報を作成して出荷側に送信する電子データである。"},{key:"イ",label:"DPS(Digital Picking System)は摘み取り方式、DAS(Digital Assort System)は種まき方式と呼ばれるピッキング支援システムである。"},{key:"ウ",label:"トラック予約受付システムは、特定の時間帯にトラックを集中させることで荷役効率を高める仕組みである。"},{key:"エ",label:"パレタイザは、パレット単位で仕分けされた商品を顧客別に分類する装置である。"},{key:"オ",label:"物流ABC(活動基準原価計算)は、管理可能なコストと不可能なコストの双方を含めて算出する。"}],correct:"イ",explanation:"イ 正:DPS=摘み取り方式、DAS=種まき方式。\nア 誤:ASNは出荷側が作成して入荷側に送信する。\nウ 誤:トラック予約受付は集中を防ぎ、平準化するシステム。\nエ 誤:パレタイザは荷を自動的にパレット上に積み付ける装置。\nオ 誤:物流ABCは管理可能なコストを活動別に算出する手法。"},
  {id:"r7-ope-q38",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第38問",title:"第38問　GTIN-14",body:"集合包装用商品コードであるGTIN-14に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"GTIN-14の先頭1桁(インジケータ)は、商品の生産国を表す。"},{key:"イ",label:"GTIN-14は消費者向け単品(バラ商品)の標準的なコードである。"},{key:"ウ",label:"GTIN-14は、日本国内向けに独自に定められた集合包装用コードである。"},{key:"エ",label:"GTIN-14は、12桁のJANコードに2桁のインジケータを付加したものである。"},{key:"オ",label:"GTIN-14のインジケータは、ボール・ケース・パレットなど包装階層を識別する。"}],correct:"オ",explanation:"オ 正:GTIN-14の先頭1桁(インジケータ)は包装階層(1=ボール、2=ケース、3=パレット等)を識別する。\nア 誤:生産国コードはGS1事業者コードの一部であり、インジケータとは別。\nイ 誤:GTIN-14は集合包装用(段ボール単位など)。\nウ 誤:GTIN-14は国際標準。\nエ 誤:GTIN-14=1桁(インジケータ)+13桁(GTIN-13ベース)で構成。"},
  {id:"r7-ope-q39",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第39問",title:"第39問　生鮮標準商品コード",body:"生鮮標準商品コードに関する次の文中の空欄A〜Cに入る語句の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\n生鮮標準商品コードは、生鮮取引【A】の標準化を進めるため【B】を対象に整備されたコードである。先頭4桁は【C】で始まる。",options:[{key:"ア",label:"A：EOS　B：青果・水産・食肉の3品　C：4912"},{key:"イ",label:"A：EOS　B：青果のみ　C：4922"},{key:"ウ",label:"A：EDI　B：青果・水産・食肉・花きの4品　C：4922"},{key:"エ",label:"A：POS　B：水産のみ　C：4912"},{key:"オ",label:"A：POS　B：花きのみ　C：4922"}],correct:"ウ",explanation:"生鮮標準商品コードはEDI(電子データ交換)の標準化を目的に、青果・水産・食肉・花きの4品目を対象として整備されている。先頭4桁は4922で始まる。"},
  {id:"r7-ope-q40-1",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第40問",title:"第40問 設問1　アソシエーション分析(信頼度)",body:"下表は、ある店舗で商品A、B、Cの3つの売れ行きを調べたレシートデータである。「商品Aを購入した顧客が商品Bも購入する」というルールの信頼度(コンフィデンス)として、最も適切なものを下記の解答群から選べ。",figure:"OpeQ40",options:[{key:"ア",label:"1/5"},{key:"イ",label:"1/3"},{key:"ウ",label:"1/2"},{key:"エ",label:"2/5"},{key:"オ",label:"3/5"}],correct:"オ",explanation:"信頼度(A→B) = P(B|A) = (AかつB含む枚数) / (A含む枚数)。\nA含む枚数 = 400 + 1200 + 800 + 600 = 3000\nA∩B含む枚数 = 1200 + 600 = 1800\n信頼度 = 1800/3000 = 3/5。"},
  {id:"r7-ope-q40-2",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第40問",title:"第40問 設問2　アソシエーション分析(リフト値)",body:"設問1と同じ表を用いるとき、「商品Aを購入した顧客が商品Bも購入する」というルールのリフト値として、最も適切なものを下記の解答群から選べ。",figure:"OpeQ40",options:[{key:"ア",label:"2/5"},{key:"イ",label:"1/2"},{key:"ウ",label:"3/5"},{key:"エ",label:"1"},{key:"オ",label:"6/5"}],correct:"オ",explanation:"リフト値 = P(B|A) / P(B) = 信頼度 / 支持度(B)。\nP(B) = B含む枚数/全レシート = (200+1200+1000+600)/6000 = 3000/6000 = 1/2\nリフト値 = (3/5)/(1/2) = 6/5。\nリフト値>1なので、AとBは独立より共起しやすい(関連がある)。"},
  {id:"r7-ope-q41",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第41問",title:"第41問　HACCP",body:"HACCPの7原則のうち、最初に行うべき原則として、最も適切なものはどれか。",options:[{key:"ア",label:"重要管理点(CCP)の決定"},{key:"イ",label:"危害要因分析(HA)の実施"},{key:"ウ",label:"管理基準(CL)の設定"},{key:"エ",label:"モニタリング方法の設定"},{key:"オ",label:"改善措置の設定"}],correct:"イ",explanation:"HACCPの7原則は順に「危害要因分析」「重要管理点(CCP)の決定」「管理基準(CL)の設定」「モニタリング方法の設定」「改善措置の設定」「検証方法の設定」「記録の保管」。\nまず危害要因分析(Hazard Analysis)から始まる。"},

const QUESTIONS_MNG = [
  {id:"r7-mng-q1",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第1問",title:"第1問　戦略の階層(ホッファー＆シェンデル)",body:"C.ホッファーとD.シェンデルは、戦略には階層があり、それぞれの戦略の検討事項は異なることを指摘している。彼らの分類に基づいた戦略に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"機能分野別戦略では、事業領域の選択が最も重要な戦略上の検討事項である。"},{key:"イ",label:"コングロマリット企業の全社戦略では、事業間の資源シナジーの創出が最も重要な戦略上の検討事項である。"},{key:"ウ",label:"事業戦略では、事業ポートフォリオ内の事業間での経営資源の配分が最も重要な戦略上の検討事項である。"},{key:"エ",label:"事業戦略では、独自能力の構築と競争優位性の獲得が最も重要な戦略上の検討事項である。"},{key:"オ",label:"全社戦略では、特定の製品や市場セグメントでの競争に焦点を当て、その事業の成長や利益を増加させることが最も重要な戦略上の検討事項である。"}],correct:"エ",explanation:"戦略の階層は全社戦略・事業戦略・機能別戦略。\nア 誤:事業領域(ドメイン)の選択は全社戦略の検討事項。\nイ 誤:コングロマリットは事業間関連性が低く資源シナジーは限定的(財務シナジー中心)。\nウ 誤:事業間の資源配分は全社戦略の検討事項。\nエ 正:事業戦略は競争戦略で、独自能力の構築と競争優位の獲得が中心課題。\nオ 誤:特定の製品・市場での競争は事業戦略の検討事項。"},
  {id:"r7-mng-q2",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第2問",title:"第2問　アンゾフの成長マトリクス",body:"食品メーカーA社は日本国内の一般消費者向けシリアルの専業企業である。I.アンゾフの成長マトリクスの考え方に基づく記述として、最も適切なものはどれか。",options:[{key:"ア",label:"自社シリアルのみを販売する国内一般消費者向け自社ECサイトを立ち上げ、既存シリアル市場でのシェア拡大を狙うことで「多角化戦略」を行う。"},{key:"イ",label:"新しく飲食事業者を顧客とするSNSマーケティング支援事業を開始し次の収益の柱としようとすることで「市場浸透戦略」を行う。"},{key:"ウ",label:"一部の既存販売地域を対象に地域名産品を用いた限定フレーバーの一般消費者向けシリアルを新しく開発することで「多角化戦略」を行う。"},{key:"エ",label:"既存顧客のリピート購入を促進するクーポンキャンペーンを実施し既存シリアル市場でのシェア拡大を狙うことで「新市場開拓戦略」を行う。"},{key:"オ",label:"コア・ユーザーである中高年層向けに新しく低糖質シリアルを開発することで「新製品開発戦略」を行う。"}],correct:"オ",explanation:"成長マトリクス:既存製品×既存市場=市場浸透、既存×新市場=新市場開拓、新製品×既存市場=新製品開発、新製品×新市場=多角化。\nア 誤:既存製品×既存市場で実際は市場浸透。\nイ 誤:新製品×新市場で実際は多角化。\nウ 誤:新製品×既存市場で実際は新製品開発。\nエ 誤:既存製品×既存市場で実際は市場浸透。\nオ 正:既存市場(中高年=既存顧客)×新製品なので新製品開発戦略。"},
  {id:"r7-mng-q3",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第3問",title:"第3問　VRIO・模倣困難性",body:"VRIOフレームワークに基づくと、競合企業が経営資源を模倣する際のコスト上の不利をもたらし、自社の経営資源の模倣困難性を高める要因として、最も適切なものはどれか。",options:[{key:"ア",label:"競合企業には他に将来性が高く注力するべき経営資源があること。"},{key:"イ",label:"自社が歴史的な経緯で長い時間をかけて、独自の経営資源を獲得してきたこと。"},{key:"ウ",label:"自社の経営資源がどのように競争優位性につながっているのかが既に明確になっており、業界に知れ渡っていること。"},{key:"エ",label:"自社の経営資源の価値が特定の市場だけに限定されており、他市場では活用できないこと。"},{key:"オ",label:"自社の経営資源を代替できる別の経営資源が外部の企業から調達可能であること。"}],correct:"イ",explanation:"模倣コストを高める要因は、歴史的条件(経路依存性)、因果関係の曖昧性、社会的複雑性など。\nイ 正:長い時間をかけた独自資源の蓄積=経路依存性(historical conditions)で模倣困難性を高める。\nア 誤:競合の事情で自社資源の模倣困難性とは別。\nウ 誤:つながりが明確で知れ渡っている=因果曖昧性が低く模倣されやすい。\nエ 誤:価値の限定は模倣困難性とは別問題。\nオ 誤:代替資源が調達可能=模倣(代替)されやすい。"},
  {id:"r7-mng-q4",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第4問",title:"第4問　ダイナミック・ケイパビリティ",body:"ダイナミック・ケイパビリティに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"企業が外部環境への依存度を下げ、完全に独立した運営を実現する能力を指す。"},{key:"イ",label:"既存の経営資源を活用することで、成熟期の安定的な市場環境で競争優位性を得る能力を指す。"},{key:"ウ",label:"競合他社からの模倣によって追いつかれないように、業務プロセスの効率化を一層追求する能力を指す。"},{key:"エ",label:"顧客に独自の価値を提供し、かつ競合他社からの模倣を防ぐことを可能にする、現在の市場において競争優位性を獲得する基盤となる中核的な能力を指す。"},{key:"オ",label:"市場環境の変化を知覚し、新たなビジネス機会を活かし、必要時には既存の経営資源やプロセスを再構成する能力を指す。"}],correct:"オ",explanation:"ティースらのダイナミック・ケイパビリティは、感知(sensing)・捕捉(seizing)・変容/再構成(transforming)の3要素。\nオ 正:変化の知覚・機会の活用・資源やプロセスの再構成という定義に合致。\nイ 誤:既存資源の効率的活用はオーディナリー(通常)・ケイパビリティ。\nウ 誤:既存資源の効率的活用はオーディナリー(通常)・ケイパビリティ。\nエ 誤:中核的能力はコア・コンピタンスの説明。\nア 誤:完全独立を目指すものではない。"},
  {id:"r7-mng-q5",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第5問",title:"第5問　垂直統合と市場取引",body:"垂直統合と市場取引に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"市場取引から垂直統合に転換すると、市場取引の時よりも暗黙知や文脈依存的な知識は活用されにくくなる。"},{key:"イ",label:"市場取引は垂直統合に比べて調整の効率性が高く、機会主義的行動の発生を抑制できる。"},{key:"ウ",label:"垂直統合された組織では、市場取引の時に比べて、コストを削減したり機能や品質を向上させたりするインセンティブは高まる。"},{key:"エ",label:"特定の取引相手しか供給できない財を調達する場合、市場取引よりも垂直統合が選択される傾向がある。"},{key:"オ",label:"取引する財が標準化されている場合、市場取引よりも垂直統合が選択される傾向がある。"}],correct:"エ",explanation:"取引コスト理論では資産特殊性が高いほど垂直統合が選ばれる。\nエ 正:特定相手しか供給できない財=資産特殊性が高く、機会主義のリスクを避けるため垂直統合が選ばれやすい。\nア 誤:組織内化(垂直統合)の方が暗黙知・文脈依存知識を活用しやすい。\nイ 誤:機会主義の抑制は垂直統合の方が得意。\nウ 誤:競争のある市場取引の方がコスト削減・品質向上のインセンティブが高い。\nオ 誤:標準化された財は市場取引が選ばれやすい。"},
  {id:"r7-mng-q6",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第6問",title:"第6問　企業間の連携戦略",body:"企業間の連携戦略に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"TOBとは、買収者が対象企業の株式を公開市場で株主から買い付ける手法のことを指す。"},{key:"イ",label:"経営陣が中核となって既存株主から株式を買い取ることをMBOと呼ぶが、MBOは上場企業では起こるが、非上場企業では起こらない。"},{key:"ウ",label:"仕入先の事業を買収し、事業のバリューチェーンの変革を目指す買収を水平的M&Aと呼ぶ。"},{key:"エ",label:"ジョイントベンチャーは、M&Aよりも当事者同士で共有できる情報の範囲が広く範囲の経済を享受できるので、より大きな相乗効果が期待される。"},{key:"オ",label:"事業会社がベンチャー企業に投資をすることをCVC(コーポレート・ベンチャー・キャピタル)と呼ぶ。"}],correct:"オ",explanation:"オ 正:CVCは事業会社がシナジー等を目的にベンチャーへ投資する仕組み。\nア 誤:TOB(公開買付)は市場外で不特定多数の株主から買い付ける手法。「公開市場で」が誤り。\nイ 誤:MBOは非上場企業でも行われる。\nウ 誤:仕入先(川上)の買収は垂直的M&A。\nエ 誤:JVよりM&Aの方が情報共有・統合が深く相乗効果は大きい傾向。"},
  {id:"r7-mng-q7",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第7問",title:"第7問　業界の構造分析(参入障壁・撤退障壁)",body:"ある業界では、新規参入には大規模な設備・高度な専門技術・多額の初期投資・許可取得が必要(参入障壁が高い)だが、撤退時は設備を他業界に転用でき契約解消もスムーズ(撤退障壁が低い)。「業界の構造分析」の考え方に従った場合、この業界の競争の特質に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"参入障壁が高く、撤退障壁が低い業界であるため、新規参入は控えられる一方、低業績の企業は撤退しやすくなることから、業界の収益性は高くなりやすい。"},{key:"イ",label:"参入障壁も撤退障壁も低いため、不採算企業が市場に残りやすく、業界の競争が激化して収益性は低下しやすくなる。"},{key:"ウ",label:"新規参入が制限されるとともに競争力の低い企業が撤退しやすくなることから、市場の集中度は低下し、業界の競争は緩やかになりやすい。"},{key:"エ",label:"新規参入は慎重に行われるものの、撤退コストが低いため、多くの企業は業界にとどまり続け、結果として業界の競争は激しくなりやすい。"},{key:"オ",label:"撤退が容易であるため、新規参入に対する動機は高まり、業界の競争の激化と収益性の低下が長期的に進みやすい。"}],correct:"ア",explanation:"参入障壁が高く撤退障壁が低い業界は、最も望ましい収益構造とされる。\nア 正:新規参入が抑えられ、低業績企業は撤退しやすいため、業界の収益性は高く安定しやすい。\nイ 誤:本問は参入障壁が高い。\nウ 誤:参入が制限されると市場集中度はむしろ高まる傾向。\nエ 誤:撤退コストが低いので低業績企業はとどまらず撤退する。\nオ 誤:参入障壁が高いので参入動機は高まらない。"},
  {id:"r7-mng-q8",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第8問",title:"第8問　ポーターの活動システム",body:"M.ポーターが提唱した「活動システム(activity system)」に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"活動システム全体の一貫性を確保し、活動間の相互作用を強化することで、活動システムの模倣困難性を高めることができる。"},{key:"イ",label:"活動システム全体を最適化するために、各活動の効率性を優先した設計を行う必要がある。"},{key:"ウ",label:"企業を類似した活動システムによってグループ化し、業界全体の競争状況を視覚的に把握するためのツールを活動システムマップという。"},{key:"エ",label:"コスト優位を実現する活動システムに差別化優位を実現する活動の一部を統合することで、低コスト化と差別化のトレードオフは解消される。"},{key:"オ",label:"戦略を曖昧にすることで活動システムの柔軟性を高め、持続的な競争優位性を実現することができる。"}],correct:"ア",explanation:"ア 正:活動間のフィット(一貫性・相互強化)が全体としての模倣困難性を生む。\nイ 誤:各活動の効率性ではなく全体の適合(フィット)が重要。\nウ 誤:活動システムマップは個別企業の活動の関連を示すもの。企業のグループ化は戦略グループの議論。\nエ 誤:活動システムは戦略的ポジションを伴い、トレードオフが本質。\nオ 誤:戦略の明確さ(取捨選択)が競争優位の源泉。"},
