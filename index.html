  {id:"r7-ope-q37",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第37問",title:"第37問　物流センター",body:"物流センターに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"ASN(事前出荷情報)は、入荷側が出荷予定情報を作成して出荷側に送信する電子データである。"},{key:"イ",label:"DPS(Digital Picking System)は摘み取り方式、DAS(Digital Assort System)は種まき方式と呼ばれるピッキング支援システムである。"},{key:"ウ",label:"トラック予約受付システムは、特定の時間帯にトラックを集中させることで荷役効率を高める仕組みである。"},{key:"エ",label:"パレタイザは、パレット単位で仕分けされた商品を顧客別に分類する装置である。"},{key:"オ",label:"物流ABC(活動基準原価計算)は、管理可能なコストと不可能なコストの双方を含めて算出する。"}],correct:"イ",explanation:"イ 正:DPS=摘み取り方式、DAS=種まき方式。\nア 誤:ASNは出荷側が作成して入荷側に送信する。\nウ 誤:トラック予約受付は集中を防ぎ、平準化するシステム。\nエ 誤:パレタイザは荷を自動的にパレット上に積み付ける装置。\nオ 誤:物流ABCは管理可能なコストを活動別に算出する手法。"},
  {id:"r7-ope-q38",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第38問",title:"第38問　GTIN-14",body:"集合包装用商品コードであるGTIN-14に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"GTIN-14の先頭1桁(インジケータ)は、商品の生産国を表す。"},{key:"イ",label:"GTIN-14は消費者向け単品(バラ商品)の標準的なコードである。"},{key:"ウ",label:"GTIN-14は、日本国内向けに独自に定められた集合包装用コードである。"},{key:"エ",label:"GTIN-14は、12桁のJANコードに2桁のインジケータを付加したものである。"},{key:"オ",label:"GTIN-14のインジケータは、ボール・ケース・パレットなど包装階層を識別する。"}],correct:"オ",explanation:"オ 正:GTIN-14の先頭1桁(インジケータ)は包装階層(1=ボール、2=ケース、3=パレット等)を識別する。\nア 誤:生産国コードはGS1事業者コードの一部であり、インジケータとは別。\nイ 誤:GTIN-14は集合包装用(段ボール単位など)。\nウ 誤:GTIN-14は国際標準。\nエ 誤:GTIN-14=1桁(インジケータ)+13桁(GTIN-13ベース)で構成。"},
  {id:"r7-ope-q39",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第39問",title:"第39問　生鮮標準商品コード",body:"生鮮標準商品コードに関する次の文中の空欄A〜Cに入る語句の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\n生鮮標準商品コードは、生鮮取引【A】の標準化を進めるため【B】を対象に整備されたコードである。先頭4桁は【C】で始まる。",options:[{key:"ア",label:"A：EOS　B：青果・水産・食肉の3品　C：4912"},{key:"イ",label:"A：EOS　B：青果のみ　C：4922"},{key:"ウ",label:"A：EDI　B：青果・水産・食肉・花きの4品　C：4922"},{key:"エ",label:"A：POS　B：水産のみ　C：4912"},{key:"オ",label:"A：POS　B：花きのみ　C：4922"}],correct:"ウ",explanation:"生鮮標準商品コードはEDI(電子データ交換)の標準化を目的に、青果・水産・食肉・花きの4品目を対象として整備されている。先頭4桁は4922で始まる。"},
  {id:"r7-ope-q40-1",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第40問",title:"第40問 設問1　アソシエーション分析(信頼度)",body:"下表は、ある店舗で商品A、B、Cの3つの売れ行きを調べたレシートデータである。「商品Aを購入した顧客が商品Bも購入する」というルールの信頼度(コンフィデンス)として、最も適切なものを下記の解答群から選べ。",figure:"OpeQ40",options:[{key:"ア",label:"1/5"},{key:"イ",label:"1/3"},{key:"ウ",label:"1/2"},{key:"エ",label:"2/5"},{key:"オ",label:"3/5"}],correct:"オ",explanation:"信頼度(A→B) = P(B|A) = (AかつB含む枚数) / (A含む枚数)。\nA含む枚数 = 400 + 1200 + 800 + 600 = 3000\nA∩B含む枚数 = 1200 + 600 = 1800\n信頼度 = 1800/3000 = 3/5。"},
  {id:"r7-ope-q40-2",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第40問",title:"第40問 設問2　アソシエーション分析(リフト値)",body:"設問1と同じ表を用いるとき、「商品Aを購入した顧客が商品Bも購入する」というルールのリフト値として、最も適切なものを下記の解答群から選べ。",figure:"OpeQ40",options:[{key:"ア",label:"2/5"},{key:"イ",label:"1/2"},{key:"ウ",label:"3/5"},{key:"エ",label:"1"},{key:"オ",label:"6/5"}],correct:"オ",explanation:"リフト値 = P(B|A) / P(B) = 信頼度 / 支持度(B)。\nP(B) = B含む枚数/全レシート = (200+1200+1000+600)/6000 = 3000/6000 = 1/2\nリフト値 = (3/5)/(1/2) = 6/5。\nリフト値>1なので、AとBは独立より共起しやすい(関連がある)。"},
  {id:"r7-ope-q41",exam:"中小企業診断士",year:"R7",subject:"運営管理",examLabel:"R7 運営管理",parent:"第41問",title:"第41問　HACCP",body:"HACCPの7原則のうち、最初に行うべき原則として、最も適切なものはどれか。",options:[{key:"ア",label:"重要管理点(CCP)の決定"},{key:"イ",label:"危害要因分析(HA)の実施"},{key:"ウ",label:"管理基準(CL)の設定"},{key:"エ",label:"モニタリング方法の設定"},{key:"オ",label:"改善措置の設定"}],correct:"イ",explanation:"HACCPの7原則は順に「危害要因分析」「重要管理点(CCP)の決定」「管理基準(CL)の設定」「モニタリング方法の設定」「改善措置の設定」「検証方法の設定」「記録の保管」。\nまず危害要因分析(Hazard Analysis)から始まる。"},
];

const QUESTIONS_MNG = [
  {id:"r7-mng-q1",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第1問",title:"第1問　戦略の階層(ホッファー＆シェンデル)",body:"C.ホッファーとD.シェンデルは、戦略には階層があり、それぞれの戦略の検討事項は異なることを指摘している。彼らの分類に基づいた戦略に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"機能分野別戦略では、事業領域の選択が最も重要な戦略上の検討事項である。"},{key:"イ",label:"コングロマリット企業の全社戦略では、事業間の資源シナジーの創出が最も重要な戦略上の検討事項である。"},{key:"ウ",label:"事業戦略では、事業ポートフォリオ内の事業間での経営資源の配分が最も重要な戦略上の検討事項である。"},{key:"エ",label:"事業戦略では、独自能力の構築と競争優位性の獲得が最も重要な戦略上の検討事項である。"},{key:"オ",label:"全社戦略では、特定の製品や市場セグメントでの競争に焦点を当て、その事業の成長や利益を増加させることが最も重要な戦略上の検討事項である。"}],correct:"エ",explanation:"戦略の階層は全社戦略・事業戦略・機能別戦略。\nア 誤:事業領域(ドメイン)の選択は全社戦略の検討事項。\nイ 誤:コングロマリットは事業間関連性が低く資源シナジーは限定的(財務シナジー中心)。\nウ 誤:事業間の資源配分は全社戦略の検討事項。\nエ 正:事業戦略は競争戦略で、独自能力の構築と競争優位の獲得が中心課題。\nオ 誤:特定の製品・市場での競争は事業戦略の検討事項。"},
  {id:"r7-mng-q2",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第2問",title:"第2問　アンゾフの成長マトリクス",body:"食品メーカーA社は日本国内の一般消費者向けシリアルの専業企業である。I.アンゾフの成長マトリクスの考え方に基づく記述として、最も適切なものはどれか。",options:[{key:"ア",label:"自社シリアルのみを販売する国内一般消費者向け自社ECサイトを立ち上げ、既存シリアル市場でのシェア拡大を狙うことで「多角化戦略」を行う。"},{key:"イ",label:"新しく飲食事業者を顧客とするSNSマーケティング支援事業を開始し次の収益の柱としようとすることで「市場浸透戦略」を行う。"},{key:"ウ",label:"一部の既存販売地域を対象に地域名産品を用いた限定フレーバーの一般消費者向けシリアルを新しく開発することで「多角化戦略」を行う。"},{key:"エ",label:"既存顧客のリピート購入を促進するクーポンキャンペーンを実施し既存シリアル市場でのシェア拡大を狙うことで「新市場開拓戦略」を行う。"},{key:"オ",label:"コア・ユーザーである中高年層向けに新しく低糖質シリアルを開発することで「新製品開発戦略」を行う。"}],correct:"オ",explanation:"成長マトリクス:既存製品×既存市場=市場浸透、既存×新市場=新市場開拓、新製品×既存市場=新製品開発、新製品×新市場=多角化。\nア 誤:既存製品×既存市場で実際は市場浸透。\nイ 誤:新製品×新市場で実際は多角化。\nウ 誤:新製品×既存市場で実際は新製品開発。\nエ 誤:既存製品×既存市場で実際は市場浸透。\nオ 正:既存市場(中高年=既存顧客)×新製品なので新製品開発戦略。"},
  {id:"r7-mng-q3",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第3問",title:"第3問　VRIO・模倣困難性",body:"VRIOフレームワークに基づくと、競合企業が経営資源を模倣する際のコスト上の不利をもたらし、自社の経営資源の模倣困難性を高める要因として、最も適切なものはどれか。",options:[{key:"ア",label:"競合企業には他に将来性が高く注力するべき経営資源があること。"},{key:"イ",label:"自社が歴史的な経緯で長い時間をかけて、独自の経営資源を獲得してきたこと。"},{key:"ウ",label:"自社の経営資源がどのように競争優位性につながっているのかが既に明確になっており、業界に知れ渡っていること。"},{key:"エ",label:"自社の経営資源の価値が特定の市場だけに限定されており、他市場では活用できないこと。"},{key:"オ",label:"自社の経営資源を代替できる別の経営資源が外部の企業から調達可能であること。"}],correct:"イ",explanation:"模倣コストを高める要因は、歴史的条件(経路依存性)、因果関係の曖昧性、社会的複雑性など。\nイ 正:長い時間をかけた独自資源の蓄積=経路依存性(historical conditions)で模倣困難性を高める。\nア 誤:競合の事情で自社資源の模倣困難性とは別。\nウ 誤:つながりが明確で知れ渡っている=因果曖昧性が低く模倣されやすい。\nエ 誤:価値の限定は模倣困難性とは別問題。\nオ 誤:代替資源が調達可能=模倣(代替)されやすい。"},
  {id:"r7-mng-q4",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第4問",title:"第4問　ダイナミック・ケイパビリティ",body:"ダイナミック・ケイパビリティに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"企業が外部環境への依存度を下げ、完全に独立した運営を実現する能力を指す。"},{key:"イ",label:"既存の経営資源を活用することで、成熟期の安定的な市場環境で競争優位性を得る能力を指す。"},{key:"ウ",label:"競合他社からの模倣によって追いつかれないように、業務プロセスの効率化を一層追求する能力を指す。"},{key:"エ",label:"顧客に独自の価値を提供し、かつ競合他社からの模倣を防ぐことを可能にする、現在の市場において競争優位性を獲得する基盤となる中核的な能力を指す。"},{key:"オ",label:"市場環境の変化を知覚し、新たなビジネス機会を活かし、必要時には既存の経営資源やプロセスを再構成する能力を指す。"}],correct:"オ",explanation:"ティースらのダイナミック・ケイパビリティは、感知(sensing)・捕捉(seizing)・変容/再構成(transforming)の3要素。\nオ 正:変化の知覚・機会の活用・資源やプロセスの再構成という定義に合致。\nイ 誤:既存資源の効率的活用はオーディナリー(通常)・ケイパビリティ。\nウ 誤:既存資源の効率的活用はオーディナリー(通常)・ケイパビリティ。\nエ 誤:中核的能力はコア・コンピタンスの説明。\nア 誤:完全独立を目指すものではない。"},
  {id:"r7-mng-q5",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第5問",title:"第5問　垂直統合と市場取引",body:"垂直統合と市場取引に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"市場取引から垂直統合に転換すると、市場取引の時よりも暗黙知や文脈依存的な知識は活用されにくくなる。"},{key:"イ",label:"市場取引は垂直統合に比べて調整の効率性が高く、機会主義的行動の発生を抑制できる。"},{key:"ウ",label:"垂直統合された組織では、市場取引の時に比べて、コストを削減したり機能や品質を向上させたりするインセンティブは高まる。"},{key:"エ",label:"特定の取引相手しか供給できない財を調達する場合、市場取引よりも垂直統合が選択される傾向がある。"},{key:"オ",label:"取引する財が標準化されている場合、市場取引よりも垂直統合が選択される傾向がある。"}],correct:"エ",explanation:"取引コスト理論では資産特殊性が高いほど垂直統合が選ばれる。\nエ 正:特定相手しか供給できない財=資産特殊性が高く、機会主義のリスクを避けるため垂直統合が選ばれやすい。\nア 誤:組織内化(垂直統合)の方が暗黙知・文脈依存知識を活用しやすい。\nイ 誤:機会主義の抑制は垂直統合の方が得意。\nウ 誤:競争のある市場取引の方がコスト削減・品質向上のインセンティブが高い。\nオ 誤:標準化された財は市場取引が選ばれやすい。"},
  {id:"r7-mng-q6",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第6問",title:"第6問　企業間の連携戦略",body:"企業間の連携戦略に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"TOBとは、買収者が対象企業の株式を公開市場で株主から買い付ける手法のことを指す。"},{key:"イ",label:"経営陣が中核となって既存株主から株式を買い取ることをMBOと呼ぶが、MBOは上場企業では起こるが、非上場企業では起こらない。"},{key:"ウ",label:"仕入先の事業を買収し、事業のバリューチェーンの変革を目指す買収を水平的M&Aと呼ぶ。"},{key:"エ",label:"ジョイントベンチャーは、M&Aよりも当事者同士で共有できる情報の範囲が広く範囲の経済を享受できるので、より大きな相乗効果が期待される。"},{key:"オ",label:"事業会社がベンチャー企業に投資をすることをCVC(コーポレート・ベンチャー・キャピタル)と呼ぶ。"}],correct:"オ",explanation:"オ 正:CVCは事業会社がシナジー等を目的にベンチャーへ投資する仕組み。\nア 誤:TOB(公開買付)は市場外で不特定多数の株主から買い付ける手法。「公開市場で」が誤り。\nイ 誤:MBOは非上場企業でも行われる。\nウ 誤:仕入先(川上)の買収は垂直的M&A。\nエ 誤:JVよりM&Aの方が情報共有・統合が深く相乗効果は大きい傾向。"},
  {id:"r7-mng-q7",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第7問",title:"第7問　業界の構造分析(参入障壁・撤退障壁)",body:"ある業界では、新規参入には大規模な設備・高度な専門技術・多額の初期投資・許可取得が必要(参入障壁が高い)だが、撤退時は設備を他業界に転用でき契約解消もスムーズ(撤退障壁が低い)。「業界の構造分析」の考え方に従った場合、この業界の競争の特質に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"参入障壁が高く、撤退障壁が低い業界であるため、新規参入は控えられる一方、低業績の企業は撤退しやすくなることから、業界の収益性は高くなりやすい。"},{key:"イ",label:"参入障壁も撤退障壁も低いため、不採算企業が市場に残りやすく、業界の競争が激化して収益性は低下しやすくなる。"},{key:"ウ",label:"新規参入が制限されるとともに競争力の低い企業が撤退しやすくなることから、市場の集中度は低下し、業界の競争は緩やかになりやすい。"},{key:"エ",label:"新規参入は慎重に行われるものの、撤退コストが低いため、多くの企業は業界にとどまり続け、結果として業界の競争は激しくなりやすい。"},{key:"オ",label:"撤退が容易であるため、新規参入に対する動機は高まり、業界の競争の激化と収益性の低下が長期的に進みやすい。"}],correct:"ア",explanation:"参入障壁が高く撤退障壁が低い業界は、最も望ましい収益構造とされる。\nア 正:新規参入が抑えられ、低業績企業は撤退しやすいため、業界の収益性は高く安定しやすい。\nイ 誤:本問は参入障壁が高い。\nウ 誤:参入が制限されると市場集中度はむしろ高まる傾向。\nエ 誤:撤退コストが低いので低業績企業はとどまらず撤退する。\nオ 誤:参入障壁が高いので参入動機は高まらない。"},
  {id:"r7-mng-q8",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第8問",title:"第8問　ポーターの活動システム",body:"M.ポーターが提唱した「活動システム(activity system)」に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"活動システム全体の一貫性を確保し、活動間の相互作用を強化することで、活動システムの模倣困難性を高めることができる。"},{key:"イ",label:"活動システム全体を最適化するために、各活動の効率性を優先した設計を行う必要がある。"},{key:"ウ",label:"企業を類似した活動システムによってグループ化し、業界全体の競争状況を視覚的に把握するためのツールを活動システムマップという。"},{key:"エ",label:"コスト優位を実現する活動システムに差別化優位を実現する活動の一部を統合することで、低コスト化と差別化のトレードオフは解消される。"},{key:"オ",label:"戦略を曖昧にすることで活動システムの柔軟性を高め、持続的な競争優位性を実現することができる。"}],correct:"ア",explanation:"ア 正:活動間のフィット(一貫性・相互強化)が全体としての模倣困難性を生む。\nイ 誤:各活動の効率性ではなく全体の適合(フィット)が重要。\nウ 誤:活動システムマップは個別企業の活動の関連を示すもの。企業のグループ化は戦略グループの議論。\nエ 誤:活動システムは戦略的ポジションを伴い、トレードオフが本質。\nオ 誤:戦略の明確さ(取捨選択)が競争優位の源泉。"},
  {id:"r7-mng-q9",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第9問",title:"第9問　コア技術戦略",body:"特定の技術分野に集中しその技術をベースとした製品を次々と開発・導入する「コア技術戦略」の特徴に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"コア技術が陳腐化したり模倣されたりしても、コア技術の入れ替えは考えず、既存のコア技術にこだわった技術開発や製品開発を追求する。"},{key:"イ",label:"コア技術の活用に注力し、既存市場でのシェア拡大を最優先の目標とする。"},{key:"ウ",label:"開発の初期段階ではコア技術よりも既存顧客の要求を優先する。"},{key:"エ",label:"コア技術を基盤に多様な製品を開発し、その学習成果をコア技術の強化や発展につなげる。"},{key:"オ",label:"特定技術に経営資源を集中させるため事業の多角化が難しく、コア技術に依存するリスクを分散しにくい。"}],correct:"エ",explanation:"エ 正:コア技術を軸に多様な製品展開を行い、その学習を再びコア技術の強化に循環させるのがコア技術戦略の要点。\nア 誤:陳腐化・模倣に対してはコア技術の更新・入替も検討する。\nイ 誤:既存市場シェア拡大の最優先化が本質ではない。\nウ 誤:コア技術を起点に顧客要求に応えるのが基本。\nオ 誤:コア技術を活かして多様な製品展開・関連多角化が可能。"},
  {id:"r7-mng-q10",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第10問",title:"第10問　ユーザー・イノベーション",body:"ユーザー・イノベーションに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"個人によるユーザー・イノベーションは、コミュニティを通じたユーザー・イノベーションよりも普及しやすい傾向にある。"},{key:"イ",label:"企業の開発者が主体となり、アンケートやインタビューを活用して顧客のニーズを調査し、その結果を製品開発に反映するプロセスである。"},{key:"ウ",label:"イノベーションのジレンマを引き起こし、既存企業が破壊的イノベーションに対応できなくなる原因となる。"},{key:"エ",label:"ユーザーが持つニーズ情報の粘着性が高く、技術情報の粘着性が低い場合に起こりやすい。"},{key:"オ",label:"リード・ユーザーと呼ばれる、特定の企業への忠誠度が高いユーザーによって引き起こされる傾向が強い。"}],correct:"エ",explanation:"フォン・ヒッペルの議論。\nエ 正:ニーズ情報の粘着性が高く解(技術)情報の粘着性が低いと、ニーズを持つユーザー側でイノベーションが起こりやすい。\nア 誤:コミュニティを通じた方が普及しやすい。\nイ 誤:それは企業主導の通常の製品開発。\nウ 誤:イノベーションのジレンマとは別概念。\nオ 誤:リード・ユーザーは市場の先端ニーズを持つユーザーで、企業への忠誠度の高さで定義されない。"},
  {id:"r7-mng-q11",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第11問",title:"第11問　リーン・スタートアップ(最も不適切)",body:"E.リースが提唱したリーン・スタートアップに関する記述として、最も不適切なものはどれか。",options:[{key:"ア",label:"アーリー・アダプターと呼ばれる流行に敏感かつ自ら情報収集をするような顧客層を巻き込むことが推奨される。"},{key:"イ",label:"戦略転換(ピボット)をする最適なタイミングを特定化する手法が提示され、それを使用することが推奨される。"},{key:"ウ",label:"想定された顧客が必要とする新規製品・サービスについて仮説を立て、コストをかけずに作った実用最小限の製品を顧客に使ってもらい反応を計測することが推奨される。"},{key:"エ",label:"新規性が非常に高く、顧客が存在するのかどうかも分からないような製品・サービスに適しており、幅広い産業に応用できる。"},{key:"オ",label:"トヨタ生産方式から影響を受けた考え方である。"}],correct:"イ",explanation:"本問は『最も不適切なもの』を選ぶ問題。\nイ:リーン・スタートアップは「構築-計測-学習」のループの中でピボットを判断するもので、ピボットの最適タイミングを特定する公式手法が提示されているわけではない。これが最も不適切で正解。\nア:アーリー・アダプターを巻き込むことは推奨される適切な記述(最も不適切ではない)。\nウ:MVP(実用最小限の製品)で顧客の反応を計測するのは中核的な考え方で適切(最も不適切ではない)。\nエ:新規性が高く顧客の有無も不明な製品に適し、幅広い産業に応用できる適切な記述(最も不適切ではない)。\nオ:トヨタ生産方式(リーン生産方式)から影響を受けており適切(最も不適切ではない)。"},
  {id:"r7-mng-q12",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第12問",title:"第12問　ダニングの折衷理論(OLIパラダイム)",body:"J.ダニングの折衷理論(OLIパラダイム)は、所有優位性(O)・立地優位性(L)・内部化優位性(I)の3条件から海外進出の形態を説明する。この理論に基づく記述として、最も適切なものはどれか。",options:[{key:"ア",label:"所有優位性と立地優位性と内部化優位性の全てがある場合、海外直接投資による海外進出が最も望ましい。"},{key:"イ",label:"所有優位性はあるが立地優位性と内部化優位性はない場合、輸出による海外進出が最も望ましい。"},{key:"ウ",label:"内部化優位性はあるが所有優位性と立地優位性はない場合、ライセンシング契約による海外進出が最も望ましい。"},{key:"エ",label:"立地優位性と内部化優位性はあるが所有優位性はない場合、輸出による海外進出が最も望ましい。"},{key:"オ",label:"立地優位性はあらゆる形態の海外進出において重要であり、この優位性がない場合は海外進出を行わないことが最も望ましい。"}],correct:"ア",explanation:"OLIの組み合わせ:O+L+I全て→海外直接投資(FDI)、O+I(Lなし)→輸出、Oのみ→ライセンシング。\nア 正:OLI全てが揃う場合はFDIが最適。\nイ 誤:Oのみならライセンシング。\nウ 誤:Iのみでは進出は説明されにくい(Oが前提)。\nエ 誤:Oがなければそもそも海外進出の優位がない。\nオ 誤:立地優位は形態選択の一要素で、ないから進出しないと断ずるのは不適切。"},
  {id:"r7-mng-q13",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第13問",title:"第13問　コーポレートガバナンス・コード",body:"日本のコーポレートガバナンス・コード(2015年から東京証券取引所の上場企業に適用)に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"企業価値よりも社会価値を優先し、社会の持続可能性を実現していくことを企業に求めている。"},{key:"イ",label:"上場企業に投資家としてのあるべき姿を示し遵守させるガイドラインのことである。"},{key:"ウ",label:"上場企業が備える企業の規律の在り方に関するガイドラインであり、法的拘束力はない。"},{key:"エ",label:"ステークホルダーの中で投資家の利益を最優先することを企業に求めている。"}],correct:"ウ",explanation:"ウ 正:コーポレートガバナンス・コードはソフトロー(comply or explain)で法的拘束力はない。\nア 誤:企業価値の向上を目指すもの。\nイ 誤:投資家のあるべき姿を示すのはスチュワードシップ・コード。\nエ 誤:特定ステークホルダーの利益最優先ではなく、株主を含む多様なステークホルダーとの適切な協働を求める。"},
  {id:"r7-mng-q14",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第14問",title:"第14問　組織における分業と調整",body:"組織における分業と調整に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"作業範囲を特定の領域に狭く限定すると、作業者のスキルが均質化し業務の幅が広がるため、キャリア形成の選択肢も増える。"},{key:"イ",label:"作業手順を標準化し作業内容を確定させることで計画目標の達成率を高め生産性向上につながる関係は、「計画のグレシャムの法則」として知られている。"},{key:"ウ",label:"分業が過度に進むと組織メンバーが仕事の意味を実感できず意欲が低下する現象は、「アンダーマイニング効果」として知られている。"},{key:"エ",label:"分業を進めると個々の作業が単純化され機械化が容易となるため、各工程間の調整が不要となり業務は効率化されやすい。"},{key:"オ",label:"定型的な作業は標準化によってあらかじめ調整し、想定外の事態には上位層が事後的に対応することで、仕事は効率的に行われる。"}],correct:"オ",explanation:"オ 正:標準化による事前調整と、ヒエラルキー(上位層)による例外の事後調整という分業・調整の基本形。\nア 誤:作業範囲を狭めると専門化し業務の幅は狭まる。\nイ 誤:計画のグレシャムの法則は「日常業務が計画業務を駆逐する」現象で記述と異なる。\nウ 誤:仕事の意味喪失は疎外の問題。アンダーマイニング効果は外的報酬が内発的動機づけを低下させる現象。\nエ 誤:分業が進むほど工程間の調整は必要になる。"},
  {id:"r7-mng-q15",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第15問",title:"第15問　組織構造と管理システム",body:"組織構造や管理システムに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"J.ウッドワードによれば、「単品・小バッチ生産」→「大バッチ・大量生産」→「装置生産」へと技術の複雑性が高まるにつれ、組織の階層数は増加し、管理者・監督者の全従業員に対する割合、および直接労働者に対する間接労働者の割合も高くなる。"},{key:"イ",label:"J.ウッドワードによれば、「単品・小バッチ生産」や「装置生産」を行う企業では、作業の標準化と手順の明確化が重要であり、「機械的管理システム」の導入が最も適している。"},{key:"ウ",label:"P.ローレンスとJ.ローシュによれば、不確実性の高い環境で高業績の組織は、組織全体を統合する取り組みをできる限り抑えながら各職能部門を高度に分化させていた。"},{key:"エ",label:"T.バーンズとG.M.ストーカーによれば、「有機的管理システム」は情報と意思決定の権限を上位に集中させることで分化と統合の両立を実現する。"},{key:"オ",label:"T.バーンズとG.M.ストーカーによれば、起業者段階や共同体段階では「有機的管理システム」が採用されるが、公式化段階や精巧化段階では「機械的管理システム」が採用される傾向が高くなる。"}],correct:"ア",explanation:"ア 正:ウッドワードの発見。技術の複雑性が高まるほど階層数が増え、管理者比率・間接労働者比率も高まる。\nイ 誤:単品生産や装置生産は有機的管理システムが適し、大量生産が機械的管理システム。\nウ 誤:ローレンス＆ローシュは高い分化と高い統合の両立を示した(統合を抑えるのではない)。\nエ 誤:有機的管理システムは分権的。集権は機械的管理システム。\nオ 誤:これは組織ライフサイクル論(グレイナー等)で、バーンズ＆ストーカーの帰属が誤り。"},
  {id:"r7-mng-q16",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第16問",title:"第16問　シャインの組織文化論(組み合わせ)",body:"E.シャインが提唱した組織文化論に関する記述の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　「組織文化の3層モデル」において、価値観は組織文化の最も深層に位置し、長年にわたってほとんど変化することなく組織の行動や意思決定を無意識のうちに方向づける。\nb　組織文化には、環境への外的適応を図る機能と、組織内の価値観や行動規範を共有して内的統合を促進する機能がある。\nc　組織文化変革のプロセスでは、まず人々が現状の問題を認識し、心理的安全性を確保しながら新しい学習を行い、その後、新しい価値観を内面化することで変革が定着する。\nd　組織文化は自らの経験を通じてしか身につけることができず、明示的な教育やトレーニングでは文化を伝えることはできない。",options:[{key:"ア",label:"aとb"},{key:"イ",label:"aとc"},{key:"ウ",label:"bとc"},{key:"エ",label:"bとd"},{key:"オ",label:"cとd"}],correct:"ウ",explanation:"a 誤:3層モデルの最深層は「基本的仮定」。価値観は中間層。\nb 正:外的適応と内的統合という文化の2機能はシャインの主張。\nc 正:解凍→変革→再凍結の変革プロセスに合致(心理的安全性の確保を含む)。\nd 誤:文化は教育・トレーニング等でも伝達・学習されうる。\n→ b と c の組み合わせ。"},
  {id:"r7-mng-q17",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第17問",title:"第17問　組織市民行動(OCB)",body:"D.オーガンによると組織市民行動は5次元(市民道徳、スポーツマン精神、誠実さ、丁重さ、利他主義)から構成される。これらに則した代表的な行動例の記述として、最も適切なものはどれか。",options:[{key:"ア",label:"「市民道徳」とは、関係者の時間を無駄にしないために義務でない会議には出席しない行動を指す。"},{key:"イ",label:"「スポーツマン精神」とは、自分の弱みを同僚に開示して職場のチームワーク強化を図る行動を指す。"},{key:"ウ",label:"「誠実さ」とは、上司の監視の目がなければ労働時間中でも仕事に関係のない雑談をして職場の雰囲気を和らげる行動を指す。"},{key:"エ",label:"「丁重さ」とは、関係者に対して事前に報告や相談をすることで関係者に問題が起こらないように配慮する行動を指す。"},{key:"オ",label:"「利他主義」とは、仕事で困っている同僚がいても助けの手を差し伸べず、本人の責任を明確にする行動を指す。"}],correct:"エ",explanation:"エ 正:丁重さ(courtesy)は事前の連絡・配慮で他者に問題が生じないようにする予防的行動。\nア 誤:市民道徳は組織の活動に積極参加すること(義務でない会議への参加など)。\nイ 誤:スポーツマン精神は不平不満を言わず困難に耐える姿勢。\nウ 誤:誠実さ(良心性)は規則を守り職務以上に勤勉に働くこと。雑談はむしろ逆。\nオ 誤:利他主義は困っている他者を進んで助ける行動。"},
  {id:"r7-mng-q18",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第18問",title:"第18問　組織コミットメントの3次元",body:"組織コミットメントの3次元(情緒的・継続的・規範的)に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"規範的コミットメントとは、組織の理念や価値観が自分の信念や倫理観と合致するかどうかを重視する個人の規範意識に基づくものである。"},{key:"イ",label:"継続的コミットメントとは、長期にわたって1つの組織に継続して参加し続けることに対する個人の義務感に基づくものである。"},{key:"ウ",label:"個人は情緒的・継続的・規範的コミットメントのうちいずれか1つしか経験できないのではなく、3つは個人の中で同時に併存可能である。"},{key:"エ",label:"情緒的コミットメントとストレスとの間には正の関係が見られる一方、継続的コミットメントとストレスとの間には負の関係が見られる。"},{key:"オ",label:"情緒的コミットメントとは、もし組織を去った場合、現状の生活水準を維持できなくなるのではないかという不安心理に基づくものである。"}],correct:"ウ",explanation:"ウ 正:3つのコミットメントは相互排他ではなく同時に併存しうる。\nア 誤:理念・倫理観との合致は情緒的要素寄り。規範的は義務感・忠誠の規範。\nイ 誤:義務感に基づくのは規範的。継続的はコスト(離脱の損失)に基づく。\nエ 誤:一般に情緒的は負、継続的は正のストレス関係が見られ、記述は逆。\nオ 誤:離脱コストへの不安は継続的コミットメント。"},
  {id:"r7-mng-q19",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第19問",title:"第19問　組織社会化",body:"「組織社会化」に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"新しいメンバーが自らの仕事の出来栄えのフィードバックを上司に求めるような積極的な行動は、組織社会化を阻害するように作用する。"},{key:"イ",label:"組織社会化を既に経験した個人が、転職などの組織間移動を契機として移動先の組織に適応していく過程は「組織再社会化」と呼ばれる。"},{key:"ウ",label:"上司とメンターは社会化エージェントとして重要な役割を果たすが、同じ地位の同僚が社会化エージェントの役割を果たすことはない。"},{key:"エ",label:"組織社会化によって組織文化にとらわれない自由な思考や行動が促進され、組織の秩序が損なわれる側面がある。"},{key:"オ",label:"「予期的社会化」とは、組織に参加した直後に得た情報や経験に基づいて、その組織に将来的に適応できるかを予期するプロセスを指す。"}],correct:"イ",explanation:"イ 正:既に社会化経験のある個人が移動先で再び適応する過程が組織再社会化。\nア 誤:フィードバック探索などのプロアクティブ行動は社会化を促進する。\nウ 誤:同僚も重要な社会化エージェントになりうる。\nエ 誤:社会化は組織への適応・秩序維持を促す。\nオ 誤:予期的社会化は組織に参加する「前」のプロセス(就職前の期待形成等)。"},
  {id:"r7-mng-q20",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第20問",title:"第20問　リーダーシップ理論",body:"リーダーシップ理論に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"F.フィードラーの研究によると、状況好意性が極めて好ましい場合と極めて好ましくない場合は、人間関係志向型のリーダーの方がタスク志向型より高業績をあげる傾向がある。"},{key:"イ",label:"オハイオ研究によると、「構造づくり」と「配慮」は互いにトレードオフの関係にあり、両立させることは不可能である。"},{key:"ウ",label:"サーバント・リーダーシップ理論によると、リーダーが何を要求しているかにメンバーが常に注意を向け、リーダーに対して自己犠牲的な行動をとることが成立要件である。"},{key:"エ",label:"パス・ゴール理論によると、リーダーがメンバーあるいは業務環境に欠けている要因を補完する行動をとった場合に、メンバーの業績と満足度は上昇する傾向がある。"},{key:"オ",label:"LMX理論によると、リーダーとメンバー集団全体との間で結ばれる包括的な交換関係の質が、メンバーの態度や行動に影響を与える。"}],correct:"エ",explanation:"エ 正:パス・ゴール理論は、リーダーがメンバーや状況に不足する要素を補完することで業績・満足が高まると説く。\nア 誤:フィードラーでは状況が極めて好意的/非好意的な両極端ではタスク志向型が有効、中間で人間関係志向型。記述は逆。\nイ 誤:構造づくりと配慮は独立した2次元で両立可能。\nウ 誤:サーバント・リーダーシップはリーダーがメンバーに奉仕する考え方で記述は逆。\nオ 誤:LMX理論はリーダーと「個々の」メンバーの個別交換関係の質に着目する。"},
  {id:"r7-mng-q21",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第21問",title:"第21問　資源依存パースペクティブ",body:"組み立てメーカーA社は製品Xのみを開発・製造・販売しており、製品Xに不可欠な部品Yを自社で製造できず部品サプライヤーB社からしか調達できない。一方、B社は部品YをA社以外の複数メーカーにも供給している。資源依存パースペクティブの考え方に従った記述として、最も適切なものはどれか。",options:[{key:"ア",label:"A社が製品Xの品質を向上させれば、B社からの供給リスクを低減できる。"},{key:"イ",label:"A社はB社に対する資源依存度が高いため、A社のB社に対する相対的なパワーは強い。"},{key:"ウ",label:"A社は部品Yの在庫を増やすことで、B社への依存を解消できる。"},{key:"エ",label:"A社は部品Yを使用しない新製品を開発することで、B社への依存度を低減できる。"},{key:"オ",label:"B社が部品Yの供給先を増やすと、A社のB社への依存度は低減する。"}],correct:"エ",explanation:"資源依存では、相手に依存する資源の重要性・代替不可能性が高いほど相手のパワーが強い。A社はB社に強く依存(代替先なし)している。\nエ 正:部品Yを使わない新製品開発は依存対象そのものをなくすため依存度を下げる有効策。\nア 誤:製品X品質向上は供給リスクと無関係。\nイ 誤:依存度が高いほどA社の相対的パワーは弱い。\nウ 誤:在庫積み増しは一時的緩衝にすぎず依存は解消しない。\nオ 誤:B社の供給先増加はB社のパワーを高め、A社の依存度低減には直結しない。"},
  {id:"r7-mng-q22",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第22問",title:"第22問　組織のネットワーク理論",body:"組織のネットワーク理論に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"D.ワッツとS.ストロガッツによると、スモールワールド・ネットワークでは、ランダムなつながりを増やすとネットワーク全体の平均経路長は長くなり情報の流通は困難になる。"},{key:"イ",label:"M.グラノヴェッターによると、交流の機会が少なく信頼関係が薄い「弱い紐帯」は、やりとりされる情報の範囲を限定し、新しい知識やアイデアを伝わりにくくする。"},{key:"ウ",label:"M.グラノヴェッターによると、強い信頼関係のもとで協力し合う「強い紐帯」は、組織の柔軟性を高め環境の変化に迅速に適応できるようにする。"},{key:"エ",label:"R.バートによると、構造同値の関係にある競争関係の組織同士は、目的や価値観を共有しやすいため連携して協調関係を構築しやすい。"},{key:"オ",label:"R.バートによると、構造的空隙の間に位置する組織は仲介者の役割を担うことで、多様な情報を入手し情報の優位性を得ることができる。"}],correct:"オ",explanation:"オ 正:バートの構造的空隙(structural holes)。空隙を橋渡しする位置は仲介者として情報の優位を得る。\nア 誤:ランダムなショートカットが増えると平均経路長は短くなる(スモールワールド)。\nイ 誤:グラノヴェッターの「弱い紐帯の強さ」は、弱い紐帯こそ新規情報をもたらすと説く。\nウ 誤:強い紐帯は結束を生むが新情報や柔軟性は弱い紐帯が担う。\nエ 誤:構造同値は競争関係を意味し、協調しやすいとはいえない。"},
  {id:"r7-mng-q23",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第23問",title:"第23問　組織変革への抵抗(最も不適切)",body:"組織における個人が組織変革に抵抗を示す理由に関する記述として、最も不適切なものはどれか。",options:[{key:"ア",label:"外部環境が変化しているのに、組織内の慣習が従来の安定的かつ効率的な仕事の進め方を維持し強化していることに対して、危機感を抱くから。"},{key:"イ",label:"組織変革によって、従来よりも仕事の成果がうまく出せなくなることを心配するから。"},{key:"ウ",label:"組織変革によって、新しい仕事のやり方が少なくとも短期的には従来よりも非効率になると感じるから。"},{key:"エ",label:"組織変革によって、自らの職務にとって未知で不確実な状態がもたらされることに不安を感じるから。"},{key:"オ",label:"客観的に外部環境が変化しても、偏った情報を収集・解釈することで従来と同じ環境が継続していると考えるから。"}],correct:"ア",explanation:"本問は『最も不適切なもの』を選ぶ問題。\nア:変化への「危機感を抱く」ことはむしろ変革を後押しする動機であり、変革への抵抗理由ではない。これが最も不適切で正解。\nイ:成果がうまく出せなくなることへの心配は、変革抵抗の典型的理由(最も不適切ではない)。\nウ:短期的に非効率になると感じることは、変革抵抗の典型的理由(最も不適切ではない)。\nエ:未知で不確実な状態への不安は、変革抵抗の典型的理由(最も不適切ではない)。\nオ:偏った情報収集・解釈で現状維持を正当化することは、変革抵抗の典型的理由(最も不適切ではない)。"},
  {id:"r7-mng-q24",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第24問",title:"第24問　有期雇用労働者",body:"使用者と期間の定めのある労働契約を締結する労働者(有期雇用労働者)に関する記述として、最も適切なものはどれか。なお、一定の事業の完了に必要な期間を定める労働契約は考慮しない。",options:[{key:"ア",label:"厚生労働大臣が定める基準に該当する高度の専門的知識等を有する労働者(その業務に就く者に限る)との有期労働契約は、5年を超える期間について締結してはならない。"},{key:"イ",label:"就業規則で「退職手当は3年以上勤務した者に支給する」と定めている場合、契約期間1年の有期雇用労働者を雇い入れる際の労働条件通知に際して、退職手当の有無を明示する必要はない。"},{key:"ウ",label:"使用者は有期労働契約期間が満了するまでの間は雇用し続けなければならず、やむを得ない事由がある場合であっても契約期間途中で解雇することができない。"},{key:"エ",label:"更新を期待することについて合理的な理由があると認められるときは、使用者はいかなる場合も当該契約の更新の申し込みを拒絶することができない。"}],correct:"ア",explanation:"ア 正:労基法14条で、原則の契約期間上限は3年だが、高度の専門的知識等を有する者および満60歳以上の者は5年が上限。よって高度専門職は「5年を超えてはならない」。\nイ 誤:退職手当の定めがある場合、その有無(対象者の範囲など)は明示すべき労働条件。\nウ 誤:やむを得ない事由がある場合は契約期間途中でも解雇できる(労契法17条)。\nエ 誤:雇止め法理(労契法19条)でも、客観的合理性・社会通念上の相当性があれば更新拒絶は可能で、「いかなる場合も」拒絶できないわけではない。"},
  {id:"r7-mng-q25",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第25問",title:"第25問　ストレスチェック(労安衛法66条の10)",body:"労働安全衛生法第66条の10に規定する「心理的な負担の程度を把握するための検査」(ストレスチェック)および厚生労働省の指針に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"事業者は、ストレスチェックを受けた労働者に対し、当該検査を行った医師等から当該検査の結果が通知されるようにしなければならない。"},{key:"イ",label:"就業規則でストレスチェックの受検を義務付けている事業場では、受検を拒否した労働者に対し、拒否を理由として懲戒処分を行うことができる。"},{key:"ウ",label:"ストレスチェック制度は、特にメンタルヘルス不調を早期に発見し適切な対応を行うことを主たる目的としている。"},{key:"エ",label:"検査結果が要件に該当する労働者が保健師による面接指導を希望する旨の申出をしたときは、事業者は保健師による面接指導を行わなければならない。"}],correct:"ア",explanation:"ア 正:検査結果は実施者(医師等)から本人に通知される必要がある。\nイ 誤:受検は強制できず、拒否を理由とする不利益取扱い・懲戒はできない。\nウ 誤:主目的はメンタルヘルス不調の未然防止(一次予防)であり、早期発見が主目的ではない。\nエ 誤:法定の面接指導は「医師」が行う。"},
  {id:"r7-mng-q26",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第26問",title:"第26問　職場におけるパワーハラスメント",body:"労働施策総合推進法第30条の2に規定される、いわゆる「職場におけるパワーハラスメント」および厚生労働省の指針に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"1人の労働者に対して同僚が集団で無視をし職場で孤立させるなどの「人間関係からの切り離し」は、パワーハラスメントの代表的な言動の類型に含まれる。"},{key:"イ",label:"事業主はパワハラ防止の措置を講じなければならないが、常時雇用する労働者が10人未満の事業所は、相談窓口の設置・周知など相談体制を整備する義務までは負わない。"},{key:"ウ",label:"パワハラ該当性は労働者個人の主観に基づき判断されるため、客観的に業務上必要かつ相当な範囲の適正な業務指示であっても、労働者が不満に感じればパワハラに該当する。"},{key:"エ",label:"「職場」とは労働者が通常就業している場所を指し、社外における取引先との打ち合わせ場所(接待の席を含む)は「職場」に該当することはない。"}],correct:"ア",explanation:"ア 正:「人間関係からの切り離し」は厚労省指針が示すパワハラ6類型の1つ。\nイ 誤:パワハラ防止の雇用管理上の措置義務は事業主の規模を問わず課される。\nウ 誤:客観的に業務上必要かつ相当な範囲で行われる適正な指示・指導はパワハラに該当しない。\nエ 誤:業務を遂行する場所であれば、社外の打ち合わせ・接待の席も「職場」に含まれうる。"},
  {id:"r7-mng-q27",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第27問",title:"第27問　1年単位の変形労働時間制",body:"労働基準法第32条の4(1年単位の変形労働時間制)に関する記述として、最も適切なものはどれか。なお、積雪地域の建設業の屋外労働者および隔日勤務のタクシー運転手のケースは考慮しない。",options:[{key:"ア",label:"対象労働者の範囲は労使協定で明確にしなければならず、対象期間の途中に採用した者は途中から対象労働者に含めることができないため、その者に途中から1年単位の変形労働時間制を適用させることはできない。"},{key:"イ",label:"1日の労働時間の限度は10時間、1週間の労働時間の限度は52時間である。さらに、対象期間を1年と定めた場合、労働時間が48時間を超える週が連続3週以下であり、かつ、対象期間を初日から3カ月ごとに区分した各期間において48時間を超える週の初日が3回以下でなければならない。"},{key:"ウ",label:"対象期間を1カ月以上の期間に区分する場合には、最初の期間における労働日及び労働日ごとの労働時間を定めておくことで、あらかじめ全期間にわたって定めておく必要がなくなる。"},{key:"エ",label:"対象期間は、その期間を平均して1週間当たりの労働時間が40時間を超えない範囲内において労働させる期間をいい、3カ月を超え1年以内の期間に限ることとされている。"}],correct:"イ",explanation:"イ 正:1日10時間・1週52時間が限度。対象期間が3カ月超の場合、48時間超の週は連続3週以下、かつ3カ月ごとの各期間で48時間超の週の初日が3回以下、という規制がある。\nア 誤:対象期間の途中採用者にも途中から適用でき、退職・途中採用に対する賃金清算の規定がある。\nウ 誤:区分する場合でも各区分期間の総労働日数・総労働時間を定める必要があり、最初の期間以外は各期間開始の30日前までに労働日等を特定する。\nエ 誤:対象期間は「1カ月を超え1年以内」。"},
  {id:"r7-mng-q28",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第28問",title:"第28問　マーケティング・リサーチ",body:"マーケティング・リサーチに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"1950〜60年代のアメリカでは、精神分析や臨床心理学を応用して消費者の深層心理を調べるニューロ・マーケティング・リサーチが盛んに行われたが、恣意的な解釈などにより次第に行われなくなった。"},{key:"イ",label:"顧客満足度(7点尺度)と顧客の年収との相関分析の結果、相関係数がゼロであったため、両者は相互に無関係であると結論づけた。"},{key:"ウ",label:"顧客満足度(7点尺度)を連続尺度とみて顧客の居住地(都道府県)との関係を調べるために、カイ2乗分析を行った。"},{key:"エ",label:"サービスセンターに寄せられる手紙・ハガキの分析の結果、製品Aより製品Bへの不満が多いことが分かったため、直ちに製品Bの販売を中止することにした。"},{key:"オ",label:"全顧客を対象とする全数調査は得られるデータの正確性が高い一方で時間とコストの観点から現実的でないため、単純無作為抽出法や層化抽出法などのサンプリング調査が行われることが多い。"}],correct:"オ",explanation:"オ 正:全数調査はコスト・時間の制約から現実的でなく、確率抽出によるサンプリング調査が一般的。\nア 誤:深層心理を扱うのはモチベーション・リサーチ。ニューロ・マーケティングは脳科学を用いる近年の手法。\nイ 誤:相関係数ゼロは線形関係がないことを示すだけで、非線形の関係がある可能性は否定できない。\nウ 誤:連続尺度と質的変数の関係には分散分析等が適切で、カイ2乗は質的変数間の検定。\nエ 誤:苦情件数のみで直ちに販売中止は短絡的(母数や原因の検討が必要)。"},
  {id:"r7-mng-q29-1",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第29問",title:"第29問 設問1　グローバル・マーケティングの発展段階",body:"食品メーカーA社は今後の経営計画として海外進出を視野に入れグローバル・マーケティングの検討を開始した。下図は、国内マーケティングを行っている企業がグローバル・マーケティングを展開するに至るまでの一般的な発展段階を示している。図中の空欄A〜Cに入る語句の組み合わせとして、最も適切なものを下記の解答群から選べ。",figure:"MngQ29_1",options:[{key:"ア",label:"A：国際マーケティング　B：多国籍マーケティング　C：輸出(間接・直接)"},{key:"イ",label:"A：国際マーケティング　B：輸出(間接・直接)　C：多国籍マーケティング"},{key:"ウ",label:"A：多国籍マーケティング　B：輸出(間接・直接)　C：国際マーケティング"},{key:"エ",label:"A：輸出(間接・直接)　B：国際マーケティング　C：多国籍マーケティング"},{key:"オ",label:"A：輸出(間接・直接)　B：多国籍マーケティング　C：国際マーケティング"}],correct:"エ",explanation:"一般的な発展段階は「国内マーケティング→輸出マーケティング→国際マーケティング→多国籍マーケティング→グローバル・マーケティング」。\nしたがって A=輸出(間接・直接)、B=国際マーケティング、C=多国籍マーケティング。"},
  {id:"r7-mng-q29-2",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第29問",title:"第29問 設問2　グローバル展開と参入モード",body:"グローバル・マーケティングや海外参入モードに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"海外進出して間もない時期は完全所有子会社による現地生産を採用することが必要であるが、現地ビジネスが軌道に乗るにつれて次第に直接・間接輸出に転換していく。"},{key:"イ",label:"知識には形式知と暗黙知があり、前者は明文化により国際移転が可能であるが、後者については移転できない。"},{key:"ウ",label:"フランチャイズでは、母国の本社がフランチャイジーとして研究開発・マーケティング・生産を行い、進出先のフランチャイザーが販売とサービスを担当する場合が多い。"},{key:"エ",label:"製品やサービスを進出先に合わせる適応化戦略は標準化戦略より高コストであるが、進出先における最終顧客の満足度は高い場合が多い。"},{key:"オ",label:"輸出マーケティングでは、当初は直接海外に輸出していた企業が、取扱量が増えるに従いリスク回避などの目的で商社などを介して間接輸出を行うようになる。"}],correct:"エ",explanation:"エ 正:適応化は現地適合のためコスト高だが、現地顧客満足は高まりやすい(標準化とのトレードオフ)。\nア 誤:一般には輸出から始め、軌道に乗ると現地生産・完全所有子会社へと進む(記述は逆)。\nイ 誤:暗黙知も(困難を伴うが)移転は可能。\nウ 誤:本社=フランチャイザー、進出先=フランチャイジーであり記述は逆。\nオ 誤:通常は間接輸出から直接輸出へ移行する(記述は逆)。"},
  {id:"r7-mng-q30",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第30問",title:"第30問　プライシング",body:"プライシングに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"価格を「支出の痛み」として捉えれば安いほど売れ行きは伸びるが、価格を「品質のバロメーター」や「プレステージ」として捉えれば、必ずしも安い価格の方が売れ行きが伸びるとは言えない。"},{key:"イ",label:"時期によって価格を変えるプライシングが行われるようになったのは、デジタル・マーケティングによるダイナミック・プライシングが浸透した近年になってからである。"},{key:"ウ",label:"サブスクリプションは所有権の移転を行わずに使用権だけを販売するもので、デジタル時代になって誕生した新しい契約形態である。"},{key:"エ",label:"流通業者への金銭的見返りのうち短期的なものは一般的にリベートと呼ばれ、長期的に提供されるアローワンスと区別される。"}],correct:"ア",explanation:"ア 正:価格は支出の痛みであると同時に品質・威光の手がかりにもなり、威光価格のように高価格が好まれる場合もある。\nイ 誤:季節価格やピーク価格など、時期による価格変動は古くから存在する。\nウ 誤:新聞・雑誌の定期購読など、サブスク型の契約は古くからある。\nエ 誤:リベートは取引量等に応じた割戻、アローワンスは特定の販促活動への報酬で、短期/長期という区分ではない。"},
  {id:"r7-mng-q31",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第31問",title:"第31問　マーケティング・コミュニケーション",body:"マーケティング・コミュニケーションに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"インフィード広告は、SNSのコンテキストやデザインとマッチさせて表示され、あたかも投稿の1つであるかのようにタイムラインに溶け込み、ユーザーの利用体験を妨げないことを目指す広告である。"},{key:"イ",label:"AIDMAモデルやAISASモデル、FCBグリッドなどの階層モデルは、消費者の反応が認知段階から感情段階を経て行動段階に進むと考える点で共通している。"},{key:"ウ",label:"サードパーティ・クッキーの利用が制限されると広告効果が低下するリスクがあるが、リ・ターゲティング広告には影響はない。"},{key:"エ",label:"日本では2022年に改正された個人情報保護法において、クッキーは個人情報であり個人情報保護の対象に含まれると規定された。"},{key:"オ",label:"ネイティブ広告ではデザインとフォーマットを媒体と一体化させる必要があるが、広告の内容やクリック後の遷移先のコンテンツは自由に設定できる。"}],correct:"ア",explanation:"ア 正:インフィード広告はフィードに溶け込ませて表示し、利用体験を損なわないことを目指す。\nイ 誤:FCBグリッドは関与度と思考/感情の2軸マトリクスで、単純な認知→感情→行動の階層モデルではない。\nウ 誤:リ・ターゲティング広告はサードパーティ・クッキー制限の影響を受ける。\nエ 誤:クッキー単体は個人情報ではなく「個人関連情報」として規律される。\nオ 誤:ネイティブ広告は媒体との一体化が求められ、遷移先まで含めた整合が前提となる。"},
  {id:"r7-mng-q32-1",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第32問",title:"第32問 設問1　外部環境の分析",body:"企業による環境分析のうち、外部環境の分析に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"PEST分析は、企業動向に影響を与える人口動態的要因(people)、経済的要因(economy)、社会的要因(society)、技術的要因(technology)を分析する手法である。"},{key:"イ",label:"SWOT分析の4つの分析視点のうち、外部環境分析に該当するのはSとWの視点である。"},{key:"ウ",label:"業界内の競争状況を視覚的に分析する知覚マップ分析では、価格・製品多様性・地域展開などの客観的要素が分析軸として設定される。"},{key:"エ",label:"ハーフィンダール・ハーシュマン指数の値が小さいほど、市場は完全競争につながっていく。"},{key:"オ",label:"ファイブ・フォーシズは、分析者の主観が反映されにくい極めて客観的な枠組みであり、分析結果の信頼性が高い。"}],correct:"エ",explanation:"エ 正:HHI(市場集中度指数)は値が小さいほど市場が分散し競争的(完全競争に近づく)。\nア 誤:PESTはPolitical(政治)・Economic(経済)・Social(社会)・Technological(技術)。peopleではない。\nイ 誤:外部環境はO(機会)とT(脅威)。SとWは内部環境。\nウ 誤:業界の競争状況を視覚化するのは戦略グループマップ。知覚マップは消費者の主観的知覚に基づくポジショニング分析。\nオ 誤:ファイブ・フォーシズも分析者の主観が入りうる。"},
  {id:"r7-mng-q32-2",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第32問",title:"第32問 設問2　内部環境の分析",body:"企業による環境分析のうち、内部環境の分析に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"3C分析は市場分析・競合他社分析・自社分析で構成され、このうち自社分析では自社の顧客のトレンドや潜在性といった動向を分析することが目的であり、個別顧客のニーズや行動までは分析対象にならない。"},{key:"イ",label:"KFS(Key Factor for Success)は、自社の将来的な目標と現状との間のギャップの明確化や、自社の成長において獲得すべき経営資源の明確化において指針となる概念である。"},{key:"ウ",label:"マーケティング・マイオピアを回避するためには、市場や顧客ニーズの変化を的確に捉えることよりも、自社の製品や技術の優位性を経営資源の観点から的確に捉えることが重要である。"},{key:"エ",label:"リソース・ベースト・ビューでは、企業はまず市場でのポジションを決め、それに必要な企業内の資源を構築するという順序で事業戦略を策定する。"}],correct:"イ",explanation:"イ 正:KFS(重要成功要因)は、目標と現状のギャップや獲得すべき資源を明確化する際の指針となる。\nア 誤:顧客のトレンド・潜在性を分析するのは顧客(市場)分析。自社分析は自社の強み・弱みの把握。\nウ 誤:マーケティング・マイオピア(近視眼)の回避には、自社製品・技術より市場・顧客ニーズの変化を捉えることが重要。\nエ 誤:RBVは経営資源を起点に戦略を組み立てる。市場ポジションを起点とするのはポジショニング・ビュー。"},
  {id:"r7-mng-q33",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第33問",title:"第33問　プッシュ戦略とプル戦略",body:"プッシュ戦略とプル戦略に関する記述の正誤の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\na　プル戦略では、大規模な店舗よりも小規模な店舗で販売する方が適している。\nb　プル戦略は、買い手の使用経験が豊富ですでに熟知している製品に対して用いられることが多く、広告は用いずにコストを削減することが多い。\nc　プッシュ戦略では、店頭で知識が豊富な店員による丁寧な人的説明や推奨を行うことが適している。\nd　プッシュ戦略では、投資の早期回収を図る場合、浸透価格で販売されることが多い。",options:[{key:"ア",label:"a：正　b：誤　c：正　d：正"},{key:"イ",label:"a：正　b：誤　c：正　d：誤"},{key:"ウ",label:"a：誤　b：正　c：正　d：正"},{key:"エ",label:"a：誤　b：正　c：誤　d：誤"},{key:"オ",label:"a：誤　b：誤　c：正　d：誤"}],correct:"オ",explanation:"a 誤:プル戦略は広告等で需要を喚起し顧客が指名買いする戦略で、店舗規模の大小とは結びつかない。\nb 誤:プル戦略はむしろ広告を積極的に用いる。\nc 正:プッシュ戦略は人的販売・店頭推奨が中心。\nd 誤:早期回収を図るなら上澄み(スキミング)価格。浸透価格は普及優先で回収は遅い。\n→ a:誤 b:誤 c:正 d:誤。"},
  {id:"r7-mng-q34",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第34問",title:"第34問　製品の需要",body:"製品の需要に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"環境やエネルギー保全などの公共的テーマと結びつけたデ・マーケティングは、対象市場の需要を抑制するため、そこから新たな代替市場を生み出す可能性につながる。"},{key:"イ",label:"健康食品カテゴリーの需要が持続している状態のように、ある方向性や連続性を保ちながら一定期間需要が長続きする状態のことをファッドと呼ぶ。"},{key:"ウ",label:"市場で優れた競争優位と成果をもたらしている企業の多くが顧客志向であり、顧客志向は需要創造において最も有効なマーケティング・コンセプトである。"},{key:"エ",label:"数量限定や地域限定のプロモーションは希少性の知覚を通して需要を増加させるが、時間限定のプロモーションにはその効果がない。"},{key:"オ",label:"頻繁に新たなデザインを導入することで旧デザインの魅力度を低下させ買い替え需要を促す計画的陳腐化は、SDGsの観点から望ましいマーケティング手法である。"}],correct:"ア",explanation:"ア 正:デ・マーケティングは需要を意図的に抑制する手法で、公共的テーマと結びつけることで代替市場の創出につながりうる。\nイ 誤:長続きするのはトレンド。ファッドは短命な流行。\nウ 誤:顧客志向は重要だが「最も有効」と断ずるのは過剰(社会志向など他の視点も重要)。\nエ 誤:時間限定プロモーションも希少性効果を持つ。\nオ 誤:計画的陳腐化は資源浪費を招きやすくSDGsの観点からは望ましくない。"},
  {id:"r7-mng-q35",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第35問",title:"第35問　消費行動",body:"消費行動におけるさまざまな現象に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"顕示的消費には、SNS映えする料理の写真を投稿したり動画で自分の趣味のよさを公開したりする行為や、裕福な家庭の親が子供に高級品を身に着けさせる行為が含まれる。"},{key:"イ",label:"現代の消費スタイルを包括的に記述する概念であるリキッド消費は、永続的で、所有ベースで、物質主義的な消費スタイルである。"},{key:"ウ",label:"消費者情報処理の枠組みにおける快楽消費の評価基準には、感覚的な満足や空想、美的な楽しみ、感情的反応だけでなく、合理的判断や思考などの功利も含まれる。"},{key:"エ",label:"消費の文化的意味や消費経験のダイナミックな側面を解明する消費文化理論の研究では、参与観察やデプス・インタビューなどの定性的アプローチがとられており、定量的アプローチはとられていない。"}],correct:"ア",explanation:"ア 正:顕示的消費(ヴェブレン)は富や地位を見せびらかす消費で、SNSでの誇示や子供への高級品なども該当する。\nイ 誤:リキッド消費は一時的・アクセスベース・脱物質主義的。永続・所有・物質主義はソリッド消費。\nウ 誤:快楽消費は感覚・感情・空想・美的楽しみが評価基準で、功利的判断は実用的消費の側面。\nエ 誤:消費文化理論は定性が中心だが定量的アプローチも併用されうる。"},
  {id:"r7-mng-q36",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第36問",title:"第36問　購買関与度×製品判断力",body:"下図は、購買関与度と製品判断力によって消費者の購買意思決定の特性を分類したものである。この中で、セールス・パーソンや小売店頭での店員との会話、あるいは知人・友人・家族のクチコミなどを通じた情報収集により意思決定が行われることが多いセルとして、最も適切なものを下記の解答群から選べ。",figure:"MngQ36",options:[{key:"ア",label:"セル1"},{key:"イ",label:"セル2"},{key:"ウ",label:"セル3"},{key:"エ",label:"セル4"}],correct:"エ",explanation:"縦軸=購買関与度、横軸=製品判断力。セル4は「購買関与度が高い／製品判断力が低い」象限(左上)。\n関与度が高く重要な買い物なのに自分では製品を判断する力が乏しい場合、消費者は店員の説明や知人・友人・家族のクチコミなど他者からの情報に頼って意思決定する傾向が強い。\nしたがって該当するのはセル4。"},
  {id:"r7-mng-q37",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第37問",title:"第37問　ブランディング",body:"ブランディングに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"COO(Country of Origin)イメージは、製品に対する消費者の選好に影響を及ぼし、時間を経ても変化することはない。"},{key:"イ",label:"コ・ブランディングはコミュニケーション・コストを削減できるが、ブランド・エクイティが希釈化するリスクがあるため、新製品には適用できない。"},{key:"ウ",label:"第三者ソースによる高評価はブランドの信頼性を付与し消費者の態度を向上させるが、ソーシャルネットワーク上での影響力は極めて小さい。"},{key:"エ",label:"著名人による推奨は当該著名人のイメージと結びつく知覚は形成されるが、ブランドが思い出されないリスクがあり、ファン以外の注意はひきつけられない。"},{key:"オ",label:"ライセンス供与は在庫費用や製造費用をかけずにブランド認知を増やすことができるが、過剰露出になった場合、消費者の飽きが生じるリスクがある。"}],correct:"オ",explanation:"オ 正:ライセンス供与は低コストでブランド認知を拡大できる反面、過剰露出によるブランド毀損(飽き)のリスクがある。\nア 誤:COOイメージは時間とともに変化しうる。\nイ 誤:コ・ブランディングは新製品にも適用可能。\nウ 誤:第三者評価はSNS上でも大きな影響力を持つ。\nエ 誤:著名人推奨はファン以外の注意もひきつけうる(吸血鬼効果のリスクはあるが「ひきつけられない」は誤り)。"},
  {id:"r7-mng-q38",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第38問",title:"第38問　ブランド関連概念(空欄)",body:"次の文中の空欄A〜Dに入るブランド関連概念の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\n消費者は、ブランドが有する【A】に魅力を感じ、その度合いが強くなると【B】を有するようになる。その結果、当該ブランドを優先的に選択する【C】を示すようになる。こうした一連の心理的プロセスの結果として形成される消費者の【D】は、当該ブランドが他ブランドに比した競争優位性を獲得するうえで極めて重要である。\n\n【概念】①ブランド・ロイヤルティ ②ブランド・パーソナリティ ③ブランド・リレーションシップ ④ブランド・エクイティ ⑤ブランド・アタッチメント",options:[{key:"ア",label:"A：②　B：①　C：⑤　D：④"},{key:"イ",label:"A：②　B：⑤　C：①　D：③"},{key:"ウ",label:"A：④　B：①　C：⑤　D：②"},{key:"エ",label:"A：④　B：②　C：⑤　D：③"},{key:"オ",label:"A：⑤　B：②　C：③　D：①"}],correct:"イ",explanation:"心理プロセスは「ブランド・パーソナリティ②に魅力を感じる → 愛着(ブランド・アタッチメント⑤)を持つ → 優先的に選択する行動(ブランド・ロイヤルティ①)を示す → その結果として消費者とブランドの関係性(ブランド・リレーションシップ③)が形成される」。\nしたがって A=②、B=⑤、C=①、D=③(選択肢イ)。"},
  {id:"r7-mng-q39",exam:"中小企業診断士",year:"R7",subject:"企業経営理論",examLabel:"R7 企業経営理論",parent:"第39問",title:"第39問　顧客と従業員",body:"顧客と従業員に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"顧客満足を起点とするサービス・プロフィット・チェーンは、高い顧客満足の実現が従業員のモチベーションとサービス品質を高め、結果として従業員満足と企業収益に影響するという流れである。"},{key:"イ",label:"従業員へのエンパワーメントが高いほど顧客ニーズへの対応は早く業務改善アイデアも出やすくなるが、サービスの失敗が起こったときのリカバリーは遅くなる。"},{key:"ウ",label:"従業員満足が顧客満足に影響することは大いにあるが、顧客満足が従業員満足につながることはほとんどない。"},{key:"エ",label:"従業員を内部顧客ととらえ自社の理念を共有し高い意識とモチベーションを醸成すべく実施されるインターナル・マーケティングの目的には、外部顧客の満足を高めることが含まれる。"}],correct:"エ",explanation:"エ 正:インターナル・マーケティングは従業員を内部顧客と捉え、最終的に外部顧客満足の向上につなげることを目的に含む。\nア 誤:サービス・プロフィット・チェーンは従業員満足が起点(内部サービス品質→従業員満足→定着・生産性→外部サービス価値→顧客満足→収益)。顧客満足起点ではない。\nイ 誤:エンパワーメントが高いとサービス失敗時のリカバリーも速くなる。\nウ 誤:顧客満足が従業員満足を高める(双方向の)効果もある。"},
  {id:"r6-mng-q1",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第1問",title:"第1問　創発的戦略(ミンツバーグ)",body:"H.ミンツバーグによって提唱された創発的戦略に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"創発的戦略とは、「意図された戦略」を「計画された戦略」に落とし込むための方策を表した概念である。"},{key:"イ",label:"創発的戦略とは、新たな事業ドメインをつくり出すための戦略と定義される。"},{key:"ウ",label:"創発的戦略とは、企業が新たな市場・製品分野に進出する際、シナジー効果の創出を意図する戦略である。"},{key:"エ",label:"創発的戦略とは、組織形態が戦略の選択肢を狭めるという、戦略策定過程の性質を表した概念である。"},{key:"オ",label:"創発的戦略とは、もともとの経営計画には組み込まれておらず偶発的に起こった事象に対応することで、事後的に生み出される戦略のことである。"}],correct:"オ",explanation:"【論点・背景】ミンツバーグは、実際に実現された戦略は『意図された戦略のうち実行されたもの(計画的戦略)』と『当初は意図していなかったが行動の積み重ねから事後的に形成されたもの(創発的戦略)』の両方から成ると論じた。トップが緻密に計画する戦略観への批判として、現場の試行錯誤や偶発的事象への対応から戦略がボトムアップ的に『創発』するという見方を提示したのが核心。\n\n【正答の理由】オは『経営計画に組み込まれておらず、偶発的事象への対応から事後的に生み出される』という創発的戦略の定義そのもの。\n\n【誤答の検討】\n・ア：意図された戦略を計画に落とし込むのは計画的(熟慮的)戦略の側のプロセスであり、創発の対義概念。\n・イ：事業ドメインの創出は戦略の内容の話であり、創発的戦略は『戦略がどう形成されるか』という形成プロセスの概念。\n・ウ：シナジー創出を意図する戦略はアンゾフの多角化戦略の文脈。『意図する』時点で創発ではない。\n・エ：『組織(構造)が戦略を制約する』はチャンドラー命題(組織は戦略に従う)の逆転に関する議論であり、創発的戦略の定義ではない。\n\n【まとめ】創発的戦略＝計画になかった行動パターンが事後的に戦略として認識されるもの。『実現された戦略＝計画的戦略＋創発的戦略』という図式と、対概念(意図された戦略・熟慮された戦略・未実現の戦略)をセットで覚える。"},
  {id:"r6-mng-q2",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第2問",title:"第2問　見えざる資産(伊丹敬之)",body:"伊丹敬之の提唱する「見えざる資産」に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"見えざる資産とは、「ヒト・モノ・カネ・情報」以外で企業の有する資産を総称した概念である。"},{key:"イ",label:"見えざる資産とは、具体的には技術やノウハウ、組織風土を指し、目に見える価値であるブランドは含まれない。"},{key:"ウ",label:"見えざる資産は、いったん出来上がるとさまざまな形で多重に利用されることはない。"},{key:"エ",label:"見えざる資産は、企業と外部との間の情報の流れだけではなく、企業内部の情報の流れからも生じる。"},{key:"オ",label:"見えざる資産は、競争上の差別化の源泉にはなりにくい性質を有する。"}],correct:"エ",explanation:"【論点・背景】伊丹敬之の『見えざる資産(invisible assets)』は、技術・ノウハウ・ブランド・顧客の信頼・組織風土といった情報的経営資源を指す。その本質は『情報』であり、(1)カネで買いにくく自らつくるしかない、(2)つくるのに時間がかかる、(3)複数の用途で同時多重利用できる、という特徴を持つため、競争力の真の源泉になるとされる。\n\n【正答の理由】エ：見えざる資産は情報の流れの中で蓄積される。『環境情報(外部→企業：技術やノウハウの蓄積)』『企業情報(企業→外部：ブランドや信用の形成)』『内部情報処理特性(企業内部：組織風土や経営管理能力)』の3つの情報の流れから生じるという伊丹の整理どおりであり正しい。\n\n【誤答の検討】\n・ア：見えざる資産は経営資源のうち『情報』に対応する情報的経営資源であり、『情報以外』とするのは正反対。\n・イ：ブランドは企業から外部への情報の流れが顧客側に蓄積されたものであり、見えざる資産の代表例。除外するのは誤り。\n・ウ：同時多重利用が可能な点こそ、物的資源にない見えざる資産の最大の特徴(例：1つのブランドを複数事業で同時に利用)。\n・オ：模倣困難で蓄積に時間がかかるため、むしろ差別化・競争優位の源泉になりやすい。\n\n【まとめ】正解はエ。『情報的経営資源』『3つの情報の流れ』『同時多重利用・蓄積に時間・カネで買えない』の3点セットで整理する。"},
  {id:"r6-mng-q3",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第3問",title:"第3問　ルメルトの多角化の分類(専門化率)",body:"ある企業では4つの事業を展開している。以下は、各事業(①〜④)の事業内容とある年度における売上高である。製品Aと製品B、部品Cは技術的に関連しているものとする。\n\n①製品A事業：960億円\n②製品B事業：10億円\n③部品C(製品Aの原材料の1つ)事業：20億円\n④不動産事業：10億円\n\nR.ルメルトの多角化の分類に基づいたこの企業の多角化の程度として、最も適切なものを下記の解答群から選べ。\nなお、この多角化の分類では、多角化企業は以下の基準で分類されるものとする。\n・専門化率が95％以上のものは単一事業企業\n・専門化率が95％未満で垂直率が70％以上のものは垂直的主力事業企業\n・専門化率と垂直率が70％未満で関連率が70％以上のものは関連事業企業\n・専門化率と垂直率、関連率のいずれもが70％未満のものは非関連事業企業",options:[{key:"ア",label:"関連事業企業"},{key:"イ",label:"垂直的主力事業企業"},{key:"ウ",label:"単一事業企業"},{key:"エ",label:"非関連事業企業"}],correct:"ウ",explanation:"【論点・背景】ルメルトの多角化分類は、(1)専門化率SR(最大の単一事業の売上高÷全社売上高)、(2)垂直率VR(垂直的に関連する事業群の売上高比率)、(3)関連率RR(関連する事業群のうち最大のものの売上高比率)という3つの比率を、問題文に示された判定基準に上から順に当てはめて分類する。判定は必ず『専門化率から』始めるのが鉄則。\n\n【計算過程】\n・全社売上高＝960＋10＋20＋10＝1,000億円\n・専門化率＝最大事業(製品A事業)960億円÷1,000億円＝96％\n・96％≧95％なので、第一基準により『単一事業企業』と判定され、ここで判定終了。垂直率・関連率を計算するまでもない。\nよってウが正しい。\n\n【誤答の検討】製品A・B・部品Cが技術的に関連している、部品Cが製品Aの原材料(垂直関係)である、といった記述は、関連事業企業(ア)や垂直的主力事業企業(イ)を選ばせるためのひっかけ情報。分類基準は階層的に適用するため、専門化率が95％以上である時点で関連性・垂直性は判定に影響しない。エの非関連事業企業は不動産事業(全体の1％)に引きずられた誤り。\n\n【キーワードの意味】専門化率＝1つの事業への集中度を測る最も基本的な指標。ルメルトの分類は『単一事業→垂直的主力→本業中心(関連)→関連事業→非関連事業』と多角化の程度が進む連続体として企業を位置づけ、多角化のタイプと収益性の関係(関連多角化が高収益という発見)を導いた研究として有名。\n\n【まとめ】SR＝96％≧95％→単一事業企業でウ。『基準は上から順に適用、該当したら終了』という機械的な手順を守れば、関連性の記述に惑わされない。"},
  {id:"r6-mng-q4",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第4問",title:"第4問　プロダクト・ポートフォリオ・マネジメント(PPM)",body:"以下の表は、企業Xのある年度の各事業の状況を示している。プロダクト・ポートフォリオ・マネジメント(PPM)の枠組みから示唆される記述として、最も適切なものを下記の解答群から選べ。\n\n事業A：売上高300億円、市場シェア15％(業界3位)、市場成長率25％\n事業B：売上高3,000億円、市場シェア45％(業界1位)、市場成長率5％\n事業C：売上高200億円、市場シェア5％(業界5位)、市場成長率5％\n事業D：売上高1,600億円、市場シェア55％(業界1位)、市場成長率25％",options:[{key:"ア",label:"事業Bは、成長余地がないので、できるだけ速やかに事業清算を行う。"},{key:"イ",label:"事業Dは、市場シェアや競争力の維持のために、事業からの収益を自事業に再投資する。"},{key:"ウ",label:"最も売上高の大きい事業Bから資金を投じ、事業Cを育成する。"},{key:"エ",label:"最も市場シェアの高い事業Dから技術シナジーを生むための技術供与を行い、事業Aを育成する。"},{key:"オ",label:"最も市場シェアの高い事業Dから資金を投じ、事業Cを育成する。"}],correct:"イ",explanation:"【論点・背景】PPM(BCGマトリクス)は、市場成長率(資金の必要量)と相対的市場シェア(資金の創出量)の2軸で事業を4象限に分類し、資金配分を考える枠組み。まず各事業を分類する：\n・事業A(成長率25％・シェア3位＝低シェア)＝問題児\n・事業B(成長率5％・シェア1位)＝金のなる木\n・事業C(成長率5％・シェア5位)＝負け犬\n・事業D(成長率25％・シェア1位)＝花形\n\n【正答の理由】イ：花形(事業D)は高シェアで資金を生むが、市場が高成長のためシェア・競争力の維持に多額の投資も必要であり、生んだ資金は自事業へ再投資するのがPPMの定石。市場成長が鈍化したときに金のなる木へ育てるための先行投資である。正しい。\n\n【誤答の検討】\n・ア：金のなる木(事業B)は低成長だが高シェアで安定した資金を生む全社の資金源。清算ではなく維持して資金を回収する。\n・ウ・オ：負け犬(事業C)は低成長・低シェアで育成投資の対象とせず、撤退・収穫が基本。資金を投じる先は問題児(事業A)であるべき。また花形Dは自事業への再投資が必要で、資金の出し手は金のなる木Bが基本(オはこの点でも誤り)。\n・エ：PPMはキャッシュフローの配分を論じる枠組みであり、技術シナジーや技術供与は分析の射程外。PPMの限界(事業間シナジーを考慮しない)を逆手に取ったひっかけ。\n\n【まとめ】正解はイ。『金のなる木で稼ぎ、問題児に投資して花形に育て、花形は自己再投資でシェア維持、負け犬は撤退』という資金循環の型と、各選択肢がどの定石に違反しているかを対応付けられるようにする。"},
  {id:"r6-mng-q5",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第5問",title:"第5問　買収防衛策",body:"他社からの買収に対応する企業Aの行動に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"「ゴールデンパラシュート」を導入し、経営陣が既存株主から自社の株式を直接購入して上場を廃止しようとする。"},{key:"イ",label:"自社の重要な資産をあらかじめ売却する「サメ除け」を行う。"},{key:"ウ",label:"買収企業が保有する企業Aの株式を、市場価格よりも高い価格で全て買い取ろうとする「パックマン戦法」を行う。"},{key:"エ",label:"買収企業による企業Aの株式の大量買付に備えて、買収企業以外の既存株主が新株を市場価格より安く取得できるなどの権利を事前に与える「ポイズンピル」を導入する。"},{key:"オ",label:"買収企業を逆に買収しようとする「ホワイトナイト」を探す。"}],correct:"エ",explanation:"【論点・背景】買収防衛策の用語問題。各用語と中身の正しい対応：\n・ポイズンピル(ライツプラン)＝買収者以外の株主に新株予約権等を事前付与し、発動時に買収者の持株比率を希薄化させる事前防衛策。\n・ゴールデンパラシュート＝買収で解任される経営陣に巨額の退職金を支払う契約を結び、買収コストを高める策。\n・サメ除け(シャーク・リペレント)＝取締役の交代時期をずらす(期差任期制)など、定款変更等で買収を困難にする事前の仕組みの総称。\n・パックマン・ディフェンス＝買収を仕掛けてきた企業を逆に買収しようとする策。\n・ホワイトナイト＝敵対的買収者に対抗して、友好的な第三者(白馬の騎士)に買収・出資してもらう策。\n・クラウンジュエル(焦土作戦)＝買収の狙いである重要資産・事業を売却して買収の魅力を失わせる策。\n\n【正答の理由】エはポイズンピルの定義として正しい(買収者以外の既存株主が新株を安く取得できる権利の事前付与)。\n\n【誤答の検討】各選択肢は『名前と中身の入れ替え』になっている。アの中身はMBO(経営陣による買収・非公開化)でありゴールデンパラシュートではない。イの中身はクラウンジュエル(焦土作戦)でありサメ除けではない。ウの中身は買収者からの高値での株式買戻し(グリーンメイラー対応)でありパックマンではない。オの中身はパックマン・ディフェンスでありホワイトナイトではない。\n\n【まとめ】正解はエ。防衛策はカタカナ用語の中身の入れ替えが定番の出題パターンなので、『誰が・何を・いつ(事前/事後)』で各用語を1行定義できるようにしておく。"},
  {id:"r6-mng-q6",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第6問",title:"第6問　取引コスト理論と垂直統合",body:"企業が垂直統合を行う動機や理由はさまざまである。このうち、O.ウィリアムソンの取引コスト(transaction cost)理論の観点からの説明として、最も適切なものはどれか。",options:[{key:"ア",label:"相手企業との取引関係構築の際に、関係特殊的な資産への多額の投資を必要とするため。"},{key:"イ",label:"自社に蓄積された余剰資金を活用し、資本効率を高める必要があるため。"},{key:"ウ",label:"自社の企業規模を拡大し、規模の経済性を高めるため。"},{key:"エ",label:"市場の新規性が高く取引相手の企業が存在しないが、自社資源を柔軟に再配分して直接進出することができるため。"},{key:"オ",label:"複数の事業を傘下に収めることで、範囲の経済性を高めるため。"}],correct:"ア",explanation:"【論点・背景】ウィリアムソンの取引コスト理論は、『市場で取引するか、組織内部に取り込む(内部化＝垂直統合)か』を取引コストの大小で説明する。取引コストを高める要因は、(1)資産特殊性(その取引relationにしか使えない関係特殊的資産)、(2)不確実性、(3)取引頻度、これに人間側の限定合理性と機会主義が組み合わさる。特に関係特殊的資産へ投資すると、投資後に相手から足元を見られる『ホールドアップ問題』が生じ、契約交渉・監視のコストが膨らむため、市場取引より内部化(垂直統合)が選好される。\n\n【正答の理由】ア：関係特殊的資産への多額の投資が必要な取引は、まさに資産特殊性が高くホールドアップ問題のリスクが大きい取引であり、取引コスト理論が垂直統合を予測する典型ケース。正しい。\n\n【誤答の検討】\n・イ(余剰資金の活用・資本効率)：財務的動機であり取引コストの議論ではない。\n・ウ(規模の経済)：生産コスト面の動機。取引コスト理論は生産コストではなく『取引に伴うコスト』に着目する。\n・エ(取引相手が存在しない市場への直接進出)：取引相手の不在は市場取引が成立しない話であり、市場vs組織の比較という取引コスト理論の枠組みとはずれる。\n・オ(範囲の経済)：多角化の経済性の議論であり、垂直統合の取引コスト的説明ではない。\n\n【まとめ】正解はア。『資産特殊性→ホールドアップ→取引コスト増→内部化』の因果連鎖がこの理論の核。規模の経済・範囲の経済・シナジーといった他の統合動機と明確に区別して覚える。"},
  {id:"r6-mng-q7",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第7問",title:"第7問　5フォース分析(代替品の脅威)",body:"M.ポーターの「業界の構造分析(5フォース分析)」における代替品に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"ある業界に代替品が存在することは、その業界の潜在的な収益性に正の影響を及ぼす。"},{key:"イ",label:"代替品となるものが少ないほど、代替品の脅威は大きくなる。"},{key:"ウ",label:"代替品のコストパフォーマンス比の向上が急速であるほど、その代替品の脅威は大きい。"},{key:"エ",label:"代替品を提供する業界の利益率が高いほど、代替品の脅威は小さい。"},{key:"オ",label:"何を代替品と見なすかは客観的に識別しやすいものである。"}],correct:"ウ",explanation:"【論点・背景】5フォース分析では、代替品(同じ顧客ニーズを異なる方法で満たす製品・サービス)の存在は業界の価格に上限を設け、業界の潜在的収益性を引き下げる脅威として働く。代替品の脅威が大きくなる条件は、(1)代替品の価格対性能比(コストパフォーマンス)の向上が速い、(2)代替品業界が高利益で価格引き下げ余力がある、(3)買い手の切り替えコストが低い、など。\n\n【正答の理由】ウ：代替品のコストパフォーマンス比の改善が急速なほど、顧客が乗り換える誘因が強まり脅威は大きい。ポーターの整理どおりで正しい。\n\n【誤答の検討】\n・ア：代替品の存在は価格の上限を画し、業界の収益性に『負』の影響を及ぼす。正の影響は逆。\n・イ：代替品が『多い』ほど脅威は大きい。少ないほど脅威は小さく、逆。\n・エ：代替品業界の利益率が高いほど、値下げ余力や投資余力があり脅威は『大きい』。逆。\n・オ：代替品は同一業界の競合と違って機能・ニーズベースで考える必要があり、何を代替品と見なすかの識別はむしろ難しい(例：映画館の代替は配信か、外食か)。『客観的に識別しやすい』は誤り。\n\n【まとめ】正解はウ。代替品の論点は『収益性へのマイナス圧力』『脅威が増す3条件(性能向上スピード・代替業界の収益力・低い切替コスト)』『識別の難しさ』の3点を、ア〜オのような逆転表現のひっかけに惑わされず判定できるかが問われる。"},
  {id:"r6-mng-q8",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第8問",title:"第8問　衰退業界の競争戦略(ポーター)",body:"衰退業界とは、景気変動や短期的要因によるものではなく、長期にわたって販売数量そのものが下降を続けている業界のことである。M.ポーターの衰退業界の競争戦略に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"買い手が価格に敏感でなく、かつ買い手の交渉力が小さいほど、業界の売上が縮小しても、残存者は利益を得やすい。"},{key:"イ",label:"企業が業界内で強力なポジションを占めているほど、企業による業界の衰退予想はより悲観的になりやすい。"},{key:"ウ",label:"急激かつ無軌道な衰退プロセスが予想されるほど、その業界の競争の激しさは減少する。"},{key:"エ",label:"業界衰退期の戦略の1つである刈り取り戦略とは、高い利益率を生み出す特定のセグメントを見い出し、その防衛を目指す戦略である。"},{key:"オ",label:"業界衰退の速度は、技術進歩や人口変化などの環境要因によって決まるもので、個々の企業の撤退戦略とは関係ない。"}],correct:"ア",explanation:"【論点・背景】ポーターの衰退業界(end-game)の戦略論。衰退業界でも需要構造・撤退障壁・競争の性質次第で残存者が利益を得られる場合があり、戦略の選択肢として(1)リーダーシップ(残存者利益狙い)、(2)ニッチ(高収益セグメントの確保・防衛)、(3)刈り取り(投資を絞り資金回収を最大化)、(4)即時撤退、の4つが示される。\n\n【正答の理由】ア：買い手が価格に敏感でなく(値下げ圧力が弱い)、買い手の交渉力が小さい(価格決定力が業界側にある)需要構造であれば、数量が縮小しても価格・マージンを維持でき、残存者は利益を得やすい。正しい。\n\n【誤答の検討】\n・イ：強いポジションの企業ほど自社の生き残りを前提に業界の将来を『楽観的』に見やすい(だからこそ過剰残存が起こる)。悲観的は逆。\n・ウ：急激で無軌道な衰退が予想されるほど、投げ売りや過当競争が起き、競争は『激化』する。緩やかで秩序ある衰退の方が競争は穏やか。\n・エ：記述の『高収益セグメントを見出して防衛する』のはニッチ戦略。刈り取り(収穫)戦略は、新規投資を抑制して既存事業から得られるキャッシュの回収を最大化する戦略であり、別物。\n・オ：撤退障壁の高さや各社の撤退戦略は衰退過程の秩序・速度に影響する。環境要因だけで決まり企業行動と無関係、は誤り。\n\n【まとめ】正解はア。衰退業界の収益性は『需要の性質(価格感応度・交渉力)』と『撤退障壁・衰退パターンの予見可能性』で決まる、という構造を押さえ、4戦略(リーダーシップ・ニッチ・刈り取り・即時撤退)の定義の入れ替えに注意する。"},
  {id:"r6-mng-q9",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第9問",title:"第9問　A-Uモデル(ドミナントデザイン)",body:"W.アバナシーとJ.アッターバックによって提唱された産業発展の段階とイノベーションのモデル(A-Uモデル)に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"ある製品について、使用状況、仕様、評価基準が顧客の間で共有されるようになると、ドミナントデザインが定まってくる。"},{key:"イ",label:"生産者の評価基準は、工程イノベーションが主流になると、コストから製品の新規性に移っていく。"},{key:"ウ",label:"製品そのものや、それを背後で支える各種の要素技術の進歩をもたらす製品イノベーションは、ドミナントデザインが生じた後により多く現れる。"},{key:"エ",label:"ドミナントデザインが出現すると、機械的組織よりも有機的組織が、その産業において増えていく。"},{key:"オ",label:"ドミナントデザインが出現すると、製品イノベーションも工程イノベーションも活発化する。"}],correct:"ア",explanation:"【論点・背景】A-Uモデルは産業の発展を『流動期→移行期→固定期(特定期)』の3段階で捉える。流動期は製品イノベーション(何を作るか)が活発で、製品の支配的な標準形＝ドミナントデザインが確立すると移行期に入り、競争の焦点は工程イノベーション(いかに安く作るか)へ移る。固定期には両イノベーションとも逓減し、コスト競争が中心になる。\n\n【正答の理由】ア：使用状況・仕様・評価基準が顧客の間で共有・収斂していくことで、市場で支配的な製品形態＝ドミナントデザインが定まる、というドミナントデザイン成立のメカニズムの説明として正しい。\n\n【誤答の検討】\n・イ：工程イノベーションが主流になる段階では、評価基準は製品の新規性から『コスト・効率』へ移る。方向が逆。\n・ウ：製品イノベーションが多く現れるのはドミナントデザイン確立『前』の流動期。確立後は製品の基本形が固定され、製品イノベーションは減少する。\n・エ：ドミナントデザイン出現後は効率追求のため標準化・分業が進み、『機械的組織』が増えていく。試行錯誤が必要な流動期にこそ有機的組織が適合する。逆。\n・オ：出現後に活発化するのは工程イノベーションであり、製品イノベーションは減少する。『両方活発化』は誤り。\n\n【まとめ】正解はア。『流動期＝製品イノベ・有機的組織、ドミナントデザイン確立、移行期以降＝工程イノベ・機械的組織・コスト競争』という時系列の対応表を作って覚えると、イ〜オのような前後・方向の入れ替えひっかけを確実に排除できる。"},
  {id:"r6-mng-q10",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第10問",title:"第10問　製品アーキテクチャ(インテグラル/モジュラー)",body:"製品アーキテクチャーとは、製品を構成する個々の部品や要素の間のつなぎ方や製品としてのまとめ方である。製品アーキテクチャーに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"インテグラル型のアーキテクチャーを持つ製品は、標準化が進んでいる。"},{key:"イ",label:"擦り合わせによって創造される価値が差別化要因になる製品については、モジュラー型のアーキテクチャーを持つことが多い。"},{key:"ウ",label:"部品間の相互依存性が高いインテグラル型のアーキテクチャーを持つ製品の場合、部門横断的に調整することが不可欠になる。"},{key:"エ",label:"モジュラー型のアーキテクチャーを持つ製品では、部品調達業者は、部品のコスト低減ではなく、部品の差別化をしなければならない。"}],correct:"ウ",explanation:"【論点・背景】製品アーキテクチャの2類型。インテグラル(擦り合わせ)型＝部品間の相互依存性が高く、部品を相互に微調整して全体最適を図る(例：自動車)。モジュラー(組み合わせ)型＝部品間のインターフェースが標準化され、独立に設計した部品を組み合わせられる(例：パソコン)。\n\n【正答の理由】ウ：インテグラル型では部品間の相互依存性が高いため、設計・生産の各部門や部品担当間で濃密な調整(部門横断的なすり合わせ)が不可欠になる。日本企業の組織能力(統合型ものづくり)との適合がよく論じられる点でもあり、正しい。\n\n【誤答の検討】\n・ア：標準化が進むのはモジュラー型(インターフェースの標準化が定義的特徴)。インテグラル型は製品ごとの専用設計が基本で標準化は進みにくい。\n・イ：擦り合わせの価値が差別化要因になるのは、定義上インテグラル型の特徴。モジュラー型としている点が逆。\n・エ：モジュラー型ではインターフェースが標準化されるため部品はコモディティ化しやすく、部品調達業者の競争は『コスト低減』が中心になる。差別化『しなければならない』は逆。\n\n【まとめ】正解はウ。『インテグラル＝相互依存・擦り合わせ・部門横断調整・差別化』『モジュラー＝標準インターフェース・独立設計・コスト競争・水平分業』という対の特徴を入れ替えるのが定番のひっかけ。藤本隆宏のアーキテクチャ論(統合型組織能力との適合)も周辺知識として有用。"},
  {id:"r6-mng-q11",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第11問",title:"第11問　I-Rフレームワーク(現地適応重視)",body:"ある企業では、国際化に際して、「自社の事業特性を考え、標準化を最小限に抑えながら、現地適応を最重要視する」という方針を立てた。この方針と合致する、I-Rフレームワークに基づいた経営スタイルに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"意思決定の権限や経営資源は海外子会社に分散され、親会社は子会社と緩やかにつながる。"},{key:"イ",label:"親会社が海外子会社を公式的に管理・統制し、子会社間の調整を行うが、日常業務の意思決定の権限や経営資源の多くは海外子会社に分散される。"},{key:"ウ",label:"各海外子会社が密接につながるネットワークとなり、各地での学習成果を企業全体で活用する。"},{key:"エ",label:"現地化と標準化の両立を図ることの負荷を下げるために、現地企業との戦略的提携体制を整える。"},{key:"オ",label:"重要な意思決定や経営資源は本国や親会社に集中し、集権的に海外子会社を統制する。"}],correct:"ア",explanation:"【論点・背景】I-Rフレームワーク(統合-適応グリッド)は、グローバル統合(I：世界規模の標準化・効率)への圧力と、ローカル適応(R：現地への対応)への圧力の2軸で国際経営のスタイルを整理する。バートレット＝ゴシャールの4類型との対応：(1)グローバル型(I高R低)＝本国集権・標準化、(2)マルチナショナル型(I低R高)＝現地分権・適応重視、(3)インターナショナル型＝本国の知識を移転しつつ一定の現地裁量、(4)トランスナショナル型(I高R高)＝ネットワークによる両立。\n\n【正答の理由】設問の方針は『標準化を最小限に、現地適応を最重要視』＝I低・R高のマルチナショナル(マルチドメスティック)型。その特徴は、意思決定権限と経営資源を各国子会社に分散し、親会社は緩やかな連邦のように子会社とつながること。アが正しい。\n\n【誤答の検討】\n・イ：本社が公式的に管理・統制しつつ権限を一定分散するのはインターナショナル型の説明。\n・ウ：子会社間の密なネットワークと学習成果の全社活用はトランスナショナル型(I・R両立)の説明。\n・エ：戦略的提携は4類型の経営スタイルの説明ではなく、I-Rフレームワークの枠外。\n・オ：本国集権・集権的統制はグローバル型(I高R低)で、設問の方針と正反対。\n\n【まとめ】正解はア。『グローバル＝集権・標準化／マルチナショナル＝分権・現地適応／トランスナショナル＝ネットワークで両立』という3点対比を、設問文のI-R圧力の記述から逆引きできるようにしておく。"},
  {id:"r6-mng-q12",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第12問",title:"第12問　CSR・ESG投資(最も不適切)",body:"企業の社会的責任やESG投資に関する記述として、最も不適切なものはどれか。",options:[{key:"ア",label:"「インパクト投資」とは、測定可能かつポジティブなインパクトを社会および環境に生み出す企業に、経済的リターンを求めず投資することである。"},{key:"イ",label:"「統合報告書」には、企業の売上高や資産などのような従来の財務諸表で記載されている内容に加えて、温室効果ガスの排出量、有給休暇の取得率、経営者報酬の決め方などが記載される。"},{key:"ウ",label:"CSVとは、経済的価値を創造しながら、社会課題に対応することで社会的価値も同時に創造するアプローチである。"},{key:"エ",label:"環境・社会問題への取り組みが十分でないと思われる企業の株式や債券を売却することによって、投資家が企業に圧力をかけることを「ダイベストメント」と呼ぶ。"},{key:"オ",label:"環境に対して適切な対応をしているように見せて、実態は二酸化炭素を多く排出しているような企業を「グリーンウォッシュ」と呼ぶ。"}],correct:"ア",explanation:"【論点・背景】ESG・サステナビリティ関連の用語問題。『最も不適切なもの』を選ぶ点に注意。\n\n【正答(不適切)の理由】ア：インパクト投資は『社会的・環境的インパクトと経済的リターンの両立』を意図する投資であり、経済的リターンを『求めず』とする点が誤り。リターンを求めない資金提供は寄付や助成であって投資ではない、というのが概念上の区別。測定可能なインパクトを求める点は正しいだけに、最後の一句で誤りに転じる典型的なひっかけ。\n\n【他の選択肢(適切)の確認】\n・イ：統合報告書は財務情報と非財務情報(ESG情報：温室効果ガス排出量、人的資本関連指標、ガバナンス＝役員報酬の決定方針など)を統合して価値創造ストーリーを示す報告書。適切。\n・ウ：CSV(共通価値の創造、ポーター＆クラマー)は『社会課題の解決を事業として行い、経済的価値と社会的価値を同時に創造する』アプローチ。本業と切り離れた慈善活動(CSR)との対比で覚える。適切。\n・エ：ダイベストメント(投資撤退)は、ESG面で問題のある企業・産業(化石燃料等)から資金を引き揚げて圧力をかける手法。適切。\n・オ：グリーンウォッシュは、環境配慮を装いながら実態が伴わないこと(見せかけの環境訴求)。適切。\n\n【まとめ】不適切はア。ESG用語は『定義の9割が正しく、1カ所だけ逆にする』出題が多いので、インパクト投資＝リターン『も』追求、ESG投資・CSV＝経済性と社会性の両立、という『両立』のキーワードを軸に判定する。"},
  {id:"r6-mng-q13",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第13問",title:"第13問　エフェクチュエーション(最も不適切)",body:"熟達した起業家にみられる意思決定の様式とされるエフェクチュエーションに即した行動に関する記述として、最も不適切なものはどれか。",options:[{key:"ア",label:"既存の製品を製造する時に使用していた温水に着眼し、その温水を利用してイチゴのハウス栽培を始めた。"},{key:"イ",label:"新規店舗を開設する際に、目標店舗数を設定するのではなく、許容できる損失額を重視して、段階的に店舗数を増やしていった。"},{key:"ウ",label:"大災害が起こったことによって大きな被害を受けたが、新聞報道などで被災地に注目が集まったことを利用して、自社製品の広告に力を入れた。"},{key:"エ",label:"他国で戦争が勃発し、エネルギー価格の変動が見込まれるため、過去20年分のデータを精査して、来年度の利益目標を立てた。"},{key:"オ",label:"発売した新製品に対してある顧客からクレームを受けたが、その顧客に製品改良のための活動に参加してもらい、製品の品質向上を図った。"}],correct:"エ",explanation:"【論点・背景】エフェクチュエーション(サラス・サラスバシー)は、熟達した起業家に共通する『予測に頼らない』意思決定様式で、5つの原則から成る：(1)手中の鳥(手持ちの資源から始める)、(2)許容可能な損失(期待利益でなく失ってよい範囲で賭ける)、(3)レモネード(予期せぬ事態を機会として活用する)、(4)クレイジーキルト(関与してくれるパートナーと共創する)、(5)飛行機のパイロット(コントロール可能なことに集中する)。対義概念は、目標を定め予測に基づいて最適手段を選ぶ『コーゼーション』。本問は『最も不適切＝エフェクチュエーションでないもの』を選ぶ。\n\n【正答(不適切)の理由】エ：過去20年分のデータを精査して将来の利益『目標』を立てるのは、予測(forecast)に基づく目標設定型の意思決定＝コーゼーションの典型。エフェクチュエーションの『予測ではなくコントロール』という発想と正反対であり、不適切。\n\n【他の選択肢(エフェクチュエーションに合致)の確認】\n・ア：既存設備の温水という手持ち資源から事業を発想＝手中の鳥の原則。\n・イ：目標店舗数(目標逆算)でなく許容損失の範囲で段階的に拡大＝許容可能な損失の原則。\n・ウ：災害という予期せぬ(ネガティブな)事象を広告機会に転換＝レモネードの原則。\n・オ：クレームをくれた顧客を製品改良のパートナーに巻き込む＝クレイジーキルトの原則。\n\n【まとめ】不適切はエ。5原則それぞれに対応する具体例を選択肢に割り当て、残った『予測・目標・データ分析』型の行動(コーゼーション)を見抜く、という出題構造を理解しておくと再現性高く解ける。"},
  {id:"r6-mng-q14",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第14問",title:"第14問　ガルブレイスの組織デザイン(情報処理モデル)",body:"J.ガルブレイスによれば、組織デザインの諸方策は、情報処理の必要性と情報処理能力の観点から評価できる。組織デザインの方策に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"横断的な関係の創出は、情報処理能力を増大させる。"},{key:"イ",label:"自己完結的職務の創出は、情報処理の必要性を増大させる。"},{key:"ウ",label:"垂直的な情報システムへの投資は、情報処理能力を低減させる。"},{key:"エ",label:"スラック資源の創出は、情報処理の必要性を増大させる。"}],correct:"ア",explanation:"【論点・背景】ガルブレイスの情報処理モデルでは、タスクの不確実性が高いほど組織が処理すべき情報量が増えるため、組織デザインの方策は2系統に整理される。(1)情報処理の『必要性を減らす』方策＝スラック資源の創出(余裕資源で例外対応を吸収)、自己完結的職務(部門)の創出(部門間の調整の必要を減らす)。(2)情報処理の『能力を高める』方策＝垂直的情報システムへの投資(階層を通る情報の処理能力を高める)、横断的関係の創出(部門間の直接接触・リエゾン・タスクフォース・マトリクス等で水平方向の処理能力を高める)。\n\n【正答の理由】ア：横断的(水平的)関係の創出は、階層を経由せずに部門間で直接情報を処理できるようにするため、情報処理『能力』を増大させる方策。正しい。\n\n【誤答の検討】\n・イ：自己完結的職務の創出は、部門間の相互依存を減らして調整に要する情報量を減らす、『必要性を低減させる』方策。増大は逆。\n・ウ：垂直的情報システムへの投資は、計画の更新頻度を上げるなどして階層の情報処理『能力を増大』させる方策。低減は逆。\n・エ：スラック資源(在庫・納期余裕・予算余裕など)は、例外事象を緩衝して調整の必要を減らす『必要性を低減させる』方策。増大は逆。\n\n【まとめ】正解はア。『必要性を減らす2つ(スラック・自己完結)／能力を高める2つ(垂直情報システム・横断的関係)』という2×2の分類を覚えれば、増減の向きを入れ替えるひっかけ(イ・ウ・エ)を機械的に排除できる。"},
  {id:"r6-mng-q15",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第15問",title:"第15問　シャインの組織文化論",body:"組織メンバーの行動や思考パターン、価値観などに影響を与えるものとして組織文化は注目されてきた。組織文化についての代表的な研究者であるE.シャインの組織文化論に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"質問票調査は組織文化の内容を的確に把握するための有効な方法であることから、組織文化に関する質問票調査を定期的に実施すべきである。"},{key:"イ",label:"組織文化は組織内部の統合という問題の解決に役立ってきたものであるため、長く続いている組織では組織文化を変革すべきではない。"},{key:"ウ",label:"組織文化は明文化された経営理念・価値観に沿って醸成されるため、組織のリーダーがそれらの変更を行えば組織文化の変革がおのずと達成される。"},{key:"エ",label:"組織メンバーであれば、目に見える組織構造や儀礼といった「人工物(artifacts)」を手がかりとして組織文化の「基本的仮定」を読み解き、組織メンバーではない第三者に組織文化の全容を説明することは容易に行える。"},{key:"オ",label:"組織メンバーの採用や昇進の際にリーダーが適用する基準は、組織文化に影響を及ぼす。"}],correct:"オ",explanation:"【論点・背景】シャインの組織文化論は、文化を3つのレベルで捉える：(1)人工物(目に見える構造・儀礼・シンボル)、(2)標榜された価値観(明文化された理念)、(3)基本的仮定(当然視され無意識化された前提＝文化の本質)。文化の本質は無意識の基本的仮定にあるため、表層の観察や質問票では把握が難しく、変革も容易ではない。またリーダーが文化を『埋め込むメカニズム』として、何に注意を払うか、危機への対応、資源配分、報酬や地位の配分基準、採用・選抜・昇進・解雇の基準などを挙げた。\n\n【正答の理由】オ：採用や昇進にリーダーが適用する基準は、シャインのいう文化の埋め込みメカニズムの代表例であり、『どのような人が評価され組織に残るか』を通じて組織文化に影響を及ぼす。正しい。\n\n【誤答の検討】\n・ア：文化の本質(基本的仮定)は無意識の前提であり、回答者自身が自覚していないため質問票調査では的確に把握しにくい、というのがシャインの立場。\n・イ：文化は内部統合と外部適応の産物だが、環境変化に文化が適合しなくなれば変革が必要になる。『変革すべきではない』とは言えない。\n・ウ：明文化された理念(標榜された価値観)はレベル2にすぎず、それを変更しても深層の基本的仮定が変わるとは限らない。『おのずと達成』は誤り。\n・エ：人工物は観察しやすいが、その意味の解読は当事者にも難しく、メンバーであっても基本的仮定を読み解き全容を説明するのは容易ではない。\n\n【まとめ】正解はオ。『3レベルモデル(人工物・標榜された価値観・基本的仮定)』と『リーダーによる文化の埋め込みメカニズム(採用・昇進基準など)』の2つの枠組みを押さえれば全肢を判定できる。"},
  {id:"r6-mng-q16",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第16問",title:"第16問　制約された合理性(最も不適切)",body:"複雑な意思決定において、意思決定者は完全な合理性を追求できるだけの情報処理能力を持たないとされる。このような「制約された合理性」の下での意思決定に関する記述として、最も不適切なものはどれか。",options:[{key:"ア",label:"意思決定者は、意思決定に際して利用可能な全ての代替案のうち、限られた数の代替案のみを考慮する。"},{key:"イ",label:"意思決定者は、代替案が満たすべき最低限の水準を設定し、その水準を満たす代替案を見つけた時点で、その代替案を選択するとともに代替案の探索を終了する意思決定原理に従う。"},{key:"ウ",label:"各代替案によって将来的に引き起こされる結果に関する知識は、不完全で部分的なものとなる。"},{key:"エ",label:"各代替案によって将来的に引き起こされる全ての結果に対して、それらを最も好ましいものから最も好ましくないものまで順位づける一貫した効用関数を、意思決定者はあらかじめ持つ。"},{key:"オ",label:"反復的な意思決定を行う状況では、意思決定者は行動プログラムのレパートリーを作り、それらを代替案の集合として意思決定に利用する。"}],correct:"エ",explanation:"【論点・背景】H.サイモンの『制約された合理性(限定合理性)』。完全合理性(経済人モデル)は、(1)全代替案の列挙、(2)各代替案の全結果の予見、(3)全結果を順位づける一貫した効用関数、を前提とするが、現実の人間(経営人モデル)の情報処理能力ではいずれも不可能であり、『満足化原理』に従って意思決定する、というのが理論の骨格。本問は『最も不適切＝制約された合理性ではなく完全合理性の説明』を選ぶ。\n\n【正答(不適切)の理由】エ：全ての結果を一貫した効用関数で順位づけられる、というのは完全合理性(最適化原理)の前提そのもの。制約された合理性はまさにこれが不可能であることを出発点とするため、不適切。\n\n【他の選択肢(適切)の確認】\n・ア：全代替案ではなく限られた代替案のみを逐次的に考慮する＝限定合理性の帰結。\n・イ：最低限の水準(要求水準)を満たす案が見つかった時点で探索を打ち切る＝満足化原理(satisficing)の定義そのもの。\n・ウ：結果に関する知識は不完全・部分的＝完全な予見の不可能性。\n・オ：反復的状況では行動プログラム(ルーティン・標準手続)のレパートリーを作って利用する＝プログラム化された意思決定。サイモン＝マーチの組織論の重要概念。\n\n【まとめ】不適切はエ。『経済人(最適化・完全情報・一貫した効用関数)vs経営人(満足化・限定された探索・要求水準)』の対比表で、どちらのモデルの記述かを仕分けるのが解法の型。"},
  {id:"r6-mng-q17",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第17問",title:"第17問　変革型・交換型リーダーシップ(バス)",body:"社会や組織の転換期において、既存の体制や構造を変革するために発揮されるリーダーシップを「変革型リーダーシップ」と呼ぶ。変革型リーダーはフォロワーの価値観や態度を変化させ、フォロワーとの間で相互に刺激し合い高め合う関係を築くとされる。\n一方で、定常的な状況下において有効な成果をあげるために、ギブ・アンド・テイクの交換関係をフォロワーとの間に築くことでフォロワーへの影響力を発揮するリーダーシップを「交換型リーダーシップ」と呼ぶ。\nB.バスらによると、変革型リーダーシップと交換型リーダーシップは、それぞれ複数の異なる次元から構成される。これらの次元に則して、変革型リーダーシップと交換型リーダーシップの代表例を以下に示す。両リーダーシップとそれぞれの代表例との対応関係の組み合わせとして、最も適切なものを下記の解答群から選べ。\n\n＜変革型リーダーシップまたは交換型リーダーシップの代表例＞\na　業績目標を達成した場合に何が報酬としてフォロワーに与えられるかを示す。\nb　魅力的な将来ビジョンを打ち出し、ビジョンを実現する意義をフォロワーに話す。\nc　フォロワーがルールや基準から逸脱していないか日常的に注意を払う。\nd　フォロワーにとって理想的な模範となるべく率先して行動する。\ne　前提を見直すことで、フォロワーに新たな視点から問題解決するよう促す。\nf　個々のフォロワーのニーズや能力の多様性を認め、フォロワーの強みを伸ばそうと支援する。\ng　フォロワーがリーダーや組織に対して誇りや尊敬の念を持つように促す。\nh　問題が深刻になってから事後的に問題に介入する。",options:[{key:"ア",label:"変革型リーダーシップ：a、b、d、f、h　交換型リーダーシップ：c、e、g"},{key:"イ",label:"変革型リーダーシップ：a、c、d、e、g　交換型リーダーシップ：b、f、h"},{key:"ウ",label:"変革型リーダーシップ：a、c、e、f、g　交換型リーダーシップ：b、d、h"},{key:"エ",label:"変革型リーダーシップ：b、c、d、e、h　交換型リーダーシップ：a、f、g"},{key:"オ",label:"変革型リーダーシップ：b、d、e、f、g　交換型リーダーシップ：a、c、h"}],correct:"オ",explanation:"【論点・背景】バスの理論では、変革型リーダーシップは4つのI：(1)理想化された影響(カリスマ：模範となり誇り・尊敬を集める)、(2)モチベーションの鼓舞(魅力的なビジョンの提示)、(3)知的刺激(前提を問い直させ新たな視点を促す)、(4)個別配慮(一人ひとりのニーズに応じた支援・育成)から成る。交換型リーダーシップは、(1)業績連動報酬(コンティンジェント・リワード：目標達成と報酬の交換を明示)、(2)能動的な例外管理(逸脱を日常的に監視し事前に是正)、(3)受動的な例外管理(問題が深刻化してから事後介入)から成る。\n\n【各代表例の対応】\n・a(達成時の報酬を明示)＝業績連動報酬→交換型\n・b(魅力的ビジョンと意義の伝達)＝モチベーションの鼓舞→変革型\n・c(逸脱の日常的監視)＝能動的例外管理→交換型\n・d(理想的な模範として率先垂範)＝理想化された影響→変革型\n・e(前提の見直しによる新視点の促進)＝知的刺激→変革型\n・f(個々の多様性を認め強みを伸ばす支援)＝個別配慮→変革型\n・g(誇り・尊敬の念の醸成)＝理想化された影響→変革型\n・h(深刻化後の事後介入)＝受動的例外管理→交換型\nよって変革型＝b・d・e・f・g、交換型＝a・c・hのオが正しい。\n\n【誤答の検討】ア〜エはいずれも、報酬の明示(a)や監視(c)・事後介入(h)を変革型に、ビジョン(b)や模範(d)を交換型に混ぜている。判定基準は『交換(報酬・監視・是正)か、変容(ビジョン・模範・刺激・配慮)か』の一点。\n\n【まとめ】正解はオ。変革型の4つのI(理想化された影響・モチベーション鼓舞・知的刺激・個別配慮)と交換型の3要素(業績連動報酬・能動的/受動的例外管理)を暗記していれば、8つの例文を機械的に仕分けできる。"},
  {id:"r6-mng-q18",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第18問",title:"第18問　欲求段階説とERG理論",body:"A.マズローの欲求段階説と、その修正を試みたC.アルダファーのERG理論に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"ERG理論では、例えばある人との関係において関係欲求が満たされない場合、人間はその人との関係において関係欲求を満たすことを追求し続けると考える。"},{key:"イ",label:"ERG理論では、例えば成長欲求が満たされない場合、欲求段階説の想定とは異なり、より具体的で確実性の高い目標を志向する関係欲求を満たそうとするようになる可能性を想定する。"},{key:"ウ",label:"ERG理論における関係欲求の内容は、欲求段階説における生理的欲求の一部と安全欲求、および所属と愛の欲求の一部に対応する。"},{key:"エ",label:"欲求段階説では、人間の持つ欲求を生理的欲求、安全欲求、所属と愛の欲求、自己実現欲求の4つのカテゴリーに分類するのに対して、ERG理論では、生存欲求、関係欲求、成長欲求という3つのカテゴリーに分類する。"}],correct:"イ",explanation:"【論点・背景】アルダファーのERG理論はマズローの5段階説を3カテゴリー(E：生存欲求、R：関係欲求、G：成長欲求)に再編し、さらに(1)複数の欲求が同時に活性化しうる、(2)上位欲求が満たされないとき下位欲求への『欲求の挫折-退行』が起こりうる、という2点でマズローの『下から順に1段ずつ』という前提を修正した。マズローとの対応：生存欲求＝生理的欲求＋安全欲求(物的)、関係欲求＝安全欲求(対人)＋所属と愛＋承認(他者からの尊重)、成長欲求＝承認(自尊)＋自己実現。\n\n【正答の理由】イ：成長欲求が満たされない(挫折する)場合に、より具体的・確実な対象である関係欲求の充足へ向かう、というのは『挫折-退行』仮説そのもの。欲求段階説にはない、ERG理論固有の修正点であり正しい。\n\n【誤答の検討】\n・ア：ERG理論では、満たされない欲求に固執し続けるのではなく、別の対象・別の欲求(退行を含む)へ向かう柔軟な動きを想定する。『追求し続ける』と固定的に述べるのは不適切。\n・ウ：『生理的欲求の一部と安全欲求』に対応するのは生存欲求(E)。関係欲求(R)は安全欲求の対人的側面、所属と愛、承認の一部に対応する。対応関係の取り違え。\n・エ：マズローの欲求段階説は『承認(尊重)欲求』を含む5段階。4つとしている点が誤り(ERGが3カテゴリーである点は正しいが、前半が誤りのため全体として誤り)。\n\n【まとめ】正解はイ。ERG理論のポイントは『3カテゴリー』『同時活性化』『挫折-退行』の3つ。特に挫折-退行はマズローとの最大の違いとして頻出。"},
  {id:"r6-mng-q19",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第19問",title:"第19問　手続き的公正",body:"限られた資源や成果を組織メンバーに分配するに当たっては、公正な手続きを経る必要がある。このような分配手続きにおいて求められる公正を「手続き的公正」と呼ぶ。分配を受ける組織メンバーが、ある分配手続きを「公正である」と肯定的に評価する際の判断基準に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"一般的な道徳や倫理基準の影響をできる限り排除した独自性の高い分配手続きであること"},{key:"イ",label:"特定の対象者だけに他者よりも優遇された分配手続きが適用されること"},{key:"ウ",label:"分配手続きの影響を受ける人々の関心や価値観をできる限り排除した分配手続きであること"},{key:"エ",label:"分配の決定プロセスにおいて修正や不服申し立ての機会があること"},{key:"オ",label:"分配を決定する際に利用される情報が曖昧さを含むものであること"}],correct:"エ",explanation:"【論点・背景】組織的公正は、分配の結果に関する『分配的公正』と、分配を決める過程に関する『手続き的公正』(さらに対人的・情報的公正)に分けられる。手続き的公正の判断基準としてはレベンサルの6基準が有名：(1)一貫性(誰に対しても同じ手続き)、(2)偏りの抑制(特定者の利益に偏らない)、(3)正確性(正確な情報に基づく)、(4)修正可能性(誤りを修正・不服申立てできる)、(5)代表性(影響を受ける人々の関心・価値観が反映される)、(6)倫理性(一般的な道徳・倫理に適合する)。\n\n【正答の理由】エ：決定プロセスに修正や不服申立ての機会があること＝『修正可能性』の基準そのものであり、手続きを公正と評価する判断基準として正しい。発言の機会(ボイス)が公正感を高めるという知見とも整合する。\n\n【誤答の検討】いずれもレベンサル基準の『逆』を述べている。\n・ア：倫理性基準に反する(道徳・倫理基準への適合がむしろ求められる)。\n・イ：偏りの抑制・一貫性に反する(特定者の優遇は不公正の典型)。\n・ウ：代表性に反する(影響を受ける人々の関心・価値観の反映が求められる)。\n・オ：正確性に反する(正確で曖昧さのない情報に基づくことが求められる)。\n\n【まとめ】正解はエ。レベンサルの6基準(一貫性・偏りの抑制・正確性・修正可能性・代表性・倫理性)を覚えれば、本問のように各基準を裏返した選択肢を瞬時に消去できる。手続き的公正が高いと、分配結果が不利でも納得が得られやすい(公正な手続き効果)という含意も重要。"},
  {id:"r6-mng-q20",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第20問",title:"第20問　コンフリクトへの対処(5類型)",body:"組織や集団においては、意見の相違や利害の不一致から、個人間でコンフリクトが発生することが一般的である。コンフリクトへの対処は、自己の利益を追求する度合いと、相手の利益追求を許容し協力する度合いとの組み合わせに応じて、「回避」、「競争」、「協調」、「妥協」、「適応」の5類型に分類される。コンフリクトへの対処に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"「回避」とは、自己の利益を強く主張しない一方で相手の利益もあまり許容できない場合に、問題解決を延期して様子を見るという対処である。互いの対立点が表立つのを避けたい場合にとられやすい。"},{key:"イ",label:"「競争」とは、相手の利益を最大限に許容しつつ、相手に命令したり相手を説得したりすることで自己の利益も追求するという対処である。権力志向的で高い職位の人間から、順応的な低い職位の人間に対してとられやすい。"},{key:"ウ",label:"「協調」とは、双方がある程度の利益を獲得しつつ互いに犠牲も払うという対処である。互いの対立点を曖昧にすることでコンフリクトを自然に解消しようとする場合にとられやすい。"},{key:"エ",label:"「妥協」とは、当事者の一方のみが自己の利益を犠牲にして相手の利益を最大限に許容するという対処である。互いにある程度の利益をとりつつ犠牲も払うという折り合いがつけられない場合にとられやすい。"},{key:"オ",label:"「適応」とは、相手の利益を犠牲にして自己の利益を追求するという対処である。自己の利益を一方的に追求することで、相手との長期的な関係が損なわれても問題ないと判断される場合にとられやすい。"}],correct:"ア",explanation:"【論点・背景】トーマス＝キルマンのコンフリクト対処モデル。『自己主張(自己の利益追求)』と『協力(相手の利益の許容)』の2軸で5類型を定義する：回避(自己主張低・協力低)、競争(高・低)、適応(低・高)、妥協(中・中)、協調(高・高＝双方の利益を最大化するwin-win)。\n\n【正答の理由】ア：回避は自己主張も協力も低く、問題への取り組み自体を先送りして様子を見る対処。対立が表面化するのを避けたい場合にとられやすい、という説明も適切。正しい。\n\n【誤答の検討】定義の入れ替えになっている。\n・イ：競争は自己主張が高く『協力が低い』対処。『相手の利益を最大限に許容しつつ』が定義と矛盾(後半の権力志向・上位者から下位者へ、という記述自体は競争に当てはまるだけに紛らわしい)。\n・ウ：『双方がある程度の利益を得つつ犠牲も払う』のは妥協の定義。協調は双方の利益を同時に最大化する統合的問題解決であり、対立点を曖昧にするのではなく直視する。\n・エ：『一方のみが自己利益を犠牲にして相手を最大限許容する』のは適応の定義。妥協ではない(後半の『折り合いがつけられない場合』も妥協の説明として不適)。\n・オ：『相手の利益を犠牲にして自己利益を追求』するのは競争の定義。適応は正反対(自己犠牲)である。\n\n【まとめ】正解はア。2軸(自己主張×協力)のマトリクスに5類型を配置した図を頭に置き、各選択肢の定義文がどの象限の説明かを照合する。本問のように『名称と定義の総入れ替え』が定番なので、競争↔適応、協調↔妥協の取り違えに特に注意。"},
  {id:"r6-mng-q21",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第21問",title:"第21問　組織間関係・紐帯",body:"組織間関係や組織間ネットワークに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"「埋め込まれた紐帯」では機会主義的行動が生じやすいため、組織間ネットワークにおける「埋め込まれた紐帯」の比率を減らすことが望ましい。"},{key:"イ",label:"「埋め込まれた紐帯」で結ばれた組織間ネットワークでは、暗黙的な知識の移転が促進されやすい。"},{key:"ウ",label:"「弱い紐帯の強み」を最大限享受しようとすれば、関係を取り結ぶ組織を絞り込み、弱い紐帯を強い紐帯に転換することが不可欠である。"},{key:"エ",label:"組織にとって新奇性の高い知識をより獲得するためには、これまでに築いてきた組織との紐帯をいっそう強めることが望ましい。"},{key:"オ",label:"他の組織からの影響を極力排除するためには、「埋め込まれた紐帯」のみによって構成される組織間ネットワークを構築することが望ましい。"}],correct:"イ",explanation:"【論点・背景】組織間ネットワーク論の2つの鍵概念。(1)埋め込まれた紐帯(ウッツィ)＝社会関係に埋め込まれた信頼ベースの緊密な取引関係。信頼により機会主義が抑制され、きめ細かな情報や暗黙知の移転、共同問題解決が促進される。ただし埋め込みが過剰になると外部の新情報から遮断される(過剰埋め込みのパラドックス)。(2)弱い紐帯の強み(グラノヴェッター)＝接触頻度の低い弱いつながりほど、自分の周りにない新奇な情報をもたらす。\n\n【正答の理由】イ：埋め込まれた紐帯は信頼と長期的関係を基盤とするため、形式知化しにくい暗黙的な知識の移転が促進されやすい。正しい。\n\n【誤答の検討】\n・ア：埋め込まれた紐帯では信頼により機会主義的行動はむしろ『抑制』される。前提が逆。\n・ウ：弱い紐帯の強みは『弱いまま広く保つ』ことで多様な情報源にアクセスできる点にある。強い紐帯への転換や相手の絞り込みは、その利点を打ち消す。\n・エ：既存の強い紐帯をさらに強めると同質的な情報に閉じこもりやすい。新奇性の高い知識の獲得には弱い紐帯や新しい相手とのつながりが有効。\n・オ：埋め込まれた紐帯のみのネットワークは外部から閉じたロックイン状態に陥り、むしろ特定の相手への依存・影響が強まる。『影響の排除』にはならない。\n\n【まとめ】正解はイ。『強い(埋め込まれた)紐帯＝信頼・暗黙知・深い協働、ただし過剰だと閉鎖的』『弱い紐帯＝新奇情報の獲得』という機能の対比と、それぞれの限界(過剰埋め込み・浅い関係)をセットで覚える。"},
  {id:"r6-mng-q22",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第22問",title:"第22問　組織学習",body:"組織学習に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"「有能さの罠(competency trap)」とは、これまでの学習の結果として高い能力を構築し成果を上げているために、学習をやめてしまうことである。"},{key:"イ",label:"高次学習とは組織の上位階層のみで生じる行動レベルの学習であるのに対して、低次学習は組織の下位階層のみで生じる行動レベルでの学習である。"},{key:"ウ",label:"組織学習とは、組織ルーティンの変化の中で組織成果に正の貢献をもたらすもののみを指す。"},{key:"エ",label:"組織メンバーが環境の変化に対応した新しい知識を獲得しても、組織によって規定された役割が制約となって、組織としての学習が進まないことがある。"},{key:"オ",label:"ダブルループ学習とは行動とその結果を振り返り行動を修正することを何度も繰り返すものであるのに対して、シングルループ学習とは行動を一度だけしか修正しないものである。"}],correct:"エ",explanation:"【論点・背景】組織学習論の主要概念を横断する問題。鍵となる概念：(1)有能さの罠＝既存の能力・ルーティンが成果を生むため、その活用(exploitation)に偏り、新しい代替案の探索(exploration)が進まなくなる現象。(2)低次学習/高次学習＝既存の枠組み内での漸進的学習と、枠組み自体を変える学習(階層の上下の話ではない)。(3)シングルループ/ダブルループ学習(アージリス)＝既存の前提・規範の枠内で行動を修正するか、前提・規範そのものを問い直すか(回数の話ではない)。(4)マーチ＝オルセンの不完全な学習サイクル＝個人の信念→個人の行動→組織の行動→環境の反応という学習サイクルが、各所で断絶し学習が阻害される。\n\n【正答の理由】エ：個人が新しい知識・信念を獲得しても、組織が規定した役割や手続きが制約となって個人の行動・組織の行動に結びつかないことがある。これはマーチ＝オルセンのいう『役割制約的学習』(学習サイクルの断絶の一型)であり、正しい。\n\n【誤答の検討】\n・ア：有能さの罠は『学習をやめる』ことではなく、既存能力の活用に学習が偏って新規探索が阻害されること。既存領域の学習はむしろ進み続ける点が本質。\n・イ：高次・低次は学習の『深さ』(枠組みを変えるか否か)の区別であり、組織階層の上位・下位の話ではない。\n・ウ：組織学習はルーティンの変化一般を指し、成果に負の影響を与える学習(迷信的学習など)も含む。『正の貢献のみ』と限定するのは誤り。\n・オ：シングル/ダブルの区別は修正の『回数』ではなく、既存の前提の枠内か、前提そのものを見直すかという『次元』の違い。\n\n【まとめ】正解はエ。組織学習の論点は『個人の学習が組織の学習に自動的にはならない(サイクルの断絶)』が核心で、有能さの罠・シングル/ダブルループなどの概念は定義の言い換えひっかけが定番。"},
  {id:"r6-mng-q23",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第23問",title:"第23問　組織のライフサイクル(最も不適切)",body:"組織のライフサイクル仮説によれば、組織は発展段階に応じて直面する課題が異なる。組織のライフサイクルを起業者段階、共同体段階、公式化段階、精巧化段階に分けて考えるとき、それぞれの段階に関する記述として、最も不適切なものはどれか。",options:[{key:"ア",label:"起業者段階では、起業家の創造性や革新性が重視されるとともに外部からの資源獲得が優先されるが、組織の成長とともに経営管理を実行できるリーダーシップが求められるようになる。"},{key:"イ",label:"共同体段階では、組織メンバーの凝集性の向上を図るべくトップはリーダーシップを発揮するが、トップダウンによって部下のモラールダウンが生じないようにトップは権限委譲を進めることが求められる。"},{key:"ウ",label:"公式化段階では、さまざまな規則や手続きが導入され、公式的な調整によって安定性や効率性が追求されるようになるが、組織構造が複雑化するにつれて官僚制の逆機能が顕著に生じるようになる。"},{key:"エ",label:"精巧化段階では、安定性や効率性を省みず公式的な構造を解体するとともに、新たな成長機会を自ら発見するリーダーシップの発揮が課題となる。"}],correct:"エ",explanation:"【論点・背景】組織のライフサイクル仮説(クイン＝キャメロン等)は、組織の発展を(1)起業者段階(創造性・資源獲得が課題→危機：リーダーシップの必要性)、(2)共同体段階(凝集性・一体感の形成→危機：権限委譲の必要性)、(3)公式化段階(規則・手続による安定性と効率性→危機：官僚制の形式主義・逆機能)、(4)精巧化段階(チーム制や分権化など柔軟な仕組みで官僚制の硬直を克服し、再活性化を図る)という段階と、各段階末の危機・次段階への課題の連鎖として描く。本問は『最も不適切』を選ぶ。\n\n【正答(不適切)の理由】エ：精巧化段階の課題は、公式的な構造を土台としつつチームワークや横断的な仕組みを取り入れて柔軟性を回復し、新たな成長機会を探索すること。『安定性や効率性を省みず公式的な構造を解体する』わけではない。既存の構造・効率の上に柔軟性を付加するのであって、破壊するのではない点が誤り。\n\n【他の選択肢(適切)の確認】\n・ア：起業者段階は創造性と外部資源の獲得が優先されるが、成長すると専門的な経営管理(リーダーシップ)が必要になる(リーダーシップの危機)。適切。\n・イ：共同体段階ではトップの強いリーダーシップで一体感を高めるが、組織拡大に伴い権限委譲が課題になる(自律性の危機)。適切。\n・ウ：公式化段階は規則・手続による安定と効率の追求が特徴で、進行すると官僚制の逆機能(形式主義・硬直化)が顕在化する。適切。\n\n【まとめ】不適切はエ。各段階の『達成すること』と『段階末に直面する危機』をペアで覚え、精巧化段階＝『解体・破壊』ではなく『柔軟性の付加・再活性化』という方向感を押さえる。"},
  {id:"r6-mng-q24",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第24問",title:"第24問　募集・採用・内定・試用期間・労働契約",body:"労働者の募集及び採用、採用内定、試用期間、労働契約に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"使用者が期限を定めない労働契約を締結する際の労働条件として3カ月の試用期間を定め書面により通知した場合、当該期間中に解雇するときは労働基準法の解雇予告制度の適用を受けない。"},{key:"イ",label:"使用者が労働者を募集及び採用するに当たり、転居を伴う転勤ができる者のみを対象とすることは、合理的な理由の有無にかかわらず、雇用の分野における性別に関する間接差別には該当しない。"},{key:"ウ",label:"労働契約は、労働者が使用者に使用されて労働し、使用者がこれに対して賃金を支払うことについて、労働者及び使用者が合意することによって成立する。"},{key:"エ",label:"労働契約を締結する承諾の意思表示をした新規学卒者の採用内定を使用者が取り消すことは、実際の就業が開始する前であることから、理由の如何にかかわらず有効である。"}],correct:"ウ",explanation:"【論点・背景】労働契約の成立と入口規制(募集・採用・内定・試用)の横断問題。\n\n【正答の理由】ウ：労働契約法6条の条文どおり。『労働契約は、労働者が使用者に使用されて労働し、使用者がこれに対して賃金を支払うことについて、労働者及び使用者が合意することによって成立する』。労働契約は諾成契約であり、書面がなくても合意のみで成立する点も含めて正しい。\n\n【誤答の検討】\n・ア：試用期間中の者は解雇予告制度の適用除外とされるが、それは『14日以内』の者に限られる(労基法21条)。14日を超えて引き続き使用された場合は解雇予告(30日前の予告または予告手当)が必要であり、『3カ月の試用期間中はずっと適用なし』は誤り。\n・イ：募集・採用で転居を伴う転勤要件を課すことは、合理的な理由がない場合、男女雇用機会均等法上の『間接差別』に該当する(省令で定める3類型の一つ)。『合理的な理由の有無にかかわらず該当しない』は誤り。\n・エ：新規学卒者の採用内定により『始期付き・解約権留保付きの労働契約』が成立しているとするのが判例(大日本印刷事件)。内定取消しは、解約権留保の趣旨・目的に照らして客観的に合理的で社会通念上相当と認められる場合に限り有効であり、『理由の如何にかかわらず有効』は誤り。\n\n【キーワードの意味】間接差別＝性別以外の事由を要件とするが、実質的に一方の性に相当程度の不利益を与えるもの(転勤要件・身長体重要件など)。解約権留保付労働契約＝内定時点で契約は成立し、取消しは『解雇』に準じて厳しく制約されるという構成。\n\n【まとめ】正解はウ。『内定＝契約成立済み』『試用中の予告除外は14日まで』『転勤要件は間接差別になりうる』の3つの判例・法令知識で誤答肢を消す。"},
  {id:"r6-mng-q25",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第25問",title:"第25問　労働者派遣",body:"労働者派遣に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"紹介予定派遣は、労働者派遣法において禁止されている。"},{key:"イ",label:"派遣先の都合で労働者派遣契約を解除することになり、そのために派遣元事業主が当該派遣労働者に休業手当を支払うこととなった場合であっても、派遣先は当該休業手当のための費用を負担する必要はない。"},{key:"ウ",label:"派遣先は、派遣元事業主に無期雇用されている派遣労働者を、3年の派遣可能期間を超える期間継続して労働者派遣の役務の提供を受けてはならない。"},{key:"エ",label:"労働者派遣事業を行う事業主から労働者派遣の役務の提供を受けた事業主が、当該派遣労働者を、警備業務が労働者派遣事業の禁止業務であると知りながら当該業務に従事させた場合、当該派遣労働者に対して労働契約の申し込みをしたものとみなされる。"}],correct:"エ",explanation:"【論点・背景】労働者派遣法の重要論点(紹介予定派遣・中途解除時の措置・期間制限・労働契約申込みみなし制度)の横断問題。\n\n【正答の理由】エ：派遣先が違法派遣(①禁止業務への従事、②無許可事業主からの受入れ、③期間制限違反、④偽装請負)を、違法であることを知りながら受け入れた場合、その時点で派遣先が当該派遣労働者に対し、派遣元と同一の労働条件で労働契約を申し込んだものとみなされる(労働契約申込みみなし制度、派遣法40条の6)。警備業務は港湾運送・建設・警備・医療(一部)と並ぶ派遣禁止業務であり、知りながら従事させたケースはみなし制度の対象。正しい。\n\n【誤答の検討】\n・ア：紹介予定派遣(派遣終了後の直接雇用を予定し、職業紹介を組み合わせた派遣)は適法な制度として認められている。禁止は誤り。\n・イ：派遣先の都合による中途解除の場合、派遣先は新たな就業機会の確保、それができないときは休業手当等の費用負担など、派遣労働者の雇用の安定を図る措置を講じる義務がある(派遣法29条の2)。『負担する必要はない』は誤り。\n・ウ：事業所単位・個人単位の3年の期間制限は、派遣元に『無期雇用』される派遣労働者や60歳以上の者などには適用されない。無期雇用派遣労働者は3年を超えて継続受入れが可能であり、誤り。\n\n【キーワードの意味】労働契約申込みみなし制度＝違法派遣の是正を派遣先の直接雇用責任で担保する仕組み。派遣禁止業務＝港湾運送・建設・警備・医療関係(一部)。\n\n【まとめ】正解はエ。『紹介予定派遣は適法』『中途解除は派遣先に費用負担等の責任』『無期雇用派遣は期間制限の対象外』『違法派遣＝申込みみなし』の4点セットで整理する。"},
  {id:"r6-mng-q26",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第26問",title:"第26問　育児休業",body:"育児・介護休業法に規定する育児休業に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"事業主は、繁忙期で代替人員を確保できない場合であっても、育児休業を取得する権利がある労働者からの育児休業取得申出を拒むことはできない。"},{key:"イ",label:"出生時育児休業は、養育する子の出生後8週間に男性労働者が取得することを目的とする制度であるため、養子縁組をした場合であっても、女性労働者は出生時育児休業の対象にならない。"},{key:"ウ",label:"使用者は、就業規則に定めがない場合であっても、育児休業期間中の労働者に対して平均賃金の6割を育児休業手当として支払わなければならない。"},{key:"エ",label:"労働者が育児休業を取得するためには、労使協定で育児休業をすることができないものとして定める場合を除き、育児休業を取得する時点で雇用期間が1年以上必要である。"}],correct:"ア",explanation:"【論点・背景】育児・介護休業法の基本論点。育児休業は法律上の労働者の権利であり、要件を満たす労働者からの申出を事業主は拒めない、という強行的な性格が出発点。\n\n【正答の理由】ア：育児休業の申出があったとき、事業主はこれを拒むことができない(育介法6条)。繁忙期や代替人員の確保困難といった経営上の事情は拒否の理由にならない。正しい。\n\n【誤答の検討】\n・イ：出生時育児休業(産後パパ育休)は『出生後8週間以内に4週間まで』取得できる制度で、主な利用者は男性だが、養子縁組等の場合には女性労働者も対象になりうる。『女性は対象にならない』と断定するのは誤り。\n・ウ：育児休業期間中の賃金支払義務は法律上なく(ノーワーク・ノーペイ)、所得保障は雇用保険の『育児休業給付』によって行われる。労基法26条の休業手当(平均賃金の6割)は使用者の責に帰すべき事由による休業の規定であり、育児休業には適用されない。\n・エ：『引き続き雇用された期間が1年以上』という要件は、法改正(2022年4月施行)により有期雇用労働者についても廃止された(労使協定による除外は可能)。現行法では取得時点の雇用期間1年以上は原則不要であり、誤り。\n\n【キーワードの意味】出生時育児休業(産後パパ育休)＝出生後8週以内に4週まで、2回に分割可能、労使協定があれば休業中の就業も一部可能(2022年10月施行)。育児休業給付＝雇用保険から支給(休業開始時賃金の67％→50％)。\n\n【まとめ】正解はア。『申出は拒めない』『賃金支払義務はなく雇用保険給付』『1年要件は廃止(労使協定除外のみ)』という改正後の姿で覚え直すことが重要。"},
  {id:"r6-mng-q27",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第27問",title:"第27問　就業規則",body:"就業規則に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"使用者は、就業規則において1日の労働時間について「8時間勤務とする」と定めた場合であっても、その事業場における具体的な始業及び終業の時刻並びに休憩時間について規定しなければならない。"},{key:"イ",label:"使用者は、新規に会社を設立し初めて就業規則を定めることになった場合は、その内容に関して、全労働者の過半数の同意を得なければならない。"},{key:"ウ",label:"使用者は、同一事業場において一部の労働者にのみ適用される「パートタイム就業規則」を変更する際には、当該事業場に労働組合がない場合には、全労働者の過半数を代表する者の意見を聴く必要はない。"},{key:"エ",label:"使用者は、変更後の就業規則を労働者に周知させ、当該変更が諸事情を考慮して合理的なものであると判断されたとしても、労働者と合意しなければ、就業規則の変更によって労働条件を不利益に変更することは一切できない。"}],correct:"ア",explanation:"【論点・背景】就業規則の作成・変更手続(労基法89条・90条)と、就業規則による労働条件の不利益変更(労契法10条)の問題。始業・終業時刻、休憩、休日、賃金、退職(解雇事由を含む)は『絶対的必要記載事項』であり、必ず記載しなければならない。\n\n【正答の理由】ア：始業及び終業の時刻、休憩時間は絶対的必要記載事項(労基法89条1号)。『1日8時間勤務』と所定労働時間の長さだけを定めても足りず、具体的な始業・終業時刻と休憩を規定しなければならない。正しい。\n\n【誤答の検討】\n・イ：就業規則の作成・変更に必要なのは、過半数労働組合(なければ過半数代表者)の『意見を聴く』こと(意見聴取義務)であり、『同意』は不要。意見が反対でも手続上は有効に作成できる。\n・ウ：パートタイム労働者にのみ適用される就業規則の変更であっても、それは事業場の就業規則の一部であるから、事業場の過半数代表者からの意見聴取が必要(加えてパート・有期法では、パート労働者の過半数代表の意見聴取が努力義務)。『聴く必要はない』は誤り。\n・エ：就業規則の変更による労働条件の不利益変更は原則として労働者の合意が必要(労契法9条)だが、例外として、変更後の就業規則を周知させ、かつ変更が(不利益の程度・必要性・相当性・労働組合等との交渉状況などに照らして)合理的なものであれば、合意なく変更後の就業規則によることができる(労契法10条)。『一切できない』は誤り。\n\n【まとめ】正解はア。『絶対的必要記載事項(始業終業・休憩・休日・賃金・退職)』『手続は同意でなく意見聴取』『不利益変更は周知＋合理性で例外的に可能』の3点が就業規則問題の定番チェックポイント。"},
  {id:"r6-mng-q28",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第28問",title:"第28問　ブランド・マネジメント",body:"ブランド・マネジメントに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"ある企業が既存事業とは異なる新たな事業領域に進出する際に、既存事業で構築してきた既存のブランドを新事業でも用いることを、ブランドのリポジショニングと呼ぶ。"},{key:"イ",label:"企業が既存製品と同一カテゴリーに新製品を投入する際には、そのカテゴリーの既存製品に用いてきたブランドを用いることも多いが、あえて新しいブランドをつけることがあり、これをマルチ・ブランド戦略と呼ぶ。"},{key:"ウ",label:"ブランドや企業の創業者の物語、目指す大きな方向性、専門性などをコーポレート・ブランドによって示し、その下に個々のプロダクト・ブランドが位置づけられることも多いが、これら2種類のブランドを同時に冠することをダブルチョップ戦略と呼ぶ。"},{key:"エ",label:"マーケティングにおいては、自社のブランドが消費者の想起集合に含まれるようにすることが極めて重要である。このためには、すでに想起集合に入っている競合ブランドと比較して際立った異質性を自社ブランドにもたせることが、まず最初に必要である。"}],correct:"イ",explanation:"【論点・背景】ブランド戦略の用語問題。ブランド採用戦略は『市場(カテゴリー)が既存か新規か×ブランドが既存か新規か』の2×2で整理される：既存カテゴリー×既存ブランド＝ライン拡張、既存カテゴリー×新ブランド＝マルチ・ブランド、新カテゴリー×既存ブランド＝ブランド拡張、新カテゴリー×新ブランド＝新ブランド戦略。\n\n【正答の理由】イ：同一カテゴリーに、既存ブランドとは別の新しいブランドを付けて新製品を投入するのはマルチ・ブランド戦略の定義そのもの(例：同じビールカテゴリーに複数ブランドを並べ、棚や多様なセグメントを押さえる)。正しい。\n\n【誤答の検討】\n・ア：既存ブランドを新たな事業領域(新カテゴリー)に用いるのは『ブランド拡張』。リポジショニングは既存ブランドの位置づけ(ポジション)を再定義することであり、別概念。\n・ウ：コーポレート・ブランドとプロダクト・ブランドの2層を併記するのは『ブランドの階層(ダブル・ブランド)』の話。ダブルチョップは、メーカーと流通業者(あるいは2つの企業)双方のブランドを1つの製品に併記する共同ブランドの手法であり、同一企業内の階層構造のことではない。\n・エ：想起集合(購買時に思い浮かぶブランドの集合)に入るためには、まずそのカテゴリーの一員として認識されること(類似点・カテゴリー所属の確立)が先であり、『際立った異質性をまず最初に』は順序が逆。異質性(差別化点)は所属確立の後に効いてくる。\n\n【まとめ】正解はイ。ブランド採用戦略の2×2(ライン拡張・マルチブランド・ブランド拡張・新ブランド)を確実に再現できるようにし、リポジショニング・ダブルチョップなど紛らわしい用語の定義のすり替えに注意する。"},
  {id:"r6-mng-q29",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第29問",title:"第29問　ソーシャル・マーケティング",body:"ソサイエタル・マーケティングなどソーシャル・マーケティングに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"企業が文化支援を行うメセナや慈善行為を行うフィランソロピーの活動は、企業による社会貢献活動であるから、ソシオエコロジカル・マーケティングの一部と理解することができる。"},{key:"イ",label:"ソサイエタル・マーケティングの根底には、企業が行う社会貢献は当該企業の利益につながってはならないという考え方がある。"},{key:"ウ",label:"貧困問題を解決するといった社会課題においては、貧困者に自立を促すなどのコミュニケーション活動だけでなく、そもそも貧困が生まれる社会そのものを改革するといった構造的な問題解決も必要である。しかしこのような構造的な問題解決は、ソサイエタル・マーケティングが扱う分野ではない。"},{key:"エ",label:"マーケティングの4Pの1つである「製品(プロダクト)」とは、顧客にベネフィットをもたらす何らかの製品・サービスであるが、ソサイエタル・マーケティングにおける製品・サービスには、例えば「投票に行こう」というような、社会に向けた提案も含まれる。"}],correct:"エ",explanation:"【論点・背景】ソーシャル・マーケティングには大きく2つの系譜がある。(1)ソサイエタル・マーケティング(コトラー)＝企業のマーケティングに消費者と社会の長期的利益への配慮を組み込む考え方。(2)非営利組織や社会的アイデアの普及にマーケティングの技術を適用するソーシャル・マーケティング(禁煙・投票・献血などの行動変容キャンペーン)。後者では『製品』概念が拡張され、有形の製品だけでなくアイデア・行動の提案も製品とみなされる。\n\n【正答の理由】エ：『投票に行こう』のような社会に向けたアイデア・行動の提案も、ソーシャル/ソサイエタル・マーケティングの文脈では『製品』に含まれる。製品概念の拡張(モノ→サービス→アイデア)の説明として正しい。\n\n【誤答の検討】\n・ア：メセナ(文化支援)やフィランソロピー(慈善)は本業のマーケティングと切り離された社会貢献活動であり、『ソシオエコロジカル(生態学的)・マーケティング』(環境問題への対応をマーケティングに組み込む考え方)の一部とするのは概念の取り違え。\n・イ：ソサイエタル・マーケティングは『企業の利益・消費者の欲求・社会の福祉』の3者の調和を図る考え方であり、利益につながってはならないとは考えない(CSVのように両立を目指す潮流とも整合)。\n・ウ：社会課題の構造的解決(上流への働きかけ)もソーシャル・マーケティングの射程に含まれる。『扱う分野ではない』と切り捨てるのは誤り。\n\n【まとめ】正解はエ。『製品概念の拡張(アイデアも製品)』『企業利益・顧客満足・社会福祉の3者調和』という2つの軸を押さえ、メセナ／フィランソロピー／ソシオエコロジカルといった周辺用語の混同を誘う選択肢を消去する。"},
  {id:"r6-mng-q30",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第30問",title:"第30問　カスタマー・ジャーニー",body:"S社は、家庭用の充電式スティック型掃除機の新製品(「W」とする)を近々発売する予定である。そこでS社では、さまざまな顧客セグメントに対してカスタマー・ジャーニーを作成しようとしている。下図は、そのうち1つの顧客セグメント(図中の「顧客タイプX」)についてのカスタマー・ジャーニーを示している。\n図中の空欄A〜Dに入る語句の組み合わせとして、最も適切なものを下記の解答群から選べ。",figure:"MgtR6Q30",options:[{key:"ア",label:"A：Wを知らない　B：スティック型掃除機をリピート購買する　C：スティック型掃除機の購入経験が一度ある　D：スティック型掃除機に関心がある"},{key:"イ",label:"A：Wをまだ知らない　B：Wを少し知っている　C：スティック型掃除機の具体的購入計画がある　D：スティック型掃除機に関心がある"},{key:"ウ",label:"A：スティック型掃除機を検討している　B：Wを推奨する　C：Wに関心がある　D：Wを認知する"},{key:"エ",label:"A：掃除機の買い替えを検討している　B：Wを推奨する　C：スティック型掃除機を検討している　D：掃除機の想起集合にS社が入っている"},{key:"オ",label:"A：掃除機の買い替えを検討している　B：スティック型掃除機に関心がある　C：スティック型掃除機を具体的に検討する　D：Wを購入する"}],correct:"オ",explanation:"【論点・背景】カスタマー・ジャーニーは、顧客が製品・ブランドを認知してから購買・推奨に至るまでの一連のプロセスを段階(フェーズ)に分け、各段階のタッチポイントとメッセージを設計するフレームワーク。空欄A〜Dは左から右へ時間が流れる購買プロセスであり、『認知・問題意識→興味・関心→比較・検討→購買(→推奨)』という一般的な購買意思決定プロセス(AIDMAやAISASの骨格)に沿って、各段階が論理的に前後関係を保って並んでいる選択肢を選ぶ。\n\n【正答の理由】オ：『掃除機の買い替えを検討している(問題認識)→スティック型掃除機に関心がある(カテゴリーへの関心)→スティック型掃除機を具体的に検討する(比較検討)→Wを購入する(購買)』。問題認識からカテゴリー関心、具体的検討、自社新製品Wの購買へと、段階が広いものから狭いものへ自然に絞り込まれており、ジャーニーの設計として一貫している。正しい。\n\n【誤答の検討】\n・ア：『リピート購買』(B)が『購入経験が一度ある』(C)より前に来ており時系列が逆転。\n・イ：『Wを知らない→少し知っている』の後に『具体的購入計画→関心がある』と続き、関心(D)が購入計画(C)の後に来るのは逆順。\n・ウ：『Wを推奨する』(B)が『Wに関心がある』(C)や『Wを認知する』(D)より前にあり、認知前に推奨するという順序矛盾。\n・エ：『Wを推奨する』(B)が検討段階(C)の前に来ており、購買・使用を経ない推奨は不自然。\n\n【まとめ】正解はオ。この種の並べ替え問題は『各空欄の中身が時系列として単調に進行しているか(後の段階が前の段階を前提にしているか)』だけを機械的にチェックすれば、知識がなくても論理だけで解ける。"},
  {id:"r6-mng-q31",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第31問",title:"第31問　BtoBマーケティング",body:"BtoBマーケティングに関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"BtoBマーケティングでは、社内での慎重な検討を経て購買意思決定がなされるが、ブランドのイメージに頼る購買も存在する。"},{key:"イ",label:"BtoBマーケティングでは顧客は取引先企業であるため、不特定多数の消費者を対象とするBtoCマーケティングとは異なり、広告は不要である。"},{key:"ウ",label:"BtoBマーケティングにおける顧客とは取引先企業であるため、クチコミは発生しない。"},{key:"エ",label:"不特定多数の消費者を対象とするBtoCマーケティングとは対照的に、BtoBマーケティングでは特定少数の取引先企業との長期的関係が重要であるため、現在の取引先企業の要望に応えることだけに専念することが必要である。"}],correct:"ア",explanation:"【論点・背景】BtoB(組織間)マーケティングの特徴：購買が組織的・合理的で、購買センター(複数の関与者)による慎重な検討を経る、特定少数顧客との長期的関係が重要、派生需要である、など。ただし『組織購買＝完全に合理的』ではなく、購買担当者も人間であり、リスク回避のために知名度・実績のあるブランドを選ぶなど、ブランドイメージや感情的要素が意思決定に影響する。\n\n【正答の理由】ア：BtoBの購買は社内の稟議や複数部門の検討を経る合理的なプロセスが基本だが、『有名な会社から買っておけば間違いない』といったブランドイメージに依拠する購買も現実に存在する。組織購買における非合理的・心理的側面を認める記述として正しい。\n\n【誤答の検討】\n・イ：BtoBでも、認知獲得・リード(見込み客)獲得のための専門誌広告・展示会・デジタル広告などは広く活用される。『広告は不要』は極端で誤り。\n・ウ：業界内の評判、導入事例、ユーザー企業同士の情報交換など、BtoBでもクチコミ(リファレンス)は強力に働く。『発生しない』は誤り。\n・エ：既存顧客との長期的関係が重要であることは正しいが、『現在の取引先の要望に応えることだけに専念』すると新規顧客開拓や新市場への対応がおろそかになる。『だけ』『一切』型の極端表現で誤り。\n\n【まとめ】正解はア。BtoB問題は『組織的・合理的という原則＋人間的・心理的要素の存在』というバランス感覚が問われ、イ〜エのような全否定・全肯定の極端な記述は誤りと判断するのが定石。"},
  {id:"r6-mng-q32",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第32問",title:"第32問　コンテンツ・マネジメント・プロセス",body:"マーケティング・コミュニケーションにおいては、コンテンツのマネジメントが重要である。下図は、典型的なコンテンツのマネジメント・プロセスを示している。図中の空欄A〜Dに入る語句の組み合わせとして、最も適切なものを下記の解答群から選べ。",figure:"MgtR6Q32",options:[{key:"ア",label:"A：差別化戦略の策定　B：セグメンテーション　C：コンテンツの制作　D：コンテンツの配信と拡散"},{key:"イ",label:"A：セグメンテーション　B：ターゲットの設定　C：コンテンツの制作　D：コンテンツの配信と拡散"},{key:"ウ",label:"A：セグメンテーション　B：ターゲットの設定　C：コンテンツの配信と拡散　D：リピートの獲得"},{key:"エ",label:"A：ターゲットの設定　B：コンテンツの制作　C：コンテンツの配信と拡散　D：コンテンツの評価と改善"},{key:"オ",label:"A：ポジショニング政策の立案　B：セグメンテーション　C：コンテンツの評価と改善　D：コンテンツの配信と拡散"}],correct:"エ",explanation:"【論点・背景】コンテンツ・マーケティングの典型的なマネジメント・プロセスは、『目標設定(どのような成果をもたらしたいか)→ターゲットの設定(誰に届けるか)→コンテンツの計画立案(どのようなコンテンツを提供するか)→コンテンツの制作→コンテンツの配信と拡散→コンテンツの評価と改善』というPDCA型の流れで整理される。図では『目標設定』と『コンテンツの計画立案』が既に与えられており、A(目標設定の直後)・B〜D(計画立案の後工程)を埋める。\n\n【正答の理由】エ：A＝ターゲットの設定(目標を定めた後、計画立案の前に『誰に』を決める)、B＝コンテンツの制作(計画したコンテンツを実際に作る)、C＝コンテンツの配信と拡散(作ったものを届け広げる)、D＝コンテンツの評価と改善(成果を測定し次に活かす)。計画→制作→配信→評価という自然な実行順序であり正しい。\n\n【誤答の検討】\n・ア・イ・オ：Aにセグメンテーションや差別化戦略・ポジショニングを置くと、Bにターゲット設定等が来て『計画立案』の後に標的設定が来る配置になり、計画を立ててから誰向けかを決めるという順序矛盾が生じる。またSTP全体はマーケティング戦略の話で、コンテンツ運用プロセスの図の粒度と合わない。\n・ウ：D『リピートの獲得』は成果(目標)であってプロセスの工程名ではなく、評価・改善の工程が欠落する。\n\n【まとめ】正解はエ。『目標→ターゲット→計画→制作→配信・拡散→評価・改善』というコンテンツ運用のPDCAを知識として持ちつつ、知らなくても『各工程の前後関係(作る前に計画、配る前に作る、最後に評価)』という論理チェックで解ける。"},
  {id:"r6-mng-q33",exam:"中小企業診断士",year:"R6",subject:"企業経営理論",examLabel:"R6 企業経営理論",parent:"第33問",title:"第33問　SNSとマーケティング・コミュニケーション",body:"マーケティング・コミュニケーションにおけるSNSの利用やその役割に関する記述として、最も適切なものはどれか。",options:[{key:"ア",label:"SNS広告にはさまざまなタイプがあるが、利用者を目的ページへ遷移させることを意図していない。"},{key:"イ",label:"SNSとは、消費者が自由に投稿したり、相互にコメントしたり参照し合ったりする場である。このため、原則的には企業が開設するアカウントからSNS上に投稿されることはない。"},{key:"ウ",label:"消費者によって毎日SNS上に投稿されるクチコミは、消費者によって発信された情報であるために信頼性が高い。すなわち、SNS上のクチコミには信頼属性に関する情報が豊富に含まれている。"},{key:"エ",label:"フォロワー数が極めて多い著名人をインフルエンサーとして起用し、当該インフルエンサーを通じてSNS上で企業が情報発信を行う場合、当該企業の意図通りに実施されるように、企業は厳密にコミュニケーションを設計し、インフルエンサーを統制して情報発信を行っている。"},{key:"オ",label:"ほとんどの消費者は、自己のアカウントにログインした状態でSNSを利用する。このためSNSでは、基本的に企業はクッキーを使用せずに広告配信のターゲティングを行うことができる。"}],correct:"オ",explanation:"【論点・背景】SNSマーケティングの特性問題。SNSはログインベースのプラットフォームであり、利用者の登録情報(年齢・性別・地域)や行動データ(フォロー・いいね・閲覧)をプラットフォーム内に保持しているため、サードパーティ・クッキーに依存しないターゲティング広告が可能。これはクッキー規制が進む環境でSNS広告の強みとされる点。\n\n【正答の理由】オ：消費者はログイン状態でSNSを利用するため、プラットフォームはアカウントに紐づく属性・行動データに基づいて広告配信のターゲティングを行える。クッキーに依存しない(ログインデータ型の)ターゲティングというSNS広告の特徴の説明として正しい。\n\n【誤答の検討】\n・ア：SNS広告にはリンク付きの誘導型広告が多数あり、目的ページ(LP・EC)への遷移はむしろ主要な目的の一つ。\n・イ：企業の公式アカウントからの投稿(オウンドメディア的活用)はSNS運用の基本であり、『投稿されることはない』は明白に誤り。\n・ウ：クチコミは消費者発信ゆえに商業的情報より信頼されやすいが、それは『情報の信頼性』の話。一方『信頼属性』とは、購入・使用後でも品質を評価しにくい属性(専門サービスの質など)を指すサービス・マーケティングの専門用語であり、『信頼性が高い→信頼属性の情報が豊富』という推論は用語のすり替えで誤り(クチコミが豊富に伝えるのはむしろ使用経験に基づく経験属性の情報)。\n・エ：インフルエンサーの影響力は本人の自律的な表現や信頼に由来し、企業が厳密に統制すれば自然さが失われる(また広告であることを隠した統制的発信はステルスマーケティングとして規制対象)。『厳密に統制して発信している』は実態・規範の両面で誤り。\n\n【まとめ】正解はオ。『ログインデータによる脱クッキー・ターゲティング』というSNS広告の構造的特徴と、探索属性・経験属性・信頼属性の区別(ウのひっかけ)を押さえる。"},
